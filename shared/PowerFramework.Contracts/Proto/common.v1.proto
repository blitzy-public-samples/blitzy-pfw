    XML_E_NO_DOCUMENT_ELEMENT  = 16;  // [:L100]
  }
}

// ==============================================================================================
//  SECTION 5 - SqliteResultCode : 98 VALUES, 31 BASE PLUS 67 EXTENDED
//  --------------------------------------------------------------------------------------------
//  The SQLite result-code space as the legacy catalogues it: 31 base codes from
//  ws_objects/pfw.shared.pbl.src/retcode.sru:L107-L138 and 67 extended codes from :L140-L206. It
//  is reported by the legacy SQLite binding as its SQLDBCode, which is why it is on the boundary
//  at all - Persistence surfaces it, and DataServices relays it.
//
//  Base and extended share ONE enum because they share one code space: SQLite's own convention is
//  that an extended code is `base + (n * 256)`, so the low byte of an extended code IS its base
//  code. Splitting them would break that relationship and force consumers to consult two enums to
//  interpret one field.
//
//  EVERY EXTENDED VALUE IS WRITTEN AS A LITERAL, WITH ITS ARITHMETIC IN THE COMMENT (C-K)
//  The oracle declares each extended code as `(BASE + (n*256))`. A .proto enum requires a literal
//  integer, so the arithmetic cannot survive as arithmetic - it is preserved in a trailing comment
//  instead, naming the base and the multiplier. That keeps every line checkable against the oracle
//  without a calculator, which matters because the multiplicative structure IS the documentation:
//  it states which base code an extended code refines and which ordinal it is. All 67 literals
//  were computed mechanically from the oracle, not by hand.
//
//  Group counts, verified against the oracle so a missing member is detectable by arithmetic:
//    ERROR 3, IOERR 31, LOCKED 2, BUSY 2, CANTOPEN 5, CORRUPT 2, READONLY 6, ABORT 1,
//    CONSTRAINT 10, NOTICE 2, WARNING 1, AUTH 1, OK 1  =  67
//
//  FOUR QUIRKS, EACH PRESERVED AND ANNOTATED AT ITS OWN LINE, NEVER REPAIRED (C-B)
//    * SQLITE_ABORT_ROLLBACK uses multiplier 2 with NO multiplier-1 sibling in existence, so it is
//      516 and not 260. This looks like an off-by-one and is not one.
//    * SQLITE_CANTOPEN_DIRTYWAL carries the oracle's own "Not Used" note.
//    * SQLITE_FORMAT is marked "Not used" and SQLITE_EMPTY "Internal use only" - both are kept as
//      members regardless, because the oracle declares them.
//    * SQLITE_OK_LOAD_PERMANENTLY is an EXTENDED code hanging off the SUCCESS base, making it a
//      positive non-zero value that nevertheless denotes success. It is not an error code.
//  A fifth structural oddity: the 28-to-100 gap between SQLITE_WARNING and SQLITE_ROW is left
//  open exactly as the oracle leaves it.
//
//  No allow_alias here either: all 98 values were checked and none collides with another, and
//  SQLITE_OK = 0 satisfies proto3's first-enumerator rule. SQLITE_IOERR_ROLLBACK_ATOMIC = 7946 is
//  the largest value anywhere in this file.
// ==============================================================================================
message SqliteResultCode {
  enum Value {
    // ---- 31 base result codes [retcode.sru:L107-L138] ----
    SQLITE_OK         =   0;  // Successful result | [:L107]
    SQLITE_ERROR      =   1;  // Generic error | [:L109]
    SQLITE_INTERNAL   =   2;  // Internal logic error in SQLite | [:L110]
    SQLITE_PERM       =   3;  // Access permission denied | [:L111]
    SQLITE_ABORT      =   4;  // Callback routine requested an abort | [:L112]
    SQLITE_BUSY       =   5;  // The database file is locked | [:L113]
    SQLITE_LOCKED     =   6;  // A table in the database is locked | [:L114]
    SQLITE_NOMEM      =   7;  // A malloc() failed | [:L115]
    SQLITE_READONLY   =   8;  // Attempt to write a readonly database | [:L116]
    SQLITE_INTERRUPT  =   9;  // Operation terminated by sqlite3_interrupt() | [:L117]
    SQLITE_IOERR      =  10;  // Some kind of disk I/O error occurred | [:L118]
    SQLITE_CORRUPT    =  11;  // The database disk image is malformed | [:L119]
    SQLITE_NOTFOUND   =  12;  // Unknown opcode in sqlite3_file_control() | [:L120]
    SQLITE_FULL       =  13;  // Insertion failed because database is full | [:L121]
    SQLITE_CANTOPEN   =  14;  // Unable to open the database file | [:L122]
    SQLITE_PROTOCOL   =  15;  // Database lock protocol error | [:L123]
    // QUIRK PRESERVED: the oracle marks this "Internal use only" and declares it anyway. [:L124]
    SQLITE_EMPTY      =  16;  // Internal use only | [:L124]
    SQLITE_SCHEMA     =  17;  // The database schema changed | [:L125]
    SQLITE_TOOBIG     =  18;  // String or BLOB exceeds size limit | [:L126]
    SQLITE_CONSTRAINT =  19;  // Abort due to constraint violation | [:L127]
    SQLITE_MISMATCH   =  20;  // Data type mismatch | [:L128]
    SQLITE_MISUSE     =  21;  // Library used incorrectly | [:L129]
    SQLITE_NOLFS      =  22;  // Uses OS features not supported on host | [:L130]
    SQLITE_AUTH       =  23;  // Authorization denied | [:L131]
    // QUIRK PRESERVED: the oracle marks this "Not used" and declares it anyway. [:L132]
    SQLITE_FORMAT     =  24;  // Not used | [:L132]
    SQLITE_RANGE      =  25;  // 2nd parameter to sqlite3_bind out of range | [:L133]
    SQLITE_NOTADB     =  26;  // File opened that is not a database file | [:L134]
    SQLITE_NOTICE     =  27;  // Notifications from sqlite3_log() | [:L135]
    SQLITE_WARNING    =  28;  // Warnings from sqlite3_log() | [:L136]
    // QUIRK PRESERVED: the 28-to-100 gap is the oracle's, and it is left open. [:L137-L138]
    SQLITE_ROW        = 100;  // sqlite3_step() has another row ready | [:L137]
    SQLITE_DONE       = 101;  // sqlite3_step() has finished executing | [:L138]

    // ---- 67 extended result codes [retcode.sru:L140-L206] ----
    // Literal values with the oracle's `BASE + (n*256)` arithmetic preserved in each comment.
    SQLITE_ERROR_MISSING_COLLSEQ   =  257;  // SQLITE_ERROR + (1*256) | [:L140]
    SQLITE_ERROR_RETRY             =  513;  // SQLITE_ERROR + (2*256) | [:L141]
    SQLITE_ERROR_SNAPSHOT          =  769;  // SQLITE_ERROR + (3*256) | [:L142]
    SQLITE_IOERR_READ              =  266;  // SQLITE_IOERR + (1*256) | [:L143]
    SQLITE_IOERR_SHORT_READ        =  522;  // SQLITE_IOERR + (2*256) | [:L144]
    SQLITE_IOERR_WRITE             =  778;  // SQLITE_IOERR + (3*256) | [:L145]
    SQLITE_IOERR_FSYNC             = 1034;  // SQLITE_IOERR + (4*256) | [:L146]
    SQLITE_IOERR_DIR_FSYNC         = 1290;  // SQLITE_IOERR + (5*256) | [:L147]
    SQLITE_IOERR_TRUNCATE          = 1546;  // SQLITE_IOERR + (6*256) | [:L148]
    SQLITE_IOERR_FSTAT             = 1802;  // SQLITE_IOERR + (7*256) | [:L149]
    SQLITE_IOERR_UNLOCK            = 2058;  // SQLITE_IOERR + (8*256) | [:L150]
    SQLITE_IOERR_RDLOCK            = 2314;  // SQLITE_IOERR + (9*256) | [:L151]
    SQLITE_IOERR_DELETE            = 2570;  // SQLITE_IOERR + (10*256) | [:L152]
    SQLITE_IOERR_BLOCKED           = 2826;  // SQLITE_IOERR + (11*256) | [:L153]
    SQLITE_IOERR_NOMEM             = 3082;  // SQLITE_IOERR + (12*256) | [:L154]
    SQLITE_IOERR_ACCESS            = 3338;  // SQLITE_IOERR + (13*256) | [:L155]
    SQLITE_IOERR_CHECKRESERVEDLOCK = 3594;  // SQLITE_IOERR + (14*256) | [:L156]
    SQLITE_IOERR_LOCK              = 3850;  // SQLITE_IOERR + (15*256) | [:L157]
    SQLITE_IOERR_CLOSE             = 4106;  // SQLITE_IOERR + (16*256) | [:L158]
    SQLITE_IOERR_DIR_CLOSE         = 4362;  // SQLITE_IOERR + (17*256) | [:L159]
    SQLITE_IOERR_SHMOPEN           = 4618;  // SQLITE_IOERR + (18*256) | [:L160]
    SQLITE_IOERR_SHMSIZE           = 4874;  // SQLITE_IOERR + (19*256) | [:L161]
    SQLITE_IOERR_SHMLOCK           = 5130;  // SQLITE_IOERR + (20*256) | [:L162]
    SQLITE_IOERR_SHMMAP            = 5386;  // SQLITE_IOERR + (21*256) | [:L163]
    SQLITE_IOERR_SEEK              = 5642;  // SQLITE_IOERR + (22*256) | [:L164]
    SQLITE_IOERR_DELETE_NOENT      = 5898;  // SQLITE_IOERR + (23*256) | [:L165]
    SQLITE_IOERR_MMAP              = 6154;  // SQLITE_IOERR + (24*256) | [:L166]
    SQLITE_IOERR_GETTEMPPATH       = 6410;  // SQLITE_IOERR + (25*256) | [:L167]
    SQLITE_IOERR_CONVPATH          = 6666;  // SQLITE_IOERR + (26*256) | [:L168]
    SQLITE_IOERR_VNODE             = 6922;  // SQLITE_IOERR + (27*256) | [:L169]
    SQLITE_IOERR_AUTH              = 7178;  // SQLITE_IOERR + (28*256) | [:L170]
    SQLITE_IOERR_BEGIN_ATOMIC      = 7434;  // SQLITE_IOERR + (29*256) | [:L171]
    SQLITE_IOERR_COMMIT_ATOMIC     = 7690;  // SQLITE_IOERR + (30*256) | [:L172]
    // The largest value anywhere in this file. [:L173]
    SQLITE_IOERR_ROLLBACK_ATOMIC   = 7946;  // SQLITE_IOERR + (31*256) | [:L173]
    SQLITE_LOCKED_SHAREDCACHE      =  262;  // SQLITE_LOCKED + (1*256) | [:L174]
    SQLITE_LOCKED_VTAB             =  518;  // SQLITE_LOCKED + (2*256) | [:L175]
    SQLITE_BUSY_RECOVERY           =  261;  // SQLITE_BUSY + (1*256) | [:L176]
    SQLITE_BUSY_SNAPSHOT           =  517;  // SQLITE_BUSY + (2*256) | [:L177]
    SQLITE_CANTOPEN_NOTEMPDIR      =  270;  // SQLITE_CANTOPEN + (1*256) | [:L178]
    SQLITE_CANTOPEN_ISDIR          =  526;  // SQLITE_CANTOPEN + (2*256) | [:L179]
    SQLITE_CANTOPEN_FULLPATH       =  782;  // SQLITE_CANTOPEN + (3*256) | [:L180]
    SQLITE_CANTOPEN_CONVPATH       = 1038;  // SQLITE_CANTOPEN + (4*256) | [:L181]
    // QUIRK PRESERVED: the oracle's own inline "Not Used" note is carried, and the member with it.
    SQLITE_CANTOPEN_DIRTYWAL       = 1294;  // SQLITE_CANTOPEN + (5*256) | Not Used | [:L182]
    SQLITE_CORRUPT_VTAB            =  267;  // SQLITE_CORRUPT + (1*256) | [:L183]
    SQLITE_CORRUPT_SEQUENCE        =  523;  // SQLITE_CORRUPT + (2*256) | [:L184]
    SQLITE_READONLY_RECOVERY       =  264;  // SQLITE_READONLY + (1*256) | [:L185]
    SQLITE_READONLY_CANTLOCK       =  520;  // SQLITE_READONLY + (2*256) | [:L186]
    SQLITE_READONLY_ROLLBACK       =  776;  // SQLITE_READONLY + (3*256) | [:L187]
    SQLITE_READONLY_DBMOVED        = 1032;  // SQLITE_READONLY + (4*256) | [:L188]
    SQLITE_READONLY_CANTINIT       = 1288;  // SQLITE_READONLY + (5*256) | [:L189]
    SQLITE_READONLY_DIRECTORY      = 1544;  // SQLITE_READONLY + (6*256) | [:L190]
    // QUIRK PRESERVED - DO NOT "CORRECT" THIS TO 260. The oracle uses multiplier 2 and there is no
    // multiplier-1 sibling anywhere, so 516 is right and the apparent off-by-one is the legacy's.
    SQLITE_ABORT_ROLLBACK          =  516;  // SQLITE_ABORT + (2*256) | [:L191]
    SQLITE_CONSTRAINT_CHECK        =  275;  // SQLITE_CONSTRAINT + (1*256) | [:L192]
    SQLITE_CONSTRAINT_COMMITHOOK   =  531;  // SQLITE_CONSTRAINT + (2*256) | [:L193]
    SQLITE_CONSTRAINT_FOREIGNKEY   =  787;  // SQLITE_CONSTRAINT + (3*256) | [:L194]
    SQLITE_CONSTRAINT_FUNCTION     = 1043;  // SQLITE_CONSTRAINT + (4*256) | [:L195]
    SQLITE_CONSTRAINT_NOTNULL      = 1299;  // SQLITE_CONSTRAINT + (5*256) | [:L196]
    SQLITE_CONSTRAINT_PRIMARYKEY   = 1555;  // SQLITE_CONSTRAINT + (6*256) | [:L197]
    SQLITE_CONSTRAINT_TRIGGER      = 1811;  // SQLITE_CONSTRAINT + (7*256) | [:L198]
    SQLITE_CONSTRAINT_UNIQUE       = 2067;  // SQLITE_CONSTRAINT + (8*256) | [:L199]
    SQLITE_CONSTRAINT_VTAB         = 2323;  // SQLITE_CONSTRAINT + (9*256) | [:L200]
    SQLITE_CONSTRAINT_ROWID        = 2579;  // SQLITE_CONSTRAINT + (10*256) | [:L201]
    SQLITE_NOTICE_RECOVER_WAL      =  283;  // SQLITE_NOTICE + (1*256) | [:L202]
    SQLITE_NOTICE_RECOVER_ROLLBACK =  539;  // SQLITE_NOTICE + (2*256) | [:L203]
    SQLITE_WARNING_AUTOINDEX       =  284;  // SQLITE_WARNING + (1*256) | [:L204]
    SQLITE_AUTH_USER               =  279;  // SQLITE_AUTH + (1*256) | [:L205]
    // QUIRK PRESERVED: an EXTENDED code off the SUCCESS base, so a positive non-zero value that
    // denotes success rather than an error. Do not treat a non-zero code here as failure.
    SQLITE_OK_LOAD_PERMANENTLY     =  256;  // SQLITE_OK + (1*256) | [:L206]
  }
}

// ==============================================================================================
//  SECTION 6 - THE TWO DATAWINDOW DOMAIN ENUMS
//  --------------------------------------------------------------------------------------------
//  Both are TOP-LEVEL rather than nested, and Section 2 records why that is principled rather
//  than inconsistent: their legacy sources are PowerBuilder BUILT-IN enumerated literals whose
//  trailing-bang spelling (Primary!, DataModified!) cannot be carried into protobuf at all, so no
//  legacy spelling is at stake and the idiomatic enum-name-prefixed form is strictly better.
// ==============================================================================================

// DwBuffer - the PowerBuilder `dwbuffer` domain, in full.
//
// WHY THIS ENUM IS IN THIS FILE AND NOT IN persistence.v1.proto (the C-A justification, C-K).
// The admission test for common.v1.proto is that a definition be needed by BOTH sibling protocol
// definitions. DwBuffer passes it twice over, and the first reason is structural rather than a
// judgement call: DbError below has a `dwbuffer`-typed field [dberrordata.srs:L7], so DbError
// CANNOT BE DEFINED WITHOUT DwBuffer. Since DbError is shared, its field's type must be too.
// Independently, both siblings need it on their own account - C-03's Retrieve returns a server
// stream of buffer-shaped chunks and C-06's update path addresses rows by buffer.
//
// EXACTLY THREE MEMBERS, AND THERE IS NO FOURTH - NOT A SENTINEL EITHER. Verified by counting
// every literal across the eight in-scope legacy libraries rather than assumed from the type's
// name: Primary! appears 36 times, Filter! 18 and Delete! 2. The count is deliberately recorded
// because a fourth member invented later would be a new capability, not a port - and that includes
// a fourth member added for protocol convenience. AAP §0.4.5.2 maps `dwbuffer` to exactly
// `{ Primary, Delete, Filter }`, so three is the mandated target domain and not merely the
// observed one.
//
// A NOTE ON DW_BUFFER_DELETE. The prefix is not decoration here: a bare value named DELETE would
// generate an identifier that collides with the Win32 DELETE macro, which is a real hazard in
// generated C and C++ output from this same descriptor. The prefix removes the problem entirely.
//
// FILTER IS NOT A "LEFTOVER" BUFFER, and consumers must not treat it as one: the legacy walks the
// Filter buffer BACKWARDS during the identity round trip because its row order is inverted
// relative to the source [n_cst_thread_task_sqlupdate.sru:L235-L238]. That inversion is a property
// of the buffer, so it is a property of anything reconstructed from a payload tagged with it.
enum DwBuffer {
  // NO SYNTHETIC SENTINEL, AND THE ZERO MEMBER IS Primary! (C-K).
  // This domain DOES have a natural zero. PowerBuilder initialises an unassigned `dwbuffer` to
  // Primary!, so in the legacy "no buffer was supplied" and "the default buffer" are ONE state
  // rather than two - which is why the legacy can synthesize an error with Primary! and a row of 0
  // and mean "not attributable to any buffer or row" [n_cst_thread_task_sqlupdate.sru:L190].
  // Primary! therefore occupies zero on its own account and proto3's first-enumerator rule is
  // already satisfied, exactly as OK = 0 satisfies it for RetCode.
  //
  // WHY A SENTINEL WOULD BE A DEFECT RATHER THAN A CONVENIENCE. Inserting an UNSPECIFIED = 0 shifts
  // all three real members up by one, and AAP 0.4.5.3 forbids that outright: the values themselves
  // appear in serialized payloads, log records and characterization recordings, so a renumber
  // silently invalidates every stored comparison and every numeric bridge that casts between this
  // enum and a legacy buffer ordinal. Nothing fails to compile and everything reads one state too
  // high at runtime, which is the worst available failure shape.
  //
  // HOW ABSENCE IS EXPRESSED INSTEAD. Where a field genuinely needs to say "no buffer was supplied"
  // - RetrieveChunk.buffer in dataservices.v1.proto, whose single-buffer convenience value is
  // meaningless in a mixed chunk - that FIELD is declared proto3 `optional`, which gives real
  // presence tracking (HasBuffer / ClearBuffer on the generated C# type) without disturbing the
  // value domain at all. Presence is a property of a field, never a member of a value set.
  //
  // THE MIRROR IMAGE, STATED ADJACENTLY SO THE TWO RULINGS CANNOT BE TRANSPOSED. SQL_MS_* in
  // persistence.v1.proto MUST carry a synthetic SQL_MS_UNSPECIFIED = 0, because its legacy values
  // are 1, 2 and 3 and it occupies no zero at all. One rule - never renumber a legacy value -
  // producing opposite outcomes, decided purely by whether the legacy set already holds zero.
  // DwBuffer and ItemStatus follow the RetCode ruling; SQL_MS_* is the exception, and it is the
  // only one in the folder.
  DW_BUFFER_PRIMARY = 0;  // Primary! - the live rows; also the state of an unassigned dwbuffer (36 legacy uses)
  DW_BUFFER_DELETE  = 1;  // Delete!  - rows deleted but not yet flushed (2 legacy uses)
  DW_BUFFER_FILTER  = 2;  // Filter!  - filtered-out rows, ROW ORDER INVERTED (18 legacy uses)
}

// ItemStatus - the PowerBuilder `dwItemStatus` domain, in full.
//
// THE FOUR-VERSUS-THREE DECISION, AND WHY FOUR IS THE FAITHFUL CHOICE (C-K).
// A literal census of the in-scope legacy sources finds only THREE of the four statuses named:
// DataModified! 11 times, NewModified! 6 and NotModified! once, while bare New! NEVER APPEARS
// literally anywhere in scope. The tempting move is therefore to carry three.
//
// This file carries FOUR, and the reasoning is the distinction between a TYPE'S DOMAIN and the
// subset of it that in-scope code happens to mention. New! is a legal runtime status: the
// DataWindow engine assigns it to a row that has been inserted but not yet edited, entirely
// without any legacy source line having to name it. A three-member enum would therefore make some
// real rows UNREPRESENTABLE on the wire, and a payload that cannot represent a row's actual state
// is a lossy payload - it would force a service to either invent a substitute status or drop the
// row. Carrying all four is faithfulness to the legacy type, not an added capability: no operation,
// no field and no behaviour accompanies New!, only the ability to say it.
//
// THE ROW-STATUS CONVENTION, which is the single most surprising thing about this enum.
// The legacy reads a ROW's status by asking for COLUMN INDEX 0:
//     GetItemStatus(nRow, 0, Primary!)   [n_cst_thread_task_sqlupdate.sru:L160]
//     GetItemStatus(nIndex, 0, Primary!) [:L230]   GetItemStatus(nIndex, 0, Filter!) [:L238]
// Column 0 is NOT a real column - it means "the row itself". The same object also reads a genuine
// per-COLUMN status two lines away, with a real column index [:L162], so both readings coexist and
// the distinction is carried entirely by whether the index is zero. Any message in this folder that
// pairs an ItemStatus with a column identifier must therefore preserve that convention: a column
// identifier of 0 denotes the row's own status, not column zero's.
enum ItemStatus {
  // NO SYNTHETIC SENTINEL, AND THE ZERO MEMBER IS NotModified! - the same ruling as DwBuffer above,
  // for the same reason and with the same AAP 0.4.5.3 authority (C-K). NotModified! is the state a
  // freshly retrieved row is in and the state an unassigned `dwItemStatus` reads as, so it occupies
  // zero naturally and proto3's first-enumerator rule is already satisfied.
  //
  // "THE ROW IS UNMODIFIED" VERSUS "NO STATUS WAS SUPPLIED" - a real distinction, kept, but moved
  // off the value domain and onto field presence. The two statements are genuinely different and
  // conflating them would lose the second - which is why a sentinel VALUE is the tempting mechanism.
  // The correct mechanism is proto3 `optional` on the field that needs it: ColumnValue.item_status
  // is declared optional precisely because a status is not meaningful on every column in every
  // direction, and its absence is then expressed by presence tracking rather than by a fourth-plus
  // enum member that shifts DataModified!, New! and NewModified! up by one and breaks every
  // recorded numeric comparison.
  ITEM_STATUS_NOT_MODIFIED  = 0;  // NotModified!  - existing row, unchanged (1 legacy use)
  ITEM_STATUS_DATA_MODIFIED = 1;  // DataModified! - existing row, edited (11 legacy uses)
  // New! - inserted, not yet edited. NEVER named literally in scope, but a legal runtime status,
  // so it is carried to keep the domain complete. See the four-versus-three note above.
  ITEM_STATUS_NEW           = 2;
  ITEM_STATUS_NEW_MODIFIED  = 3;  // NewModified!  - inserted and edited (6 legacy uses)
}


// ==============================================================================================
//  SECTION 7 - THE VALUE CARRIERS
//  --------------------------------------------------------------------------------------------
//  The concrete messages that implement Section 1's UNIFORM CARRIER RULE. Each passes the
//  admission test - both sibling definitions need every one of them. C-03's buffer chunks and
//  C-04's expression variable environment carry column and variable values; C-05's query results,
//  C-06's ConflictDetail and C-07's positional binding carry exactly the same value shapes. A
//  value carrier defined in only one sibling would have to be duplicated in the other, and two
//  independently-drifting definitions of "a decimal on the wire" is precisely the failure this
//  file exists to prevent.
//
//  WHY EVERY NAME CARRIES A `Value` SUFFIX, WHICH IS A DELIBERATE DEVIATION FROM THE LEGACY TYPE
//  NAMES (C-K). The obvious naming - Decimal, Date, Time, DateTime, matching Section 1's legacy
//  column - WOULD BREAK EVERY CONSUMING SERVICE, and the mechanism is worth stating precisely so
//  the suffix is never "tidied" away. Directory.Build.props sets ImplicitUsings, so the SDK injects
//  `global using System;` into every project in this repository, application and test alike. A
//  service file that also writes `using PowerFramework.Contracts.Common.V1;` and then mentions a
//  bare `DateTime` or `Decimal` would find two candidates in scope - System.DateTime and the
//  generated contract type - and C# reports that as CS0104 "ambiguous reference". Because
//  TreatWarningsAsErrors is set, that is a BUILD FAILURE, not a nuisance, and it would appear in
//  Gateway, DataServices and Persistence at once.
//
//  This is the same class of clash the file header flags for RetCode, but the resolution differs
//  for a reason. RetCode's name is part of the published boundary and its counterpart is a
//  hand-written type in this same repository, so the fix there is a using alias at the consumer.
//  These carriers are net-new names with no legacy spelling to preserve - PowerBuilder's `dec`,
//  `date`, `time` and `datetime` are lower-case built-in keywords, not identifiers that appear in
//  a payload - so the cheaper and safer fix is available: choose a name that never collides. The
//  suffix is applied UNIFORMLY, including where it is not strictly needed (DateValue, TimeValue),
//  because a rule that holds for four types out of four is one a reader can trust, whereas a rule
//  with exceptions invites the exceptions to be relitigated.

// A decimal, carried as canonical invariant TEXT. NEVER a double - see Section 1.
//
// CANONICAL FORM, stated so that two encodings of one number are byte-identical, which is what a
// golden-master comparison requires: optional leading '-', then digits, then an optional '.' and
// further digits. No leading '+', no exponent, no thousands separator, no whitespace, and no
// culture-dependent decimal separator ever - the separator is always '.' regardless of locale.
// TRAILING ZEROES ARE SIGNIFICANT AND MUST BE PRESERVED, because they carry the declared scale:
// the primary fixture's `salary decimal(2)` renders 1500 as "1500.00", and normalising that to
// "1500" would silently change the scale the legacy declared.
message DecimalValue {
  string value = 1;
}

// A calendar date with no time component - the legacy `date` type, mapped by the refactor onto
// DateOnly. Canonical form is ISO 8601 "yyyy-MM-dd", zero-padded, proleptic Gregorian.
// This is one of THREE DISTINCT temporal messages, deliberately not one Timestamp (Section 1).
message DateValue {
  string value = 1;
}

// A time of day with no date component - the legacy `time` type, mapped onto TimeOnly. Canonical
// form is "HH:mm:ss" on a 24-hour clock, with an optional ".ffffff" fractional part present only
// when non-zero. NO time zone offset and NO 'Z' suffix: a bare time of day has no instant to
// anchor an offset to, which is one of the two concrete reasons Timestamp cannot serve here.
message TimeValue {
  string value = 1;
}

// A date and time together - the legacy `datetime` type, mapped onto DateTime. Canonical form is
// "yyyy-MM-ddTHH:mm:ss" with an optional ".ffffff" fractional part present only when non-zero.
// UNZONED, matching the legacy, which has no time-zone concept at all: adding an offset here would
// invent information the oracle does not have, and omitting it keeps the round trip exact.
message DateTimeValue {
  string value = 1;
}

// AnyValue - the legacy `any` type as a DISCRIMINATED UNION, never a stringly-typed map.
//
// WHY A UNION AND NOT A STRING (C-K). `any` reaches the boundary from two directions: the
// `any`-returning macro-invocation event, and the expression variable environment, which is
// strongly typed across SEVEN distinct scalar types (time, string, long, double, datetime, date,
// boolean). Flattening those to strings would discard the type information that the legacy
// coercion behaviour dispatches on - the item-change path selects its conversion by the column's
// declared type - so a stringly-typed carrier would not merely be untidy, it would make the
// coercion unreproducible.
//
// THE EXPLICIT NULL ARM IS LOAD-BEARING, NOT DEFENSIVE. PowerBuilder has null for value types and
// the return-code predicates depend on it: null is NEITHER succeeded nor failed (Section 3). The
// refactor's standing instruction is never to collapse null to zero, because doing so converts
// "neither" into "succeeded". A set `is_null` therefore means "the value is SQL/PowerScript NULL",
// which is a positive statement, and it is distinct from the whole `kind` oneof being unset, which
// means "no value was supplied at all". Consumers must keep those two apart.
//
// AND NULL IS NOT THE EMPTY STRING EITHER, which is the sharper form of the same rule and the one
// with a concrete failure attached. In the optimistic-concurrency comparison of Section 9 the
// legacy distinguishes a null column from an empty one, so collapsing the two WOULD MATCH ROWS THE
// LEGACY WOULD NOT - it would silently widen the WHERE clause and overwrite a row that should have
// conflicted. `is_null = true` and `string_value = ""` are therefore different values here, and a
// producer must never substitute one for the other. This is also why every value on the wire is an
// AnyValue rather than a bare scalar plus a side-channel flag: the null-ness travels WITH the
// value, so there is no way to serialize one without the other.
//
// int64 covers both `long` and `integer` per Section 1's widening rule, so there is no separate
// int32 arm; a narrower arm would only create a second way to say the same thing.
message AnyValue {
  oneof kind {
    // Set to true to state the value IS null. Never set it to false - to say "not null", set one of
    // the other arms instead. This arm existing at all is what keeps null distinct from zero.
    bool is_null = 1;

    bool bool_value = 2;             // legacy boolean
    int64 int64_value = 3;           // legacy long AND integer (widened, Section 1)
    uint64 uint64_value = 4;         // legacy unsignedlong
    // legacy double/real - genuinely floating point at source.
    //
    // NOT-A-NUMBER IS REFUSED, AND THE TWO INFINITIES ARE NOT. Persistence answers its own defined
    // refusal for a NaN in this arm - E_INVALID_DATA with "无效的更新数据!" for an update payload,
    // E_INVALID_ARGUMENT for a command or query parameter - before any statement is generated, so a
    // multi-row payload cannot half-apply. The distinction is the storage provider's and was measured:
    // binding NaN raises a fault rather than a database error, while both infinities bind and store.
    // A DELIBERATE NARROWING: the legacy has no NaN at all - PowerScript has no literal for it - so
    // there is no legacy behaviour to preserve, and substituting null or zero would write a value the
    // caller never sent.
    double double_value = 5;
    DecimalValue decimal_value = 6;  // legacy dec / decimal(n) - NOT double_value
    DateValue date_value = 7;        // legacy date
    TimeValue time_value = 8;        // legacy time
    DateTimeValue datetime_value = 9;// legacy datetime
    string string_value = 10;        // legacy string
    bytes blob_value = 11;           // legacy blob
  }
}

// ColumnValue - one column's value, tagged with how the legacy identifies that column.
//
// BOTH IDENTIFIERS ARE CARRIED, and neither is redundant. The legacy addresses a column by name in
// expressions and by ordinal in the buffer and status APIs, and the two are not interchangeable at
// a boundary: a name survives a column reorder while an ordinal does not, and an ordinal is what
// the status APIs actually take. Carrying both lets a consumer use whichever its call site needs
// without a lookup table it would have to keep in step.
//
// column_id CARRIES THE ROW-STATUS CONVENTION described on ItemStatus: a column_id of 0 denotes
// THE ROW ITSELF, not the first column, exactly as GetItemStatus(row, 0, buffer) does. Legacy
// column ordinals are ONE-BASED, so a real column is 1 or greater. That is stated explicitly here
// because one-based-to-zero-based translation is the most dangerous mechanical hazard in this
// refactor, and a reader who assumes zero-based ordinals will be wrong by one everywhere.
// A PER-COLUMN ITEM STATUS IS CARRIED, AND IT IS BEHAVIOURALLY LOAD-BEARING RATHER THAN
// INFORMATIONAL. The legacy reads a status at BOTH granularities from the same call, distinguished
// only by whether the column index is zero: GetItemStatus(row, 0, buffer) for the row itself
// [n_cst_thread_task_sqlupdate.sru:L160] and GetItemStatus(row, <realColumnIndex>, buffer) for one
// column, two lines away at [:L162]. The per-column status is what SELECTS WHICH STATEMENT KIND IS
// GENERATED, so a carrier that could not express it would force the update path to guess. It is
// optional in the protobuf sense rather than merely "in effect" - omit the field entirely when only
// the value matters, as in a plain query result - because a status is not meaningful on every column
// in every direction.
message ColumnValue {
  // THE NAME, AND WHEN IT IS EMPTY. Persistence carries it wherever it knows it: a retrieval records its
  // column names as it fills the carrier, and an update resolves them anyway when it builds its column
  // plan, so both the query chunks and an update's conflict rows carry both identifiers. It is the EMPTY
  // STRING only where the name is genuinely not known - a carrier populated from a caller-supplied
  // changeset has never been told the names, because the legacy blob carries ordinals and nothing else.
  // A name is never FABRICATED from the ordinal: an invented identifier would be indistinguishable from a
  // real one and would not survive the column reorder this field exists to survive, which is worse than
  // an absent one.
  string column_name = 1;
  // ONE-BASED column ordinal. 0 is reserved by the legacy convention for "the row itself".
  //
  // int64, NOT int32, and the width is fixed by Section 1's rule rather than chosen here. The legacy
  // produces this ordinal as `Long(dwo.ID)` - PowerBuilder `long` - at every site that reads it
  // [ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L190, :L219, :L220, :L233;
  // n_cst_dwsvc_columnexp.sru:L216], and Section 1 maps legacy `long` onto int64. Every sibling
  // identifier in this folder already does so - IdentityColumnData.identity_column_id below,
  // dataservices.v1.DwObjectRef.id, ColumnSort.column_id and CalcResult.column_id - so an int32 here
  // was a silent DRIFT rather than a narrowing anybody decided on: the generated C# gave this one
  // field an `int` while every identifier beside it got a `long`, which is precisely the kind of
  // divergence Section 1 exists to prevent, and it would have surfaced as a cast at every consumer
  // that moved a column id between the two.
  int64 column_id = 2;
  AnyValue value = 3;
  // This COLUMN's own status, not the row's; the row's status lives on the containing row message.
  //
  // DECLARED proto3 `optional`, WHICH IS HOW ABSENCE IS EXPRESSED HERE (C-K). ItemStatus carries no
  // "unspecified" member - see the ruling on that enum - so the ability to say "no status was
  // supplied" lives on this field instead, as real presence tracking. The generated C# gains
  // HasItemStatus and ClearItemStatus, and an omitted field is unambiguously distinct from an
  // explicit ITEM_STATUS_NOT_MODIFIED, which is exactly the distinction a sentinel would have been
  // reaching for. Absent is the NORMAL case outside the update path.
  //
  // ============ WHAT ABSENCE MEANS *ON* THE UPDATE PATH, WHICH IS NOT LEFT TO A READER ============
  //
  // Saying only "absent is normal outside the update path" left the update path itself undefined, and
  // the reading a receiver picked was the harmful one: every absent status read as NotModified!, so a
  // row stamped DataModified! carrying its six current values and its six originals - the payload this
  // contract describes, and the payload a caller assembles from what a retrieval returned - generated
  // no SET list, affected no row, and was classified as an OPTIMISTIC-CONCURRENCY CONFLICT. The caller
  // was told another writer had changed a row nothing had touched, and the only way to make an update
  // apply at all was to send a field this contract calls optional.
  //
  // THE RULE, IN BOTH DIRECTIONS:
  //   * NOT ONE column of a MODIFIED row carries a status  -> the ROW's own status governs EVERY COLUMN
  //     WHOSE SUPPLIED VALUE DIFFERS FROM ITS SUPPLIED ORIGINAL, and a column whose value did not move
  //     stays NotModified!. This is the legacy row-status convention above: a row's status is read with
  //     column index 0 [n_cst_thread_task_sqlupdate.sru:L160], and in process a row is DataModified!
  //     precisely BECAUSE a column of it was modified - but the row's OTHER columns are NOT modified,
  //     since the runtime flips a status only where SetItem changed a value. That is what makes the
  //     generated SET list name the columns that changed rather than the whole updatable set. Because a
  //     row carries both halves of every marked column anyway - updatewhere=1 needs the originals for
  //     the predicate - the pair itself says which columns moved, so reading it reconstructs exactly the
  //     per-column state the in-process runtime would have held. Adopting the row's status for every
  //     supplied column instead writes a WIDER SET LIST than the oracle's and stamps the KEY column
  //     modified, which sends an update whose key never moved down the updatekeyinplace=no
  //     DELETE-plus-INSERT path and answers rowsUpdated = 0 beside statements the caller never asked for.
  //     THE VALUE TEST APPLIES ONLY WHERE AN ORIGINAL WAS STATED: a column with no original_values entry
  //     has no baseline to be measured against, so the row's statement stands for it - which is the whole
  //     of an INSERT-shaped row, whose status is NewModified! and which carries no originals at all
  //     because it has no prior state.
  //   * ANY column carries a status -> every column is taken at its word, and an unstamped one stays
  //     NotModified!. This is what keeps a partial update EXACT: a payload that stamps the one column it
  //     changed writes exactly that column, so an unmodified value cannot clobber a concurrent writer's.
  //     Presence, not value, decides WHICH RULE APPLIES - an explicit ITEM_STATUS_NOT_MODIFIED is a
  //     statement, and an explicit ITEM_STATUS_DATA_MODIFIED is honoured even where the value did not
  //     move, which is how the legacy's self-assignment key-refresh workaround
  //     [n_cst_thread_task_sqlupdate.sru:L155-L167] stays expressible across this boundary.
  //   * A MODIFIED row whose every updatable column resolves to NotModified! cannot express an update.
  //     It is a payload contradiction and is refused with the oracle's own invalid-update-data code,
  //     RetCode.E_INVALID_DATA - HTTP 400 through C-09 - never as a concurrency conflict.
  //
  // VALUES ARE COMPARED AS VALUES, NOT AS WIRE ARMS. AnyValue is a union in which one number has several
  // faithful spellings - a retrieval answers a legacy `number` column through double_value, and a caller
  // re-sending that number as int64_value is equally within the contract - so 28 sent as int64_value and
  // 28 sent as double_value are THE SAME VALUE for the test above, exactly as the storage engine compares
  // them. No conversion is invented ACROSS families: a date is not compared against the text that would
  // render it, and a bool is not compared against 0 or 1.
  //
  // A PRODUCER INSIDE THIS SYSTEM ALWAYS SETS THE FIELD, so the first rule is reachable only from a
  // caller-composed payload: the carrier serialization assigns this field on every projected column, and
  // assigning a proto3 `optional` field sets its presence bit whatever the value.
  optional ItemStatus item_status = 4;
}

// DataWindowRow - one row, buffer-tagged and status-tagged.
//
// WHY THIS MESSAGE IS IN THE COMMON FILE (the C-A admission test, C-K).
// It sits in the common file for one reason: BOTH
// siblings need it. C-03's RetrieveChunk and its update rows produce and consume it, and
// persistence.v1's CarrierState carries it inside every buffer segment of C-05's query chunks and
// C-06's update input. Two consumers, so one definition, here - exactly the ruling IdentityColumnData
// records below. A per-file copy would be two types that serialise alike until one of them gained a
// field, and this payload is the kind whose drift is invisible: both copies would carry a buffer tag,
// a row ordinal, a status and two value lists, and only the FIELD NUMBERS would differ.
//
// WHY A FLAT ROWSET WOULD NOT DO, stated here because it is the obvious simplification and it is
// wrong: the legacy result carrier derives from a `datastore`, so it IS a DataWindow complete with
// buffers and per-item statuses, and the original-value shadow the update contract compares against
// is part of that state rather than something recomputable from the current row.
message DataWindowRow {
  // Which buffer the row sits in. DwBuffer above records that THE FILTER BUFFER'S ROW ORDER IS
  // INVERTED relative to the source, so `row` does not count the same way across buffers.
  //
  // ALWAYS MEANINGFUL, SO NO EXPLICIT PRESENCE - a row is in exactly one buffer, always. The zero
  // value is DW_BUFFER_PRIMARY, matching PowerBuilder's own unassigned-`dwbuffer` default, so an
  // untagged row reads as a Primary row. That is the right default and it is also a trap for a lazy
  // producer: a Delete! or Filter! row MUST carry its tag explicitly, because silence means Primary
  // and a mis-tagged Filter row would be counted in the wrong direction.
  DwBuffer buffer = 1;

  // ONE-BASED row ordinal within that buffer.
  int64 row = 2;

  // THE ROW'S OWN status, read the legacy way with column index 0 - the convention ItemStatus
  // documents above, and the one the legacy uses at [se_cst_dw.sru:L190] and [:L335]:
  // GetItemStatus(row, Long(dwo.ID), Primary!) for a column, GetItemStatus(row, 0, buffer) for the
  // row.
  ItemStatus item_status = 3;

  // The row's CURRENT column values. Each ColumnValue carries the column name, the one-based ordinal
  // and, where it is meaningful, that column's own status.
  //
  // A NOTE FOR PRODUCERS OF A CARRIER CHANGESET, so an empty name is not read as an omission. The
  // legacy's cross-thread carrier serialization is POSITIONAL - `GetChanges(ref blob)` carries column
  // ORDINALS and no names at all - so a row projected from a carrier's changeset leaves
  // ColumnValue.column_name empty and column_id is the authoritative identifier there. A row
  // projected from a live DataWindow, as C-03's retrieve path does, carries both.
  repeated ColumnValue columns = 4;

  // The ORIGINAL values of the columns marked for the concurrency comparison.
  //
  // POPULATED IN BOTH DIRECTIONS, AND ON A RETRIEVED ROW ITS ENTRIES EQUAL THE CURRENT ONES. It is
  // declared on this message rather than on a separate update-only row type because a row is one thing
  // whichever direction it travels, and a second row shape would drift. ConflictDetail below records
  // why both values must travel: the one updatable DataWindow in the repository declares
  // `updatewhere=1` and marks ALL SIX columns `updatewhereclause=yes`, so the generated WHERE clause
  // carries the key column PLUS THE ORIGINAL VALUE OF EVERY UPDATEABLE COLUMN. A payload carrying only
  // current values could not express what the failed statement compared.
  //
  // ONE ENTRY PER COLUMN THIS ROW CARRIES, WITH NO OMIT-WHEN-EQUAL ALLOWANCE. Letting a producer skip a
  // column whose original equals its current value, and requiring the consumer to read the omission as
  // "unchanged since the last baseline", is the tempting compression. That is an inference the carrier
  // codecs can make about their own payloads and a consumer of this CONTRACT cannot be asked to: it
  // leaves a freshly retrieved row carrying no baseline for any column, so the caller that has to build
  // the concurrency predicate must reconstruct it from an absence - and reading the absence the other
  // legal way, as "no baseline exists", drops the predicate and silently overwrites. AAP 0.6.3.2 states the rule
  // without an exemption: per row, both the current and the original value of every marked column.
  //
  // AN EMPTY LIST THEREFORE MEANS EXACTLY ONE THING: the row has NO PRIOR STATE. That is an
  // insert-shaped row, which has nothing to compare against and whose generated statement carries no
  // WHERE clause at all.
  repeated ColumnValue original_values = 5;
}

// NullableInt64 - an int64 that can also say "no value".
//
// WHY A WRAPPER MESSAGE RATHER THAN A BARE repeated int64 (C-K). A repeated scalar field cannot
// express a missing element: proto3 has no presence on the elements of a packed scalar array, so a
// null would have to be COERCED to some number or DROPPED, and both are silent data loss inside a
// payload that a consumer cannot audit. A repeated MESSAGE field gives every element its own presence
// bit, so "null" travels as an element whose `value` is simply not set, and the array's LENGTH and
// ORDER survive unchanged - which matters because IdentityColumnData's two arrays are order-bearing.
//
// WHERE THE NULL COMES FROM, so the wrapper does not read as defensive plurality. The legacy collects
// identity values with `GetItemNumber`, which ANSWERS NULL for a null item, and PowerScript stores
// that null straight into the array it hands to the callback
// [n_cst_threading_task_sqlupdate.sru:L144, :L160]. Collapsing it to zero would make a null
// indistinguishable from a legitimate identity value of zero.
//
// google.protobuf.Int64Value from wrappers.proto has the same shape and is deliberately NOT used:
// AAP 0.5's dependency inventory authorises no package carrying the well-known types beyond
// descriptor.proto, and 0.5.3 is explicit that a package outside the inventory is scope creep. The
// alternative is one four-line message.
message NullableInt64 {
  // Set to state the value. UNSET means the element is null - never set it to 0 to mean "absent".
  optional int64 value = 1;
}


// ==============================================================================================
//  SECTION 8 - DbError : THE LEGACY DATABASE-ERROR STRUCTURE, MIRRORED FIELD FOR FIELD
//  --------------------------------------------------------------------------------------------
//  A field-for-field mirror of ws_objects/pfw.thread.ext.pbl.src/dberrordata.srs:L3-L9, whose own
//  header calls it the DBError data structure. EXACTLY FIVE FIELDS, IN THE ORACLE'S OWN ORDER:
//
//      long      sqldbcode    [:L4]      ->  int64     sqldbcode  = 1
//      string    sqlerrtext   [:L5]      ->  string    sqlerrtext = 2
//      string    sqlsyntax    [:L6]      ->  string    sqlsyntax  = 3   REDACTED, see below
//      dwbuffer  buffer       [:L7]      ->  DwBuffer  buffer     = 4
//      long      row          [:L8]      ->  int64     row        = 5
//
//  No sixth field, no reordering, no renaming. The legacy field spellings are kept verbatim rather
//  than restyled to protobuf's preferred multi-word snake_case (sql_db_code, sql_err_text): each is
//  already a single lower-case token and therefore already valid, and keeping them makes the
//  correspondence to the oracle checkable at a glance, which is the whole point of a mirror.
//
//  DbError IS THE OnDBError PAYLOAD - not merely similar to it. The decisive evidence is that the
//  legacy forwards the five structure fields positionally, in structure order, in one expression:
//      event dberror;return #ParentTask.Event OnDBError(sqldbcode,sqlerrtext,sqlsyntax,buffer,row)
//      [n_cst_thread_task_sqlbase_ds.sru:L159]
//  Other call sites confirm the same five-positional shape, including the synthesized
//  "no updatable table" error [n_cst_thread_task_sqlupdate.sru:L190] and the failing-command case
//  [n_cst_thread_task_sqlcommand.sru:L110]. The structure is additionally passed as a `ref`
//  out-parameter, `of_GetTransObject(ref transObject, ref dbErrData)`
//  [n_cst_thread_task_sqlbase.sru:L187, n_cst_thread_task_sqlcommand.sru:L70,
//  n_cst_thread_task_sqlquery.sru:L520, n_cst_thread_task_sqlupdate.sru:L292], so it is genuinely a
//  carrier the caller reads back - which is exactly what makes it a response message here. The four
//  locators are spelled in full rather than abbreviated: no file named `sqlbase.sru`, `sqlcommand.sru`,
//  `sqlquery.sru` or `sqlupdate.sru` exists anywhere in ws_objects/, so a shortened form resolves to
//  nothing.
//
//  ================= sqlsyntax : THE ONE FIELD THAT MUST BE REDACTED =========================
//  SHAPE CHOSEN, EXPLICITLY (C-K). Two shapes were permitted: a single REDACTED field, or a
//  statement field plus a repeated parameter field. THIS FILE USES THE REDACTED SINGLE FIELD, and
//  the deciding reason is that it is the only one of the two that ALSO satisfies the
//  field-for-field five-field mirror above - splitting would have introduced a SIXTH field and
//  broken the exact correspondence to dberrordata.srs that the rest of this section depends on.
//  The redacted single field satisfies both requirements at once; the split satisfies only one.
//
//  WHY REDACTION IS REQUIRED AT ALL, mechanically rather than as a precaution. The legacy places
//  the COMPLETE GENERATED STATEMENT, INCLUDING INTERPOLATED LITERAL VALUES, into this field - the
//  failing command text is passed straight into the error event at
//  [n_cst_thread_task_sqlcommand.sru:L110] - and the legacy logger performs NO redaction of any
//  kind. Every literal in a failing statement therefore reaches whatever consumes the error.
//
//  THE MECHANICAL ROOT is the connection parameter string. The legacy parses `DBParm` for the
//  DisableBind and NCharBind flags [n_cst_thread_task_sqlbase.sru:L128-L129], and DisableBind=1
//  MEANS THE RUNTIME DOES NOT USE BIND VARIABLES - values are interpolated into the statement text
//  as literals instead. That is not a bug in the error path; it is why the statement text contains
//  data in the first place, and it is why a field that merely echoed it would leak whatever the
//  failing row contained.
//
//  WHAT A PRODUCER MUST PUT HERE: statement text with every literal removed - parameter
//  placeholders only, or an empty string when even the shape is sensitive. What a producer must
//  NEVER put here: an interpolated literal, a column value, or anything derived from row data.
//  Note that in-scope legacy call sites already pass "" for this field in most cases, so an empty
//  value is ordinary rather than exceptional.
//
//  This is a NARROWING of an in-process field on a NEW boundary, not a change to an existing wire
//  format - there was no wire format. The unredacted text remains available to the service's own
//  diagnostics under its own controls, so nothing is lost to the operator who owns the service;
//  only the network peer's view is narrowed. Consumers must not treat this field as reproducing the
//  executed statement byte for byte, because deliberately it does not.
//  ==========================================================================================
message DbError {
  // The driver's own numeric code, as the legacy transaction object reports it. NOTE this is NOT a
  // RetCode: for the SQLite provider it is a SqliteResultCode, and for another provider it is that
  // provider's code space. Three different code spaces reach this one field depending on provider,
  // which is why it is a plain integer here and not one of this file's enums. [dberrordata.srs:L4]
  int64 sqldbcode = 1;

  // The driver's message text, LITERAL-REDACTED. May be non-English: legacy call sites synthesize
  // Chinese diagnostics for framework-detected conditions, for example the "no updatable table" case
  // at [n_cst_thread_task_sqlupdate.sru:L190]. Consumers must treat this as opaque display text and
  // must not parse it to classify the error - use sqldbcode for that. [dberrordata.srs:L5]
  //
  // REDACTED ON THE SAME TERMS AS sqlsyntax, AND THE REASON IS THE SAME MECHANISM. Opacity describes
  // how a consumer may READ this field; it says nothing about what the provider PUTS in it, and what
  // SQLite puts in it routinely includes the caller's own data - a uniqueness violation names the
  // duplicated column, a constraint or type failure quotes the offending value, a bad identifier
  // echoes the text the caller sent. The legacy could publish that safely because it published
  // nothing at all: PowerFramework is a library, and this field never left the process. Across this
  // boundary it reaches a network peer.
  //
  // THE REDACTION IS LITERAL-SCOPED, so this remains a useful diagnostic. String literals, radix
  // literals, numeric literals and comment bodies are replaced with placeholders; every other byte
  // is copied through unchanged. A message that quotes no value therefore arrives byte for byte -
  // `near "FROM": syntax error` and `NOT NULL constraint failed: COMPANY.NAME` are unaltered - so a
  // consumer still learns WHICH condition failed and on which column. What it does not learn is the
  // row data. Consumers must not treat this field as reproducing the driver's message byte for byte,
  // because when the driver quoted a value it deliberately does not.
  string sqlerrtext = 2;

  // REDACTED STATEMENT TEXT. Placeholders only, never interpolated literals; empty is valid and
  // common. See the sqlsyntax block above for the full rule and the DisableBind=1 mechanism that
  // makes it necessary. [dberrordata.srs:L6]
  string sqlsyntax = 3;

  // The buffer the offending row sits in. DwBuffer is defined in this file precisely so that this
  // field can exist here - see the DwBuffer placement note. [dberrordata.srs:L7]
  //
  // NOT `optional`, DELIBERATELY. The legacy structure always carries a buffer, and its cleared
  // state is Primary! rather than an absence - the framework's own synthesized error passes
  // Primary! with row 0 to mean "not attributable to one row" [n_cst_thread_task_sqlupdate.sru:L190].
  // Because DW_BUFFER_PRIMARY is the zero member, a default-constructed DbError observes exactly the
  // legacy cleared state with no presence machinery and no bridging code on either side.
  DwBuffer buffer = 4;

  // The offending row number, ONE-BASED like every legacy row ordinal. 0 means "no particular row",
  // which is what the legacy passes for a connection- or statement-level failure that is not
  // attributable to one row [e.g. n_cst_thread_task_sqlupdate.sru:L190]. [dberrordata.srs:L8]
  int64 row = 5;
}

// ==============================================================================================
//  SECTION 9 - ConflictDetail : THE OPTIMISTIC-CONCURRENCY MISMATCH PAYLOAD
//  --------------------------------------------------------------------------------------------
//  Carried on the gRPC `Aborted` status returned by C-06's Update, and by C-03's Update which
//  relays it; Gateway's REST projection surfaces the same payload as HTTP 409. It lives in this
//  file because BOTH sibling definitions reference it, which is the admission test.
//
//  ABORTED, NOT FAILED_PRECONDITION, and the distinction is deliberate: the operation MAY succeed
//  if the caller re-reads and retries at a higher level, which is exactly what Aborted means and
//  what FailedPrecondition does not. Aborted is also the canonical gRPC mapping to HTTP 409.
//
//  NO SILENT OVERWRITE ANYWHERE IN THE SYSTEM. This message exists so that a mismatch is always
//  reported rather than resolved by guessing. The caller implements an explicit retry-or-surface
//  policy; there is no last-writer-wins path and no field here that would enable one.
//
//  WHY BOTH CURRENT AND ORIGINAL VALUES MUST TRAVEL - the requirement comes straight from the
//  legacy DataWindow settings and is not a design preference. The one updatable DataWindow in the
//  repository, ws_objects/pfw.tests.pbl.src/dw_sqlite.srd, declares `updatewhere=1` and marks ALL
//  SIX of its columns `updatewhereclause=yes`. updatewhere=1 is the "key and updateable columns"
//  concurrency mode, so the generated WHERE clause carries the key column PLUS THE ORIGINAL VALUE
//  OF EVERY UPDATEABLE COLUMN. A payload that carried only current values could therefore not
//  express what the failed statement actually compared, and the caller could not tell which column
//  moved underneath it. Hence two repeated fields per row, not one.
//
//  This is also why a flat rowset is insufficient anywhere in this folder: the legacy result
//  carrier derives from a datastore, so it IS a DataWindow complete with buffers and item
//  statuses, and the original-value shadow is part of that state rather than something
//  recomputable from the current row.
// ==============================================================================================

// One row that failed its concurrency check.
message ConflictRow {
  // Which buffer the row is in. Remember the Filter buffer's row order is inverted relative to the
  // source, so a consumer must not assume `row` counts the same way across buffers.
  DwBuffer buffer = 1;

  // ONE-BASED row ordinal within that buffer.
  int64 row = 2;

  // The row's status as the SERVER sees it now, read the legacy way with column index 0 (the
  // row-status convention documented on ItemStatus).
  //
  // A ROW ALWAYS HAS A STATUS, so unlike ColumnValue.item_status this field needs no explicit
  // presence: the server has read one by the time it builds a conflict row, and the zero value
  // NotModified! is a real status rather than a stand-in for "unknown". A server that has not read
  // the status has no business emitting this message.
  ItemStatus item_status = 3;

  // The CURRENT server-side values of the marked columns - the state a retry would be rebased onto.
  repeated ColumnValue current_values = 4;

  // The ORIGINAL values the caller believed were current: the values that formed the failed
  // statement's WHERE clause under updatewhere=1. Comparing these against current_values is what
  // tells a caller WHICH column changed underneath it, which is the whole diagnostic value of this
  // message. Empty only if the caller supplied no original-value shadow, which is itself a fault.
  repeated ColumnValue original_values = 5;
}

// The conflict payload as a whole. Repeated rows rather than a single row because one Update call
// submits a whole changeset, so more than one row can conflict in a single failed attempt, and
// reporting only the first would send a caller round the retry loop once per conflicting row.
message ConflictDetail {
  // Every row that failed its check. Never empty on an Aborted response: an Aborted with no rows
  // would tell the caller nothing it could act on.
  repeated ConflictRow rows = 1;

  // The update table the failing statement targeted. Carried because MULTI-TABLE UPDATE FROM ONE
  // DATAWINDOW IS A REAL LEGACY CAPABILITY - the update contract is re-derived at runtime from an
  // ARRAY of table descriptors, not from the DataWindow's static definition - so without this a
  // caller could not tell which of several targeted tables the conflict came from.
  string update_table = 2;

  // How many rows the failing statement expected to affect, and how many it actually matched. For
  // the classic single-row optimistic-concurrency failure these are 1 and 0, and stating both keeps
  // "the row changed" distinguishable from "the row was deleted" without a second round trip.
  int64 rows_expected = 3;
  int64 rows_matched = 4;
}
// ==============================================================================================
//  SECTION 10 - IdentityColumnData : THE IDENTITY ROUND TRIP
//  --------------------------------------------------------------------------------------------
//  WHY THIS MESSAGE IS IN THE COMMON FILE (the C-A admission test, C-K).
//  It sits in the common file for one reason: BOTH
//  siblings need it. C-06's UpdateResponse produces it, and C-03's UpdateResponse RELAYS IT
//  UNCHANGED to Gateway - without which a caller that inserted rows could never learn the
//  auto-increment values the database assigned them, and no inserted DataWindow row could be
//  reconciled with its generated identity. Two consumers, so one definition, here. Duplicating it in
//  both service files would let the two copies drift, and this payload is exactly the kind whose
//  drift is invisible: both copies would carry two int64 arrays and only the ORDER would differ.
//
//  THE COLUMN IS DISCOVERED AT RUN TIME, NOT TAKEN FROM THE DESCRIPTOR
//  [n_cst_thread_task_sqlupdate.sru:L217-L225]. The legacy lowercases the update table name, appends
//  a dot, and prefix-matches that against each column's database name - WITH A FIRST-WINS FALLBACK
//  that accepts the first identity column found if no name matched [:L221]. So the value reported
//  here can differ from the identity column named in the request's table contract, and a consumer
//  must READ it rather than assume it.
//
//  COLLECTION IS CONDITIONAL AT THREE LEVELS, so an absent identity block means "none collected" and
//  is NOT an error: rows must have been inserted at all [:L215], an identity column must have been
//  found [:L226], and at least one of the two arrays must be non-empty [:L242-L244].
//
//  ROWS ARE SELECTED BY THE ROW-STATUS CONVENTION, WHICH USES COLUMN INDEX ZERO:
//      GetItemStatus(nIndex, 0, Primary!) = NewModified!     [:L230]
//      GetItemStatus(nIndex, 0, Filter!)  = NewModified!     [:L238]
//  COLUMN 0 IS NOT A REAL COLUMN - it means THE ROW ITSELF. The same object reads a genuine
//  per-column status a few lines away with a real column index [:L162], so both readings coexist and
//  the whole distinction is carried by whether the index is zero. Section 6 records the same
//  convention on ItemStatus, and Section 7 on ColumnValue.column_id.
//
//  ============ WHY THE TWO ARRAYS ARE SEPARATE, AND MUST NEVER BE MERGED OR REORDERED =========
//  The legacy delivers them through one callback with TWO `ref` ARRAY OUT-PARAMETERS -
//  OnIdentityColumnDataRetrieved(nIdentityColumn, ref nPrimaryIdValues, ref nFilterIdValues)
//  [:L243, declared at n_cst_threading_task_sqlupdate.sru:L19] - because they come from DIFFERENT
//  BUFFERS COLLECTED IN DIFFERENT DIRECTIONS:
//
//      Primary buffer, FORWARD:    for nIndex = 1 to nCount              [:L228-L233]
//      Filter buffer,  BACKWARD:   for nIndex = nCount to 1 step -1      [:L237]
//
//  The justification sits in the source immediately above the backward loop, at [:L235]: THE FILTER
//  BUFFER'S ROW ORDER IS INVERTED relative to the data source that produced the changeset.
//
//  THIS IS THE MOST DANGEROUS SINGLE LINE IN THE REFACTOR FOR ONE-BASED-TO-ZERO-BASED TRANSLATION.
//  IT LOOKS LIKE A BUG. IT IS NOT A BUG. "Correcting" the direction produces wrong identity values
//  that a row-count assertion WOULD NOT CATCH - the same number of values comes back, paired with the
//  wrong rows, which is exactly the class of regression a characterization suite flags and a unit test
//  does not. Merging the arrays would destroy the only evidence a consumer has of which order each
//  was collected in, so the contract keeps them separate and separately ordered (C-B).
//
//  THE RELAY IS ORDER-PRESERVING BY CONTRACT. Any service that forwards this message - Gateway
//  forwards C-03's, C-03 forwards C-06's - MUST forward both arrays element for element in the order
//  received. Re-sorting either array, deduplicating it, or concatenating the two is a contract
//  violation, not an optimisation.
//
//  ============ THIS MESSAGE IS CARRIED AS A REPEATED FIELD, ONE ELEMENT PER UPDATE TABLE =======
//  Both producers declare it `repeated` - persistence.v1.UpdateResponse.identity and
//  dataservices.v1.UpdateResponse.identity - and that is not defensive plurality. ONE Update can emit
//  ONE BLOCK PER UPDATE TABLE: the worker loops `for nIndex = 1 to UpperBound(Tables)` calling
//  `_of_Update` once per table [n_cst_thread_task_sqlupdate.sru:L358-L369], each call fires the
//  callback AT MOST ONCE [:L243], and the caller-side proxy APPENDS each firing to an ordered array
//  rather than replacing anything:
//      IDCOLDATA _idColDatas[]                    [n_cst_threading_task_sqlupdate.sru:L45]
//      nIndex = UpperBound(_idColDatas) + 1       [:L73]
//  then replays EVERY element when it writes the values back [:L128, :L142-L195]. Each element
//  therefore carries its OWN identity_column_id, and the elements are ordered by the table order
//  declared on PrepareUpdate.
//
//  SO THE ORDER OBLIGATION HAS TWO LEVELS AND BOTH BIND: the BLOCKS in the order received, and within
//  each block the two arrays element for element. Dropping blocks after the first, re-ordering them, or
//  merging them into one is data loss that returns a PLAUSIBLE response - the first table's identities
//  arrive, the rest vanish, and no count anywhere disagrees. An EMPTY list means "none collected" for
//  the same three-level conditional reason described above, and a single-table update that collected
//  identities carries exactly one element.
// ==============================================================================================

message IdentityColumnData {
  // The discovered identity column's ONE-BASED ordinal. Legacy `long id`; int64 per the scalar rule's
  // widening. A real column is 1 or greater, and 0 never appears here - the legacy only fires this
  // callback when the ordinal is positive [n_cst_thread_task_sqlupdate.sru:L226].
  int64 identity_column_id = 1;

  // Values from the PRIMARY buffer, in FORWARD collection order [:L228-L233]. Read with
  // GetItemNumber, hence a numeric array.
  //
  // ============ EVERY ELEMENT CARRIES PRESENCE, BECAUSE A NULL IDENTITY IS REPRESENTABLE ========
  // The element type is NullableInt64 and not a bare int64, and the reason is data loss rather than
  // taste. `GetItemNumber` ANSWERS NULL for a null item and PowerScript stores that null into the
  // array it hands to the callback [n_cst_threading_task_sqlupdate.sru:L144, :L160], so a null
  // identity value is a state the oracle can produce. A `repeated int64` has no per-element presence,
  // so such a value could only be COERCED to 0 - making it indistinguishable from a legitimate
  // identity of 0 - or DROPPED, which would shorten the array and silently re-pair every value after
  // it with the wrong row. Both failures return a plausible response that no count disagrees with.
  //
  // THE WRAPPER CHANGES NOTHING ELSE. The field is still repeated, still field 2, still separate from
  // filter_values, and still in collection order. A producer emits one element per collected value,
  // in order, with `value` set; it emits an element with `value` UNSET for a null. A consumer must
  // test presence per element and must not treat an unset element as zero.
  //
  // On the sole evidenced fixture a null cannot arise - the DataWindow marks `id`
  // `key=yes identity=yes` [ws_objects/pfw.tests.pbl.src/dw_sqlite.srd:L8] over
  // `ID INTEGER PRIMARY KEY NOT NULL` [ws_objects/pfw.tests.pbl.src/w_test_sqlite.srw:L464], which is
  // rowid aliasing with no AUTOINCREMENT keyword, and the database always assigns it - so this is the
  // contract being able to say what the oracle can produce rather than a case the fixture exercises.
  // ==========================================================================================
  repeated NullableInt64 primary_values = 2;

  // Values from the FILTER buffer, in BACKWARD collection order [:L237-L241]. The order is the
  // legacy's and must be transmitted, and relayed, as collected - see the block above.
  //
  // Same element type and the same presence rule as primary_values, for the same reason.
  repeated NullableInt64 filter_values = 3;
}


// ==============================================================================================
//  SECTION 11 - THE RICH-ERROR MECHANISM : ONE WAY TO CARRY ConflictDetail AND DbError
//  --------------------------------------------------------------------------------------------
//  THE PROBLEM THIS SECTION SOLVES. A conflict is reported as the gRPC status ABORTED, and a status
//  carries only a code and a message - neither can hold ConflictDetail. Without a declared mechanism
//  each service would invent its own encoding, a client would have to know which service it was
//  talking to in order to decode it, and the retry-or-surface policy the concurrency contract
//  requires would be undecidable. So exactly ONE mechanism is defined here, and it is
//  machine-readable rather than prose: a versioned BINARY TRAILER carrying RichErrorTrailer, bound to
//  each RPC by a custom method option that names the key, the status code and the payload type.
//
//  WHY NOT google.rpc.Status WITH Any, WHICH WOULD OTHERWISE BE THE IDIOMATIC CHOICE (C-K).
//  It requires google/rpc/status.proto, which ships in Google.Api.CommonProtos / Grpc.StatusProto -
//  and AAP 0.5's dependency inventory lists NEITHER, nor is either present in this repository's
//  restored package closure. Importing it would therefore add an unpinned dependency the plan does
//  not authorise, and AAP 0.5.3 is explicit that packages outside the inventory are scope creep. The
//  binary-trailer form needs nothing but descriptor.proto, which the protobuf toolchain already
//  provides, and it is the alternative the review of this contract named as acceptable. The trade is
//  recorded rather than hidden: a caller using a generic google.rpc.Status-aware client library will
//  not decode this automatically and must read the trailer, which is why the key is declared on the
//  method rather than left to documentation.
//
//  HOW A CLIENT USES IT, CONCRETELY, WITH NO HAND-WRITTEN CONTRACT CODE ANYWHERE.
//    1. Catch RpcException. Read ex.Status.StatusCode - ABORTED for a concurrency conflict.
//    2. Read the trailer named by RICH_ERROR_TRAILER_KEY below:
//           byte[] raw = ex.Trailers.GetValueBytes("powerframework-rich-error-v1-bin");
//       The `-bin` suffix is not decoration: gRPC treats a metadata key ending in `-bin` as BINARY
//       and base64-transports it, and a key without that suffix may only carry ASCII - so a
//       protobuf payload under a non-`-bin` key would be corrupted in transit.
//    3. Parse it: RichErrorTrailer.Parser.ParseFrom(raw), then switch on the oneof.
//    4. To discover which RPCs can produce it without reading comments, read the option off the
//       generated descriptor:
//           var binding = MethodDescriptor.GetOptions()
//               .GetExtension(CommonV1Extensions.RichError);
//       Every accessor named here is GENERATED from this file by Grpc.Tools. No .cs file in this
//       project supplies any of it, which is what keeps the contracts project free of behaviour (C-A).
//
//  VERSIONING. The key carries `v1`, matching the `common.v1` package. A future RichErrorTrailer with
//  incompatible semantics gets a NEW key ending `-v2-bin` and both may be sent on one response during
//  a migration, so a v1 client keeps working unchanged. Never redefine the meaning of an existing key.
// ==============================================================================================

// The rich-error payload. Exactly one of the alternatives is set: a oneof rather than two optional
// fields because a single failure is one KIND of failure, and a response carrying both would leave a
// client to guess which one to act on.
message RichErrorTrailer {
  oneof detail {
    // Optimistic-concurrency mismatch. Accompanies gRPC ABORTED, which Gateway projects as HTTP 409.
    // Section 9 records why both current and original values travel per row.
    ConflictDetail conflict = 1;

    // A database-level failure the legacy would have surfaced through its error event. Accompanies
    // whichever status the operation's own contract specifies - it is NOT tied to ABORTED. Section 8
    // records that sqlsyntax is redacted, and that rule applies here too: this trailer crosses the
    // network, so an unredacted statement in it would be the exact exposure Section 8 exists to
    // prevent.
    DbError db_error = 2;
  }

  // The reconciled outcome code, so a client that only wants to classify the failure need not decode
  // the oneof at all. Numerically a RetCode.Value.
  int64 ret_code = 3;
}

// The binding an RPC declares to say "this method can fail with a rich error". Message-typed rather
// than three separate options so a reader sees the whole contract in one place, and so a future
// alternative payload type is expressible without adding another option.
message RichErrorBinding {
  // The metadata key the trailer is sent under. MUST be RICH_ERROR_TRAILER_KEY's value exactly; it is
  // repeated on each method so the descriptor is self-describing to a client that never reads this
  // file.
  string trailer_key = 1;

  // The gRPC status code the trailer accompanies, as the canonical numeric code - 10 is ABORTED,
  // which is the canonical mapping to HTTP 409 and the only value the concurrency contract uses. A
  // plain integer rather than an enum because the canonical code space is gRPC's, not this file's,
  // and mirroring it here would create a second copy free to drift.
  int32 grpc_status_code = 2;

  // The fully-qualified payload type carried under trailer_key. Always "common.v1.RichErrorTrailer"
  // today; named explicitly so a v2 payload can be introduced without changing the option's shape.
  string payload_type = 3;
}

// Constants for the mechanism, in an enum so they are part of the descriptor rather than prose a
// consumer has to copy. Section 2's scoping ruling applies: nested inside a wrapper message so the
// bare member names cannot poison the package scope.
message RichError {
  enum Key {
    // The one canonical trailer key. Its spelling is the contract: lowercase, hyphenated, prefixed
    // with the product so it cannot collide with another library's trailer, versioned, and ending
    // `-bin` so gRPC transports it as binary.
    //
    //     powerframework-rich-error-v1-bin
    //
    // An enum cannot hold a string, so the VALUE here is an ordinal and the spelling lives in this
    // comment and in each method's RichErrorBinding.trailer_key - which is the field a client
    // actually reads, and the reason the spelling is machine-readable despite this limitation.
    RICH_ERROR_TRAILER_KEY_V1 = 0;
  }
}

// The custom method options themselves. Extending google.protobuf.MethodOptions is the ONLY form of
// `extend` proto3 permits, and it is why descriptor.proto is imported.
//
// FIELD NUMBERS. 50001 and 50002 sit inside 50000-99999, the range protobuf reserves for options
// used INSIDE ONE ORGANISATION and never published to a global registry. That is exactly this case:
// these options are read by this repository's four services and by nothing else. They are recorded
// here so a later option is added at 50003 rather than colliding.
extend google.protobuf.MethodOptions {
  // Declares that the method can fail with a rich error, and how to retrieve it. Absent means the
  // method has no rich-error contract - which is a real statement, not a default: a client may then
  // rely on the status code and message alone.
  RichErrorBinding rich_error = 50001;

  // The legacy PowerScript identifier this RPC corresponds to, where the two differ. Protobuf
  // identifiers cannot begin with an underscore, so an RPC cannot literally be named `_of_calcitem`;
  // this option carries the original spelling so compatibility adapters and characterization
  // recordings can key on the legacy name instead of the protobuf one. Absent means the RPC name and
  // the legacy name agree, or that no single legacy member corresponds to the RPC.
  string legacy_name = 50002;
}
