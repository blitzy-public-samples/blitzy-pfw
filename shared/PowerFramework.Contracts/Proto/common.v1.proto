// ==============================================================================================
//  common.v1.proto - THE SHARED HALF OF THE PUBLISHED CROSS-SERVICE BOUNDARY
//  --------------------------------------------------------------------------------------------
//  This file is the FOUNDATION of the gRPC boundary. Its two siblings in this folder,
//  dataservices.v1.proto (C-03, C-04) and persistence.v1.proto (C-05..C-08), both import it, so
//  it is the bottom of the contract graph and it imports nothing itself.
//
//  IT CARRIES NO BEHAVIOUR. Not one line here executes. PowerFramework.Contracts is the boundary
//  DEFINITION, not a shared-code back door: it declares the shapes that cross the wire and
//  nothing else. Every enum and message below is consumed by BOTH sibling definitions, which is
//  the admission test for this file - see THE ADMISSION TEST below.
//
//  EVERY CONTRACT IN THIS FOLDER IS NET NEW, NOT A PORT
//  --------------------------------------------------------------------------------------------
//  The legacy PowerFramework is a LIBRARY. It has no process of its own, no listening socket, no
//  route table and no serialization layer, so no definition here translates an existing wire
//  format - there was none to translate. The source branch contains zero .proto files. What is
//  faithful to the legacy here is therefore its VALUES and its SEMANTICS, never a schema.
//
//  THE VALUE BINDING IS MAINTAINED BY REVIEW, NOT BY COMPILATION
//  --------------------------------------------------------------------------------------------
//  RetCode.Value below must equal shared/PowerFramework.Shared.Kernel/RetCode.cs member for
//  member. That agreement has NO COMPILE-TIME EDGE and cannot be given one: Shared.Kernel is the
//  bottom of the assembly dependency graph and must not reference Contracts, and this project
//  declares zero ProjectReference by design (constraint C-A). RetCode.cs states the direction of
//  alignment explicitly in its DECISION 6 - the Contracts author aligns to RetCode.cs, never the
//  reverse - and this file was authored that way.
//
//  The agreement was verified mechanically rather than by eye, in both directions, against the
//  read-only oracle ws_objects/pfw.shared.pbl.src/retcode.sru (221 lines):
//
//      retcode.sru:L39-L79    PowerFramework return codes     41  ->  RetCode.Value
//      retcode.sru:L84-L100   XML parser parse status         17  ->  XmlParseStatus.Value
//      retcode.sru:L107-L138  SQLite base result codes        31  ->  SqliteResultCode.Value
//      retcode.sru:L140-L206  SQLite extended result codes    67  ->  SqliteResultCode.Value
//                                                           ---
//                                                           156
//
//  156 is an audit, not decoration. If a future edit makes the count anything other than 156, or
//  makes any single value differ from RetCode.cs, the boundary has silently drifted from the
//  oracle and every stored characterization comparison that mentions the changed member becomes
//  invalid. Re-verify by extracting both sides and diffing them, not by reading them.
//
//  A NAME CLASH DOWNSTREAM CONSUMERS WILL MEET, AND MUST NOT "FIX"
//  --------------------------------------------------------------------------------------------
//  The generated PowerFramework.Contracts.Common.V1.RetCode and the hand-written
//  PowerFramework.Shared.Kernel.RetCode share the simple type name RetCode. They compile together
//  without complaint because they sit in different namespaces, but a C# file that uses both needs
//  a using alias, for example:
//
//      using WireRetCode = PowerFramework.Contracts.Common.V1.RetCode;
//
//  That alias is the correct resolution. Renaming the contract type is NOT: the name is part of
//  the published boundary, and the two types are deliberately distinct - Shared.Kernel.RetCode is
//  the in-process catalogue of const long values, while this one is the wire enum.
//
//  BINDING CONSTRAINTS AT THIS SITE
//  C-F SELF-AUDIT: no key, credential, token, password, connection string, certificate or
//  secret-shaped placeholder appears anywhere in this file, in any field, default or comment.
//  C-G SELF-AUDIT: no auth, token, credential or identity message is defined here. Authentication
//  on every edge is each service's stock JwtBearer configuration, which is framework code;
//  hand-writing a security surface here would duplicate it and enlarge the attack surface.
// ==============================================================================================

syntax = "proto3";

package common.v1;

// EXACT VALUE, DECIDED RATHER THAN DEFAULTED (C-K). The sibling PowerFramework.Contracts.csproj
// enumerates PowerFramework.Contracts.DataServices.V1, ...Persistence.V1 and ...Security.V1 and
// leaves only the common message namespace unnamed; docs/CONTRACTS.md section 2.3 does the same.
// ...Common.V1 is the single value consistent with that scheme and with `package common.v1`, and
// Gateway, DataServices and Persistence all consume it under that name. Do NOT substitute a
// variant such as ...Shared.V1: "Shared" is the name of the in-process library layer
// (PowerFramework.Shared.*), and reusing it here would blur the one distinction this project
// exists to keep - published boundary versus shared implementation. Do NOT hang these messages
// off a service namespace either; they belong to no single service.
option csharp_namespace = "PowerFramework.Contracts.Common.V1";

import "google/protobuf/descriptor.proto";

// EXACTLY ONE IMPORT, AND IT IS NOT A WELL-KNOWN TYPE (C-K).
// This file is still the bottom of the CONTRACT graph: the siblings import it and it imports no
// sibling. The single import is descriptor.proto, which is the protobuf compiler's own descriptor
// language and is required - there is no alternative mechanism - to declare the CUSTOM METHOD
// OPTIONS in Section 11. Extending google.protobuf.MethodOptions is the one form of `extend` proto3
// permits, and it is what makes the rich-error binding MACHINE-READABLE rather than prose.
//
// No well-known VALUE type is imported, because none is used, and that is a decision rather than an
// omission. google.protobuf.Timestamp in particular is REJECTED, for the reason recorded under
// TEMPORAL TYPES in the scalar rule below. google/rpc/status.proto is likewise NOT imported, and
// Section 11 records why: it is absent from this repository's pinned dependency closure
// (AAP 0.5 lists no Google.Api.CommonProtos / Grpc.StatusProto package), so importing it would
// silently add a dependency the plan does not authorise.
//
// A note for the sibling authors, because it is the one thing an import can get wrong here: the
// .csproj sets ProtoRoot="Proto", so an import of this file is the BARE FILE NAME
//
//     import "common.v1.proto";
//
// and never "Proto/common.v1.proto". If protoc reports this file "not found", the fault is the
// prefix, not this file.

// ==============================================================================================
//  SECTION 1 - THE SCALAR AND WIDTH RULE
//  --------------------------------------------------------------------------------------------
//  NORMATIVE FOR ALL THREE .proto FILES IN THIS FOLDER. It is stated once, here, precisely so
//  that dataservices.v1.proto and persistence.v1.proto can REFERENCE it instead of restating it
//  and drifting. A divergence between the three files on how a legacy scalar crosses the wire
//  would be invisible at compile time and fatal to parity, which is exactly the class of defect
//  this section exists to prevent.
//
//      PowerScript type     Wire type in this folder     Note
//      ------------------   --------------------------   ------------------------------------
//      long                 int64                        widened - see WIDENING
//      integer              int32                        16-bit at source, widened to 32
//      unsignedlong         uint64                       widened
//      boolean              bool
//      string               string
//      blob                 bytes
//      any                  AnyValue                     discriminated union, NEVER a bare string
//      dec / decimal(n)     DecimalValue                 canonical text, NEVER double
//      date                 DateValue                    three DISTINCT types, never one instant
//      time                 TimeValue
//      datetime             DateTimeValue
//      dwbuffer             DwBuffer
//      dwItemStatus         ItemStatus
//
//  The four carrier messages take a `Value` suffix rather than the bare legacy type name, and that
//  is a load-bearing decision rather than a stylistic one: bare `Decimal` and `DateTime` would
//  collide with System.Decimal and System.DateTime, which ImplicitUsings imports into every
//  consuming file, and a bare mention would then be a CS0104 build failure in all four services.
//  Section 7 records the full reasoning at the point of definition.
//
//  WIDENING, AND WHY IT IS NOT A BEHAVIOURAL CHANGE
//  PowerBuilder `integer` is 16-bit signed and `long` is 32-bit signed. The refactor maps legacy
//  `long` onto C# `long`, i.e. 64-bit, and this file follows that mapping onto int64. Widening is
//  the safe direction and it is UNOBSERVABLE: every value the legacy can produce fits, so no
//  round trip can change, while narrowing could truncate. Stated once for the whole folder: a
//  wire type here may be WIDER than its legacy counterpart without behavioural regression. It may
//  never be narrower.
//
//  DECIMALS ARE NOT DOUBLES. This is the single most dangerous available shortcut in this folder.
//  Protobuf has no decimal type, and the primary fixture ws_objects/pfw.tests.pbl.src/dw_sqlite.srd
//  carries `salary decimal(2)`. A double round trip loses precision, and it loses it QUIETLY: the
//  value still looks plausible, so no unit test flags it, and the damage surfaces only as a
//  byte-exact characterization comparison that can no longer be made. Decimals therefore travel
//  as the Decimal message below.
//
//  TEMPORAL TYPES ARE THREE TYPES, NOT ONE. The legacy has `date`, `time` and `datetime` as
//  DISTINCT types, mapped by the refactor onto DateOnly, TimeOnly and DateTime respectively, and
//  the item-change coercion path dispatches on which one a column is. google.protobuf.Timestamp
//  collapses all three into a single absolute instant and so destroys exactly the type
//  information that behaviour depends on - a bare `time` has no date to anchor an instant to, and
//  a bare `date` has no time of day. Hence three distinct messages, and hence no import.
//
//  THE UNIFORM CARRIER RULE, so that the three preceding paragraphs are one decision and not
//  three: a value whose PRECISION or whose TYPE IDENTITY must survive the wire byte for byte
//  travels as canonical invariant TEXT inside a named wrapper message. Text is losslessly
//  comparable, which is precisely what a golden-master recording needs; a named wrapper makes
//  every site type-checked, keeps the canonical form documented in exactly one place, and leaves
//  room to add a field later without changing the shape of every message that carries one.
//  Alternatives considered and rejected: a {units, scale} pair for Decimal, which cannot hold a
//  full 96-bit C# decimal mantissa in an int64 and needs a normalization convention before two
//  encodings of the same number compare equal; and structured {year, month, day} temporal
//  messages, which are fine in isolation but split the folder's carrier convention in two.
// ==============================================================================================

// ==============================================================================================
//  SECTION 2 - THE ENUM SCOPING RULING: RESOLVE BY SCOPE, NEVER BY RENAMING
//  --------------------------------------------------------------------------------------------
//  THE HAZARD. Protobuf enum values use C++ scoping rules: a value declared in a TOP-LEVEL enum
//  belongs to the ENCLOSING PACKAGE, not to the enum. Two top-level enums in package common.v1
//  therefore cannot both declare a value named OK - protoc rejects the file. And the legacy names
//  at risk are the most generic imaginable: OK, SUCCESS, ALLOW, PREVENT, FAILED, CANCELED,
//  CANCELLED, UNKNOWN. Declared at top level they would occupy those names in common.v1
//  permanently, for every message and enum any of the three files in this folder ever adds.
//
//  THE RULING. The legacy SCREAMING_SNAKE spellings are preserved EXACTLY - they appear in
//  serialized payloads, in log records and in characterization recordings, so renaming one does
//  not restyle a symbol, it silently invalidates every stored comparison that mentions it. The
//  collision is therefore resolved by SCOPE and never by renaming: each legacy constant set is
//  nested as an enum named Value inside its own thin wrapper message. Nesting creates a scope, so
//  the names live in common.v1.RetCode, common.v1.XmlParseStatus and common.v1.SqliteResultCode
//  instead of in common.v1, and the package scope stays clean.
//
//  WHAT NESTING IS AND IS NOT PROTECTING AGAINST. The three sets do not collide with EACH OTHER:
//  the legacy already prefixes XML_ and SQLITE_. What nesting protects is the package scope from
//  the bare generic names of the core set. The wrapper messages are deliberately empty of fields;
//  they exist to create a scope and carry documentation, which is why they are called thin.
//
//  A SECOND, INDEPENDENT REASON THE THREE STAY SEPARATE. These are three unrelated numbering
//  schemes that OVERLAP heavily in value: 0 is OK, SUCCESS, ALLOW, XML_OK and SQLITE_OK at once;
//  1 is PREVENT, XML_E_FILE_NOT_FOUND and SQLITE_ERROR; every value from 2 to 16 is shared by one
//  XML_* status and one SQLITE_* base code; and, most confusingly, XML_E_FILE_NOT_FOUND is 1
//  while E_FILE_NOT_FOUND is -15. They are not duplicates to reconcile - a return code, an XML
//  parse status and a SQLite result code are three different code spaces catalogued together, and
//  a value is only meaningful against the space it came from. Three scopes make that structural,
//  so no consumer can accidentally compare across spaces. RetCode.cs reaches the same conclusion
//  independently in its DECISION 5.
//
//  THE EXCEPTION, AND WHY IT IS PRINCIPLED. DwBuffer and ItemStatus are top-level enums with
//  Google-style enum-name-prefixed values (DW_BUFFER_*, ITEM_STATUS_*). There is NO legacy
//  SCREAMING_SNAKE spelling at stake for either: their legacy sources are PowerBuilder BUILT-IN
//  enumerated literals written Primary!, Delete!, Filter!, NotModified!, DataModified!, New! and
//  NewModified!, whose trailing-bang syntax cannot be carried into protobuf at all. With no
//  spelling to preserve, the idiomatic prefixed form is strictly better - it is collision-safe by
//  construction, so these two can safely be top level and read naturally at every use site. It
//  also avoids a bare value named DELETE, which is a Win32 macro and a hazardous identifier to
//  emit into generated code.
//
//  A CONSEQUENCE OF C# CODE GENERATION, recorded so nobody reports it as a defect. The protobuf
//  C# generator normalizes enum value names to PascalCase, so OK generates Ok,
//  E_INVALID_ARGUMENT generates EInvalidArgument and SQLITE_IOERR_READ generates SqliteIoerrRead.
//  The preserved spelling survives where it actually matters - in this file, in the compiled
//  descriptor and in the protobuf-JSON representation, which is what a recording stores - and the
//  C# identifier is a generated artifact of the toolchain, not part of the boundary. All three
//  sets were checked for post-normalization collisions, and for any value normalizing to its own
//  enum's name: there are none (41 -> 41, 17 -> 17, 98 -> 98 distinct identifiers).
// ==============================================================================================

// ==============================================================================================
//  SECTION 3 - RetCode : THE POWERFRAMEWORK RETURN-CODE ALGEBRA
//  --------------------------------------------------------------------------------------------
//  41 values, transcribed one for one from ws_objects/pfw.shared.pbl.src/retcode.sru:L39-L79 in
//  the oracle's own order. Each carries its :L locator so any value can be adjudicated against
//  the oracle without a search. Must equal PowerFramework.Shared.Kernel.RetCode member for member.
//
//  THE TRI-STATE ALGEBRA IS A DEFECT, AND IT IS PRESERVED (C-B)
//  This enum is not a partition into success and failure. The legacy predicates are
//  `rtCode >= OK` [issucceeded.srf:L11-L13] and `rtCode < OK` with CANCELLED explicitly excluded
//  [isfailed.srf:L11-L13], which produces three consequences a consumer of this contract must
//  expect rather than repair:
//
//    * PREVENT = 1 satisfies the success predicate, so A PREVENTION READS AS A SUCCESS.
//    * CANCELED / CANCELLED = -2 is excluded from failure by an explicit guard while also failing
//      the success test, so CANCELLED IS NEITHER SUCCEEDED NOR FAILED - a tri-state hole in a
//      nominally boolean algebra.
//    * A null return is likewise neither, because both predicates return false on null. This is
//      why the AnyValue carrier in Section 7 has an EXPLICIT null arm: collapsing null to zero
//      would silently convert "neither" into "succeeded".
//
//  Consumers must therefore branch on the specific value, never on a two-way success test. No
//  member is renamed, renumbered, deduplicated or removed to tidy this up.
//
//  WHY allow_alias IS MANDATORY HERE (C-K)
//  OK, SUCCESS and ALLOW are three names for 0, and CANCELED and CANCELLED are two spellings of
//  -2. Protobuf forbids duplicate values in an enum unless allow_alias is set, so WITHOUT THE
//  OPTION BELOW protoc REJECTS THIS FILE OUTRIGHT - it is a build prerequisite, not a style
//  choice. The aliases are kept because both spellings appear in legacy call sites, in log records
//  and in characterization recordings; dropping either would invalidate every stored comparison
//  that used it. This was verified by removing the option and observing the build fail.
//
//  The option is scoped deliberately: allow_alias is set HERE ONLY. XmlParseStatus.Value and
//  SqliteResultCode.Value contain no duplicate values, so setting it there would be noise that
//  also silently permits a future accidental duplicate to pass unnoticed.
//
//  WHY THERE IS NO SYNTHETIC "UNSPECIFIED = 0" SENTINEL (C-K)
//  proto3 requires the FIRST enumerator to be zero. OK = 0 already satisfies that, so no sentinel
//  is needed, and adding one would be actively harmful: it would be a fourth name for 0, it would
//  collide with OK, and it would inject a value the legacy algebra does not contain into a
//  catalogue whose whole purpose is to equal the oracle exactly.
//
//  MIRROR IMAGE - DO NOT TRANSPOSE THESE TWO RULINGS. The SQL_MS_* modification-style set is the
//  opposite case: it is SQL_MS_REPLACE = 1, SQL_MS_APPEND = 2, SQL_MS_PREPEND = 3
//  [ws_objects/pfw.shared.pbl.src/enums.sru:L718-L720], so it has NO zero value and therefore
//  DOES need a synthetic zero sentinel to be a legal proto3 enum. That set lives in
//  persistence.v1.proto, not here, because only C-05's SetWhereClause and SetOrderByClause consume
//  it (C-A). The rulings are opposite because the inputs are opposite: RetCode has a natural zero
//  and must not gain a sentinel; SQL_MS_* has no natural zero and cannot do without one.
//
//  WHICH SIDE DwBuffer AND ItemStatus FALL ON, stated here because this is where a reader looks for
//  the rule and getting it wrong is a cross-boundary defect rather than a style slip: BOTH fall on
//  the RetCode side, and NEITHER carries a sentinel. Each has a natural zero - an unassigned
//  PowerBuilder `dwbuffer` is Primary!, and NotModified! is the first literal of `dwItemStatus` and
//  the status of a row nothing has happened to - so zero is spent on the legacy default rather than
//  on a synthetic name for "absent". The two enums in Section 6 carry that reasoning in full,
//  together with the mechanism that replaces a sentinel where wire absence must genuinely be
//  distinguishable: proto3 EXPLICIT PRESENCE on the individual field, never an extra domain value.
//
//  THE TALLY, SO THE RULING IS NOT MISREAD AS A ONE-OFF. Three of the four enums reachable from
//  this boundary sit on the RetCode side and carry no sentinel: RetCode itself, DwBuffer and
//  ItemStatus. Exactly one - SQL_MS_* - sits on the other side. The test is always the same single
//  question, DOES THE LEGACY SET ALREADY CONTAIN ZERO, and it is answered from the oracle rather
//  than from whether the type's name sounds like it has a "none" state.
//
//  THE DECISION PROCEDURE FOR ANY FUTURE ENUM IN THIS FOLDER, in full, so it need not be rederived.
//  Ask whether the LEGACY domain contains a value that means "none". If it does, use it. If it does
//  not and the legacy numbering starts at 1, a sentinel is unavoidable - that is the SQL_MS_* case.
//  If it does not and there is no legacy numbering at all, put the legacy DEFAULT on zero - which is
//  the DwBuffer and ItemStatus case. Where a FIELD, rather than a domain, needs to say "not
//  supplied", express it with proto3 explicit field presence (`optional`) - see
//  ColumnValue.item_status.
//
//  NEGATIVE VALUES COST 10 BYTES, AND ARE STILL NOT RENUMBERED (C-K)
//  Negative enum values are legal in protobuf but are encoded as a plain, non-zigzag varint over
//  the 64-bit two's-complement representation, so EVERY negative value below occupies the full 10
//  bytes on the wire - 35 of these 41 members are negative. Renumbering them into a positive dense
//  range would shrink that, and it is nevertheless FORBIDDEN: these exact numbers appear in
//  serialized payloads, in log records and in the characterization recordings that are the parity
//  evidence for the whole migration, so a renumber would silently invalidate every stored
//  comparison rather than optimise anything. The cost is accepted deliberately, once, here. It is
//  also small in context: this enum appears as a status field on responses, not in a hot inner
//  loop, and no performance objective exists anywhere in this refactor to trade against.
//
//  RANGE, so the choice of an enum rather than an int32 field is auditable: across all three
//  constant sets in this file the minimum is UNKNOWN = -4000 and the maximum is
//  SQLITE_IOERR_ROLLBACK_ATOMIC = 7946. Every value fits int32, which is the protobuf enum's
//  underlying type, so NO value has to escape to a bare int32 field anywhere in this folder.
//
//  The wrapper message is intentionally EMPTY OF FIELDS. It exists to create a scope for the enum
//  (Section 2) and to carry this documentation. It is never sent as a message.
// ==============================================================================================
message RetCode {
  enum Value {
    // MANDATORY, AND THIS IS ITS ONLY LEGAL POSITION. allow_alias is an ENUM option, so it belongs
    // inside `enum Value`, NOT beside it at message level - protoc rejects the message-level
    // spelling with `Option "allow_alias" unknown`, which is a confusing message for a misplaced
    // option rather than an absent one. Verified both ways by building (C-K).
    option allow_alias = true;

    // OK / SUCCESS / ALLOW are three spellings of 0. All three are kept: each appears at legacy
    // call sites, so each can appear in a recording. [retcode.sru:L39-L41]
    OK                    =     0;  // [:L39]
    SUCCESS               =     0;  // [:L40]
    ALLOW                 =     0;  // [:L41]
    // PREVENT = 1 SATISFIES the success predicate. A prevention reads as a success. [:L42]
    PREVENT               =     1;  // [:L42]
    FAILED                =    -1;  // [:L43]
    // CANCELED / CANCELLED = -2, both spellings preserved, and NEITHER succeeded nor
    // failed. [:L44-L45]
    CANCELED              =    -2;  // [:L44]
    CANCELLED             =    -2;  // [:L45]
    // The contiguous, GAP-FREE error block -3 .. -33 [:L46-L76]. There is no gap to tidy and no
    // value to add; the density is the oracle's, and E_RETRY at -33 is its last member.
    E_INVALID_ARGUMENT    =    -3;  // [:L46]
    E_INVALID_IMAGE       =    -4;  // [:L47]
    E_INVALID_OBJECT      =    -5;  // [:L48]
    E_INVALID_TYPE        =    -6;  // [:L49]
    E_INVALID_TRANSACTION =    -7;  // [:L50]
    E_INVALID_SQL         =    -8;  // [:L51]
    E_INVALID_DATA        =    -9;  // [:L52]
    E_INVALID_DATAOBJECT  =   -10;  // [:L53]
    E_INVALID_HANDLE      =   -11;  // [:L54]
    E_OUT_OF_BOUND        =   -12;  // [:L55]
    E_OUT_OF_RANGE        =   -13;  // [:L56]
    E_OUT_OF_MEMORY       =   -14;  // [:L57]
    // NOTE the code space collision this file keeps separate by scope: E_FILE_NOT_FOUND is -15
    // here, while XmlParseStatus.XML_E_FILE_NOT_FOUND is 1. They are not the same code.
    E_FILE_NOT_FOUND      =   -15;  // [:L58]
    E_OBJECT_NOT_FOUND    =   -16;  // [:L59]
    E_DATA_NOT_FOUND      =   -17;  // [:L60]
    E_FUNCTION_NOT_FOUND  =   -18;  // [:L61]
    E_EVENT_NOT_FOUND     =   -19;  // [:L62]
    E_MEMBER_NOT_FOUND    =   -20;  // [:L63]
    E_VAR_NOT_FOUND       =   -21;  // [:L64]
    E_NOT_EXISTS          =   -22;  // [:L65]
    E_BUSY                =   -23;  // [:L66]
    E_TIME_OUT            =   -24;  // [:L67]
    E_ACCESS_DENIED       =   -25;  // [:L68]
    // E_WIN32_ERROR and E_WINHTTP_ERROR keep their Windows-flavoured names even though the target
    // runtime is Linux containers. The identifiers are contract; the platform is not. [:L69, :L73]
    E_WIN32_ERROR         =   -26;  // [:L69]
    E_INTERNAL_ERROR      =   -27;  // [:L70]
    E_DB_ERROR            =   -28;  // [:L71]
    E_HTTP_ERROR          =   -29;  // [:L72]
    E_WINHTTP_ERROR       =   -30;  // [:L73]
    E_IO_ERROR            =   -31;  // [:L74]
    E_SQL_BIND_ARG_FAILED =   -32;  // [:L75]
    E_RETRY               =   -33;  // [:L76]
    // The three outliers. E_NO_SUPPORT and E_NO_IMPLEMENTATION sit far below the dense block, and
    // E_NO_IMPLEMENTATION is the value the paging rewriter's `case else` arm returns for an
    // unrecognised database type. UNKNOWN = -4000 is the minimum of this whole file. [:L77-L79]
    E_NO_SUPPORT          = -2000;  // [:L77]
    E_NO_IMPLEMENTATION   = -2001;  // [:L78]
    UNKNOWN               = -4000;  // [:L79]
  }
}


// ==============================================================================================
//  SECTION 4 - XmlParseStatus : 17 VALUES CARRIED, ZERO XML CAPABILITY IMPLIED
//  --------------------------------------------------------------------------------------------
//  17 values from ws_objects/pfw.shared.pbl.src/retcode.sru:L84-L100, the parse status the legacy
//  XML reader reports. The oracle gives each one a short English explanation; those explanations
//  are carried across verbatim rather than paraphrased.
//
//  THE C-D LINE, AND IT IS A FINE ONE - READ THIS BEFORE "CLEANING UP" THIS SECTION
//  The XML object family belongs to Documents, one of the FOUR DEFERRED SERVICES that this phase
//  must not implement even partially and not even to stub out. So why is this here at all?
//
//  Because A VALUE IS NOT A CAPABILITY. These 17 integers are part of the 156-constant algebra
//  that PowerFramework.Shared.Kernel.RetCode ports from a single in-scope oracle object, and the
//  agreement between that file and this one is value-for-value across all 156. Omitting this block
//  would break that agreement and leave a 17-value hole in the audit, while carrying it implies
//  nothing whatsoever about XML support.
//
//  What would cross the line, and is therefore ABSENT here: any XML service, any XML request or
//  response message, any XML document, node, query or reader message, any XML field on any message
//  in this folder, and any reserved field number held open for one. There is none. This section is
//  a numbering scheme and a scope for it - nothing reads XML, nothing parses XML, and no consumer
//  of this contract can obtain an XML capability from it. PowerFramework.Shared.Kernel.RetCode
//  draws exactly the same distinction for exactly the same reason, so the two files agree on the
//  principle as well as on the numbers.
//
//  No allow_alias here: all 17 values are distinct, and XML_OK = 0 already satisfies proto3's
//  first-enumerator-is-zero rule, so this set needs neither the option nor a sentinel.
//
//  Note the deliberate collision with Section 3 that scoping keeps harmless: XML_E_FILE_NOT_FOUND
//  is 1 while RetCode.E_FILE_NOT_FOUND is -15, and XML_OK, RetCode.OK and
//  SqliteResultCode.SQLITE_OK are all 0. Three code spaces, three scopes, never compared.
// ==============================================================================================
message XmlParseStatus {
  enum Value {
    // No error
    XML_OK                     =  0;  // [:L84]
    // File was not found during load_file()
    XML_E_FILE_NOT_FOUND       =  1;  // [:L85]
    // Error reading from file/stream
    XML_E_IO_ERROR             =  2;  // [:L86]
    // Could not allocate memory
    XML_E_OUT_OF_MEMORY        =  3;  // [:L87]
    // Internal error occurred
    XML_E_INTERNAL_ERROR       =  4;  // [:L88]
    // Parser could not determine tag type
    XML_E_UNRECOGNIZED_TAG     =  5;  // [:L89]
    // Parsing error occurred while parsing document declaration/processing instruction
    XML_E_BAD_PI               =  6;  // [:L90]
    // Parsing error occurred while parsing comment
    XML_E_BAD_COMMENT          =  7;  // [:L91]
    // Parsing error occurred while parsing CDATA section
    XML_E_BAD_CDATA            =  8;  // [:L92]
    // Parsing error occurred while parsing document type declaration
    XML_E_BAD_DOCTYPE          =  9;  // [:L93]
    // Parsing error occurred while parsing PCDATA section
    XML_E_BAD_PCDATA           = 10;  // [:L94]
    // Parsing error occurred while parsing start element tag
    XML_E_BAD_START_ELEMENT    = 11;  // [:L95]
    // Parsing error occurred while parsing element attribute
    XML_E_BAD_ATTRIBUTE        = 12;  // [:L96]
