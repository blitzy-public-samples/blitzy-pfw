# ==================================================================================================
#  gateway.v1.yaml - CONTRACT C-09 (REST INGRESS) AND THE INGRESS HALF OF C-10 (READINESS)
#  ------------------------------------------------------------------------------------------------
#  AUTHORITY         docs/CONTRACTS.md 12.1 (C-09), 12.2 (C-10), 13 (the four reserved routes)
#                    Agent Action Plan 0.4.3 C-09/C-10 and 0.4.4
#  SERVED BY         gateway-service, PowerFramework.Gateway, port 5105
#  CONSUMED BY       External clients. This is the system's FIRST-EVER ingress.
#
#  WHAT THIS DOCUMENT IS, AND WHAT IT IS NOT - READ BEFORE ANY OPERATION DESCRIPTION BELOW
#  ------------------------------------------------------------------------------------------------
#  THIS IS THE CONTRACT. IT IS NOT A DESCRIPTION OF RUNNING CODE. Every description below - the
#  health aggregation, the proxying of each /v1/datawindow operation onto its gRPC method, the status
#  translation, the reserved 501 routes - states TARGET SEMANTICS: what an implementation of this
#  boundary must do. It is written in the present tense throughout because that is how a contract is
#  written, and the present tense must NOT be read as a report of behaviour that has been observed.
#
#  At the time of writing, in this repository: PowerFramework.Gateway compiles, carries an entry point,
#  and implements this boundary - Endpoints/DataServicesProxyEndpoints.cs registers all 39 projected
#  C-03 and C-04 operations, alongside the health, capability, ping and deferred-route endpoints - and
#  its test suite drives every one of those 39 through the real composition root. All four service
#  Dockerfiles exist and all four images build, and .github/workflows/ci.yml enforces the
#  80-percent-per-service coverage floor. Behaviour against a running stack is a separate question and is
#  answered in exactly one place - orchestration/README.md section 10, this repository's only
#  execution-status statement - rather than restated here, where it would be a second copy to keep true.
#  Everything a static check can verify about this file is verified: it parses as OpenAPI 3.1, has zero
#  unresolved internal references, and its schema set agrees with the proto files it projects - which is
#  exactly what the contract tests in shared/PowerFramework.Contracts.Tests assert. docs/BUILD.md
#  section 1 defines the four status labels this documentation set uses, and section 5.5 records what
#  has been run.
#
#  WHY THIS DOCUMENT IS REST AND NOT gRPC
#  ------------------------------------------------------------------------------------------------
#  Gateway is the sole ingress, and an ingress needs three properties gRPC cannot give it: reach from
#  a browser or a third party without a translating proxy, alignment with HTTP-standard caching and
#  proxying, and mature description tooling. gRPC-Web requires a translating proxy and supports
#  server streaming only, so choosing gRPC here would forfeit exactly what an ingress exists to
#  provide. The internal east-west edges are gRPC precisely because both ends are owned; this one is
#  not. The decision is recorded per service in docs/ARCHITECTURE.md and is not restated here.
#
#  THE PROJECTION IS A TRANSLATION LAYER, NOT A SECOND IMPLEMENTATION
#  ------------------------------------------------------------------------------------------------
#  Gateway holds no DataWindow logic, no expression engine and no validator. Every /v1/datawindow
#  operation maps onto exactly one gRPC method of C-03 or C-04, and maps the returned status back to
#  HTTP. Each operation therefore declares the method it projects in `x-grpc-method`, and the request
#  and response payload shapes in `x-proto-request` and `x-proto-response`.
#
#  PAYLOAD SHAPES: EVERY ONE IS PUBLISHED CONCRETELY, AND NONE IS DELEGATED
#  ------------------------------------------------------------------------------------------------
#  A DELIBERATE TWO-TIER DECISION UNDER C-K, because the two tiers answer different questions - but
#  BOTH tiers publish concrete, closed schemas, and NOTHING in this document delegates a payload
#  shape to a file a consumer's tooling cannot read.
#
#  TIER 1 - MIRRORED FIELD FOR FIELD, in components/schemas below. Every shape a consumer has to
#  understand in order to ACT on a response is transcribed here, member by member and value by value,
#  from Proto/common.v1.proto and Proto/dataservices.v1.proto:
#
#      RetCode (the closed value set on ProblemDetails.retCode)   DwBuffer      ItemStatus
#      AnyValue and its four string-carrier value types           ColumnValue   DataWindowRow
#      DbError (statement text REDACTED)                          ConflictRow   ConflictDetail
#      RetrieveChunk (the chunking contract)                      EventGate and its EID_* bit set
#      ExpansionMode (the five per-reference modes)               VarData       ExpressionBinding
#
#  These are hand-authored because each one carries a DECISION whose consequences need prose. A 409
#  whose conflict detail a caller cannot read is a 409 the caller cannot retry against; an error whose
#  statement field a consumer believes is unredacted invites a diagnostic flow built on data that will
#  never arrive; and an expansion mode a consumer cannot see turns a static binding into an
#  indistinguishable literal.
#
#  TIER 3 - GENERATED FROM THE COMPILED DESCRIPTORS, for the remaining 102 shapes: the other 93
#  messages the 39 projected operations carry, transitively, plus the 9 nested enums they reference.
#  Together the two tiers cover the COMPLETE closure - 118 messages and 15 enums - with concrete
#  members, canonical JSON names, canonical scalar encodings, closedness, and a `required` rule that
#  states the measured wire truth. The Tier 3 section header in components/schemas records every rule
#  the generator applied.
#
#  DELEGATING EVERY PROJECTED BODY TO ONE OPEN SCHEMA IS A DEFECT rather than a trade, which is why
#  this document does not. Such a schema publishes `additionalProperties: true` with no members and a
#  pointer at the `x-proto-*` extension naming the real message - while the projection binds every
#  request with the STRICT canonical parser, which REJECTS a member the target message does not
#  declare. The document would therefore promise a permissiveness the runtime does not have, and a
#  consumer generating a client from it could not see a single member it was required to send.
#
#  The objection that argues FOR delegating is sound and is answered rather than overruled:
#  transcribing the shapes BY HAND creates a second source of truth with nothing keeping the two in
#  step, so the first divergence is silent. Tier 3 is not transcribed, it is GENERATED, and every schema
#  carrying `x-proto-message` or `x-proto-enum` - all 133 of them, Tier 1 included - is cross-checked
#  against its descriptor member for member and value for value by the sibling test project on every
#  build. A divergence is a BUILD FAILURE, which is precisely the mechanism whose absence would
#  justify delegating. The `x-proto-*` operation extensions are checked the same way: they name each
#  operation's RPC input and output type.
#
#  What this document specifies exhaustively, because it is the ingress contract and nothing else
#  publishes it: every route, its authentication posture, its HTTP status surface, the gRPC-to-HTTP
#  status mapping, and the four reserved extension points. Those are C-09 and C-10.
#
#  THE FOUR RESERVED ROUTES ARE METADATA, NOT STUBS
#  ------------------------------------------------------------------------------------------------
#  /v1/design, /v1/documents, /v1/integration and /v1/scripting are declared here and return 501 with
#  a machine-readable body naming the deferred service. Per docs/CONTRACTS.md 13.1 there is no project,
#  no container definition, no test project, no partial implementation and no exception-throwing
#  placeholder class for any of the four. A declaration in a route table implements nothing: it has no
#  handler beyond the constant response, it calls nothing, and it can reach nothing. The prohibition in
#  C-D is on IMPLEMENTING the deferred services, and this document does not.
#
#  OPENAPI VERSION
#  ------------------------------------------------------------------------------------------------
#  3.1.0, matching OpenApi/security.v1.yaml. No 3.0-only construct is used: there is no `nullable`
#  keyword anywhere, and an optional-null is expressed as a JSON Schema type array.
# ==================================================================================================

openapi: 3.1.0

info:
  title: PowerFramework Gateway API
  version: 1.0.0
  summary: >-
    The composition root and sole ingress of the PowerFramework .NET decomposition. Contract C-09
    (REST ingress), the ingress half of C-10 (health and readiness), and the four reserved extension
    points that name the deferred Phase-2 services.
  license:
    # NAME ONLY. The full BSD 2-Clause text, its four-condition Chinese restatement and the eleven
    # upstream attributions live in the repository-root NOTICE and LICENSE files.
    name: BSD-2-Clause
  description: |-
    # PowerFramework Gateway API

    Gateway is the **composition root** of the decomposed system and its **only** ingress. Nothing
    else in the system accepts an unsolicited external request.

    ## What Gateway is, in terms of the legacy it replaces

    The legacy PowerFramework is a *library*: 39 PowerBuilder libraries loaded into one process, with
    no listener, no route table and no server tier. Its closest analogue to this document is the
    coarse `open` / `close` / `systemerror` application lifecycle of
    `ws_objects/pfw.pbl.src/pfw.sra:L88-L108` plus a navigation surface - a request/response shape,
    which is one of the reasons this contract is REST.

    Two consequences follow and are worth stating plainly:

    * **Every route below is new.** None translates an existing wire format, because there was no
      wire. That is why the contract inventory in `docs/CONTRACTS.md` exists to be reviewed rather
      than generated silently.
    * **"No new attack surface" cannot mean "no new surface".** Decomposition creates the system's
      first ingress, so the requirement reads as: every newly created surface is authenticated from
      the outset. That is why `/v1/ping` exists, and why it is here rather than only being asserted.

    ## Why REST at the edge, and why that is a per-service decision rather than a house style

    The transport for each service in this system was decided from **the shape of its current
    interface**, not chosen once and applied uniformly. For Gateway the shape is the one described just
    above: the coarse `open` / `close` / `systemerror` application lifecycle plus a navigation surface,
    which is **request/response** and nothing more - no ordered chain, no veto, nothing to stream.

    Being the **sole ingress** then decides it outright, because an ingress needs three properties:

    1. **Reach.** A browser or a third-party client must be able to call it directly, with no
       intermediary of ours in the path.
    2. **Alignment with HTTP itself** - standard caching semantics, standard proxying, standard status
       codes an operator's tooling already understands.
    3. **Mature description tooling**, so a consumer generates a client from this document rather than
       hand-writing one.

    **gRPC at the edge would forfeit exactly those three.** gRPC-Web requires a translating proxy in
    front of it and supports **server** streaming only, so the reach an ingress exists to provide would
    depend on an extra hop, and the richer streaming the internal contracts rely on would not survive
    the translation anyway.

    The internal east-west edges are gRPC precisely because the reasoning inverts there: both ends are
    owned, the contracts are strongly typed and stable, and C-03's interface really is an ordered
    22-event chain with a tri-valued veto. `docs/ARCHITECTURE.md` records the decision and its evidence
    for all four services; this paragraph states Gateway's half so a reader of *this* document has it
    without following a link.

    ## Every path is versioned `v1`, and that is a constraint rather than a habit

    Explicitly versioned contracts are the **only permitted cross-service coupling** in this system
    (constraint C-A). No service reaches into another's internals, and no behaviour is shared across a
    service boundary; the published contract is the whole of the coupling. Versioning every path is
    what lets this boundary change without a lock-step deployment of Gateway and its consumers.

    `/health` is the one unversioned path, deliberately. It is the readiness probe an orchestrator
    calls, its spelling is fixed by that convention, and versioning it would break the health gate for
    no benefit - a probe has nothing to negotiate.

    ## Authentication, and the token role Gateway does *not* have

    A bearer token is required by default. Exactly one operation overrides that, and it declares
    itself anonymous explicitly:

    * `GET /health` - a readiness probe holds no token and probes precisely while the service is
      starting.
    * The four reserved-route families are *not* among the exceptions: they require a token like every
      other `/v1` route, so an unauthenticated caller cannot enumerate the deferred roster.

    ### The `401` is produced by the scheme, and every guarded operation enumerates it anyway

    **Every operation that does not override the document-level requirement answers `401` to an
    unauthenticated caller, and it answers it before the route runs.** The check belongs to the
    authentication layer, so the `401` originates in `bearerAuth` rather than in anything an operation
    computes. `x-cross-cutting-responses` below records that origin machine-readably.

    **Where the refusal comes from does not change what the contract owes a consumer, and every guarded
    operation in this document - the four reserved route families included - enumerates `401`.**
    Omitting it from the reserved families is the tempting reading, on the reasoning that a cross-cutting
    concern is not a response those routes produce. The reasoning is sound about the origin and wrong about the
    obligation: a client generated from a response set that omits `401` is told the status cannot occur
    on paths that demonstrably return it, and a conformance tool checking response coverage reports a
    violation against a correct server. So the reserved families declare `{401, 501}`, exactly like every
    other guarded operation declares `401` beside its own outcomes.

    Two consequences a consumer needs, because the distinction is otherwise easy to lose:

    * **`401` and `501` on a reserved family are not two outcomes of one handler.** They are the two
      things a caller can receive. The `401` is the pre-handler refusal; the `501` is the *only* result
      any reserved handler computes, and it computes it unconditionally - every method, every path
      remainder, no evaluation of anything.
    * **`501` being the single HANDLER outcome is the property the deferred-service compliance position
      rests on, and enumerating the pre-handler `401` beside it leaves that property untouched.** What
      would break it is any `2xx`, which would say part of a deferred service had been built, or any
      `4xx` other than that `401`, which would say the route inspects the request before answering.
      Neither appears on any of the eight operations.

    **Gateway holds verification material only. It is not an issuer.** Security is the sole minter in
    the system, and Gateway validates inbound tokens with the stock
    `Microsoft.AspNetCore.Authentication.JwtBearer` handler pointed at Security's own
    `/.well-known/jwks.json` and `/.well-known/openid-configuration`. **Gateway holds no signing key**,
    mints nothing, and has no independent signing authority; that is a structural property of the
    sole-issuer topology rather than a configuration choice. See `docs/SECRETS.md` for the topology.

    ## Port map

    From `docs/ARCHITECTURE.md` 4.1, which is the authority. It is restated here because a reader of
    this document needs to know which listener each hop lands on, and because the reserved slot is a
    decision rather than an omission:

    | Service | Port | Role in relation to this document |
    | --- | --- | --- |
    | Persistence | **5101** | Its single `Http1AndHttp2` endpoint, carrying contracts C-05..C-08 AND its anonymous `/health`. No operation of this document reaches the contracts - Gateway never *calls* Persistence - but Gateway does *read* that `/health`, which is what lets `/health` here name all three upstreams |
    | DataServices | **5102** | Its single `Http1AndHttp2` endpoint: the anonymous `/health` Gateway reads, the thin REST projection, and **the gRPC upstream every `/v1/datawindow` operation projects onto** |
    | *(reserved)* | **5103** | **Deliberately unallocated** - see below |
    | Security | **5104** | The token issuer and the JWKS publisher Gateway verifies against |
    | **Gateway** | **5105** | **This document's listener** and the composition-root access URL |

    Every listener above terminates TLS, and each service binds exactly ONE endpoint. The two
    gRPC-carrying services declare `Protocols: Http1AndHttp2` on theirs, so ALPN selects HTTP/1.1 for the
    readiness probe and the REST projection and HTTP/2 for the gRPC contracts on that one port - which is
    why an operation of this document projects onto 5102, the same port its `/health` hop reads. TLS is
    what makes that work: on cleartext, `Http1AndHttp2` silently means HTTP/1.1 alone, because Kestrel
    disables HTTP/2 without application-protocol negotiation.

    Giving those two services a SECOND `Http2`-only endpoint each, above the documented band, and
    projecting onto that instead is the tempting shape. It is not available, because AAP 0.3.2.2 assigns
    C-05..C-08 to 5101 and C-03/C-04 to 5102: a published contract answering on a port the map does not
    name is not on the port the map gives it. Sharing one endpoint moves nothing into 5103.

    **5103 is reserved rather than reassigned, and that is a decision.** The attached environment had
    assigned it to a design service, and DesignSystem is precisely one of the four deferred services, so
    the slot is left commented out in the orchestration manifest instead of being filled by one of the
    four services that do exist. A gap in a port band with a comment explaining it is the obvious
    Phase-2 slot; a band silently renumbered to be contiguous would have erased the information.

    Port 5105 is retained for Gateway specifically so the documented composition-root access URL still
    resolves. `servers` below therefore declares **one** entry and it is Gateway's own - another
    service's port listed there would invite a consumer to send a Gateway request to the wrong listener.

    ## Status mapping, which is the substantive part of the projection

    The `/v1/datawindow` routes translate gRPC statuses from C-03 and C-04 into HTTP. The full
    translation this document applies, so the projection is auditable without reading another file:

    | gRPC status from C-03 / C-04 | HTTP | Note |
    | --- | --- | --- |
    | `OK` | `200` | |
    | **`Aborted`** | **`409`** | **Mandatory and canonical.** An optimistic-concurrency mismatch, carrying `ConflictDetail` with the current row state unchanged |
    | `InvalidArgument` | `400` | Carries the originating `retCode` so the specific legacy validation is identifiable, not merely the HTTP class |
    | `Unauthenticated` | `401` | |
    | `PermissionDenied` | `403` | A valid-but-insufficient credential, deliberately distinct from a missing one |
    | `NotFound` | `404` | |
    | `Unimplemented` | `501` | Including the four reserved routes below |
    | `ResourceExhausted` | `429` | A capacity ceiling declining to take more work, carrying the legacy `E_BUSY` code. A refusal, not a fault |
    | `Unavailable` | `503` | The upstream answered that it is not currently serving - distinct from `502`, where it answered nothing |
    | `DeadlineExceeded` | `504` | The deadline this service set on the outbound call elapsed. Every outbound call carries one |
    | `Internal` / `Unknown` | `500` | With the statement field **redacted** - see `DbError` |
    | `AlreadyExists` | `409` | Translated, but **not declared on any operation**: see the note below |

    The one that matters most: **gRPC `Aborted` becomes HTTP `409`**, carrying the conflict detail
    unchanged so a caller can implement an explicit **retry-or-surface** policy. **There is no silent
    overwrite anywhere in the system.**

    The table above is the *translation*, and what each operation DECLARES is a separate question with a
    single rule: **each operation declares the responses it can actually produce** and no others, because
    a status every generated client must branch on but no operation can return is noise that hides the
    real surface. Applying that rule honestly is what fixes the response sets below, and it cuts in both
    directions.

    **Four statuses are declared on every projected operation because every projected operation can
    really produce them.** `429` when a handle registry behind C-05 through C-08 refuses to hold more
    work. `503` when an upstream answers that it is not currently serving. `504` when the deadline this
    service sets on every outbound call elapses - a deadline is present on all of them, so its expiry is
    an ordinary outcome rather than a hypothetical. And `502`, which is the status the table cannot
    describe at all, because it is the case where **no gRPC response arrived**: an exhausted retry or an
    unreachable upstream. That last failure mode is one decomposition itself creates - an in-process call
    cannot fail in transit and a network call can - so leaving it undocumented would make the first
    transient fault an unhandled status in every generated client.

    **Two rows of the table are translated but declared nowhere, and each has a reason a reader can
    check.** `AlreadyExists` is produced by exactly one method in the whole estate - the macro channel
    reporting that a channel is already attached - and that method is **bidirectional and therefore not
    projected**, so no REST operation can return it; the arm exists so a future projection could not fall
    through to `500`. `Unimplemented` from a projected method would mean the upstream does not implement a
    method this document projects, which under explicitly versioned contracts is a deployment defect
    rather than an outcome; the `501` in the response sets below belongs to the four reserved routes,
    which produce it deliberately and declare it themselves. `503` likewise appears on `/health` on its
    own account, from C-10 rather than from this mapping, and its body there is the aggregate report
    rather than a problem document.

    ## What is deliberately NOT projected: the three bidirectional streams

    Three methods have **no REST projection**, and they are named individually so the boundary is
    checkable rather than asserted: **`EventChain`** on C-03, and **`InvokeMethodChannel`** and
    **`TraceChannel`** on C-04. All three are bidirectional.

    The reason is ordering, and it is structural rather than a matter of effort. The item-change and
    validation chain `EventChain` carries is **strictly synchronous with no reordering permitted**: the
    validation-error handler **reads and clears** the item-change result that the preceding event
    stashed, so its behaviour is a function of the prior event's return value, and the item-change
    handler fires a nested event from inside itself. JSON over independent REST requests would lose
    both that ordering and the **tri-valued typed veto** - prevent-once, prevent-deep, continue - which
    collapses to a boolean the moment it is flattened. Flattening these into polling endpoints would
    invite exactly the reordering the contract forbids, and a partial projection would be worse than
    none: a consumer would receive part of an ordered chain with no way to know what it had missed.

    `InvokeMethodChannel` and `TraceChannel` are additionally **inverted**: the legacy expects the
    *application* to implement the macro switch, so across a boundary DataServices calls back **into**
    its client. An inverted stream has no request/response direction to project at all.

    Consumers needing any of the three use DataServices' gRPC surface directly. This is a documented
    gap, deliberately preferred over a partial implementation.

    **Every other method of C-03 and C-04 IS projected**, including both server streams and the eight
    read-and-apply operations of the four headless models. A server stream *is* projectable, because
    its ordering is the trivial one - the server produces a sequence and the client consumes it - so
    `Retrieve` and `EventStream` are published as operations that return the same chunk shape as a
    collection, **with the chunking contract unchanged**: the chunk index, the final-chunk flag and the
    cumulative row count all travel exactly as the stream carries them.

    A partial projection would otherwise be the worst outcome available: Gateway is the sole ingress,
    so an operation the gRPC contract publishes but this document omits is unreachable from outside the
    cluster, and a consumer would read that as a bug in its own client rather than as a boundary of the
    contract. The sibling test project asserts the correspondence in both directions.

    ## The four reserved extension points are routing METADATA, not stubs

    `/v1/design/**`, `/v1/documents/**`, `/v1/integration/**` and `/v1/scripting/**` are declared here
    and each returns **`501 Not Implemented`** with a machine-readable body naming the deferred service
    it will eventually reach and the marker `reserved for Phase 2`. They exist so that the **shape of
    the eventual system is legible from Gateway's contract**, which is what the brief asks for.

    For DesignSystem, Documents, Integration and ScriptBridge there is **no service directory and no
    project file, no container definition, no test project, no partial implementation and no
    exception-throwing placeholder class.** Phase 1 implements exactly four of an eight-service roster
    and the other four are mapped in discovery and deliberately unbuilt.

    The distinction is worth stating plainly because it is the one an auditor should be able to check
    without ambiguity: **the prohibition is on *implementing* the deferred services - not partially,
    not even to stub them out - and a declaration in a route table implements nothing.** A reserved
    route has no handler beyond the constant response, calls nothing, and can reach nothing, because
    there is nothing behind it to reach. Every one of the four declares the same two methods, the same
    single `501` response and the same body schema, and none declares a request body - a request schema
    would model a deferred capability, which is the one thing a routing declaration must not do.

    ## Related documents

    `docs/ARCHITECTURE.md` is the service topology and port map, `docs/CONTRACTS.md` is the full
    ten-contract inventory, `docs/DEFERRED.md` is the authoritative deferred-service roster, and
    `Proto/dataservices.v1.proto` and `Proto/common.v1.proto` are the payload authority for the
    projected operations. Where any of those and this document disagree about a route, a status or an
    authentication posture, **this document is authoritative for the wire** and the prose is corrected
    to match it.

# ==================================================================================================
#  CROSS-CUTTING RESPONSES - declared once, machine-readably, so a consumer does not have to infer the
#  convention from prose and a generator does not have to guess it.
#
#  WHY THIS EXTENSION EXISTS EVEN THOUGH EVERY GUARDED OPERATION ALSO ENUMERATES `401`. OpenAPI has no
#  first-class way to say "the security scheme produces this status, and it produces it before any route
#  handler runs". Enumerating the response per operation conveys the STATUS and its BODY but not its
#  ORIGIN, and the origin is what a consumer needs in order to know that a `401` says nothing about the
#  operation it was requested against - it is not evidence that the route evaluated the request. So both
#  are published: every guarded operation enumerates `401` so that a generated client and a conformance
#  tool see a complete response set, and this declaration records once, machine-readably, where the
#  status comes from and when it is evaluated.
#  THE RESERVED FAMILIES ARE NOT AN EXCEPTION TO EITHER HALF. They enumerate `401` like everything else
#  guarded, and `501` remains the only outcome any of their handlers computes.
# ==================================================================================================
x-cross-cutting-responses:
  - status: 401
    appliesTo: every-operation-not-overriding-document-security
    producedBy: bearerAuth
    evaluatedBefore: route-handler
    declaredPerOperation: all-guarded-operations
    body: >-
      application/problem+json, described by the shared Unauthorized response that every guarded
      operation references - the four reserved route families included.
    reason: >-
      The authentication check runs in the pipeline before any route handler, so this status is a
      property of the security scheme rather than an outcome a route computes. It is nonetheless
      enumerated on every guarded operation, because a response set that omitted it would tell a
      generated client the status cannot occur on a path that demonstrably returns it. Recording the
      origin here is what keeps the two facts reconciled: on a reserved family the enumerated `401` is
      the pre-handler refusal, and `501` is still the single unconditional result its handler computes.
  - status: 429
    appliesTo: every-operation-except-the-anonymous-health-probe
    producedBy: ingress-rate-limiter
    evaluatedBefore: route-handler
    declaredPerOperation: all-operations-except-the-four-reserved-families
    body: >-
      application/problem+json, described by the shared UpstreamBusy response, carrying an optional
      `Retry-After` header. `/health` is exempt from the limiter and therefore cannot answer it.
    reason: >-
      Gateway is this system's first-ever listener - the legacy was an in-process library with no
      listener at all - so a caller able to exhaust it is a failure mode decomposition itself created,
      and the limiter that bounds it is global middleware rather than a per-path policy. It therefore
      runs before every route handler in this document except the exempt `/health`, and the operations
      that compute something enumerate it beside their own outcomes.
      THE FOUR RESERVED FAMILIES ARE THE DELIBERATE EXCEPTION, AND THIS ENTRY IS WHY OMITTING IT THERE
      IS NOT A GAP. Their declared set is exactly `{401, 501}`: this document states above that any
      `4xx` on those families other than the `401` would say the route inspects the request before
      answering, and a reserved family inspects nothing - it answers `501` unconditionally for every
      method and every path remainder. The `401` earns its place there because the operation itself
      carries the requirement that produces it; the limiter carries no such per-operation declaration.
      So the status is reconciled HERE, machine-readably, rather than enumerated on a family whose
      closed response set is the deferred-service compliance position. A caller of a reserved path may
      receive `429` and should read this declaration for it.

servers:
  # ONE ENTRY, DELIBERATELY. Port 5105 is Gateway's listener per docs/ARCHITECTURE.md 4.1, and it is
  # the documented composition-root access URL the attached environment fixes. The other services'
  # ports belong in their own documents, not here.
  - url: https://localhost:5105
    description: >-
      The gateway-service listener and the documented composition-root access URL. Port 5105 is fixed
      by the port map in docs/ARCHITECTURE.md 4.1 and is the same value the local orchestration
      manifest publishes. The scheme is TLS: this is the system's sole ingress and every request that
      crosses it carries a bearer token, so a cleartext listener here would expose every caller's
      credential to anyone on path (CWE-319). Inside the orchestration network, callers reach this
      service by its service name on the same port rather than through localhost.

tags:
  - name: Health
    x-contract-id: C-10
    description: >-
      Contract C-10, readiness half. Gateway reports healthy only after Persistence, DataServices and
      Security all report healthy, and the aggregate names each upstream with its own state rather
      than returning one opaque verdict. `/health` is anonymous on all four services.
  - name: Diagnostics
    x-contract-id: C-10
    description: >-
      Contract C-10, authentication-proof half. `/v1/ping` requires a token on all four services and
      returns 401 without one. It is a separate grouping from readiness deliberately: the two halves of
      C-10 have opposite authentication postures, and a reader scanning the groupings should see that
      rather than have to infer it from one mixed group.
  - name: Capabilities
    x-contract-id: C-09
    description: >-
      Contract C-09. Projects the framework's eight-bit capability gate as configuration. The bits are
      carried by their preserved legacy identifiers; `INIT_FLAG_ENABLE_SQLITE` is the only one with an
      in-scope consumer in this phase.
  - name: DataWindow
    x-contract-id: C-09
    description: >-
      Contract C-09's REST projection of C-03 (`dataservices.v1.DataWindowService`). The retrieval,
      validation-session, update and event-gate surface. Gateway holds no DataWindow logic; each
      operation maps onto exactly one gRPC method and maps its status back.
  - name: ColumnExpression
    x-contract-id: C-09
    description: >-
      Contract C-09's REST projection of C-04 (`dataservices.v1.ColumnExpressionService`). The
      expression, variable, flag and calculation surface. Kept separate from the DataWindow tag for
      the same reason C-04 is a separate contract from C-03: the expansion engine versions
      independently.
  - name: Reserved
    x-contract-id: C-09
    description: >-
      The four reserved extension points of docs/CONTRACTS.md 13. Each names a DEFERRED Phase-2
      service and returns 501 with a machine-readable body. These are routing declarations, not
      implementations: no project, container, test project or placeholder class exists behind any of
      them.

# DOCUMENT-LEVEL DEFAULT: a token is required unless an operation overrides it. Stating the
# requirement once and overriding it in exactly one place is deliberate - it makes "authenticated" the
# default posture and forces every anonymous operation to declare itself, so an anonymous surface can
# never be created by forgetting to add a requirement (constraint C-G).
security:
  - bearerAuth: []

paths:

  # ================================================================================================
  #  C-10 - HEALTH AND READINESS
  # ================================================================================================

  /health:
    get:
      operationId: getHealth
      x-contract-id: C-10
      x-required-scope: none
      tags: [Health]
      summary: Report aggregated readiness across Gateway and its three upstreams. Anonymous.
      description: |-
        Reports Gateway's readiness **and that of each of its three upstreams individually**.

        **Gateway reports healthy only after Persistence, DataServices and Security all report
        healthy.** The ordering is expressed in the orchestration manifest as a dependency condition
        on upstream health, and it is the readiness property that ruled out the alternative
        orchestration approach recorded in `docs/ARCHITECTURE.md` 10.4 - the generated model could not
        express it.

        **The aggregate names each upstream and its own state rather than returning one opaque
        verdict.** An operator reading a failed aggregate needs to know *which* upstream is not ready;
        collapsing three states into one would make the aggregate useless for the diagnosis it exists
        to support.

        **This endpoint is anonymous, on all four services.** The thing that probes it - a container
        orchestrator, a load balancer, an operator - holds no token, and it probes precisely during the
        window in which the service is still starting. Requiring a token would make readiness depend
        on the very service being probed and on Security's token issuance being already live, which is
        a circular dependency that cannot resolve during a cold start.

        **`Degraded` and `Unhealthy` are different states, and the difference is carried in the body
        rather than in the status code.** A service still completing startup validation is not the same
        as one whose dependency has failed. On the 200 the report's own `status` member keeps the two
        apart; on the 503 the body is a problem document, so the token travels in its `serviceStatus`
        extension member instead - RFC 9457 reserves `status` there for the integer HTTP status. **Only
        `Healthy` is answered with 200**; `Degraded` means *not ready* and is answered with 503
        alongside `Unhealthy`. The reason is mechanical rather than a matter of taste: what an
        orchestrator observes is the status **code**, so a service answering 200 immediately after
        saying it was not ready would satisfy a `service_healthy` condition and let Gateway start
        before its upstreams were usable - defeating the readiness property this contract exists to
        guarantee. A probe that tears down on any non-2xx is a *liveness* concern, which is a different
        question from readiness and is not what this path answers.
      # OVERRIDES the document-level bearer requirement with an EMPTY REQUIREMENT LIST, and this is the
      # ONLY operation in the document that overrides it. `[]` is not interchangeable with `[{}]`: `[]`
      # says "no requirement applies", whereas `[{}]` says "one requirement applies and it is satisfied
      # by nothing". Both permit anonymous access, but only `[]` says so in the shape every generator
      # and policy checker reads, and it is the form the sibling OpenApi/security.v1.yaml uses for the
      # same purpose - one convention across both documents in this folder rather than two.
      security: []
      responses:
        '200':
          description: >-
            Gateway is `Healthy`, which is the only verdict answered with 200: Gateway itself and all
            three upstreams are ready. The body names each upstream with its own state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateHealthReport'
        '503':
          description: >-
            Gateway is **not ready** - `Degraded` or `Unhealthy`. One of its three upstreams is not
            ready or has failed, or Gateway's own startup validation has not completed. The
            `serviceStatus` extension member distinguishes the two verdicts; the status code does not,
            for the reason given above, and RFC 9457's own `status` member cannot carry the token
            because it is the integer HTTP status. The participant responsible is named in the problem
            `detail` and `retCode` carries the corresponding legacy return code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/ping:
    get:
      operationId: ping
      x-contract-id: C-10
      x-required-scope: ping
      tags: [Diagnostics]
      summary: The standing proof that this boundary is authenticated. Token required.
      description: |-
        Returns a trivial success **only** when a valid token is presented, and `401` without one.

        This operation exists for one reason: to make the authenticated-boundary requirement
        **testable rather than merely asserted**. The legacy opens no listening socket and receives no
        unsolicited request, so decomposition creates every boundary in this system from nothing - and
        the requirement that each be authenticated needs a surface a conformance test can point at.

        It is present on **all four** services rather than only at the ingress, because an internal
        edge is a created boundary too. That uniformity is part of contract C-10.

        The body does not echo the presented token, any claim of it, or any part of the verification
        material.
      responses:
        '200':
          description: A valid token was presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/IngressBusy'
        '500':
          $ref: '#/components/responses/IngressInternalError'

  # ================================================================================================
  #  C-09 - CAPABILITY PROJECTION
  # ================================================================================================

  /v1/capabilities:
    get:
      operationId: getCapabilities
      x-contract-id: C-09
      x-required-scope: capabilities
      tags: [Capabilities]
      summary: Project the framework's eight-bit capability gate. Token required.
      description: |-
        Reports which of the framework's eight capability bits are enabled in this deployment.

        ## The gate is the legacy's own decomposition intent

        `ws_objects/pfw.shared.pbl.src/enums.sru:L41-L49` declares eight capability bits, and a module
        not explicitly initialized is unusable - *and its native library need not ship*
        [`docs/README.md` initialization section]. That bitmask is the legacy framework telling us
        where its own seams are, and mapping it onto the service roster is independent corroboration
        that the Phase-1 slice is drawn correctly.

        ## Only one bit has an in-scope consumer in this phase

        | Bit | Value | Phase-1 destination |
        | --- | --- | --- |
        | `INIT_FLAG_ENABLE_UI` | 1 | DesignSystem - deferred |
        | `INIT_FLAG_ENABLE_SCITER` | 2 | ScriptBridge - deferred |
        | `INIT_FLAG_ENABLE_BLINK` | 4 | ScriptBridge - deferred |
        | `INIT_FLAG_ENABLE_BLINKFAST` | 8 | ScriptBridge - deferred |
        | `INIT_FLAG_ENABLE_ORCA` | 256 | packaging tooling, not a service |
        | `INIT_FLAG_ENABLE_SQLITE` | 512 | **Persistence - in scope** |
        | `INIT_FLAG_ENABLE_DPIAWARE` | 1024 | DesignSystem - deferred |
        | `INIT_FLAG_ENABLE_WEBVIEW` | 2048 | ScriptBridge - deferred |

        ## `INIT_FLAG_ENABLE_ALL` = 3847, and it deliberately omits `BLINKFAST`

        `enums.sru:L49` declares the aggregate as a **seven-term sum** - UI + SCITER + BLINK + ORCA +
        SQLITE + DPIAWARE + WEBVIEW - which computes to **3847**. `INIT_FLAG_ENABLE_BLINKFAST` (8) is
        **not** one of the terms, so `3847` is **not** the bitwise union of the eight declared bits;
        the union would be 3855.

        It is not an oversight and must not be "corrected": `blink.dll` and `blinkfast.dll` are
        alternative builds of **one** engine, so enabling both is meaningless. The omission is
        reproduced verbatim under C-B, and the reported `allMask` reflects it.

        This is the value the composition root actually initializes with:
        `ws_objects/pfw.pbl.src/pfw.sra:L91` calls `pfwInitialize(Enums.INIT_FLAG_ENABLE_ALL)`, so the
        runtime-effective capability set genuinely is the `BLINKFAST`-omitting sum rather than an
        all-bits mask. The path is spelled in full because TWO distinct files in the legacy tree are
        named `pfw.sra` - the framework application cited here, and the packager application at
        `ws_objects/pfw.pack.pbl.src/pfw.sra` - so a bare `pfw.sra:L91` would be ambiguous.

        ## The identifiers are preserved verbatim

        The bit names are the legacy `SCREAMING_SNAKE` spellings, in deliberate departure from .NET
        naming convention, because they appear in serialized payloads, log records and
        characterization recordings where a rename would silently invalidate every stored comparison
        (Agent Action Plan 0.4.5.3).
      responses:
        '200':
          description: The capability report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/IngressBusy'
        '500':
          $ref: '#/components/responses/IngressInternalError'

  # ================================================================================================
  #  C-09 - THE /v1/datawindow PROJECTION OF C-03 (dataservices.v1.DataWindowService)
  #
  #  Fifteen of C-03's sixteen methods are projected: the retrieval operation, the six lifecycle,
  #  update and gate operations, and the eight read-and-apply operations of the four headless models.
  #  `EventChain` is the one exclusion, because it is BIDIRECTIONAL and carries a strictly ordered
  #  chain with a tri-valued veto - see the introduction. Every operation below names the gRPC method
  #  it projects and the protobuf messages that define its payload.
  # ================================================================================================

  /v1/datawindow/retrieve:
    post:
      operationId: retrieve
      x-contract-id: C-03
      x-required-scope: datawindow
      x-grpc-method: dataservices.v1.DataWindowService/Retrieve
      x-proto-request: dataservices.v1.RetrieveRequest
      x-proto-response: dataservices.v1.RetrieveChunk
      x-grpc-streaming: server
      tags: [DataWindow]
      summary: Retrieve rows as an ordered sequence of buffer-shaped chunks. Token required.
      description: |-
        The **retrieval** third of the legacy retrieval/validation/update triple, projected from C-03's
        `Retrieve`.

        ## A server stream IS projectable, and this is the form it takes

        `Retrieve` is **server**-streaming, not bidirectional, and the distinction is the whole reason
        this operation exists while `EventChain` does not. A server stream's ordering is the trivial
        one - the server produces a sequence and the client consumes it in order - so it has a faithful
        request/response projection: one request, and a response carrying the same chunks the stream
        would have delivered, **in the same order**. There is no per-message veto to lose and no
        client-to-server message to invert.

        ## The chunking contract is carried unchanged, not flattened away

        This is the part a naive projection gets wrong. The response is **not** a flat rowset: it is the
        sequence of `RetrieveChunk` values exactly as the stream carries them, each retaining its
        `chunkIndex`, its `final` flag, its own `rowCount` and the running `cumulativeRowCount`. A
        consumer can therefore reconstruct precisely what the gRPC consumer sees, and the last chunk is
        identifiable as the last rather than inferred from the collection ending.

        Chunk size is the caller's, subject to the legacy guard the gRPC contract publishes; this
        projection changes neither the default nor the guard. A stated size the guard refuses arrives
        here as **400** with `retCode` `-3`, and `0` is the one value read as "the server chooses" -
        because a protobuf scalar cannot tell an absent field from a zero one, so `0` is the only size a
        caller cannot have stated deliberately. Every other value, negative included, is adjudicated by
        the guard rather than discarded.

        ## Buffers, and what a retrieved row actually carries

        Each row names the buffer it came from - `Primary!`, `Delete!` or `Filter!`.

        **A FRESHLY RETRIEVED ROW CARRIES `originalValues`, AND ITS ENTRIES EQUAL THE CURRENT ONES.**
        A retrieval baselines every row as it lands, so each column's original value *is* its current
        value - and the pair is transmitted anyway, one entry per column the row carries, with **no
        omit-when-equal allowance**. `common.v1.DataWindowRow.original_values` states that rule without
        an exemption and this document is bound by it.

        > **A CORRECTION TO AN EARLIER REVISION OF THIS PARAGRAPH.** It claimed the opposite - that a
        > retrieved row carries no `originalValues` because "the carrier serialization omits an original
        > that equals its current". That was measurably untrue of the running service, which returns the
        > member populated, and it contradicted the protobuf contract this document projects. The
        > compression it described is one the carrier codecs may make about their own payloads and a
        > consumer of this contract cannot be asked to: it would leave a freshly retrieved row carrying no
        > baseline for any column, so a caller building the concurrency predicate would have to
        > reconstruct it from an absence - and reading that absence the other legal way, as "no baseline
        > exists", drops the predicate and silently overwrites.

        **An EMPTY `originalValues` therefore means exactly one thing: the row has no prior state.** That
        is an insert-shaped row, which has nothing to compare against and whose generated statement
        carries no `WHERE` clause at all. It is not a signal that the originals were elided.

        A caller submitting an update **supplies the retrieved current values as `originalValues`**. That
        is what makes the `updatewhere=1` concurrency check meaningful - the one updatable DataWindow in
        the legacy estate declares it with all six columns marked, so the generated `WHERE` clause carries
        the key column plus the original value of every marked column. See the update operation for the
        payload shape in full.

        **Row status against column status on a retrieved row.** The row carries
        `ITEM_STATUS_DATA_MODIFIED` while every column carries `ITEM_STATUS_NOT_MODIFIED`. That is the
        legacy's own chunk stamping [`n_cst_thread_task_sqlquery.sru:L196-L198`], preserved rather than
        tidied. A caller replaying a retrieved row as an update must therefore either DROP the
        per-column statuses - in which case the row's own status governs every column it supplies - or
        stamp the column it edited. Doing neither submits a row that says it changed while every column
        says it did not, which the update operation refuses with `400` and a diagnostic naming the rule.

        **`Filter!` row order is inverted relative to the source.** That is the legacy's own behaviour,
        preserved and stated here rather than corrected, because a consumer re-sorting it would produce
        wrong data that a row-count assertion would not catch.

        ## A 200 can still be followed by a failure, and how to detect it

        This is the one outcome a status code cannot express, so it is stated here rather than left to be
        discovered. The status line and the opening bracket are written **before** the second chunk is
        read, so a failure that happens after the first chunk has been forwarded arrives when `200` has
        already been sent and cannot be replaced by a problem document. A consumer must therefore treat a
        `200` on this operation as "the retrieval started", not as "the retrieval completed".

        Three signals mark it, and a consumer needs only the one that suits it:

        * **The transfer terminates abnormally.** The connection is reset - an HTTP/1.1 connection close
          mid-chunk, or an HTTP/2 `RST_STREAM` - so every HTTP client surfaces it as a failed read
          rather than as a short body. This is the signal that needs no parsing at all.
        * **The JSON array is left unterminated**, with no closing `]`. A complete response always ends
          with one, so a document that does not is incomplete. This is the same signal the element-bound
          refusal uses, and it is deliberately identical: both mean "do not treat this as the whole
          answer".
        * **A terminal element describes the failure** - on a best-effort basis, which is stated plainly
          because it is measured rather than assumed. The last element of the truncated array is not a
          chunk but the **problem document this operation would have returned had the failure happened
          before the first chunk** - the same `status`, the same `retCode`, the same `detail`, the same
          `traceId` - plus two members a unary problem does not carry: `streamTerminated: true`, which
          identifies the element as this marker rather than a record, and `elementsDelivered`, the number
          of chunks that were forwarded before the failure. Because the array is not closed, this element
          is not reachable by parsing the document as a whole; it is there for a consumer that reads the
          bytes it received, and for the operator record it shares its `traceId` with.

          **It can be lost.** The reset that terminates the transfer discards anything still queued for a
          consumer that has fallen behind, so a slow reader may receive a body cut mid-chunk with no
          terminal element at all. A consumer must therefore treat the abnormal termination and the
          missing `]` as the signals it can rely on, and this element as the explanation it gets when it
          is keeping up. The gateway's own log record is written either way and carries the same
          `traceId`, so nothing diagnostic is lost to the operator.

        Chunks delivered before the failure are **valid**, and `cumulativeRowCount` on the last of them
        says how much of the result they represent. Nothing partial is applied anywhere by a retrieval,
        so the operation is safe to reissue - but note that it is not classified as replay-safe for the
        transport's automatic retry, because a retrieval acquires an upstream query task; a caller that
        wants the rest of the result reissues it deliberately.

        ## What this operation is not

        It reaches DataServices and nothing further. Gateway does not call Persistence, so no SQL, no
        statement text, no connection detail and no provider name appears in a request or a response
        here - and the error shape's statement field is redacted for the same reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveRequest'
      responses:
        '200':
          description: >-
            The retrieval STARTED and, on the ordinary path, completed: the body is the ordered sequence
            of chunks the gRPC server stream would have delivered, with the chunking contract intact. A
            failure after the first chunk cannot change this status - see "A 200 can still be followed by
            a failure" above for the three signals that mark one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/UpstreamBusy'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '503':
          $ref: '#/components/responses/UpstreamRefused'
        '504':
          $ref: '#/components/responses/UpstreamTimedOut'

  /v1/datawindow/sessions:
    post:
      operationId: openValidationSession
      x-contract-id: C-03
      x-required-scope: datawindow
      x-grpc-method: dataservices.v1.DataWindowService/OpenValidationSession
      x-proto-request: dataservices.v1.OpenValidationSessionRequest
      x-proto-response: dataservices.v1.OpenValidationSessionResponse
      tags: [DataWindow]
      summary: Open a validation session and receive its correlation identifier.
      description: |-
        Materializes the four pieces of cross-event mutable state that
        `ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L89-L96` holds as private fields:
        the disabled-event bitmask, the inside-item-change flag, the inside-validation-error flag,
        and - most consequentially - the item-changed return value **stashed for the validation-error
        event to consume**.

        A stateless request boundary has nowhere to put those, which is why the session is explicit
        rather than implicit. The returned identifier correlates every subsequent operation in the
        chain.

        Sessions must be closed. An abandoned session holds server-side state until its configured
        idle expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenValidationSessionRequest'
      responses:
        '200':
          description: >-
            The projected gRPC method returned `OK`. The body is the canonical protobuf JSON mapping
            of `dataservices.v1.OpenValidationSessionResponse`, published as
            `OpenValidationSessionResponse` below.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenValidationSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/UpstreamBusy'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '503':
          $ref: '#/components/responses/UpstreamRefused'
        '504':
          $ref: '#/components/responses/UpstreamTimedOut'

  /v1/datawindow/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: closeValidationSession
      x-contract-id: C-03
      x-required-scope: datawindow
      x-grpc-method: dataservices.v1.DataWindowService/CloseValidationSession
      x-proto-request: dataservices.v1.CloseValidationSessionRequest
      x-proto-response: dataservices.v1.CloseValidationSessionResponse
      tags: [DataWindow]
      summary: Close a validation session and release its cross-event state.
      description: >-
        Releases the session opened above. Closing a session that does not exist is reported as `404`
        rather than silently succeeding, so a caller can detect a double close - which in the legacy
        would have been a use-after-destroy.
      responses:
        '200':
          description: >-
            The projected gRPC method returned `OK`. The body is the canonical protobuf JSON mapping
            of `dataservices.v1.CloseValidationSessionResponse`, published as
            `CloseValidationSessionResponse` below.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseValidationSessionResponse'
        '400':
          $ref: '#/components/responses/SessionIdConstraint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/UpstreamBusy'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '503':
          $ref: '#/components/responses/UpstreamRefused'
        '504':
          $ref: '#/components/responses/UpstreamTimedOut'

  /v1/datawindow/update:
    post:
      operationId: updateDataWindow
      x-contract-id: C-03
      x-required-scope: datawindow
      x-grpc-method: dataservices.v1.DataWindowService/Update
      x-proto-request: dataservices.v1.UpdateRequest
      x-proto-response: dataservices.v1.UpdateResponse
      tags: [DataWindow]
      summary: Apply buffered changes. Returns 409 on an optimistic-concurrency conflict.
      description: |-
        Applies the buffered insert, update and delete set through C-03, which in turn reaches C-06 on
        Persistence.

        ## The payload shape an update must have, stated exactly

        Per row: the buffer tag, the one-based ordinal, the ROW's own `itemStatus`, the current value of
        every column being submitted, and - for an update of an existing row - `originalValues` carrying
        what the caller believes is currently stored. The originals are the values a preceding retrieval
        returned as its **current** values. A retrieved row also carries `originalValues` of its own, with
        entries equal to those current values, because the member is populated in both directions with no
        omit-when-equal allowance; a caller may therefore echo the retrieved row's `originalValues` back or
        copy its current values into them, and the two are equivalent by construction. An earlier revision
        of this sentence claimed a retrieved row carries no `originalValues`, which contradicted both
        `common.v1.DataWindowRow` and the running service - see the retrieve operation's own correction
        note.

        **Per-column `itemStatus` is optional, and what its ABSENCE means on this path is defined rather
        than left to a reader.** When a row is stamped `ITEM_STATUS_DATA_MODIFIED` or
        `ITEM_STATUS_NEW_MODIFIED` and **not one** of its columns carries a status, the row's own status
        governs every column **whose submitted value differs from its `originalValues` entry**, and a
        column whose value did not move stays unmodified. That is the legacy row-status convention - a
        row's status is read with column index 0 [`n_cst_thread_task_sqlupdate.sru:L160`] and a row is
        modified precisely because a column of it was - read together with the fact that the row's
        *other* columns are **not** modified, since the runtime flips a column's status only where a
        value actually changed. So the generated `SET` list names the columns that changed rather than
        the whole updatable set, and the **key** column of an ordinary update is not stamped modified and
        does not send the row down the `updatekeyinplace=no` delete-plus-insert path.

        The value test applies only where an original was actually stated. A column with no
        `originalValues` entry has no baseline to be measured against, so the row's statement stands for
        it - which is the whole of an insert-shaped row, whose status is `ITEM_STATUS_NEW_MODIFIED` and
        which carries no `originalValues` at all because it has no prior state.

        When **any** column carries a status, every column is taken at its word instead and the
        unstamped ones stay unmodified, which is what makes a partial update exact: a payload that marks
        one column writes exactly that column and cannot clobber a concurrent writer's value for the
        others. Presence decides which rule applies, so an explicit `ITEM_STATUS_DATA_MODIFIED` is
        honoured even on a column whose value did not move.

        **Values are compared as values, not as JSON arms.** One number has several faithful spellings
        in this payload - a retrieval answers the legacy `number` columns through `doubleValue`, and a
        caller re-sending that number as `int64Value` is equally correct - so `28` sent either way is the
        same value for the test above, exactly as the storage engine compares them. No conversion is
        invented across families: a `dateValue` is not compared against the `stringValue` that would
        render it.

        A row that says it changed while every column of it says it did not - or that carries no
        updatable column at all - cannot express an update. It is refused with **`400`** and
        `retCode -9` (`E_INVALID_DATA`). It is deliberately **not** a `409`: no statement was generated, so
        nothing was contended, and reporting a concurrency conflict would send a caller to re-read and
        re-send a payload that can never apply.

        **What that `400` body contains, stated exactly, because this document previously overstated it.**
        The body is the standard problem document described under this operation's `400` response: `status`,
        `title`, a FIXED `detail` classifying the refusal, `retCode`, `instance` and `traceId`. It does
        **not** name the offending row, the offending column, or a count of them. An earlier revision of
        this sentence said it named "the rule and the number of offending rows", and the sibling
        `DataWindowRow` note said a missing baseline was answered "naming the row, the column and its
        type" - neither was true of the ingress, and a consumer that built field-level feedback on those
        sentences would have found the fields absent.

        **The field-level diagnostic exists; it is on the operator channel, keyed by `traceId`.** The
        upstream validator does identify each rejected column - the row, the column name, its one-based
        ordinal and the reason class - and DataServices records it. This ingress deliberately does not
        forward it: the same relay path also carries a database error whose statement text is the complete
        generated SQL including interpolated literal values, and an earlier revision that attached upstream
        detail to the caller's body was corrected for exactly that reason. So the response classifies and
        the log identifies, and the `traceId` in the body is what joins the two. A caller needing
        field-level feedback in-band should validate against `dataservices.v1`'s own contract, which
        publishes the per-column failure shape.

        ## The 409 is the substantive part of this operation

        The sole updatable DataWindow in the legacy estate carries `updatewhere=1` with all six
        columns marked `updatewhereclause=yes`
        [`ws_objects/pfw.tests.pbl.src/dw_sqlite.srd:L8-L14`], so the optimistic-concurrency check
        spans **all six columns' original values**. On a mismatch, C-06 returns gRPC `Aborted` and
        this operation returns **HTTP `409`** with the conflict detail carrying the current row state,
        unchanged.

        `Aborted` is the canonical gRPC-to-409 mapping and is chosen over `FailedPrecondition`
        deliberately: the operation may succeed if retried at a higher level, which is what the status
        is defined to mean.

        **Callers implement an explicit retry-or-surface policy. There is no silent overwrite
        anywhere in the system.** A caller that ignores the 409 and re-sends the same payload will
        receive the same 409, because the original values it carries are still stale.

        ## What the response carries

        Inserted, updated and deleted counts, plus the identity column and the two identity value
        arrays that reproduce the legacy identity round-trip
        [`ws_objects/pfw.thread.ext.pbl.src/n_cst_thread_task_sqlupdate.sru:L215-L245`].
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
      responses:
        '200':
          description: >-
            The projected gRPC method returned `OK`. The body is the canonical protobuf JSON mapping
            of `dataservices.v1.UpdateResponse`, published as `UpdateResponse` below.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
