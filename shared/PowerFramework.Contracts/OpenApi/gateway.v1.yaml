# ==================================================================================================
#  gateway.v1.yaml - CONTRACT C-09 (REST INGRESS) AND THE INGRESS HALF OF C-10 (READINESS)
#  ------------------------------------------------------------------------------------------------
#  AUTHORITY         docs/CONTRACTS.md 12.1 (C-09), 12.2 (C-10), 13 (the four reserved routes)
#                    Agent Action Plan 0.4.3 C-09/C-10 and 0.4.4
#  SERVED BY         gateway-service, PowerFramework.Gateway, port 5105
#  CONSUMED BY       External clients. This is the system's FIRST-EVER ingress.
#
#  WHY THIS DOCUMENT IS REST AND NOT gRPC
#  ------------------------------------------------------------------------------------------------
#  Gateway is the sole ingress, and an ingress needs three properties gRPC cannot give it: reach from
#  a browser or a third party without a translating proxy, alignment with HTTP-standard caching and
#  proxying, and mature description tooling. gRPC-Web requires a translating proxy and supports
#  server streaming only, so choosing gRPC here would forfeit exactly what an ingress exists to
#  provide. The internal east-west edges are gRPC precisely because both ends are owned; this one is
#  not. The decision is recorded per service in docs/ARCHITECTURE.md and is not restated here.
#
#  THE PROJECTION IS A TRANSLATION LAYER, NOT A SECOND IMPLEMENTATION
#  ------------------------------------------------------------------------------------------------
#  Gateway holds no DataWindow logic, no expression engine and no validator. Every /v1/datawindow
#  operation maps onto exactly one gRPC method of C-03 or C-04, and maps the returned status back to
#  HTTP. Each operation therefore declares the method it projects in `x-grpc-method`, and the request
#  and response payload shapes in `x-proto-request` and `x-proto-response`.
#
#  PAYLOAD SHAPES ARE DELEGATED TO THE PROTOCOL DEFINITIONS - A DELIBERATE DECISION UNDER C-K
#  ------------------------------------------------------------------------------------------------
#  The bodies of the /v1/datawindow operations are the canonical protobuf JSON mapping of the messages
#  named in the `x-proto-*` extensions. Those messages are defined in Proto/dataservices.v1.proto and
#  Proto/common.v1.proto IN THIS SAME PROJECT, and they are the single authority for the shapes.
#
#  Transcribing them into JSON Schema here was considered and REJECTED. It would create a second
#  source of truth for well over a hundred messages, in a different language, with no mechanism
#  keeping the two in step - and the first divergence would be silent, because nothing compiles this
#  file against those definitions. The `x-proto-*` extensions are the alternative: they are mechanical,
#  one-to-one, and CHECKABLE, and the sibling test project asserts that every one of them resolves to
#  a real generated type. A schema copy would have been longer, less precise, and unverifiable.
#
#  What this document does specify exhaustively, because it is the ingress contract and nothing else
#  publishes it: every route, its authentication posture, its HTTP status surface, the gRPC-to-HTTP
#  status mapping, and the four reserved extension points. Those are C-09 and C-10.
#
#  THE FOUR RESERVED ROUTES ARE METADATA, NOT STUBS
#  ------------------------------------------------------------------------------------------------
#  /v1/design, /v1/documents, /v1/integration and /v1/scripting are declared here and return 501 with
#  a machine-readable body naming the deferred service. Per docs/CONTRACTS.md 13.1 there is no project,
#  no container definition, no test project, no partial implementation and no exception-throwing
#  placeholder class for any of the four. A declaration in a route table implements nothing: it has no
#  handler beyond the constant response, it calls nothing, and it can reach nothing. The prohibition in
#  C-D is on IMPLEMENTING the deferred services, and this document does not.
#
#  OPENAPI VERSION
#  ------------------------------------------------------------------------------------------------
#  3.1.0, matching OpenApi/security.v1.yaml. No 3.0-only construct is used: there is no `nullable`
#  keyword anywhere, and an optional-null is expressed as a JSON Schema type array.
# ==================================================================================================

openapi: 3.1.0

info:
  title: PowerFramework Gateway API
  version: 1.0.0
  summary: >-
    The composition root and sole ingress of the PowerFramework .NET decomposition. Contract C-09
    (REST ingress), the ingress half of C-10 (health and readiness), and the four reserved extension
    points that name the deferred Phase-2 services.
  license:
    # NAME ONLY. The full BSD 2-Clause text, its four-condition Chinese restatement and the eleven
    # upstream attributions live in the repository-root NOTICE and LICENSE files.
    name: BSD-2-Clause
  description: |-
    # PowerFramework Gateway API

    Gateway is the **composition root** of the decomposed system and its **only** ingress. Nothing
    else in the system accepts an unsolicited external request.

    ## What Gateway is, in terms of the legacy it replaces

    The legacy PowerFramework is a *library*: 39 PowerBuilder libraries loaded into one process, with
    no listener, no route table and no server tier. Its closest analogue to this document is the
    coarse `open` / `close` / `systemerror` application lifecycle of
    `ws_objects/pfw.pbl.src/pfw.sra:L88-L108` plus a navigation surface - a request/response shape,
    which is one of the reasons this contract is REST.

    Two consequences follow and are worth stating plainly:

    * **Every route below is new.** None translates an existing wire format, because there was no
      wire. That is why the contract inventory in `docs/CONTRACTS.md` exists to be reviewed rather
      than generated silently.
    * **"No new attack surface" cannot mean "no new surface".** Decomposition creates the system's
      first ingress, so the requirement reads as: every newly created surface is authenticated from
      the outset. That is why `/v1/ping` exists, and why it is here rather than only being asserted.

    ## Authentication

    A bearer token is required by default. Exactly three operations override that, and each declares
    itself anonymous explicitly:

    * `GET /health` - a readiness probe holds no token and probes precisely while the service is
      starting.
    * The two reserved-route families are *not* among the exceptions: they require a token like every
      other `/v1` route, so an unauthenticated caller cannot enumerate the deferred roster.

    Gateway **validates** tokens; it does not issue them. Security is the sole minter in the system
    and publishes its verification material at its own `/.well-known/jwks.json`, which Gateway's
    stock `Microsoft.AspNetCore.Authentication.JwtBearer` handler consumes. Gateway holds no signing
    key. See `docs/SECRETS.md` for the token topology.

    ## Status mapping, which is the substantive part of the projection

    The `/v1/datawindow` routes translate gRPC statuses from C-03 and C-04 into HTTP. The mapping is
    published in full at `docs/CONTRACTS.md` 12.1 and reproduced by the response sets below. The one
    that matters most: **gRPC `Aborted` becomes HTTP `409`**, carrying the optimistic-concurrency
    conflict detail unchanged. There is no silent overwrite anywhere in the system.

    That mapping covers the statuses C-03 and C-04 **return**. It does not cover the case where the
    call never reached them, so this document adds exactly one status beyond it — **`502`**, when an
    upstream is unreachable or the call failed in transit after the retry policy was exhausted. That
    is a failure mode decomposition itself creates: an in-process call cannot fail in transit and a
    network call can. It is added rather than omitted because leaving it undocumented would make the
    first transient fault an unhandled status in every generated client.

    ## What is deliberately NOT projected

    The two streaming methods of C-03 (`Retrieve`, `EventChain`) and the three streaming methods of
    C-04 (`EventStream`, `InvokeMethodChannel`, `TraceChannel`) have **no REST projection**. A
    bidirectional stream carrying an ordered event chain with a per-message veto has no faithful REST
    representation, and a partial projection would be worse than none - a consumer would receive part
    of the chain with no way to know what it had missed. A server stream is no more projectable than a
    bidirectional one, because the property that matters is the same: the server decides when the next
    message arrives. Consumers needing those five use the gRPC contract directly. This is a documented
    gap with an enumerable boundary, not an oversight, and the five are named individually below so the
    boundary is checkable.

    **Every other method of C-03 and C-04 IS projected, including the eight read-and-apply operations
    of the four headless models.** A partial projection would be the worst outcome available: Gateway
    is the sole ingress, so an operation the gRPC contract publishes but this document omits is
    unreachable from outside the cluster, and a consumer would read that as a bug in its own client
    rather than as a boundary of the contract. The sibling test project asserts the correspondence in
    both directions.

    ## Related documents

    `docs/ARCHITECTURE.md` is the service topology and port map, `docs/CONTRACTS.md` is the full
    ten-contract inventory, `docs/DEFERRED.md` is the authoritative deferred-service roster, and
    `Proto/dataservices.v1.proto` and `Proto/common.v1.proto` are the payload authority for the
    projected operations. Where any of those and this document disagree about a route, a status or an
    authentication posture, **this document is authoritative for the wire** and the prose is corrected
    to match it.

servers:
  # ONE ENTRY, DELIBERATELY. Port 5105 is Gateway's listener per docs/ARCHITECTURE.md 4.1, and it is
  # the documented composition-root access URL the attached environment fixes. The other services'
  # ports belong in their own documents, not here.
  - url: http://localhost:5105
    description: >-
      The gateway-service listener and the documented composition-root access URL. Port 5105 is fixed
      by the port map in docs/ARCHITECTURE.md 4.1 and is the same value the local orchestration
      manifest publishes. Inside the orchestration network, callers reach this service by its service
      name on the same port rather than through localhost.

tags:
  - name: Health
    x-contract-id: C-10
    description: >-
      Contract C-10. Aggregated readiness and the standing proof that this boundary is authenticated.
      Gateway reports healthy only after Persistence, DataServices and Security all report healthy;
      `/health` is anonymous on all four services and `/v1/ping` requires a token on all four.
  - name: Capabilities
    x-contract-id: C-09
    description: >-
      Contract C-09. Projects the framework's eight-bit capability gate as configuration. The bits are
      carried by their preserved legacy identifiers; `INIT_FLAG_ENABLE_SQLITE` is the only one with an
      in-scope consumer in this phase.
  - name: DataWindow
    x-contract-id: C-09
    description: >-
      Contract C-09's REST projection of C-03 (`dataservices.v1.DataWindowService`). The retrieval,
      validation-session, update and event-gate surface. Gateway holds no DataWindow logic; each
      operation maps onto exactly one gRPC method and maps its status back.
  - name: ColumnExpression
    x-contract-id: C-09
    description: >-
      Contract C-09's REST projection of C-04 (`dataservices.v1.ColumnExpressionService`). The
      expression, variable, flag and calculation surface. Kept separate from the DataWindow tag for
      the same reason C-04 is a separate contract from C-03: the expansion engine versions
      independently.
  - name: Reserved
    x-contract-id: C-09
    description: >-
      The four reserved extension points of docs/CONTRACTS.md 13. Each names a DEFERRED Phase-2
      service and returns 501 with a machine-readable body. These are routing declarations, not
      implementations: no project, container, test project or placeholder class exists behind any of
      them.

# DOCUMENT-LEVEL DEFAULT: a token is required unless an operation overrides it. Stating the
# requirement once and overriding it in exactly one place is deliberate - it makes "authenticated" the
# default posture and forces every anonymous operation to declare itself, so an anonymous surface can
# never be created by forgetting to add a requirement (constraint C-G).
security:
  - bearerAuth: []

paths:

  # ================================================================================================
  #  C-10 - HEALTH AND READINESS
  # ================================================================================================

  /health:
    get:
      operationId: getHealth
      x-contract-id: C-10
      tags: [Health]
      summary: Report aggregated readiness across Gateway and its three upstreams. Anonymous.
      description: |-
        Reports Gateway's readiness **and that of each of its three upstreams individually**.

        **Gateway reports healthy only after Persistence, DataServices and Security all report
        healthy.** The ordering is expressed in the orchestration manifest as a dependency condition
        on upstream health, and it is the readiness property that ruled out the alternative
        orchestration approach recorded in `docs/ARCHITECTURE.md` 10.4 - the generated model could not
        express it.

        **The aggregate names each upstream and its own state rather than returning one opaque
        verdict.** An operator reading a failed aggregate needs to know *which* upstream is not ready;
        collapsing three states into one would make the aggregate useless for the diagnosis it exists
        to support.

        **This endpoint is anonymous, on all four services.** The thing that probes it - a container
        orchestrator, a load balancer, an operator - holds no token, and it probes precisely during the
        window in which the service is still starting. Requiring a token would make readiness depend
        on the very service being probed and on Security's token issuance being already live, which is
        a circular dependency that cannot resolve during a cold start.

        **`Degraded` and `Unhealthy` are different states and are reported differently.** A service
        still completing startup validation is not the same as one whose dependency has failed.
        `Degraded` is reported with 200 so a probe that tears down on any non-2xx does not kill a
        service that is merely still starting; `Unhealthy` is reported with 503.
      security:
        - {}
      responses:
        '200':
          description: >-
            Gateway is `Healthy` or `Degraded`. Both are 200 for the reason given above. The body
            names each upstream with its own state, so a `Degraded` aggregate identifies which
            upstream is responsible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateHealthReport'
        '503':
          description: >-
            Gateway is `Unhealthy` - one of its three upstreams has failed, or Gateway's own startup
            validation has. The failing participant is named in the problem `detail` and `retCode`
            carries the corresponding legacy return code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/ping:
    get:
      operationId: ping
      x-contract-id: C-10
      tags: [Health]
      summary: The standing proof that this boundary is authenticated. Token required.
      description: |-
        Returns a trivial success **only** when a valid token is presented, and `401` without one.

        This operation exists for one reason: to make the authenticated-boundary requirement
        **testable rather than merely asserted**. The legacy opens no listening socket and receives no
        unsolicited request, so decomposition creates every boundary in this system from nothing - and
        the requirement that each be authenticated needs a surface a conformance test can point at.

        It is present on **all four** services rather than only at the ingress, because an internal
        edge is a created boundary too. That uniformity is part of contract C-10.

        The body does not echo the presented token, any claim of it, or any part of the verification
        material.
      responses:
        '200':
          description: A valid token was presented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ================================================================================================
  #  C-09 - CAPABILITY PROJECTION
  # ================================================================================================

  /v1/capabilities:
    get:
      operationId: getCapabilities
      x-contract-id: C-09
      tags: [Capabilities]
      summary: Project the framework's eight-bit capability gate. Token required.
      description: |-
        Reports which of the framework's eight capability bits are enabled in this deployment.

        ## The gate is the legacy's own decomposition intent

        `ws_objects/pfw.shared.pbl.src/enums.sru:L41-L49` declares eight capability bits, and a module
        not explicitly initialized is unusable - *and its native library need not ship*
        [`docs/README.md` initialization section]. That bitmask is the legacy framework telling us
        where its own seams are, and mapping it onto the service roster is independent corroboration
        that the Phase-1 slice is drawn correctly.

        ## Only one bit has an in-scope consumer in this phase

        | Bit | Value | Phase-1 destination |
        | --- | --- | --- |
        | `INIT_FLAG_ENABLE_UI` | 1 | DesignSystem - deferred |
        | `INIT_FLAG_ENABLE_SCITER` | 2 | ScriptBridge - deferred |
        | `INIT_FLAG_ENABLE_BLINK` | 4 | ScriptBridge - deferred |
        | `INIT_FLAG_ENABLE_BLINKFAST` | 8 | ScriptBridge - deferred |
        | `INIT_FLAG_ENABLE_ORCA` | 256 | packaging tooling, not a service |
        | `INIT_FLAG_ENABLE_SQLITE` | 512 | **Persistence - in scope** |
        | `INIT_FLAG_ENABLE_DPIAWARE` | 1024 | DesignSystem - deferred |
        | `INIT_FLAG_ENABLE_WEBVIEW` | 2048 | ScriptBridge - deferred |

        ## `INIT_FLAG_ENABLE_ALL` deliberately omits `BLINKFAST`

        It is not an oversight and must not be "corrected": `blink.dll` and `blinkfast.dll` are
        alternative builds of one engine, so enabling both is meaningless. The omission is reproduced
        verbatim under C-B, and the reported `all` mask reflects it.

        ## The identifiers are preserved verbatim

        The bit names are the legacy `SCREAMING_SNAKE` spellings, in deliberate departure from .NET
        naming convention, because they appear in serialized payloads, log records and
        characterization recordings where a rename would silently invalidate every stored comparison
        (Agent Action Plan 0.4.5.3).
      responses:
        '200':
          description: The capability report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityReport'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ================================================================================================
  #  C-09 - THE /v1/datawindow PROJECTION OF C-03 (dataservices.v1.DataWindowService)
  #
  #  Fourteen of C-03's sixteen methods are projected: the six lifecycle, update and gate operations
  #  first, then the eight read-and-apply operations of the four headless models. `Retrieve` (server
  #  streaming) and `EventChain` (bidirectional) are NOT - see the introduction. Every operation below
  #  names the gRPC method it projects and the protobuf messages that define its payload.
  # ================================================================================================

  /v1/datawindow/sessions:
    post:
      operationId: openValidationSession
      x-contract-id: C-03
      x-grpc-method: dataservices.v1.DataWindowService/OpenValidationSession
      x-proto-request: dataservices.v1.OpenValidationSessionRequest
      x-proto-response: dataservices.v1.OpenValidationSessionResponse
      tags: [DataWindow]
      summary: Open a validation session and receive its correlation identifier.
      description: |-
        Materializes the four pieces of cross-event mutable state that
        `ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L89-L96` holds as private fields:
        the disabled-event bitmask, the inside-item-change flag, the inside-validation-error flag,
        and - most consequentially - the item-changed return value **stashed for the validation-error
        event to consume**.

        A stateless request boundary has nowhere to put those, which is why the session is explicit
        rather than implicit. The returned identifier correlates every subsequent operation in the
        chain.

        Sessions must be closed. An abandoned session holds server-side state until its configured
        idle expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtoPayload'
      responses:
        '200':
          $ref: '#/components/responses/ProjectedSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'

  /v1/datawindow/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: closeValidationSession
      x-contract-id: C-03
      x-grpc-method: dataservices.v1.DataWindowService/CloseValidationSession
      x-proto-request: dataservices.v1.CloseValidationSessionRequest
      x-proto-response: dataservices.v1.CloseValidationSessionResponse
      tags: [DataWindow]
      summary: Close a validation session and release its cross-event state.
      description: >-
        Releases the session opened above. Closing a session that does not exist is reported as `404`
        rather than silently succeeding, so a caller can detect a double close - which in the legacy
        would have been a use-after-destroy.
      responses:
        '200':
          $ref: '#/components/responses/ProjectedSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'

  /v1/datawindow/update:
    post:
      operationId: updateDataWindow
      x-contract-id: C-03
      x-grpc-method: dataservices.v1.DataWindowService/Update
      x-proto-request: dataservices.v1.UpdateRequest
      x-proto-response: dataservices.v1.UpdateResponse
      tags: [DataWindow]
      summary: Apply buffered changes. Returns 409 on an optimistic-concurrency conflict.
      description: |-
        Applies the buffered insert, update and delete set through C-03, which in turn reaches C-06 on
        Persistence.

        ## The 409 is the substantive part of this operation

        The sole updatable DataWindow in the legacy estate carries `updatewhere=1` with all six
        columns marked `updatewhereclause=yes`
        [`ws_objects/pfw.tests.pbl.src/dw_sqlite.srd:L8-L14`], so the optimistic-concurrency check
        spans **all six columns' original values**. On a mismatch, C-06 returns gRPC `Aborted` and
        this operation returns **HTTP `409`** with the conflict detail carrying the current row state,
        unchanged.

        `Aborted` is the canonical gRPC-to-409 mapping and is chosen over `FailedPrecondition`
        deliberately: the operation may succeed if retried at a higher level, which is what the status
        is defined to mean.

        **Callers implement an explicit retry-or-surface policy. There is no silent overwrite
        anywhere in the system.** A caller that ignores the 409 and re-sends the same payload will
        receive the same 409, because the original values it carries are still stale.

        ## What the response carries

        Inserted, updated and deleted counts, plus the identity column and the two identity value
        arrays that reproduce the legacy identity round-trip
        [`ws_objects/pfw.thread.ext.pbl.src/n_cst_thread_task_sqlupdate.sru:L215-L245`].
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtoPayload'
      responses:
        '200':
          $ref: '#/components/responses/ProjectedSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'

  /v1/datawindow/event-gate:
    get:
      operationId: getEventGate
      x-contract-id: C-03
      x-grpc-method: dataservices.v1.DataWindowService/GetEventGate
      x-proto-request: dataservices.v1.GetEventGateRequest
      x-proto-response: dataservices.v1.GetEventGateResponse
      tags: [DataWindow]
      summary: Read the event-gate bitmask.
      description: |-
        Reports which of the three gated events are currently disabled.

        The bitmask is `EID_ROWFOCUSCHANGE = 1`, `EID_ITEMFOCUSCHANGE = 2` and `EID_ITEMCHANGE = 4`
        [`se_cst_dw.sru:L41-L43`], and the identifiers are composable.

        **One coupling must be carried and is easy to miss:** disabling item-change also **suppresses
        column-expression evaluation** [`se_cst_dw.sru:L109-L111`]. So a caller that disables item
        change to stop a validation cascade also silently stops every computed column from
        recalculating. That is legacy behaviour, reproduced under C-B, and the response states the
        coupling so a caller can see it before relying on the gate.
      parameters:
        - $ref: '#/components/parameters/SessionIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/ProjectedSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'

  /v1/datawindow/event-gate/disable:
    post:
      operationId: disableEvent
      x-contract-id: C-03
      x-grpc-method: dataservices.v1.DataWindowService/DisableEvent
      x-proto-request: dataservices.v1.DisableEventRequest
      x-proto-response: dataservices.v1.DisableEventResponse
      tags: [DataWindow]
      summary: Disable one or more gated events.
      description: >-
        Sets bits in the event gate. Disabling `EID_ITEMCHANGE` also suppresses column-expression
        evaluation - see `GET /v1/datawindow/event-gate`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtoPayload'
      responses:
        '200':
          $ref: '#/components/responses/ProjectedSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'

  /v1/datawindow/event-gate/enable:
    post:
      operationId: enableEvent
      x-contract-id: C-03
      x-grpc-method: dataservices.v1.DataWindowService/EnableEvent
      x-proto-request: dataservices.v1.EnableEventRequest
      x-proto-response: dataservices.v1.EnableEventResponse
      tags: [DataWindow]
      summary: Re-enable one or more gated events.
      description: >-
        Clears bits in the event gate, restoring both the named events and - when `EID_ITEMCHANGE` is
        among them - column-expression evaluation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtoPayload'
      responses:
        '200':
          $ref: '#/components/responses/ProjectedSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'


  # ------------------------------------------------------------------------------------------------
  #  THE FOUR HEADLESS MODELS OF C-03, READ AND APPLY
  #
  #  DropDownSearch, ColumnSort, ContextMenu and RowSelect each split into a headless half that ships
  #  and a rendering half that does not (Agent Action Plan 0.3.5, docs/CONTRACTS.md 6.4). The eight
  #  operations below are the headless half, and they are projected for the same reason the rest of
  #  C-03 is: Gateway is the SOLE ingress, so an unprojected operation is unreachable from outside the
  #  cluster no matter how completely the gRPC contract declares it.
