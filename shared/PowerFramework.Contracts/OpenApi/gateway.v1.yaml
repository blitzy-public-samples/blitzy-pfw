  /v1/datawindow/expression/engine-state:
    post:
      operationId: getExpressionState
      x-contract-id: C-04
      x-grpc-method: dataservices.v1.ColumnExpressionService/GetExpressionState
      x-proto-request: dataservices.v1.GetExpressionStateRequest
      x-proto-response: dataservices.v1.GetExpressionStateResponse
      tags: [ColumnExpression]
      summary: Read the engine-state snapshot - the expression table, the reverse dependency index and the bindings.
      description: |-
        The snapshot that makes the engine's seven internal structures reachable rather than merely
        declared: the expression table, the **reverse dependency index** from a column to the
        expressions and variables depending on it, the grammar sentinels, and - when the bindings flag
        is set - the global variable table together with the three-part `$` / `$$` bindings.

        ## Why the three parts travel together

        A `$name` reference is resolved and substituted **at the moment the expression is set**, so the
        variable name is gone from the stored text and no later assignment can reach it. A `$$name`
        reference is retained as a reference and resolved at calculation time, so later mutation
        propagates [`docs/n_cst_dwsvc_columnexp.md`]. Transmitting an already-expanded string would
        make a static binding indistinguishable from a literal and would strip a dynamic binding of its
        resolution environment - so the payload carries the **unexpanded source text**, the
        **bind-time snapshot** and the **live environment**, with the expansion mode tagged
        per reference rather than per expression.

        ## Read-only by design

        State is mutated through the typed operations above and never by posting a snapshot back. There
        is deliberately no counterpart that accepts this shape: an engine that could be restored from a
        caller-supplied graph would let a caller install a dependency index inconsistent with the
        expressions it indexes.

        Projected as `POST` for the same structured-selector reason as the other reads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtoPayload'
