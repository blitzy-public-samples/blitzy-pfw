    ExpressionBinding:
      type: object
      title: ExpressionBinding
      x-proto-message: dataservices.v1.ExpressionBinding
      description: |-
        **The three-part payload that makes the `$` versus `$$` distinction survive a network boundary**,
        mirrored from `dataservices.v1.ExpressionBinding`.

        All three parts travel together, and none is optional in practice:

        1. **`unexpandedExp`** - the source text as written, before any substitution. Sending an expanded
           string instead would make a static binding indistinguishable from a literal.
        2. **`bindTimeSnapshot`** - the variable values as they stood when the expression was set. This
           is what a static (`$name`) reference resolved against, and it is why a static result never
           changes afterwards.
        3. **`liveEnvironment`** - the variable values as they stand now. This is what a dynamic
           (`$$name`) reference resolves against at calculation time, and it is why a dynamic result
           tracks later mutation.

        The reference arrays then say, **per reference**, which of the two applied - or which of the
        three further modes did. Without the arrays a consumer holding both maps still could not tell
        which map any particular reference should be read from.

        ## Where this shape travels

        It is the shape of the `bindings` member of C-04's `GetExpressionStateResponse`, returned by
        `POST /v1/datawindow/expression/engine-state` when the request asks for bindings, and of the
        `binding` member of `GetExpressionResponse`. Both of those are published concretely in Tier 3
        and both `$ref` this schema, so this schema's reachability is a fact a tool can follow rather than
        something prose has to justify. It is mirrored here regardless of that, because this
        is the **one** contract detail the requirements single out as not surviving naive serialization: a
        consumer that could not see the three parts and the per-reference mode would reasonably send an
        already-expanded string, and the distinction would be destroyed silently rather than rejected.

        Every member is `required`, and that is the measured wire truth rather than an emphasis: this
        shape appears in responses only, and none of its six members has explicit protobuf presence, so
        every one is present on every response - the three maps and arrays arriving empty rather than
        absent when they carry nothing. See the Tier 3 section note.
      additionalProperties: false
      required: [unexpandedExp, bindTimeSnapshot, liveEnvironment, vars, fns, globalVars]
      properties:
        unexpandedExp:
          type: string
          description: The expression's source text, unexpanded. Part 1 of the three.
        bindTimeSnapshot:
          type: object
          description: >-
            The bind-time variable values, keyed by variable name. Part 2 of the three - what a static
            reference resolved against. A protobuf `map<string, VarValue>`.
          additionalProperties:
            $ref: '#/components/schemas/VarValue'
        liveEnvironment:
          type: object
          description: >-
            The current variable values, keyed by variable name. Part 3 of the three - what a dynamic
            reference resolves against now. A protobuf `map<string, VarValue>`.
          additionalProperties:
            $ref: '#/components/schemas/VarValue'
        vars:
          type: array
          description: >-
            The variable references, each carrying its own `expansionMode`. **Per reference, never per
            expression** - the legacy specification documents an example mixing static and dynamic
            expansion inside one expression.
          items:
            $ref: '#/components/schemas/VarData'
        fns:
          type: array
          description: The function references.
          items:
            $ref: '#/components/schemas/FuncData'
        globalVars:
          type: array
          description: The global variable table entries the references resolve through.
          items:
            $ref: '#/components/schemas/GlobalVarData'

    AggregateHealthReport:
      type: object
      title: AggregateHealthReport
      description: |-
        Gateway's readiness **and that of each of its three upstreams individually**.

        Gateway reports `Healthy` only after Persistence, DataServices and Security all do. The
        aggregate names each upstream with its own state rather than returning one opaque verdict,
        because an operator reading a failed aggregate needs to know which upstream is responsible.

        Gateway observes each upstream's anonymous `/health` and composes the three verdicts. **That
        observation is not a call into any upstream's capability**, which is what lets this aggregate
        name Persistence while Gateway never calls Persistence: the probe addresses are configured as a
        separate group from the two services Gateway invokes, and Gateway holds no Persistence client.
      additionalProperties: false
      required: [status, service, upstreams]
      properties:
        status:
          type: string
          enum: [Healthy, Degraded, Unhealthy]
          x-enum-varnames: [Healthy, Degraded, Unhealthy]
          description: |-
            The aggregate verdict, carrying the distinction contract C-10 requires between "not ready"
            and "unhealthy":

            - `Healthy` - Gateway and all three upstreams are ready. Reported with HTTP 200, and the
              only verdict that is.
            - `Degraded` - **not ready**, but not failed. Gateway is still completing startup
              validation, or an upstream is. Reported with HTTP **503**, because not ready is not
              ready: the readiness gate observes the status code, so answering 200 here would let a
              dependent start against an aggregate that had just said it was not usable.
            - `Unhealthy` - **failed**. Reported with HTTP 503.
        service:
          type: string
          const: gateway
          description: The reporting service.
        checkedAt:
          type: string
          format: date-time
          description: When this report was produced, so a consumer can detect a stale cached report.
        upstreams:
          type: array
          minItems: 3
          maxItems: 3
          description: >-
            The three upstreams Gateway aggregates, each named with its own state. Exactly three:
            Persistence, DataServices and Security. No entry exists for any deferred service, because
            no deferred service exists.
          items:
            $ref: '#/components/schemas/UpstreamHealth'
        checks:
          type: array
          description: >-
            Gateway's own component checks, behind its own contribution to the verdict. Carries no
            configuration value, no connection string and no key material.
          items:
            $ref: '#/components/schemas/HealthCheckResult'

    UpstreamHealth:
      type: object
      title: UpstreamHealth
      description: One upstream's individually reported state within Gateway's aggregate.
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          type: string
          enum: [persistence, dataservices, security]
          x-enum-varnames: [Persistence, DataServices, Security]
          description: >-
            Which upstream this entry describes. The enumeration is closed at three: the composition
            root depends on exactly these, and the 5103 slot in the port band is a commented Phase-2
            placeholder rather than a fourth participant.
        status:
          type: string
          enum: [Healthy, Degraded, Unhealthy, Unreachable]
          x-enum-varnames: [Healthy, Degraded, Unhealthy, Unreachable]
          description: >-
            This upstream's own verdict, or `Unreachable` when Gateway could not obtain one at all.
            `Unreachable` is distinguished from `Unhealthy` because they call for different operator
            action - a network or startup-ordering problem rather than a failed dependency inside a
            running service.
        detail:
          type: string
          description: >-
            A human-readable note about this upstream's state. Never carries a connection string, a
            key, or any configuration value.

    HealthCheckResult:
      type: object
      title: HealthCheckResult
      description: >-
        One component check behind a verdict. Present so an operator can tell which check is not yet
        satisfied rather than only that something is not.
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          description: The check's identifier.
        status:
          type: string
          enum: [Healthy, Degraded, Unhealthy]
          x-enum-varnames: [Healthy, Degraded, Unhealthy]
          description: This check's own verdict.
        detail:
          type: string
          description: >-
            A human-readable note. **Carries no configuration value, no connection string and no key
            material** - a health endpoint is anonymous, so anything it reports is public.

    PingResponse:
      type: object
      title: PingResponse
      description: >-
        The successful half of the authentication proof. Returned only when a valid token was
        presented; the absence of a token yields 401, and both outcomes are part of contract C-10. The
        body deliberately does not echo the presented token, any claim of it, or any part of the
        verification material.
      additionalProperties: false
      required: [service, authenticated]
      properties:
        service:
          type: string
          const: gateway
          description: The responding service.
        authenticated:
          type: boolean
          const: true
          description: >-
            Always true when this body is returned, because the operation cannot be reached without a
            valid token. It is present so that a conformance test asserting the authenticated path has
            something explicit to assert on rather than inferring success from a status code.
        timestamp:
          type: string
          format: date-time
          description: When the response was produced.

    CapabilityReport:
      type: object
      title: CapabilityReport
      description: |-
        The framework's eight-bit capability gate, projected as configuration.

        The bit identifiers are the legacy `SCREAMING_SNAKE` spellings from
        `ws_objects/pfw.shared.pbl.src/enums.sru:L41-L49`, preserved verbatim in deliberate departure
        from .NET naming convention because they appear in serialized payloads, log records and
        characterization recordings (Agent Action Plan 0.4.5.3).
      additionalProperties: false
      required: [effectiveMask, allMask, capabilities]
      properties:
        effectiveMask:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: |-
            The bitmask actually in effect in this deployment.

            The domain is the full **unsigned 32-bit** range, not the signed one. The configured value
            is projected with an **unchecked** conversion, so every one of the 2^32 values is
            representable and none is rejected - a negative configured value wraps rather than
            failing. That is deliberate: the legacy flag word is an unsigned long, and rejecting a
            wrapped value would make a configuration that the legacy accepted fail to start.
        allMask:
          type: integer
          format: int64
          const: 3847
          description: |-
            The value of `INIT_FLAG_ENABLE_ALL`, which is **3847** and is fixed by the legacy
            declaration rather than by this deployment - hence `const` rather than a range.

            `ws_objects/pfw.shared.pbl.src/enums.sru:L49` declares it as a **seven-term sum**:
            `INIT_FLAG_ENABLE_UI` (1) + `INIT_FLAG_ENABLE_SCITER` (2) + `INIT_FLAG_ENABLE_BLINK` (4)
            + `INIT_FLAG_ENABLE_ORCA` (256) + `INIT_FLAG_ENABLE_SQLITE` (512)
            + `INIT_FLAG_ENABLE_DPIAWARE` (1024) + `INIT_FLAG_ENABLE_WEBVIEW` (2048) = **3847**.

            **It deliberately omits `INIT_FLAG_ENABLE_BLINKFAST` (8).** That is not an oversight and
            must not be "corrected": `blink.dll` and `blinkfast.dll` are alternative builds of one
            engine, so enabling both is meaningless. The omission is reproduced verbatim under C-B, so
            `allMask` is **not** the bitwise union of every declared bit - that union would be 3855, and
            a consumer computing it that way would disagree with the framework by exactly the
            `BLINKFAST` bit.
        unrecognizedBits:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: >-
            Any bits set in `effectiveMask` that are not among the eight declared capabilities.
            Reported rather than rejected, so a configuration carrying a future or mistaken bit starts
            and says so instead of failing.
        capabilities:
          type: array
          minItems: 8
          maxItems: 8
          description: >-
            All eight declared capabilities with their values and enabled state. Exactly eight - the
            set is closed by the legacy declaration.
          items:
            $ref: '#/components/schemas/Capability'

    Capability:
      type: object
      title: Capability
      description: One declared capability bit.
      additionalProperties: false
      required: [name, value, enabled, phaseOneDestination]
      properties:
        name:
          type: string
          enum:
            - INIT_FLAG_ENABLE_UI
            - INIT_FLAG_ENABLE_SCITER
            - INIT_FLAG_ENABLE_BLINK
            - INIT_FLAG_ENABLE_BLINKFAST
            - INIT_FLAG_ENABLE_ORCA
            - INIT_FLAG_ENABLE_SQLITE
            - INIT_FLAG_ENABLE_DPIAWARE
            - INIT_FLAG_ENABLE_WEBVIEW
          x-enum-varnames:
            - INIT_FLAG_ENABLE_UI
            - INIT_FLAG_ENABLE_SCITER
            - INIT_FLAG_ENABLE_BLINK
            - INIT_FLAG_ENABLE_BLINKFAST
            - INIT_FLAG_ENABLE_ORCA
            - INIT_FLAG_ENABLE_SQLITE
            - INIT_FLAG_ENABLE_DPIAWARE
            - INIT_FLAG_ENABLE_WEBVIEW
          description: >-
            The legacy identifier, spelled exactly as `enums.sru:L41-L48` declares it. Preserved
            verbatim because it appears in stored characterization comparisons. The `x-enum-varnames`
            list is identical to the `enum` list here - deliberately, because the wire value *is* the
            legacy symbol, so a generator has nothing to translate and the pairing is what makes the
            member order line up with the numeric set on `value` below.
        value:
          type: integer
          format: int64
          # THE SAME CLOSED SET AS `name`, IN THE SAME ORDER, EXPRESSED NUMERICALLY. The pairing of an
          # exact numeric `enum` with `x-enum-varnames` carrying the SCREAMING_SNAKE identifiers is the
          # convention the sibling OpenApi/security.v1.yaml uses for every legacy constant set, and it
          # is used here for the same reason: the numbers are what appear in a serialized payload, a log
          # record and a characterization recording, and the identifiers are what a reader recognises.
          # Neither alone is sufficient, and `name[i]` corresponds to `value[i]` by construction.
          enum: [1, 2, 4, 8, 256, 512, 1024, 2048]
          x-enum-varnames:
            - INIT_FLAG_ENABLE_UI
            - INIT_FLAG_ENABLE_SCITER
            - INIT_FLAG_ENABLE_BLINK
            - INIT_FLAG_ENABLE_BLINKFAST
            - INIT_FLAG_ENABLE_ORCA
            - INIT_FLAG_ENABLE_SQLITE
            - INIT_FLAG_ENABLE_DPIAWARE
            - INIT_FLAG_ENABLE_WEBVIEW
          description: >-
            The bit's numeric value, exactly as `enums.sru:L41-L48` declares it. The eight are sparse -
            1, 2, 4, 8, 256, 512, 1024, 2048 - rather than the first eight powers of two, and the gap
            between 8 and 256 is the legacy's own: bits 16, 32, 64 and 128 are simply not declared. The
            set is closed because the legacy declaration is closed; a ninth capability would be a change
            to this published contract.
        enabled:
          type: boolean
          description: Whether this bit is set in `effectiveMask`.
        phaseOneDestination:
          type: string
          enum: [Persistence, DesignSystem, ScriptBridge, PackagingTooling]
          x-enum-varnames: [Persistence, DesignSystem, ScriptBridge, PackagingTooling]
          description: >-
            Where this capability's implementation lives in the Phase-1 slice. **Only
            `INIT_FLAG_ENABLE_SQLITE` maps to an in-scope service.** `PackagingTooling` is
            `INIT_FLAG_ENABLE_ORCA`, which is build tooling rather than a service at all - so a client
            can see from this field that enabling a bit whose destination is deferred has no runtime
            effect in this phase.

    ReservedRouteBody:
      type: object
      title: ReservedRouteBody
      description: |-
        The `501` body returned by each of the four reserved routes.

        **Machine-readable rather than a text message**, so a client can branch on it without parsing
        prose - which is the whole point of declaring the routes: the shape of the eventual system is
        legible from this contract, while nothing is implemented behind it.
      additionalProperties: false
      required: [status, service, deferredService, marker, route, retCode]
      properties:
        status:
          type: integer
          const: 501
          description: Always 501. Repeated in the body so a logged body is self-describing.
        service:
          type: string
          enum: [DesignSystem, Documents, Integration, ScriptBridge]
          x-enum-varnames: [DesignSystem, Documents, Integration, ScriptBridge]
          description: |-
            The deferred service this route will eventually reach. **The same value as
            `deferredService`, and it is retained because it is the member this document published for
            `v1` first.**

            AN UNVERSIONED WIRE MEMBER IS NOT A NAME TO IMPROVE. A later revision introduced
            `deferredService` for a real reason - `service` already means the *responding* service on
            `PingResponse` and an *upstream* service on `UpstreamHealth`, and a third meaning on one word
            makes a body ambiguous in exactly the place a client branches on it - and then removed
            `service`. That silently broke every `v1` consumer reading it, under a version number that
            promises it did not change. Both members are therefore emitted, carrying the identical value:
            a consumer written against the original contract keeps working, and one written against the
            unambiguous name gets it. Neither is deprecated in `v1`; retiring `service` is a `v2`
            decision, not a tidying one.
        deferredService:
          type: string
          enum: [DesignSystem, Documents, Integration, ScriptBridge]
          x-enum-varnames: [DesignSystem, Documents, Integration, ScriptBridge]
          description: |-
            The deferred service this route will eventually reach. The four are the Phase-2 half of the
            eight-service target roster; `docs/DEFERRED.md` is the authoritative roster and records
            which legacy objects each is assigned.

            **The name is the whole of what this member carries, and that is the point.** Naming the
            destination is required by the contract - it is what makes the eventual system legible - and
            nothing beyond the name is permitted, because anything further would begin to describe a
            capability that must not be modelled.

            The unambiguous spelling, and the one to prefer in new code: `service` is already used in
            this document for the **responding** service (`PingResponse`) and for an **upstream** service
            (`UpstreamHealth`), and a third meaning on the same word would make a body ambiguous in
            exactly the place a client branches on it. It also matches the `x-deferred-service` extension
            each reserved operation carries, so the wire member and the routing metadata read the same.

            It does not REPLACE `service` in `v1`, it accompanies it. Both are emitted with the identical
            value; see `service` above for why removing the original member was a compatibility break
            rather than a rename.
        marker:
          type: string
          const: reserved for Phase 2
          description: >-
            The literal marker `reserved for Phase 2`, exactly as specified. A constant rather than
            free text so a conformance test and a client can both match on it.
        route:
          type: string
          description: The matched route pattern, echoed so a client can log what it asked for.
        retCode:
          type: integer
          format: int64
          const: -2001
          description: |-
            `E_NO_IMPLEMENTATION`, which the legacy framework declares as **-2001**
            [`ws_objects/pfw.shared.pbl.src/retcode.sru:L78`].

            **The legacy's own not-implemented code, rather than a parallel vocabulary invented for
            this document.** It is the same value `common.v1.RetCode.Value.E_NO_IMPLEMENTATION` carries
            on the gRPC half of the boundary and the same value
            `PowerFramework.Shared.Kernel.RetCode.E_NO_IMPLEMENTATION` carries in process, so a client
            that branches on `retCode` handles a reserved route with the code it already knows. Its
            neighbour `E_NO_SUPPORT` (-2000) is a different statement - "this framework does not support
            that" rather than "this is not implemented here" - and is deliberately not used.

            A constant rather than an open integer, because a reserved route has exactly one outcome.

    # ==============================================================================================
    #  TIER 3 - THE GENERATED PROTOBUF SHAPES  (102 schemas: 93 messages + 9 enums)
    #  --------------------------------------------------------------------------------------------
    #  EVERY SCHEMA BELOW IS GENERATED FROM THE COMPILED PROTOBUF DESCRIPTORS of
    #  Proto/common.v1.proto and Proto/dataservices.v1.proto, and TOGETHER WITH TIER 1 THEY COVER THE
    #  COMPLETE TRANSITIVE CLOSURE of every message the 39 projected operations carry - 118 messages
    #  and 15 enums, of which Tier 1 already publishes 31.
    #
    #  WHY THIS TIER IS CONCRETE RATHER THAN A DELEGATION, AND WHY THE ARGUMENT FOR DELEGATING IS ANSWERED
    #  --------------------------------------------------------------------------------------------
    #  Publishing ONE open schema, `ProtoPayload`, for every projected request and response body - 75 of
    #  them on this projection: `additionalProperties: true`, no members, and a pointer at the
    #  `x-proto-*` extension naming the real message - is WRONG IN THE ONE DIRECTION THAT MATTERS. The
    #  projection binds every request with the STRICT canonical parser, which REJECTS a member the
    #  target message does not declare and answers 400 - so the document would promise a permissiveness
    #  the runtime does not have, and a consumer generating a client from it could not see a single member
    #  it was required to send. `UpdateResponse.rowsInserted`, `.rowsUpdated`, `.rowsDeleted` and
    #  `.identity` would be invisible to every standard OpenAPI consumer, on the one operation whose whole
    #  purpose is to tell a caller what it just changed - and `.identity` is the round trip a caller
    #  cannot reconstruct from anywhere else.
    #
    #  The argument FOR delegating is that transcribing the shapes by hand creates a second
    #  source of truth in a different language with nothing keeping the two in step, so the first
    #  divergence is silent. THAT OBJECTION IS CORRECT, and it is answered rather than
    #  overruled: these schemas are not transcribed, they are GENERATED from the descriptors, and the
    #  sibling test project's field-for-field cross-check compares EVERY member of EVERY schema
    #  carrying `x-proto-message` or `x-proto-enum` against its descriptor on every build - member
    #  set, JSON name, type, format, repeatedness, map shape, enum value set, enum numbers,
    #  closedness, and the `required` rule stated below. A divergence is a BUILD FAILURE, which is
    #  precisely the mechanism whose absence would justify delegating.
    #
    #  THE RULES THE GENERATOR APPLIED, so a reader can check any schema against its .proto by hand
    #  --------------------------------------------------------------------------------------------
    #  MEMBER NAMES are the canonical protobuf JSON mapping - lowerCamelCase of the proto field name.
    #  The parser ALSO accepts the original snake_case spelling on input; this document names one
    #  spelling per member, and a consumer that uses the published one is always right.
    #
    #  64-BIT INTEGERS are `[integer, string]` with `format: int64` or `uint64`, because the canonical
    #  mapping EMITS them as JSON strings and ACCEPTS either form. 32-bit fields are plain integers.
    #  `bytes` is `type: string, format: byte` (base64). Signedness travels in `format`, and unsigned
    #  domains additionally state `minimum` and `maximum` so the range is machine-checkable.
    #
    #  ENUM MEMBERS are the proto enumerator NAMES, because that is what the mapping emits, and each
    #  enumerator's declared number travels beside it in `x-enum-values`, positionally aligned with
    #  `enum` and `x-enum-varnames`. Identifier spellings are preserved verbatim for the same reason
    #  the SCREAMING_SNAKE constants are: they appear in serialized payloads, log records and
    #  characterization recordings, where a rename silently invalidates every stored comparison.
    #
    #  EVERY OBJECT IS CLOSED. `additionalProperties: false` is not a style preference here - it is
    #  what the runtime does. Publishing an open object is the defect this tier exists to close.
    #
    #  `required` IS THE MEASURED WIRE TRUTH, AND ITS ASYMMETRY IS DELIBERATE
    #  --------------------------------------------------------------------------------------------
    #  A RESPONSE-ONLY shape declares `required` = every member WITHOUT explicit protobuf presence.
    #  That set is exactly what a response always carries, and it is a measured fact rather than an
    #  inference: the projection formats with default values ON, and the formatter writes a field when
    #  `HasPresence` is false OR the field is set - so a presence-less member is present on every
    #  response even when it holds 0, "", `false` or `[]`, while a member WITH presence (a message
    #  field, a proto3 `optional`, a `oneof` arm) stays absent until it is set.
    #
    #  A SHAPE CARRIED IN A REQUEST DECLARES NOTHING `required`, and that is accuracy rather than
    #  laxity. The canonical parser treats every member as optional and parses an absent member as its
    #  default, so absence and a default-valued member are INDISTINGUISHABLE to the operation: a
    #  `required` list on a request shape would publish a check nothing performs, and would make a
    #  validator reject a body the runtime accepts. Where a shape travels in both directions its
    #  description names the members a RESPONSE always carries, so the guarantee is not lost.
    #
    #  A Tier-1 shape may declare MORE than the presence-less set when the operation always populates
    #  a message-typed member - `DisableEventResponse.gate` is one - and the cross-check permits that
    #  superset while requiring the presence-less floor.
    #
    #  WHAT IS NOT HERE
    #  --------------------------------------------------------------------------------------------
    #  The .proto files remain the AUTHORITY and they carry the full rationale for every shape; each
    #  schema below reproduces its message's opening paragraph and its members' own comments, not the
    #  whole of it, so this document does not become a second copy of that prose. The 44 messages the
    #  projection does not carry - the three bidirectional streams' payloads and the event-notification
    #  family - are deliberately absent: they never cross this ingress.
    #
    #  DO NOT HAND-EDIT A SHAPE BELOW TO MAKE A TEST PASS. If the cross-check fails, either the .proto
    #  changed and this section must be regenerated from it, or the change to the .proto was wrong.
    # ==============================================================================================

