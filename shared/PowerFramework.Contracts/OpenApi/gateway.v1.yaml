        the section note.
      additionalProperties: false
      required: [identityColumnId, primaryValues, filterValues]
      properties:
        identityColumnId:
          type: [integer, string]
          format: int64
          description: >-
            The discovered identity column's ONE-BASED ordinal. Legacy `long id`; int64 per the
            scalar rule's widening. A real column is 1 or greater, and 0 never appears here - the
            legacy only fires this callback when the ordinal is positive
            [n_cst_thread_task_sqlupdate.sru:L226].
        primaryValues:
          type: array
          items:
            $ref: '#/components/schemas/NullableInt64'
          description: |-
            Values from the PRIMARY buffer, in FORWARD collection order [:L228-L233]. Read with
            GetItemNumber, hence a numeric array.

            ============ EVERY ELEMENT CARRIES PRESENCE, BECAUSE A NULL IDENTITY IS REPRESENTABLE
            ======== The element type is NullableInt64 and not a bare int64, and the reason is data
            loss rather than taste. `GetItemNumber` ANSWERS NULL for a null item and PowerScript
            stores that null into the array it hands to the callback
            [n_cst_threading_task_sqlupdate.sru:L144, :L160], so a null identity value is a state
            the oracle can produce. A `repeated int64` has no per-element presence, so such a value
            could only be COERCED to 0 - making it indistinguishable from a legitimate identity of 0
            - or DROPPED, which would shorten the array and silently re-pair every value after it
            with the wrong row. Both failures return a plausible response that no count disagrees
            with.

            THE WRAPPER CHANGES NOTHING ELSE. The field is still repeated, still field 2, still
            separate from filter_values, and still in collection order. A producer emits one element
            per collected value, in order, with `value` set; it emits an element with `value` UNSET
            for a null. A consumer must test presence per element and must not treat an unset
            element as zero.

            On the sole evidenced fixture a null cannot arise - `id` is an INTEGER PRIMARY KEY
            AUTOINCREMENT marked `key=yes identity=yes`
            [ws_objects/pfw.tests.pbl.src/dw_sqlite.srd:L8] and the database always assigns it - so
            this is the contract being able to say what the oracle can produce rather than a case
            the fixture exercises.
            ==========================================================================================
        filterValues:
          type: array
          items:
            $ref: '#/components/schemas/NullableInt64'
          description: |-
            Values from the FILTER buffer, in BACKWARD collection order [:L237-L241]. The order is
            the legacy's and must be transmitted, and relayed, as collected - see the block above.

            Same element type and the same presence rule as primary_values, for the same reason.

