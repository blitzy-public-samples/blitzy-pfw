  # ------------------------------------------------------------------------------------------------
  #  THE FOUR HEADLESS MODELS OF C-03, READ AND APPLY
  #
  #  DropDownSearch, ColumnSort, ContextMenu and RowSelect each split into a headless half that ships
  #  and a rendering half that does not (Agent Action Plan 0.3.5, docs/CONTRACTS.md 6.4). The eight
  #  operations below are the headless half, and they are projected for the same reason the rest of
  #  C-03 is: Gateway is the SOLE ingress, so an unprojected operation is unreachable from outside the
  #  cluster no matter how completely the gRPC contract declares it.
  #
  #  Every one is headless without exception - no geometry, no DPI conversion, no font metric, no pixel
  #  coordinate, no window handle and no IME state crosses this boundary. The rendering halves are the
  #  reserved /v1/design/** extension point at the end of this document, and NOTHING here implements
  #  any part of them (C-D).
  #
  #  All eight are POST, including the four reads. Each request is a STRUCTURED SELECTOR keyed on a
  #  DataWindow handle rather than a session id - ContextMenu additionally carries a row and a
  #  DataWindow-object reference - and a structured selector does not survive a query string without
  #  inventing an encoding this contract would then have to specify. That is the same reason the
  #  expression reads are POST, and it is stated per operation rather than assumed.
  # ------------------------------------------------------------------------------------------------

