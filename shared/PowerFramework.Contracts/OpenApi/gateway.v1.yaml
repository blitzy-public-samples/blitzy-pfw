components:

  securitySchemes:
    # Presenting no token, or an invalid one, yields `401` on every operation this scheme guards -
    # produced here, before any route handler runs. See `x-cross-cutting-responses` at document level
    # for the machine-readable form and for why the reserved families do not enumerate it.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        A JSON Web Token **issued by the Security service**, presented in the `Authorization` header.

        ## Gateway validates. It does not issue, and it holds no signing key

        Security is the **sole minter** in the system. Gateway holds **verification material only** -
        no signing key, no minting capability and no independent signing authority - and so do
        DataServices and Persistence. That is a structural property of the sole-issuer topology rather
        than a configuration choice: the security properties depend on there being exactly one issuer.

        **This document names no key, no key material and no key-holding setting**, deliberately and
        not merely as an omission. Gateway has nothing of the kind to configure, so naming one here
        would describe a capability this service does not have and must never acquire. Where the
        system's single signing secret is configured, and by which service, is
        `docs/SECRETS.md` §4's subject - one place, on the service that holds it.

        ## Where the verification material comes from

        Both publications are on **Security's own listener, port 5104**, and both are anonymous,
        because verification material is **public by design** - that is precisely what distinguishes it
        from a signing key:

        * `GET /.well-known/jwks.json` - the current key set, public parameters only. This is the
          material a signature is checked against.
        * `GET /.well-known/openid-configuration` - the discovery document, which points at the key set
          above so a consumer never has to fetch a key itself.

        Gateway does **not** republish either document. A consumer of *this* API presents a token and
        never needs the key set; a service verifying one fetches it from Security directly.

        ## Verification is framework code, not hand-written code

        Gateway validates with the **stock `Microsoft.AspNetCore.Authentication.JwtBearer` handler**,
        pointed at the discovery document above. The handler performs signature checking, key fetching
        and rollover, issuer and audience validation and clock-skew tolerance by itself.

        That is the point rather than an implementation note: it keeps the security-critical path
        inside framework code, on three services rather than one. It is also the specific reason
        Security's contract is REST - gRPC would have forced a bespoke key-set retrieval implementation
        into each of those three services, which is a net *increase* in hand-written security code.

        ## Scope

        Every operation in this document requires this scheme except `GET /health`, which declares
        itself anonymous. **No signing, verification or mutual-TLS material is scaffolded for any
        deferred service**, and no per-deferred-service key name appears anywhere in this document -
        those services do not exist in this phase, so material for them would secure nothing.

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: >-
        The correlation identifier returned when the session was opened. It is the handle for the
        server-held state that a stateless boundary cannot carry per request.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    SessionIdQuery:
      name: sessionId
      in: query
      required: true
      description: The correlation identifier of the session to read.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    ReservedPath:
      name: path
      in: path
      required: true
      description: >-
        The remainder of the requested path. Present so that each reserved entry is a route FAMILY
        rather than a single route, which is what makes the eventual URL shape of the deferred service
        legible from this contract. Its value is echoed in the `route` field of the 501 body and is
        otherwise unused, because nothing exists behind the route to use it.
      schema:
        type: string
      allowReserved: true

  responses:
    ProjectedSuccess:
      description: >-
        The projected gRPC method returned `OK`. The body is the canonical protobuf JSON mapping of
        the message named in the operation's `x-proto-response` extension.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProtoPayload'

    BadRequest:
      description: >-
        The projected gRPC method returned `InvalidArgument`, or the request failed Gateway's own
        binding. `retCode` carries the **originating legacy return code** so the specific legacy
        validation is identifiable rather than merely the HTTP class - `E_INVALID_ARGUMENT` (-3) for
        an argument outside its accepted domain, and the expression engine's own codes for a parse
        failure, which also carries the expression text and the caret position.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Unauthorized:
      description: >-
        No token was presented, or the token presented is expired, malformed, or not valid for this
        service. This response is part of the published contract rather than an implementation
        detail: it is the standing proof that the boundary is authenticated (C-G).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: >-
        The projected gRPC method returned `PermissionDenied`. The token is valid but does not carry
        the scope this operation requires. Deliberately distinguished from `401` so a caller can tell
        a missing credential from an insufficient one.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: >-
        The projected gRPC method returned `NotFound` - most often a session identifier that has
        expired or was already closed, or a column selector naming a column the DataWindow does not
        have.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Conflict:
      description: |-
        **The projected gRPC method returned `Aborted`: an optimistic-concurrency conflict.**

        The body carries the conflict detail **unchanged** from C-06, including the current row state,
        so a caller has what it needs to decide between retrying and surfacing.

        **Callers implement an explicit retry-or-surface policy, and there is no silent overwrite
        anywhere in the system.** Re-sending the same payload will produce the same 409, because the
        original values it carries are still stale - a retry must first re-read.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ConflictProblemDetails'

    CrossSessionReferenceBlocked:
      description: |-
        The request was rejected. On these operations one rejection reason is distinctive enough to
        document separately: a cross-DataWindow variable reference that **spans expression sessions or
        service instances**, which is BLOCKED.

        ## Why this is a 400 and not a status of its own

        A dedicated `422` was considered and REJECTED, because the status mapping in
        `docs/CONTRACTS.md` 12.1 is the specification for this contract and it does not sanction one.
        That mapping already provides the mechanism for exactly this need: `InvalidArgument` projects to
        `400` **carrying the originating `RetCode`**, so a caller distinguishes one rejection from
        another by reading `retCode` rather than by counting statuses. Introducing a ninth status would
        have been this document overriding its own specification for a case the specification already
        covers.

        So a caller identifies this outcome from the `retCode`, and from the expression-error category
        `CATEGORY_FOREIGN_REFERENCE_BLOCKED` — not from the HTTP status.

        ## Why the reason is worth documenting at all

        This is the refactor's one deliberately narrowed contract. `foreignvardata.expsvc` is a **live
        in-process object pointer** to another DataWindow's expression service, and a pointer cannot be
        serialized. References are therefore resolved by a session-scoped DataWindow handle and are
        supported only when both DataWindows are co-resident in one expression session inside one
        DataServices instance.

        Approximating a pointer dereference across a network would produce results wrong in a way no
        test would obviously catch, so the contract is **narrowed with a defined error rather than
        widened with a guess**. A caller receiving this must not retry: the topology, not the request,
        is what rejected it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    InternalError:
      description: >-
        The projected gRPC method returned `Internal`. **The statement field is redacted**: the legacy
        `sqlsyntax` field carries the complete generated statement including interpolated literal
        values and the legacy logger performs no redaction at all, so the projection redacts or
        parameter-separates it before it reaches a caller. `detail` never carries key material, a
        stack trace, a file path or a connection string.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UpstreamUnavailable:
      description: |-
        An upstream service could not be reached, or the call to it failed in transit after the
        configured retry policy was exhausted.

        **This response exists because of the decomposition itself.** An in-process call cannot fail
        in transit and a network call can, so handling the failure is required *by* the transition
        rather than being a behavioural improvement layered on top of it. Without it, the first
        transient network fault would surface as a defect the legacy could not have had - a regression
        introduced by the refactor rather than a preserved behaviour.

        The body names which upstream failed, so an operator does not have to correlate logs to find
        out.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ReservedForPhaseTwo:
      description: |-
        **Not implemented. Reserved for Phase 2.**

        The body is **machine-readable** rather than a text message, so a client can branch on it
        without parsing prose: it names the deferred service the route will eventually reach and
        carries the marker `reserved for Phase 2`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReservedRouteBody'

  schemas:

    ProblemDetails:
      type: object
      title: ProblemDetails
      description: |-
        The **one and only** error body in this document apart from its conflict specialization below.
        Every `4xx` and every `5xx` response uses one of the two, so a consumer writes one error
        handler.

        It is the RFC 9457 problem-details object, which is what ASP.NET Core Minimal APIs emit
        **without hand-written code**. Adopting the framework's own error shape rather than inventing
        one keeps the error path out of hand-written code, for the same reason token validation is
        left to the stock bearer handler.

        ## Four extension members, and why RFC 9457 permits them

        `retCode` carries the legacy PowerFramework return code, `upstream` names which upstream a
        forwarded failure came from, `dbError` carries the database-layer detail **when, and only when,
        the failure originated in the data path**, and `traceId` carries the correlation identifier
        that locates the operator record for this occurrence. RFC 9457 explicitly permits extension
        members, which is why this schema - alone in this document apart from its own conflict
        specialization and the delegated `ProtoPayload` - sets `additionalProperties: true` rather than
        `false`. A consumer must ignore any member it does not recognise.

        `traceId` is declared rather than merely tolerated by that openness, and deliberately so: it is
        the only member through which a caller can reach anything this body withholds, so a caller needs
        a contractual basis for reading it. Its own description states the guarantee in full.

        **`dbError.sqlsyntax` is redacted**, and that is a contract commitment rather than an
        implementation detail: the legacy field carries the complete generated statement with
        interpolated literal values and the legacy logger performs no redaction at all. The `DbError`
        schema states the rule in full at the point of use.
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            A URI reference identifying the problem type. RFC 9457's own default of `about:blank` is
            used when no more specific type applies.
        title:
          type: string
          description: A short, human-readable summary of the problem type. Stable across occurrences.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code, repeated in the body so a logged body is self-describing.
        detail:
          type: string
          description: >-
            A human-readable explanation specific to this occurrence. **Never carries key material, a
            stack trace, a file path, a connection string, or an unredacted SQL statement.**
        instance:
          type: string
          format: uri-reference
          description: A URI reference identifying this specific occurrence.
        retCode:
          type: integer
          format: int64
          description: |-
            The legacy PowerFramework return code for this failure, transcribed from
            `ws_objects/pfw.shared.pbl.src/retcode.sru:L39-L79`. `Proto/common.v1.proto` is the numeric
            authority; `PowerFramework.Shared.Kernel.RetCode` is the same set in C#, and the sibling
            test project asserts the two agree numerically.

            **The tri-state algebra is preserved and matters when interpreting this field.**
            `IsSucceeded` tests `>= 0`, so `PREVENT` (1) reads as a SUCCESS; `IsFailed` tests `< 0`
            **with an explicit exclusion of `CANCELLED` (-2)**, so cancelled is **neither** succeeded
            nor failed. A consumer must not infer failure from a non-zero value.

            ## Why the enumeration carries 38 members while the oracle declares 41 constants

            The oracle declares **41** constants over **38 distinct values**, because three are aliases:
            `OK`, `SUCCESS` and `ALLOW` are three spellings of **0** [`:L39-L41`], and `CANCELED` and
            `CANCELLED` are two spellings of **-2** [`:L44-L45`]. A JSON Schema `enum` lists *values*,
            not spellings, so it necessarily carries 38. All five spellings remain valid names for their
            values, and `x-enum-varnames` gives one canonical name per value. **41 minus 3 aliases
            equals 38 is an audit**: if the member count is ever anything else, a value has been added,
            removed or duplicated.

            The set is **closed** because the oracle's catalogue is closed: `UNKNOWN` (-4000) exists
            precisely for the unclassifiable case, so no failure this ingress can produce needs a value
            outside it.
          enum:
            - 0        # OK / SUCCESS / ALLOW  [retcode.sru:L39-L41] - three spellings of one value
            - 1        # PREVENT               [:L42] - SATISFIES the success predicate
            - -1       # FAILED                [:L43]
            - -2       # CANCELED / CANCELLED  [:L44-L45] - neither succeeded nor failed
            # The contiguous, gap-free error block -3 .. -33 [:L46-L76]. The density is the oracle's.
            - -3       # E_INVALID_ARGUMENT    [:L46]
            - -4       # E_INVALID_IMAGE       [:L47]
            - -5       # E_INVALID_OBJECT      [:L48]
            - -6       # E_INVALID_TYPE        [:L49]
            - -7       # E_INVALID_TRANSACTION [:L50]
            - -8       # E_INVALID_SQL         [:L51]
            - -9       # E_INVALID_DATA        [:L52]
            - -10      # E_INVALID_DATAOBJECT  [:L53]
            - -11      # E_INVALID_HANDLE      [:L54]
            - -12      # E_OUT_OF_BOUND        [:L55]
            - -13      # E_OUT_OF_RANGE        [:L56]
            - -14      # E_OUT_OF_MEMORY       [:L57]
            - -15      # E_FILE_NOT_FOUND      [:L58]
            - -16      # E_OBJECT_NOT_FOUND    [:L59]
            - -17      # E_DATA_NOT_FOUND      [:L60]
            - -18      # E_FUNCTION_NOT_FOUND  [:L61]
            - -19      # E_EVENT_NOT_FOUND     [:L62]
            - -20      # E_MEMBER_NOT_FOUND    [:L63]
            - -21      # E_VAR_NOT_FOUND       [:L64]
            - -22      # E_NOT_EXISTS          [:L65]
            - -23      # E_BUSY                [:L66]
            - -24      # E_TIME_OUT            [:L67]
            - -25      # E_ACCESS_DENIED       [:L68]
            - -26      # E_WIN32_ERROR         [:L69]
            - -27      # E_INTERNAL_ERROR      [:L70]
            - -28      # E_DB_ERROR            [:L71]
            - -29      # E_HTTP_ERROR          [:L72]
            - -30      # E_WINHTTP_ERROR       [:L73]
            - -31      # E_IO_ERROR            [:L74]
            - -32      # E_SQL_BIND_ARG_FAILED [:L75]
            - -33      # E_RETRY               [:L76]
            # The three sentinels, deliberately distant from the contiguous block.
            - -2000    # E_NO_SUPPORT          [:L77]
            - -2001    # E_NO_IMPLEMENTATION   [:L78] - the four reserved routes' own code
            - -4000    # UNKNOWN               [:L79]
          x-enum-varnames:
            - OK
            - PREVENT
            - FAILED
            - CANCELLED
            - E_INVALID_ARGUMENT
            - E_INVALID_IMAGE
            - E_INVALID_OBJECT
            - E_INVALID_TYPE
            - E_INVALID_TRANSACTION
            - E_INVALID_SQL
            - E_INVALID_DATA
            - E_INVALID_DATAOBJECT
            - E_INVALID_HANDLE
            - E_OUT_OF_BOUND
            - E_OUT_OF_RANGE
            - E_OUT_OF_MEMORY
            - E_FILE_NOT_FOUND
            - E_OBJECT_NOT_FOUND
            - E_DATA_NOT_FOUND
            - E_FUNCTION_NOT_FOUND
            - E_EVENT_NOT_FOUND
            - E_MEMBER_NOT_FOUND
            - E_VAR_NOT_FOUND
            - E_NOT_EXISTS
            - E_BUSY
            - E_TIME_OUT
            - E_ACCESS_DENIED
            - E_WIN32_ERROR
            - E_INTERNAL_ERROR
            - E_DB_ERROR
            - E_HTTP_ERROR
            - E_WINHTTP_ERROR
            - E_IO_ERROR
            - E_SQL_BIND_ARG_FAILED
            - E_RETRY
            - E_NO_SUPPORT
            - E_NO_IMPLEMENTATION
            - UNKNOWN
        dbError:
          $ref: '#/components/schemas/DbError'
        upstream:
          type: string
          enum: [persistence, dataservices, security]
          x-enum-varnames: [Persistence, DataServices, Security]
          description: >-
            Which upstream service the failure originated from, when it originated from one. Present
            on `502` and on any status the projection forwarded, so an operator can attribute the
            failure without correlating logs. Absent when Gateway itself produced the response.
        traceId:
          type: string
          description: |-
            The correlation identifier for this occurrence: the **one thing a caller is given with
            which to obtain the detail this body deliberately withholds**.

            It is the ambient distributed-trace identifier when the request carried one - in which case
            it is the `traceparent` `trace-id` in its `W3C` hexadecimal form and correlates this
            occurrence with every other service's record of the same operation - and Gateway's own
            per-request identifier otherwise.

            ## Why this member is load-bearing rather than decorative

            `detail` is fixed prose on a `500` and names nothing about the fault, by design: no stack
            trace, no exception message, no host, no port, no path and no key material reaches a
            caller. That redaction is only defensible because it is a REDIRECTION - the full diagnostic
            exists on the operator channel and this identifier is what locates it. So the value here is
            **the same value** that appears in the operator record for the same occurrence, resolved
            once before either is written; a caller quoting it to an operator will always find a record.

            Present on every problem-details response Gateway produces itself. It can be absent only if
            the host supplies no request identifier at all, which is a configuration this service does
            not ship.

    ConflictProblemDetails:
      title: ConflictProblemDetails
      description: |-
        The `409` body: a problem-details object carrying the optimistic-concurrency conflict detail.

        The detail is forwarded **unchanged** from C-06 rather than reshaped, because a caller
        deciding between retrying and surfacing needs the current row state exactly as the database
        reported it.

        **The `conflict` member is the field-for-field mirror of `common.v1.ConflictDetail`, not a
        delegated placeholder.** That is the one payload in this document a consumer must be able to
        read in order to *act* - a caller that cannot see which column moved cannot construct a retry,
        and would re-send the same stale original values and receive the same `409` for ever. So it is
        transcribed here rather than deferred to the protocol definition.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [conflict]
          properties:
            conflict:
              $ref: '#/components/schemas/ConflictDetail'

    ProtoPayload:
      type: object
      title: ProtoPayload
      description: |-
        A payload whose shape is defined by the protobuf message named in the enclosing operation's
        `x-proto-request` or `x-proto-response` extension, encoded in the **canonical protobuf JSON
        mapping**.

        **This is a deliberate delegation, not an unspecified body.** The messages live in
        `Proto/dataservices.v1.proto` and `Proto/common.v1.proto` in this same project, and they are
        the single authority for the shapes. Transcribing well over a hundred of them into JSON Schema
        here would create a second source of truth in a different language with nothing keeping the
        two in step - and the first divergence would be silent, because nothing compiles this document
        against those definitions.

        The `x-proto-*` extensions are the alternative, and they are **checkable**: the sibling test
        project asserts that every one of them resolves to a real generated type. A schema copy would
        have been longer, less precise, and unverifiable.

        `additionalProperties: true` because the authority is elsewhere; a consumer validates against
        the generated message type, not against this placeholder.
      additionalProperties: true

    # ==============================================================================================
    #  TIER 1 - THE MIRRORED PROTOBUF SHAPES
    #  --------------------------------------------------------------------------------------------
    #  Every schema in this section is transcribed FIELD FOR FIELD AND VALUE FOR VALUE from
    #  Proto/common.v1.proto or Proto/dataservices.v1.proto in this same project. They are mirrored
    #  rather than delegated because each one carries a DECISION a consumer has to act on: a conflict
    #  it must retry or surface, an error field it must not expect to be unredacted, a chunk boundary
    #  it must not flatten, an expansion mode it must not confuse with a literal.
    #
    #  THE .proto REMAINS THE AUTHORITY. Where a member here and its protobuf counterpart ever
    #  disagree, the .proto is right and this document has drifted. The agreement has no compile-time
    #  edge and cannot be given one - nothing compiles a YAML file against a .proto - so it is a review
    #  obligation on every change to either side, and the sibling test project asserts the parts it can
    #  reach from generated code.
    #
    #  MEMBER NAMES ARE THE CANONICAL PROTOBUF JSON MAPPING, i.e. lowerCamelCase of the proto field
    #  name. `column_name` is `columnName`, `item_status` is `itemStatus`, `datetime_value` is
    #  `datetimeValue`. That is what the mapping emits, so it is what a consumer sees.
    #
    #  ENUM MEMBERS ARE THE PROTO ENUMERATOR NAMES, not their numbers, because that is what the
    #  canonical mapping emits. Identifier spellings are preserved verbatim for the same reason the
    #  SCREAMING_SNAKE constants are: they appear in serialized payloads, log records and
    #  characterization recordings, where a rename does not restyle a symbol - it silently invalidates
    #  every stored comparison that mentions it.
    #
    #  EACH ENUMERATOR'S NUMBER TRAVELS WITH IT, in `x-enum-values`, positionally aligned with `enum`
    #  and `x-enum-varnames`. The numbers matter even though the wire carries names: they are what the
    #  .proto declares, what a numeric bridge to a legacy ordinal casts to, and what a characterization
    #  recording holds - so value-for-value agreement has to be checkable from this document alone
    #  rather than only from a markdown table a machine cannot read. `x-enum-varnames` is the
    #  established generator convention; `x-enum-values` is this document's own extension, declared here
    #  once so it is not mistaken for one. Every set also states its numbers in prose, for a reader.
    #
    #  ONE SCHEMA HERE IS PUBLISHED WITHOUT BEING `$ref`-ED, AND THAT IS DELIBERATE RATHER THAN DEAD
    #  WEIGHT. `ExpressionBinding` is the shape carried by the `bindings` member of C-04's
    #  `GetExpressionStateResponse`, which is a Tier-2 delegated envelope - so no `$ref` in this document
    #  reaches it, and a style linter will report it as unused. It is published anyway because it is the
    #  ONE contract detail the requirements single out as not surviving naive serialization: the static
    #  versus dynamic expansion distinction. A consumer that could not see the three-part payload and the
    #  per-reference mode would send an already-expanded string and destroy the distinction silently,
    #  which is exactly the failure the schema exists to prevent. The alternative - mirroring the whole
    #  `GetExpressionStateResponse` cascade, seven structures deep - would have pulled most of the
    #  expression engine's internal model into an ingress contract to satisfy a linter rule. Publishing
    #  the one decision-carrying shape and saying why is the better trade, and saying why is the part
    #  that makes it reviewable rather than an oversight. It is also mechanically verifiable: the name
    #  matches a real protobuf message, and the field-for-field cross-check covers it like every other.
    #
    #  64-BIT INTEGERS ARE `[integer, string]`, AND THAT IS FIDELITY RATHER THAN LOOSENESS. The
    #  canonical protobuf JSON mapping EMITS int64, uint64 and fixed64 as JSON strings, to survive
    #  consumers whose number type is a double, and ACCEPTS either form on input. A schema declaring
    #  `integer` alone would reject the encoding the upstream actually produces. Expressed as a JSON
    #  Schema type array, which OpenAPI 3.1 supports natively - there is no `nullable` keyword and no
    #  3.0-only construct anywhere in this document. 32-bit fields are plain integers, because the
    #  mapping emits them as JSON numbers.
    #
    #  AND THE SIGNEDNESS TRAVELS WITH THEM: `format` IS `int64` FOR A SIGNED FIELD AND `uint64` FOR AN
    #  UNSIGNED ONE. The two are not interchangeable and the difference is not cosmetic. A `uint64`
    #  declared `int64` produces a signed 64-bit generated model, and every value above
    #  `Int64.MaxValue` - half the legacy `unsignedlong` domain - is then rejected by validation or
    #  wrapped to a negative number, silently. Both formats are in the OpenAPI Formats Registry, so
    #  naming the right one costs nothing; `AnyValue.uint64Value` additionally states `minimum` and
    #  `maximum` so the domain is machine-checkable rather than inferred from a format name.
    # ==============================================================================================

    DwBuffer:
      title: DwBuffer
      description: |-
        The PowerBuilder `dwbuffer` domain, mirrored from `common.v1.DwBuffer`.

        | Member | Number | Legacy buffer |
        | --- | --- | --- |
        | `DW_BUFFER_PRIMARY` | 0 | `Primary!` - the live rows |
        | `DW_BUFFER_DELETE` | 1 | `Delete!` - rows deleted but not yet flushed |
        | `DW_BUFFER_FILTER` | 2 | `Filter!` - filtered-out rows |

        **`Primary!` occupies zero on its own account.** PowerBuilder initialises an unassigned
        `dwbuffer` to `Primary!`, so in the legacy "no buffer was supplied" and "the default buffer" are
        one state rather than two - which is why the framework can synthesize an error with `Primary!`
        and row 0 to mean "not attributable to any buffer or row". There is no synthetic unspecified
        member, and inserting one would shift all three real members up by one and silently invalidate
        every stored characterization comparison that mentions a buffer ordinal.

        **`Filter!` row order is INVERTED relative to the source.** That is the legacy's own behaviour
        and it is preserved: a consumer that re-sorted it would produce wrong data that a row-count
        assertion would not catch.
      type: string
      enum: [DW_BUFFER_PRIMARY, DW_BUFFER_DELETE, DW_BUFFER_FILTER]
      x-enum-varnames: [DW_BUFFER_PRIMARY, DW_BUFFER_DELETE, DW_BUFFER_FILTER]
      x-enum-values: [0, 1, 2]

    ItemStatus:
      title: ItemStatus
      description: |-
        The PowerBuilder `dwItemStatus` domain in full, mirrored from `common.v1.ItemStatus`.

        | Member | Number | Legacy status |
        | --- | --- | --- |
        | `ITEM_STATUS_NOT_MODIFIED` | 0 | `NotModified!` - existing row, unchanged |
        | `ITEM_STATUS_DATA_MODIFIED` | 1 | `DataModified!` - existing row, edited |
        | `ITEM_STATUS_NEW` | 2 | `New!` - inserted, not yet edited |
        | `ITEM_STATUS_NEW_MODIFIED` | 3 | `NewModified!` - inserted and edited |

        **All four are carried, including `New!`, which no in-scope legacy source names literally.** It
        is a legal runtime status - the DataWindow engine assigns it to a row inserted but not yet
        edited - so omitting it would make real rows unrepresentable on the wire and force a service to
        invent a substitute or drop the row. Carrying it is faithfulness to the legacy type, not an
        added capability: nothing accompanies it but the ability to say it.
      type: string
      enum:
        - ITEM_STATUS_NOT_MODIFIED
        - ITEM_STATUS_DATA_MODIFIED
        - ITEM_STATUS_NEW
        - ITEM_STATUS_NEW_MODIFIED
      x-enum-varnames:
        - ITEM_STATUS_NOT_MODIFIED
        - ITEM_STATUS_DATA_MODIFIED
        - ITEM_STATUS_NEW
        - ITEM_STATUS_NEW_MODIFIED
      x-enum-values: [0, 1, 2, 3]

    DecimalValue:
      type: object
      title: DecimalValue
      description: >-
        A legacy `dec` / `decimal(n)`, mirrored from `common.v1.DecimalValue`. **A decimal string, never
        a JSON number**: the legacy type is exact and a double is not, so routing a salary or a price
        through a binary floating-point type would change the value the database compared against. The
        one updatable DataWindow in the legacy estate declares a two-place decimal salary column, which
        is exactly the case this exists for.
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          description: The decimal in its exact textual form.

    DateValue:
      type: object
      title: DateValue
      description: >-
        A legacy `date`, mirrored from `common.v1.DateValue`. A date-only value with no time component
        and no zone, carried as text so no zone is implied where the legacy implies none.
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          description: The date in its textual form.

    TimeValue:
      type: object
      title: TimeValue
      description: >-
        A legacy `time`, mirrored from `common.v1.TimeValue`. A time-of-day with no date and no zone.
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          description: The time in its textual form.

    DateTimeValue:
      type: object
      title: DateTimeValue
      description: >-
        A legacy `datetime`, mirrored from `common.v1.DateTimeValue`. Carried as text rather than as an
        instant because the legacy type carries no zone: converting it to one would invent information
        the source does not have, and converting it back would not necessarily return the same value.
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          description: The timestamp in its textual form.

    AnyValue:
      type: object
      title: AnyValue
      description: |-
        A single legacy column or variable value, mirrored from `common.v1.AnyValue`.

        **Exactly one member is present**, which is how the canonical protobuf JSON mapping encodes a
        `oneof` - hence `minProperties: 1` and `maxProperties: 1`. A payload carrying two members, or
        none, is not a valid `AnyValue`.

        The eleven arms are the legacy scalar domain, and three of the distinctions are load-bearing:

        * `isNull` is an **arm of its own**, not the absence of a value. The legacy has null for value
          types and the tri-state return algebra depends on it; collapsing null to zero would turn
          "no value" into "the value zero".
        * `decimalValue` is **not** `doubleValue`. A legacy `dec` is exact; a double is not.
        * `int64Value` carries the legacy `long` **and** `integer`, deliberately widened, because a
          narrower wire type would truncate silently rather than fail.
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        isNull:
          type: boolean
          description: >-
            Present and true when the value is null. An arm rather than an absence, so a consumer can
            tell "null" from "not supplied".
        boolValue:
          type: boolean
          description: A legacy `boolean`.
        int64Value:
          type: [integer, string]
          format: int64
          description: A legacy `long` or `integer`, widened. Emitted as a string by the canonical mapping.
        uint64Value:
          type: [integer, string]
          format: uint64
          minimum: 0
          maximum: 18446744073709551615
          description: >-
            A legacy `unsignedlong`. Emitted as a string by the canonical mapping.

            THE FORMAT IS `uint64` AND NOT `int64`, WHICH IS A CORRECTION RATHER THAN A DETAIL. The
            protobuf field is `uint64`, whose domain runs to 18446744073709551615 - more than twice
            `Int64.MaxValue`. Declared `int64` a generator emits a signed 64-bit model for it, and every
            value in the upper half of the legacy domain is then either rejected by validation or
            wrapped to a negative number, silently, on a member whose whole purpose is to carry a value
            the sender could not express as signed. `minimum` and `maximum` are stated so the domain is
            machine-checkable rather than implied by the format name alone.
        doubleValue:
          type: number
          format: double
          description: A legacy `double` or `real` - genuinely floating point at source.
        decimalValue:
          $ref: '#/components/schemas/DecimalValue'
        dateValue:
          $ref: '#/components/schemas/DateValue'
        timeValue:
          $ref: '#/components/schemas/TimeValue'
        datetimeValue:
          $ref: '#/components/schemas/DateTimeValue'
        stringValue:
          type: string
          description: A legacy `string`.
        blobValue:
          type: string
          format: byte
          description: >-
            A legacy `blob`, base64-encoded as the canonical protobuf JSON mapping requires for a
            `bytes` field.

    ColumnValue:
      type: object
      title: ColumnValue
      description: |-
        One column's value, mirrored from `common.v1.ColumnValue`.

        **The row-status convention is the surprising part, and it is preserved.** The legacy reads a
        ROW's status by asking for column index **0**, which is not a real column - it means "the row
        itself". The same object also reads a genuine per-column status with a real index, so both
        readings coexist and the distinction is carried entirely by whether the identifier is zero. A
        consumer must therefore read `columnId: 0` paired with an `itemStatus` as the row's own status,
        not as column zero's.
      additionalProperties: false
      required: [columnName, columnId, value]
      properties:
        columnName:
          type: string
          description: The column's name as the DataWindow declares it.
        columnId:
          type: [integer, string]
          format: int64
          description: >-
            The column's one-based identifier, or **0** to denote the row itself - see the row-status
            convention above.
        value:
          $ref: '#/components/schemas/AnyValue'
        itemStatus:
          $ref: '#/components/schemas/ItemStatus'

    DbError:
      type: object
      title: DbError
      description: |-
        A database-layer failure, mirrored from `common.v1.DbError`, which mirrors the legacy
        `dberrordata` structure field for field.

        ## `sqlsyntax` IS REDACTED, AND THAT IS A CONTRACT COMMITMENT (C-G)

        The legacy field carries the **complete generated statement including interpolated literal
        values**, and the legacy logger performs **no** redaction at all. The literals are real user
        data rather than placeholders, because a `DisableBind=1` connection means the runtime does not
        use bind variables: it interpolates. Forwarding that field verbatim through an ingress would
        publish row data to whoever reads an error response.

        This member therefore carries **placeholders only**, and an empty value is valid and common. The
        commitment is published here rather than left to the implementation so that a consumer does not
        build a diagnostic flow on data that will never arrive.

        ## `sqldbcode` is NOT a `retCode`

        It is the driver's own numeric code, and three different code spaces reach it depending on
        provider. It is a plain integer here for exactly that reason, and a consumer must not interpret
        it with the `retCode` vocabulary.
      additionalProperties: false
      required: [sqldbcode, sqlerrtext, sqlsyntax, buffer, row]
      properties:
        sqldbcode:
          type: [integer, string]
          format: int64
          description: >-
            The driver's own numeric code, in the provider's code space rather than the framework's. Not
            a `retCode`.
        sqlerrtext:
          type: string
          description: >-
            The driver's message text, verbatim. **May be non-English** - the framework synthesizes
            Chinese diagnostics for some conditions it detects itself. Opaque display text: a consumer
            must classify with `sqldbcode` rather than by parsing this.
        sqlsyntax:
          type: string
          description: >-
            The statement text, **redacted**. Placeholders only, never interpolated literals; empty is
            valid and common. See the redaction rule above - this is the one member of this shape whose
            legacy content could not be forwarded as it stands.
        buffer:
          $ref: '#/components/schemas/DwBuffer'
        row:
          type: [integer, string]
          format: int64
          description: >-
            The offending row number, **one-based** like every legacy row ordinal. **0** means "no
            particular row", which is what the framework reports for a connection- or statement-level
            failure not attributable to one row.

    ConflictRow:
      type: object
      title: ConflictRow
      description: |-
        One row that lost an optimistic-concurrency check, mirrored from `common.v1.ConflictRow`.

        **Both value sets travel, and that is a requirement rather than a preference.** The one
        updatable DataWindow in the legacy estate declares `updatewhere=1` and marks **all six** of its
        columns `updatewhereclause=yes`. `updatewhere=1` is the "key and updateable columns" concurrency
        mode, so the generated `WHERE` clause carries the key column **plus the original value of every
        updateable column**. A payload carrying only current values could not express what the failed
        statement actually compared, and the caller could not tell which column moved underneath it.
      additionalProperties: false
      required: [buffer, row, itemStatus, currentValues, originalValues]
      properties:
        buffer:
          $ref: '#/components/schemas/DwBuffer'
        row:
          type: [integer, string]
          format: int64
          description: The one-based row ordinal within the buffer.
        itemStatus:
          $ref: '#/components/schemas/ItemStatus'
        currentValues:
          type: array
          description: The row's values as they stand now, per column.
          items:
            $ref: '#/components/schemas/ColumnValue'
        originalValues:
          type: array
          description: >-
            The values the failed statement's `WHERE` clause compared against, per column. This is the
            set that lets a caller identify which column moved.
          items:
            $ref: '#/components/schemas/ColumnValue'

    ConflictDetail:
      type: object
      title: ConflictDetail
      description: |-
        The optimistic-concurrency mismatch payload, mirrored from `common.v1.ConflictDetail`.

        It originates on C-06's `Update` as the detail of a gRPC **`Aborted`** status, is relayed by
        C-03's `Update`, and **this projection surfaces the same payload unchanged as HTTP `409`.** It
        is forwarded rather than reshaped because a caller deciding between retrying and surfacing needs
        the current row state exactly as the database reported it.

        **`Aborted`, not `FailedPrecondition`, and the distinction is deliberate:** the operation MAY
        succeed if the caller re-reads and retries at a higher level, which is what `Aborted` means and
        what `FailedPrecondition` does not. `Aborted` is also the canonical gRPC mapping to HTTP 409.

        **There is no silent overwrite anywhere in the system.** This shape exists so a mismatch is
        always reported rather than resolved by guessing. The caller implements an explicit
        **retry-or-surface** policy; there is no last-writer-wins path and no member here that would
        enable one.
      additionalProperties: false
      required: [rows, updateTable, rowsExpected, rowsMatched]
      properties:
        rows:
          type: array
          description: >-
            The conflicting rows, each with both value sets. More than one row can conflict in a single
            update, so this is a collection rather than a single row.
          items:
            $ref: '#/components/schemas/ConflictRow'
        updateTable:
          type: string
          description: >-
            The table the update targeted. Present because multi-table update from one DataWindow is a
            real legacy capability, so "which table" is a genuine question.
        rowsExpected:
          type: [integer, string]
          format: int64
          description: How many rows the statement expected to affect.
        rowsMatched:
          type: [integer, string]
          format: int64
          description: >-
            How many it actually matched. The gap between this and `rowsExpected` is the mismatch, and
            reporting both lets a caller see the size of it rather than only its existence.

    DataWindowRow:
      type: object
      title: DataWindowRow
      description: |-
        One retrieved row, mirrored from `dataservices.v1.DataWindowRow`.

        It carries **both** its current and its original column values for the reason `ConflictRow`
        states: the update half's concurrency check compares originals, so a retrieval that discarded
        them would leave a caller unable to construct an update at all.
      additionalProperties: false
      required: [buffer, row, itemStatus, columns, originalValues]
      properties:
        buffer:
          $ref: '#/components/schemas/DwBuffer'
        row:
          type: [integer, string]
          format: int64
          description: The one-based row ordinal within its buffer.
        itemStatus:
          $ref: '#/components/schemas/ItemStatus'
        columns:
          type: array
          description: The row's current values, per column.
          items:
            $ref: '#/components/schemas/ColumnValue'
        originalValues:
          type: array
          description: >-
            The row's original values, per column - what a subsequent update's `WHERE` clause will
            compare against.
          items:
            $ref: '#/components/schemas/ColumnValue'

    RetrieveChunk:
      type: object
      title: RetrieveChunk
      description: |-
        One chunk of a retrieval, mirrored from `dataservices.v1.RetrieveChunk`.

        **This is the chunking contract, and this projection does not change it.** Each chunk retains
        its own index, its own row count, the running cumulative count and the final-chunk flag, exactly
        as the gRPC server stream carries them. A consumer of the REST projection can therefore
        reconstruct precisely what a gRPC consumer sees, and can identify the last chunk **as** the last
        rather than inferring it from the collection ending.
      additionalProperties: false
      required: [rows, rowCount, chunkIndex, final, cumulativeRowCount]
      properties:
        rows:
          type: array
          description: The rows in this chunk.
          items:
            $ref: '#/components/schemas/DataWindowRow'
        rowCount:
          type: [integer, string]
          format: int64
          description: How many rows this chunk carries.
        chunkIndex:
          type: [integer, string]
          format: int64
          description: >-
            This chunk's position in the sequence. Retained so a consumer can detect a gap rather than
            assume there was none.
        final:
          type: boolean
          description: >-
            True on the last chunk. Explicit rather than inferred: a collection ending and a retrieval
            completing are different facts, and only the flag distinguishes a complete retrieval from a
            truncated one.
        cumulativeRowCount:
          type: [integer, string]
          format: int64
          description: The running total across this chunk and every chunk before it.
        buffer:
          $ref: '#/components/schemas/DwBuffer'
        error:
          $ref: '#/components/schemas/DbError'

    RetrieveResult:
      title: RetrieveResult
      description: |-
        The projection of C-03's `Retrieve` server stream: **the ordered sequence of chunks the stream
        would have delivered**, in the order it would have delivered them.

        A collection rather than an invented envelope, deliberately - the protobuf definition has no
        envelope message for a stream, so wrapping one here would add a member the gRPC contract does
        not have and the two halves of the boundary would stop corresponding. Element order is the
        stream's order and is significant; the last element carries `final: true`.

        An empty collection is valid and means the retrieval produced no chunk at all.
      type: array
      items:
        $ref: '#/components/schemas/RetrieveChunk'

    EventGate:
      type: object
      title: EventGate
      description: |-
        The DataWindow event gate, mirrored from `dataservices.v1.EventGate`.

        The mask is composed from the legacy bit identifiers, whose spellings and values are preserved
        verbatim:

        | Bit | Value | Legacy event |
        | --- | --- | --- |
        | `EID_ROWFOCUSCHANGE` | **1** | row-focus change |
        | `EID_ITEMFOCUSCHANGE` | **2** | item-focus change |
        | `EID_ITEMCHANGE` | **4** | item change |

        ## The one non-obvious coupling, preserved rather than fixed (C-B)

        **Disabling `EID_ITEMCHANGE` also suppresses column-expression evaluation.** That is not a
        separate switch a caller can hold differently: the legacy couples the two, and the coupling is
        reproduced. A caller disabling item-change to stop validation firing will also stop expressions
        recalculating, and it needs to know that before it does so rather than after.

        It is legacy behaviour to preserve, not a bug to fix. Splitting the two would be a behaviour
        improvement, which the mandate forbids exactly as firmly as it forbids a regression.
      additionalProperties: false
      required: [mask]
      properties:
        mask:
          type: [integer, string]
          format: int64
          description: >-
            The composed mask of currently DISABLED events. Zero means every event is enabled. The mask
            is a sum of the three bit values above.

    DataWindowEventBit:
      title: DataWindowEventBit
      description: >-
        One event-gate bit, mirrored from `dataservices.v1.EventGate.Bit`. The spellings are the legacy
        `EID_*` identifiers, preserved verbatim because they appear in serialized payloads, log records
        and characterization recordings. `EID_UNSPECIFIED` is the protobuf zero enumerator and carries no
        event; the three real bits are 1, 2 and 4, and their composition rule and the item-change
        coupling are stated on `EventGate`.
      type: string
      enum: [EID_UNSPECIFIED, EID_ROWFOCUSCHANGE, EID_ITEMFOCUSCHANGE, EID_ITEMCHANGE]
      x-enum-varnames: [EID_UNSPECIFIED, EID_ROWFOCUSCHANGE, EID_ITEMFOCUSCHANGE, EID_ITEMCHANGE]
      x-enum-values: [0, 1, 2, 4]

    RetCodeValue:
      title: RetCodeValue
      description: |-
        The legacy return code **as a mirrored protobuf enum**, from `common.v1.RetCode.Value`.

        ## This is the same algebra as `ProblemDetails.retCode`, in the other of its two encodings

        `ProblemDetails.retCode` is an integer, because it is Gateway's own RFC 9457 extension member on
        a body Gateway itself serializes. This schema is the **canonical protobuf JSON** encoding of the
        same value set, used where a mirrored upstream message carries the code - the mapping emits an
        enum's NAME, not its number. The two are the same 38 values either way, and a consumer must not
        treat them as two vocabularies.

        ## All 41 enumerator names are accepted; a writer emits the first of each alias group

        The oracle declares **41** constants over **38** distinct values, and the protobuf definition
        preserves every spelling with `allow_alias`. The canonical mapping therefore *accepts* any of the
        41 names on input while *emitting* the first-declared name for each value - `OK` for 0 and
        `CANCELED` for -2. Both alias groups are listed so a consumer that reads either spelling
        validates, and `x-enum-values` records the number each name carries so the value-for-value
        agreement stays checkable.

        ## Two properties to expect rather than repair (C-B)

        `PREVENT` is 1 and satisfies the legacy success predicate, so **a prevention reads as a
        success**; `CANCELED` is -2 and is excluded from failure by an explicit guard while also failing
        the success test, so **cancelled is neither succeeded nor failed**. Branch on the specific value,
        never on a two-way success test.
