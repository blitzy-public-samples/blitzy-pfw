components:

  securitySchemes:
    # Presenting no token, or an invalid one, yields `401` on every operation this scheme guards -
    # produced here, before any route handler runs. See `x-cross-cutting-responses` at document level
    # for the machine-readable form and for why the reserved families do not enumerate it.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        A JSON Web Token **issued by the Security service**, presented in the `Authorization` header.

        ## Gateway validates. It does not issue, and it holds no signing key

        Security is the **sole minter** in the system. Gateway holds **verification material only** -
        no signing key, no minting capability and no independent signing authority - and so do
        DataServices and Persistence. That is a structural property of the sole-issuer topology rather
        than a configuration choice: the security properties depend on there being exactly one issuer.

        **This document names no key, no key material and no key-holding setting**, deliberately and
        not merely as an omission. Gateway has nothing of the kind to configure, so naming one here
        would describe a capability this service does not have and must never acquire. Where the
        system's single signing secret is configured, and by which service, is
        `docs/SECRETS.md` §4's subject - one place, on the service that holds it.

        ## Where the verification material comes from

        Both publications are on **Security's own listener, port 5104**, and both are anonymous,
        because verification material is **public by design** - that is precisely what distinguishes it
        from a signing key:

        * `GET /.well-known/jwks.json` - the current key set, public parameters only. This is the
          material a signature is checked against.
        * `GET /.well-known/openid-configuration` - the discovery document, which points at the key set
          above so a consumer never has to fetch a key itself.

        Gateway does **not** republish either document. A consumer of *this* API presents a token and
        never needs the key set; a service verifying one fetches it from Security directly.

        ## Verification is framework code, not hand-written code

        Gateway validates with the **stock `Microsoft.AspNetCore.Authentication.JwtBearer` handler**,
        pointed at the discovery document above. The handler performs signature checking, key fetching
        and rollover, issuer and audience validation and clock-skew tolerance by itself.

        That is the point rather than an implementation note: it keeps the security-critical path
        inside framework code, on three services rather than one. It is also the specific reason
        Security's contract is REST - gRPC would have forced a bespoke key-set retrieval implementation
        into each of those three services, which is a net *increase* in hand-written security code.

        ## Scope

        Every operation in this document requires this scheme except `GET /health`, which declares
        itself anonymous. **No signing, verification or mutual-TLS material is scaffolded for any
        deferred service**, and no per-deferred-service key name appears anywhere in this document -
        those services do not exist in this phase, so material for them would secure nothing.

        ### An empty scope array here does NOT mean "no scope required"

        This scheme is applied as `bearerAuth: []` throughout, and that empty array carries **no
        information about scope**: OpenAPI defines the security-requirement array as a scope list for
        `oauth2` and `openIdConnect` schemes only, so for an `http`/`bearer` scheme an empty array is
        the sole meaningful value. Reading it as "this operation requires no scope" is the mistake an
        empty array invites, and it has a concrete cost: an operator provisioning an external
        caller grants a placeholder scope, issuance succeeds, and **every** request the caller makes is
        then refused `403`.

        Gateway does enforce a per-route scope, and the `403` response declared on thirty-nine
        operations is exactly that refusal - a valid token that does not carry the required scope,
        deliberately distinguished from `401`.

        ### `x-required-scope` - the requirement, stated machine-readably

        Every operation in this document carries an `x-required-scope` extension. Its value is one of
        four, and the closed set is the point: a reader never has to infer a requirement from silence.

        | `x-required-scope` | Operations | Surface |
        | --- | --- | --- |
        | `ping` | 1 | `GET /v1/ping` |
        | `capabilities` | 1 | `GET /v1/capabilities` |
        | `datawindow` | 39 | `/v1/datawindow/**` |
        | `none` | 9 | `GET /health` (anonymous) and the eight reserved-family operations |

        `none` means **no scope requirement**, not a scope literally named `none` - no such scope exists
        anywhere in the system. On `GET /health` it means anonymous. On the eight reserved
        `/v1/{design,documents,integration,scripting}` operations it means *authenticated principal
        only*: requiring a capability scope for a route that reaches no capability would invent an
        entitlement for a service this phase must not implement, and the issuance roster grants no such
        scope to anyone, so every caller would receive `403` and the reserved answer - the whole reason
        those routes exist - would be unreachable.

        The three real names are declared by the routes that require them and are read from those
        constants by the composition root, so a route and its requirement keep one spelling. A caller
        provisioning an identity for this ingress needs the scopes for the surfaces it actually calls;
        the worked example, exercised by a live end-to-end suite, is caller `pfw-e2e-suite` with
        audience `powerframework-gateway` and all three scopes, published identically in
        `services/security-service/PowerFramework.Security/appsettings.Development.json`,
        `orchestration/.env.example` and `orchestration/docker-compose.yml`.

        A requested scope the grant omits is **not** an issuance error - the granted set is the overlap
        and a narrowing is a success - so a shortfall is silent at issuance and surfaces only here.

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: >-
        The correlation identifier returned when the session was opened. It is the handle for the
        server-held state that a stateless boundary cannot carry per request.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    SessionIdQuery:
      name: sessionId
      in: query
      required: true
      description: The correlation identifier of the session to read.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    ReservedPath:
      name: path
      in: path
      required: true
      description: |-
        The remainder of the requested path. Present so that each reserved entry is a route FAMILY
        rather than a single route, which is what makes the eventual URL shape of the deferred service
        legible from this contract. Its value is echoed in the `route` field of the 501 body and is
        otherwise unused, because nothing exists behind the route to use it.

        **This parameter's real matching behaviour cannot be expressed in OpenAPI 3.1, and the gap is
        declared rather than papered over.** The server implements each family as an ASP.NET Core
        catch-all route parameter - each operation publishes its own literal template in its
        `x-route-template` extension - which does three things a conformant OpenAPI
        path template does not describe: the captured value MAY ITSELF CONTAIN `/`, so a nested path
        such as `/v1/design/a/b/c` resolves here rather than falling through to a generic 404; the
        remainder may be EMPTY, so the bare prefix `/v1/design` also resolves here; and every HTTP
        method answers identically, not only the two enumerated below.

        `allowReserved: true` on this parameter is the tempting way to say it, and it is INVALID:
        OpenAPI 3.1 defines `allowReserved` for `in: query` parameters only, so the field makes the
        document fail validation while still not expressing catch-all semantics - a path parameter
        is defined to match a single segment whatever `allowReserved` says. The behaviour is therefore
        stated in `x-catch-all` below, which a tool can read and which
        makes no false claim about the standard template. A consumer generating a client from this
        document should treat the parameter as an opaque remainder and NOT URL-encode its separators.
      schema:
        type: string
      x-catch-all:
        capturesNestedSegments: true
        matchesEmptyRemainder: true
        matchesEveryHttpMethod: true
        note: >-
          A vendor extension because OpenAPI 3.1 has no conformant way to declare a multi-segment path
          parameter. It is metadata about how the URL is templated and about nothing else - it is not a
          request schema, and no reserved operation declares one. All three statements above hold for
          every reserved family, which is what makes this parameter shareable across the four path items.
          A FOURTH MEMBER, `routeTemplate`, USED TO STAND HERE AND WAS THE ONLY UNTRUE STATEMENT IN THE
          BLOCK: it read `/v1/{area}/{**path}`, a template that exists nowhere, because the four families
          are literal prefixes and no `area` route parameter has ever been declared - so a tool reading
          the field as what it is presented as would model a bindable parameter the server does not have.
          The template is per-family and now lives on each operation as `x-route-template`.

  responses:
    BadRequest:
      description: >-
        The projected gRPC method returned `InvalidArgument`, or the request failed Gateway's own
        binding. `retCode` carries the **originating legacy return code** so the specific legacy
        validation is identifiable rather than merely the HTTP class - `E_INVALID_ARGUMENT` (-3) for
        an argument outside its accepted domain, and the expression engine's own codes for a parse
        failure, which also carries the expression text and the caret position.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    SessionIdConstraint:
      description: >-
        The `sessionId` does not satisfy the parameter contract this operation publishes: it was
        omitted, it is empty, or it is longer than 128 characters. Declared SEPARATELY from
        `BadRequest` because the three operations that carry it take **no request body at all**, so
        the shared wording - which is about a body Gateway could not bind - would describe something
        that cannot happen on them.


        All three conditions are answered identically, with `retCode` carrying `E_INVALID_ARGUMENT`
        (-3), and the value is never echoed back. An omitted parameter and an empty one are two
        spellings of one mistake and must not be distinguishable. Answering the first as `500` with
        `UNKNOWN` is what happens if the omission is left to parameter binding and the carried status is
        discarded - the caller is told this service failed for a request only the caller can correct.


        Whitespace is neither trimmed nor refused. A single space satisfies the declared
        `minLength: 1`, so Gateway forwards it; the identifier is opaque here and the session it
        names lives in DataServices, which answers its own defined negative for one it cannot
        resolve.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Unauthorized:
      description: >-
        No token was presented, or the token presented is expired, malformed, or not valid for this
        service. This response is part of the published contract rather than an implementation
        detail: it is the standing proof that the boundary is authenticated (C-G).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: >-
        The token is valid but does not carry the scope this operation requires. Deliberately
        distinguished from `401` so a caller can tell a missing credential from an insufficient one.
        TWO LAYERS CAN PRODUCE IT, AND A CALLER NEED NOT CARE WHICH DID.
        (1) THIS SERVICE'S OWN INGRESS CHECK, which is the usual one and is decided before any upstream
        is contacted: `/v1/ping` requires `ping`, `/v1/capabilities` requires `capabilities`, and every
        `/v1/datawindow/**` operation - the `expression` sub-surface included - requires `datawindow`.
        No upstream call is made, so a refusal here costs nothing downstream.
        (2) A PROJECTED `PermissionDenied` from the upstream gRPC method, which reaches a caller only
        when this service's own credential for that upstream is insufficient - a deployment fault rather
        than a caller one, since the caller does not choose the credential this service presents
        downstream.
        Neither cause enumerates the scopes the caller does hold or the scopes the operation would
        accept. The scope names are the INGRESS vocabulary and are deliberately unprefixed: they name
        capabilities this service exposes rather than the internal service that implements them, whose
        own scopes are namespaced separately and are never presented by an external caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: |-
        **The request named something the upstream could not find.** Most often that is a session
        identifier that has expired or was already closed, a DataWindow handle nothing resolves, or a
        column, variable or member selector naming something the DataWindow or the expression environment
        does not have.

        It is the projection of an upstream `NotFound` status or of one of five in-band not-found codes -
        `E_INVALID_HANDLE`, `E_OBJECT_NOT_FOUND`, `E_NOT_EXISTS`, `E_VAR_NOT_FOUND` and
        `E_MEMBER_NOT_FOUND` - and it is never synthesized from a response field.

        🔴 **EVERY PROJECTED OPERATION DECLARES IT, INCLUDING THE TWO SESSION OPENS.** Those two used to
        declare no `404`, on the reasoning that they carry no prior session identifier to fail to resolve.
        That is true of the identifier and false of the status: `openValidationSession` refuses a
        `datawindowHandle` in its BODY that no DataWindow resolves and answers `E_INVALID_HANDLE`, and
        `openExpressionSession` answers `E_OBJECT_NOT_FOUND` for a name no host binds. Both reach a caller
        as this response, so both must declare it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Conflict:
      description: |-
        **The request collided with the current state of the resource, and it is the caller's to
        resolve.** Three outcomes reach this status and they are mutually distinguishable by problem
        `type`, `title` and `retCode`.

        **An optimistic-concurrency conflict on `updateDataWindow` carries the `conflict` member**
        unchanged from C-06, including the current row state, so a caller has what it needs to decide
        between retrying and surfacing. That is the only outcome on the only operation that populates it.

        **An `Aborted` whose detail could not be decoded, and the in-band `E_RETRY` an upstream reports
        without one, carry NO `conflict` member.** The status is preserved because reporting anything else
        would let a rejected call look successful, and no detail is fabricated because an empty one would
        describe a conflict no caller could act on.

        **Callers implement an explicit retry-or-surface policy, and there is no silent overwrite
        anywhere in the system.** Re-sending the same payload will produce the same 409, because the
        original values it carries are still stale - a retry must first re-read.

        🔴 **EVERY PROJECTED OPERATION DECLARES THIS RESPONSE, AND UNTIL NOW ONLY `updateDataWindow` DID.**
        The update is the only operation that can encounter a concurrency MISMATCH, which is why it is the
        only one whose 409 carries a detail - but the other two outcomes above are produced by the shared
        failure map and the shared in-band map, so any of the thirty-nine can answer 409. Thirty-eight
        therefore published a surface that omitted the one status a caller must branch on in order to build
        a retry. The schema below stays truthful on all thirty-nine because its `conflict` member is
        OPTIONAL: declaring it publishes "a conflict member may be present", never "one will be".
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ConflictProblemDetails'

    CrossSessionReferenceBlocked:
      description: |-
        The request was rejected. On these operations one rejection reason is distinctive enough to
        document separately: a cross-DataWindow variable reference that **spans expression sessions or
        service instances**, which is BLOCKED.

        ## Why this is a 400 and not a status of its own

        A dedicated `422` was considered and REJECTED, because the status mapping in
        `docs/CONTRACTS.md` 12.1 is the specification for this contract and it does not sanction one.
        That mapping already provides the mechanism for exactly this need: `InvalidArgument` projects to
        `400` **carrying the originating `RetCode`**, so a caller distinguishes one rejection from
        another by reading `retCode` rather than by counting statuses. Introducing a ninth status would
        have been this document overriding its own specification for a case the specification already
        covers.

        So a caller identifies this outcome from the `retCode`, and from the expression-error category
        `CATEGORY_FOREIGN_REFERENCE_BLOCKED` — not from the HTTP status.

        ## Why the reason is worth documenting at all

        This is the refactor's one deliberately narrowed contract. `foreignvardata.expsvc` is a **live
        in-process object pointer** to another DataWindow's expression service, and a pointer cannot be
        serialized. References are therefore resolved by a session-scoped DataWindow handle and are
        supported only when both DataWindows are co-resident in one expression session inside one
        DataServices instance.

        Approximating a pointer dereference across a network would produce results wrong in a way no
        test would obviously catch, so the contract is **narrowed with a defined error rather than
        widened with a guess**. A caller receiving this must not retry: the topology, not the request,
        is what rejected it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    InternalError:
      description: |-
        The projected gRPC method returned `Internal`. **The statement field is redacted**: the legacy
        `sqlsyntax` field carries the complete generated statement including interpolated literal
        values and the legacy logger performs no redaction at all, so the projection redacts or
        parameter-separates it before it reaches a caller. `detail` never carries key material, a
        stack trace, a file path or a connection string.

        **This status also carries the unavailable-capability outcome, and that is a deliberate choice
        rather than a fallback.** An implemented operation can report that the specific capability a
        request asked for has no available implementation - the pinyin comparison whose lookup table
        exists only inside the closed legacy binary, the column-expression engine's macro and
        foreign-variable arms, or a `pinyinFlags` mask that disagrees with the deployment's configured
        one - and it does so with the legacy `retCode` `E_NO_SUPPORT` (`-2000`) or `E_NO_IMPLEMENTATION`
        (`-2001`) on this body. The same status answers an upstream that reports a method its own
        contract publishes as unimplemented, which is deployment or version skew.

        **It is deliberately not `501`, and that is a hard constraint rather than a taste.** `501`
        belongs exclusively to the four reserved deferred-capability routes of this document, whose
        purpose is to declare that an entire capability area is unbuilt; answering it on an implemented
        operation would present that operation as a placeholder and would leave a caller unable to tell
        the two situations apart from this contract alone. It is not `400` either: the request is well
        formed and the limitation is this port's rather than the caller's. The legacy vocabulary carries
        the distinction the status cannot, which is why `retCode` is the member to branch on. Security's
        contract answers its two symmetric-cipher narrowings the identical way, for the identical
        reason.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UpstreamBusy:
      description: |-
        **A capacity ceiling refused the request, and this is a refusal rather than a fault.** The
        projected gRPC method returned `ResourceExhausted`, which the operation projects as `429`.

        The ceiling is real and reachable in ordinary operation rather than theoretical: the handle
        registries behind C-05 through C-08 refuse a new session or task once a per-principal or global
        limit is reached, and they answer the legacy `E_BUSY` code that this status carries in `retCode`.
        A caller that hits it has not sent a bad request - it has sent one more than the service is
        currently willing to hold - so the correct response is to release what it already holds, or to
        retry later, rather than to change the request.

        **Distinct from `503` on purpose.** `503` says the upstream is not currently serving; this says it
        is serving and declining to take more. Distinct from `502` for the same reason: a `502` means no
        gRPC response arrived at all.

        ## A SECOND CAUSE REACHES THIS STATUS, AND A CALLER TREATS BOTH THE SAME WAY

        This gateway also bounds its OWN ingress, and a request refused by that bound is answered `429`
        without any upstream being called. Two bounds reach it - a process-wide concurrency ceiling and a
        per-caller request allowance over a fixed window - and a caller cannot tell them apart, nor tell
        either from the upstream ceiling above, deliberately: distinguishing them would report how much of
        this deployment's capacity its OTHER callers are holding. `retCode` carries `E_BUSY` (-23) in every
        case, and the correct response is the same one: release what is held, or retry later.

        `Retry-After` is present whenever the limiter can determine it and absent when it cannot; an absent
        header means "retry with backoff", never "retry immediately".

        The ingress bound exists because the decomposition created this system's first listening socket
        (C-B): the legacy was an in-process library that received no unsolicited request, so nothing could
        be flooded and there was no legacy limit to port. `/health` is exempt, because it is the readiness
        gate this gateway's own health condition is published through and a rate-limited probe would make a
        busy service a permanently unready one.
      headers:
        Retry-After:
          description: >-
            How many seconds to wait before retrying, when the limiter can determine it. Absent when it
            cannot.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    # ==============================================================================================
    #  THE TWO RESPONSES THE NON-PROJECTING DIAGNOSTIC OPERATIONS CARRY
    #
    #  🔴 `/v1/ping` AND `/v1/capabilities` USED TO REFERENCE `UpstreamBusy` FOR THEIR 429, AND THAT
    #  COMPONENT'S FIRST SENTENCE IS "the projected gRPC method returned ResourceExhausted". Neither
    #  operation projects a gRPC method - they read this service's own clock and its own configured
    #  capability mask - so the shared component described, on those two operations, a cause that cannot
    #  occur. The second half of that component covers the ingress bound and would have been the accurate
    #  half, but a consumer reads a description from its first line, and generated documentation reads it
    #  in full. These two responses say only what is true of these two operations.
    #
    #  🔴 AND NEITHER OPERATION DECLARED A 500 AT ALL, in this document or in the runtime metadata, while
    #  both can produce one. See `IngressInternalError` for the path.
    # ==============================================================================================

    ContentTooLarge:
      description: |-
        **The request body exceeded the size this deployment accepts, and it was refused at the ingress
        bound before it was read or parsed.** No upstream was called and nothing about the body's shape was
        assessed - so this is not a statement that the payload was malformed, and re-shaping it will not
        help. `retCode` carries `E_INVALID_ARGUMENT` (-3), because the offending part of the request is an
        argument the caller supplied.

        **The configured bound is deliberately not published, here or in the body.** It is a property of a
        deployment rather than of this contract, and stating it would tell a caller exactly how large a
        request it may send before being refused. That a bound exists is contract; its value is not.

        **Declared on this operation because this operation reads a request body.** An operation that reads
        none cannot produce this status: the bound is enforced when the body is read, so a body sent to a
        route that never reads one is simply ignored - measured directly, an oversized body on a body-less
        route answers that route's ordinary result rather than a refusal. Those operations therefore do not
        declare `413`, which is what keeps this document's status surface a statement about what each
        operation can actually answer.

        The bound exists for the same reason the capacity ceiling does: decomposition created this system's
        first listening socket (C-B), so an unsolicited request of unbounded size is a failure mode the
        in-process legacy could not have had and for which there was no legacy limit to port.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    IngressBusy:
      description: |-
        **A capacity ceiling refused the request, and this is a refusal rather than a fault.** No upstream
        was called: this operation reaches none, so the refusal is entirely this gateway's own ingress
        bound declining to take more work.

        Two bounds reach it - a process-wide concurrency ceiling and a per-caller request allowance over a
        fixed window - and a caller cannot tell them apart, deliberately: distinguishing them would report
        how much of this deployment's capacity its OTHER callers are holding. `retCode` carries `E_BUSY`
        (-23), and the correct response is to release what is held, or to retry later, rather than to
        change the request.

        `Retry-After` is present whenever the limiter can determine it and absent when it cannot; an
        absent header means "retry with backoff", never "retry immediately".

        The bound exists because the decomposition created this system's first listening socket (C-B): the
        legacy was an in-process library that received no unsolicited request, so nothing could be flooded
        and there was no legacy limit to port. `/health` is exempt and therefore declares no `429`,
        because it is the readiness gate this gateway's own health condition is published through and a
        rate-limited probe would make a busy service a permanently unready one.
      headers:
        Retry-After:
          description: >-
            How many seconds to wait before retrying, when the limiter can determine it. Absent when it
            cannot.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    IngressInternalError:
      description: |-
        Gateway failed while handling the request. `retCode` carries `E_INTERNAL_ERROR`, and the body
        never carries key material, a stack trace, a file path or a connection string.

        **The reachable path is upstream of the handler, which is why this status is not obvious from
        reading one.** Neither of these two operations can fail on its own account: the ping reads a clock
        and falls back to the system clock rather than requiring a registration, and the capability
        projection reads a mask that failed validation at startup if it was going to fail at all. Both
        routes are AUTHENTICATED, so the bearer handler must obtain the issuer's key set before either
        handler is reached - and a retrieval that fails with no last-known-good configuration cached, which
        is what a cold start against an unreachable Security service produces, faults inside the
        authentication middleware. That fault is answered here.

        **`/health` declares no `500` and correctly does not**, for two independent reasons: it is
        anonymous, so no key set is needed to reach it, and its own handler converts every fault into a
        degraded component entry and a `503` rather than letting one escape.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UpstreamRefused:
      description: |-
        The projected gRPC method returned `Unavailable`: an upstream reached this service's call and
        answered that it is not currently able to serve it - a dependency of its own being unreachable,
        or a shutdown in progress.

        **This is the upstream's own verdict, which is what separates it from `502`.** A `502` means the
        call never produced a gRPC response at all; this means it produced one, and the answer was "not
        now". A caller retries both, but only this one tells it the upstream is alive.

        `/health` also answers `503`, on C-10's own account rather than through this mapping, and the two
        are not the same response: that one carries the aggregate readiness report.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UpstreamTimedOut:
      description: |-
        The projected gRPC method returned `DeadlineExceeded`: the deadline this service set on the
        outbound call elapsed before the upstream answered.

        **Every outbound call carries a deadline, which is why this status is declared rather than
        theoretical.** A call with no deadline is a call that can hang for as long as the transport
        allows, so each operation class carries one derived from a correctness bound - the request
        timeout for a unary call, the session lifetime for a stream. The deadline elapsing is therefore
        an expected outcome of a slow upstream rather than a defect, and it is reported as its own status
        instead of being folded into `502`, because the two lead a caller to different actions: a
        timed-out unary call may simply need retrying, whereas an unreachable upstream will not answer
        the retry either.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UpstreamUnavailable:
      description: |-
        An upstream service could not be reached, or the call to it failed in transit after the
        configured retry policy was exhausted.

        **This response exists because of the decomposition itself.** An in-process call cannot fail
        in transit and a network call can, so handling the failure is required *by* the transition
        rather than being a behavioural improvement layered on top of it. Without it, the first
        transient network fault would surface as a defect the legacy could not have had - a regression
        introduced by the refactor rather than a preserved behaviour.

        The body names which upstream failed, so an operator does not have to correlate logs to find
        out.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ReservedForPhaseTwo:
      description: |-
        **Not implemented. Reserved for Phase 2.**

        The body is **machine-readable** rather than a text message, so a client can branch on it
        without parsing prose: it names the deferred service the route will eventually reach and
        carries the marker `reserved for Phase 2`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReservedRouteBody'

  schemas:

    ProblemDetails:
      type: object
      title: ProblemDetails
      description: |-
        The **one and only** error body in this document apart from its conflict specialization below.
        Every `4xx` and every `5xx` response uses one of the two, so a consumer writes one error
        handler.

        It is the RFC 9457 problem-details object, which is what ASP.NET Core Minimal APIs emit
        **without hand-written code**. Adopting the framework's own error shape rather than inventing
        one keeps the error path out of hand-written code, for the same reason token validation is
        left to the stock bearer handler.

        ## Five extension members, and why RFC 9457 permits them

        `retCode` carries the legacy PowerFramework return code, `upstream` names which upstream a
        forwarded failure came from, `dbError` carries the database-layer detail **when, and only when,
        the failure originated in the data path**, `serviceStatus` carries the readiness verdict on the
        one response that has one, and `traceId` carries the correlation identifier that locates the
        operator record for this occurrence. RFC 9457 explicitly permits extension members, which is
        why this schema - **alone in this document, apart from its own conflict specialization** - sets
        `additionalProperties: true` rather than `false`. A consumer must ignore any member it does not
        recognise. Every other schema in this document, generated and mirrored alike, is CLOSED, because
        the projection's parser rejects a member the target message does not declare.

        `traceId` is declared rather than merely tolerated by that openness, and deliberately so: it is
        the only member through which a caller can reach anything this body withholds, so a caller needs
        a contractual basis for reading it. Its own description states the guarantee in full.

        **`dbError.sqlsyntax` is redacted**, and that is a contract commitment rather than an
        implementation detail: the legacy field carries the complete generated statement with
        interpolated literal values and the legacy logger performs no redaction at all. The `DbError`
        schema states the rule in full at the point of use.
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            A URI reference identifying the problem type. RFC 9457's own default of `about:blank` is
            used when no more specific type applies.
        title:
          type: string
          description: A short, human-readable summary of the problem type. Stable across occurrences.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code, repeated in the body so a logged body is self-describing.
        detail:
          type: string
          description: >-
            A human-readable explanation specific to this occurrence. **Never carries key material, a
            stack trace, a file path, a connection string, or an unredacted SQL statement.**
        instance:
          type: string
          format: uri-reference
          description: A URI reference identifying this specific occurrence.
        serviceStatus:
          type: string
          enum: [Healthy, Degraded, Unhealthy]
          x-enum-varnames: [Healthy, Degraded, Unhealthy]
          description: |-
            The readiness verdict, present on the `503` of `GET /health` and on nothing else.

            ## Why this member exists rather than reusing `status`

            `Degraded` and `Unhealthy` are different states and both are answered `503`, so the status
            **code** cannot separate them - which is the whole reason `GET /health` promises that the
            body does. The obvious place for the token is a `status` member, and it cannot go there:
            RFC 9457 already uses that name for the integer HTTP status and this schema types it as an
            integer, so a second `status` would be a duplicate member of a different type. The verdict
            therefore needs a name of its own, and this is it.

            **It is machine-readable, and that is the point.** The verdict is also stated in `detail`
            together with the participants responsible, but `detail` is prose for a human; Gateway's
            aggregator reads *this* member, so a `Degraded` upstream is reported as degraded rather
            than flattened into a failure. A consumer that cannot find this member on a `503` from
            `GET /health` must read the response as `Unhealthy` - failing closed - because a body that
            cannot state its verdict is not a body whose verdict can be trusted.

            The same spelling is emitted by all four services, because C-10 publishes one readiness
            shape across the estate.
        retCode:
          type: integer
          format: int64
          description: |-
            The legacy PowerFramework return code for this failure, transcribed from
            `ws_objects/pfw.shared.pbl.src/retcode.sru:L39-L79`. `Proto/common.v1.proto` is the numeric
            authority; `PowerFramework.Shared.Kernel.RetCode` is the same set in C#, and the sibling
            test project asserts the two agree numerically.

            **The tri-state algebra is preserved and matters when interpreting this field.**
            `IsSucceeded` tests `>= 0`, so `PREVENT` (1) reads as a SUCCESS; `IsFailed` tests `< 0`
            **with an explicit exclusion of `CANCELLED` (-2)**, so cancelled is **neither** succeeded
            nor failed. A consumer must not infer failure from a non-zero value.

            ## Why the enumeration carries 38 members while the oracle declares 41 constants

            The oracle declares **41** constants over **38 distinct values**, because three are aliases:
            `OK`, `SUCCESS` and `ALLOW` are three spellings of **0** [`:L39-L41`], and `CANCELED` and
            `CANCELLED` are two spellings of **-2** [`:L44-L45`]. A JSON Schema `enum` lists *values*,
            not spellings, so it necessarily carries 38. All five spellings remain valid names for their
            values, and `x-enum-varnames` gives one canonical name per value. **41 minus 3 aliases
            equals 38 is an audit**: if the member count is ever anything else, a value has been added,
            removed or duplicated.

            The set is **closed** because the oracle's catalogue is closed: `UNKNOWN` (-4000) exists
            precisely for the unclassifiable case, so no failure this ingress can produce needs a value
            outside it.
          enum:
            - 0        # OK / SUCCESS / ALLOW  [retcode.sru:L39-L41] - three spellings of one value
            - 1        # PREVENT               [:L42] - SATISFIES the success predicate
            - -1       # FAILED                [:L43]
            - -2       # CANCELED / CANCELLED  [:L44-L45] - neither succeeded nor failed
            # The contiguous, gap-free error block -3 .. -33 [:L46-L76]. The density is the oracle's.
            - -3       # E_INVALID_ARGUMENT    [:L46]
            - -4       # E_INVALID_IMAGE       [:L47]
            - -5       # E_INVALID_OBJECT      [:L48]
            - -6       # E_INVALID_TYPE        [:L49]
            - -7       # E_INVALID_TRANSACTION [:L50]
            - -8       # E_INVALID_SQL         [:L51]
            - -9       # E_INVALID_DATA        [:L52]
            - -10      # E_INVALID_DATAOBJECT  [:L53]
            - -11      # E_INVALID_HANDLE      [:L54]
            - -12      # E_OUT_OF_BOUND        [:L55]
            - -13      # E_OUT_OF_RANGE        [:L56]
            - -14      # E_OUT_OF_MEMORY       [:L57]
            - -15      # E_FILE_NOT_FOUND      [:L58]
            - -16      # E_OBJECT_NOT_FOUND    [:L59]
            - -17      # E_DATA_NOT_FOUND      [:L60]
            - -18      # E_FUNCTION_NOT_FOUND  [:L61]
            - -19      # E_EVENT_NOT_FOUND     [:L62]
            - -20      # E_MEMBER_NOT_FOUND    [:L63]
            - -21      # E_VAR_NOT_FOUND       [:L64]
            - -22      # E_NOT_EXISTS          [:L65]
            - -23      # E_BUSY                [:L66]
            - -24      # E_TIME_OUT            [:L67]
            - -25      # E_ACCESS_DENIED       [:L68]
            - -26      # E_WIN32_ERROR         [:L69]
            - -27      # E_INTERNAL_ERROR      [:L70]
            - -28      # E_DB_ERROR            [:L71]
            - -29      # E_HTTP_ERROR          [:L72]
            - -30      # E_WINHTTP_ERROR       [:L73]
            - -31      # E_IO_ERROR            [:L74]
            - -32      # E_SQL_BIND_ARG_FAILED [:L75]
            - -33      # E_RETRY               [:L76]
            # The three sentinels, deliberately distant from the contiguous block.
            - -2000    # E_NO_SUPPORT          [:L77]
            - -2001    # E_NO_IMPLEMENTATION   [:L78] - the four reserved routes' own code
            - -4000    # UNKNOWN               [:L79]
          x-enum-varnames:
            - OK
            - PREVENT
            - FAILED
            - CANCELLED
            - E_INVALID_ARGUMENT
            - E_INVALID_IMAGE
            - E_INVALID_OBJECT
            - E_INVALID_TYPE
            - E_INVALID_TRANSACTION
            - E_INVALID_SQL
            - E_INVALID_DATA
            - E_INVALID_DATAOBJECT
            - E_INVALID_HANDLE
            - E_OUT_OF_BOUND
            - E_OUT_OF_RANGE
            - E_OUT_OF_MEMORY
            - E_FILE_NOT_FOUND
            - E_OBJECT_NOT_FOUND
            - E_DATA_NOT_FOUND
            - E_FUNCTION_NOT_FOUND
            - E_EVENT_NOT_FOUND
            - E_MEMBER_NOT_FOUND
            - E_VAR_NOT_FOUND
            - E_NOT_EXISTS
            - E_BUSY
            - E_TIME_OUT
            - E_ACCESS_DENIED
            - E_WIN32_ERROR
            - E_INTERNAL_ERROR
            - E_DB_ERROR
            - E_HTTP_ERROR
            - E_WINHTTP_ERROR
            - E_IO_ERROR
            - E_SQL_BIND_ARG_FAILED
            - E_RETRY
            - E_NO_SUPPORT
            - E_NO_IMPLEMENTATION
            - UNKNOWN
        dbError:
          $ref: '#/components/schemas/DbError'
          description: |-
            The database-layer detail, present when - and only when - the failure originated in the data
            path and the upstream reported a payload for it. **Optional**: its presence is decided by the
            payload, never by the status, and a caller must branch on presence rather than on the status
            line.

            ## What it is for, in one sentence

            It names what the storage engine objected to. The canonical case is a `NOT NULL` refusal on
            `updateDataWindow`: `sqlerrtext` carries the provider's own diagnostic - for example
            `SQLite Error 19: 'NOT NULL constraint failed: COMPANY.AGE'.` - which identifies the offending
            **column**. Without it a caller who omitted a required field receives `400` and fixed prose
            naming nothing, and has no corrective action available to it.

            ## What it does NOT carry

            `sqlsyntax` is **redacted** and empty is both valid and common - see the `DbError` schema for
            the commitment and its reason. The upstream's free-form diagnostic prose is never relayed here
            or anywhere in this document; `retCode` and this member are the whole of what a failure body
            carries beyond the fixed `detail`. Values the caller sent are masked by the service that owns
            the masking before this member is composed.

            ## Where it appears

            On any operation that projects a C-03 or C-04 method, because an in-band failure can carry one.
            In practice the update is the only operation that produces one today, and it is the only
            operation whose summary promises it - exactly as `conflict` is declared widely and populated by
            one operation.
        validationErrors:
          type: array
          maxItems: 32
          description: |-
            Per-row validation refusals, **identity only**, present when the upstream reported which
            rows and columns it refused. Read alongside `dbError`: the two describe the same class of
            refusal reaching this ingress from two different places - the storage engine rejecting a
            row, which arrives as `dbError`, and the DataWindow service's own row validator rejecting
            one, which arrives here. Both are the same HTTP status, so a client that wants to know
            which column failed reads whichever member is present.

            **Identity, and deliberately not values.** Each element names the buffer, the one-based row
            ordinal, the column name, the column ordinal and the column type - schema metadata, plus
            the caller's own addressing of the row it just sent. No element carries a column VALUE, the
            generated statement, or the upstream's own diagnostic prose: a value may not have
            originated with this caller, and the statement carries interpolated literals because the
            legacy runs without bind variables when `DisableBind` is set. The corrective action needs
            the identity and never the value.

            **Bounded at 32 elements by the gateway**, so what crosses the system's only external
            ingress is bounded here rather than by whatever an upstream produced. Truncation is
            unmarked: a caller with more than 32 refused columns has a payload-shaped problem rather
            than a per-column one, and the corrective action does not change with the count.
          items:
            $ref: '#/components/schemas/RowValidationIdentity'
        upstream:
          type: string
          enum: [persistence, dataservices, security]
          x-enum-varnames: [Persistence, DataServices, Security]
          description: >-
            Which upstream service the failure originated from, when it originated from one. Present
            on `502` and on any status the projection forwarded, so an operator can attribute the
            failure without correlating logs. Absent when Gateway itself produced the response.
        traceId:
          type: string
          description: |-
            The correlation identifier for this occurrence: the **one thing a caller is given with
            which to obtain the detail this body deliberately withholds**.

            It is the ambient distributed-trace identifier when the request carried one - in which case
            it is the `traceparent` `trace-id` in its `W3C` hexadecimal form and correlates this
            occurrence with every other service's record of the same operation - and Gateway's own
            per-request identifier otherwise.

            ## Why this member is load-bearing rather than decorative

            `detail` is fixed prose on a `500` and names nothing about the fault, by design: no stack
            trace, no exception message, no host, no port, no path and no key material reaches a
            caller. That redaction is only defensible because it is a REDIRECTION - the full diagnostic
            exists on the operator channel and this identifier is what locates it. So the value here is
            **the same value** that appears in the operator record for the same occurrence, resolved
            once before either is written; a caller quoting it to an operator will always find a record.

            Present on every problem-details response Gateway produces itself. It can be absent only if
            the host supplies no request identifier at all, which is a configuration this service does
            not ship.

    ConflictProblemDetails:
      title: ConflictProblemDetails
      description: |-
        The `409` body: a problem-details object carrying the optimistic-concurrency conflict detail.

        The detail is forwarded **unchanged** from C-06 rather than reshaped, because a caller
        deciding between retrying and surfacing needs the current row state exactly as the database
        reported it.

        **The `conflict` member is the field-for-field mirror of `common.v1.ConflictDetail`, not a
        delegated placeholder.** That is the one payload in this document a consumer must be able to
        read in order to *act* - a caller that cannot see which column moved cannot construct a retry,
        and would re-send the same stale original values and receive the same `409` for ever. So it is
        transcribed here rather than deferred to the protocol definition.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [conflict]
          properties:
            conflict:
              $ref: '#/components/schemas/ConflictDetail'

    # ==============================================================================================
    #  TIER 1 - THE MIRRORED PROTOBUF SHAPES
    #  --------------------------------------------------------------------------------------------
    #  Every schema in this section is transcribed FIELD FOR FIELD AND VALUE FOR VALUE from
    #  Proto/common.v1.proto or Proto/dataservices.v1.proto in this same project. They are mirrored
    #  rather than delegated because each one carries a DECISION a consumer has to act on: a conflict
    #  it must retry or surface, an error field it must not expect to be unredacted, a chunk boundary
    #  it must not flatten, an expansion mode it must not confuse with a literal.
    #
    #  THE .proto REMAINS THE AUTHORITY. Where a member here and its protobuf counterpart ever
    #  disagree, the .proto is right and this document has drifted. The agreement has no compile-time
    #  edge and cannot be given one - nothing compiles a YAML file against a .proto - so it is a review
    #  obligation on every change to either side, and the sibling test project asserts the parts it can
    #  reach from generated code.
    #
    #  MEMBER NAMES ARE THE CANONICAL PROTOBUF JSON MAPPING, i.e. lowerCamelCase of the proto field
    #  name. `column_name` is `columnName`, `item_status` is `itemStatus`, `datetime_value` is
    #  `datetimeValue`. That is what the mapping emits, so it is what a consumer sees.
    #
    #  ENUM MEMBERS ARE THE PROTO ENUMERATOR NAMES, not their numbers, because that is what the
    #  canonical mapping emits. Identifier spellings are preserved verbatim for the same reason the
    #  SCREAMING_SNAKE constants are: they appear in serialized payloads, log records and
    #  characterization recordings, where a rename does not restyle a symbol - it silently invalidates
    #  every stored comparison that mentions it.
    #
    #  EACH ENUMERATOR'S NUMBER TRAVELS WITH IT, in `x-enum-values`, positionally aligned with `enum`
    #  and `x-enum-varnames`. The numbers matter even though the wire carries names: they are what the
    #  .proto declares, what a numeric bridge to a legacy ordinal casts to, and what a characterization
    #  recording holds - so value-for-value agreement has to be checkable from this document alone
    #  rather than only from a markdown table a machine cannot read. `x-enum-varnames` is the
    #  established generator convention; `x-enum-values` is this document's own extension, declared here
    #  once so it is not mistaken for one. Every set also states its numbers in prose, for a reader.
    #
    #  EVERY SCHEMA IN THIS TIER IS REACHED BY A `$ref`, AND ONE OF THEM IS WORTH RECORDING BECAUSE ITS
    #  REACHABILITY DEPENDS ON A DECISION. `ExpressionBinding` is the shape carried by the `bindings`
    #  member of C-04's `GetExpressionStateResponse` and by the `binding` member of `GetExpressionResponse`.
    #  DELEGATING either envelope leaves no `$ref` in this document reaching this schema, and a style
    #  linter then reports it as unused; it is mirrored regardless, because it is the ONE contract detail
    #  the requirements single out as not surviving naive serialization - the static versus dynamic
    #  expansion distinction - and a consumer that could not see the three-part payload and the
    #  per-reference mode would send an already-expanded string and destroy that distinction silently. Both
    #  envelopes are published concretely in Tier 3 and both `$ref` it, so the reachability is a fact a
    #  tool can follow. The rule stands either way: publish the shape a consumer must act on, and say why.
    #
    #  THE THREE SCHEMAS STILL PUBLISHED WITHOUT A `$ref` ARE THE THREE BODY-LESS OPERATIONS' REQUEST
    #  MESSAGES - `GetEventGateRequest`, `CloseValidationSessionRequest` and
    #  `CloseExpressionSessionRequest`. Those operations carry their arguments as a path or query
    #  parameter and declare no request body at all, so nothing `$ref`s the message; it is published
    #  because each operation NAMES it in `x-proto-request`, and a consumer following that extension must
    #  be able to look the shape up. The closure this document publishes is therefore exactly the set the
    #  projection carries, with no member of it silently omitted for want of a reference.
    #
    #  64-BIT INTEGERS ARE `[integer, string]`, AND THAT IS FIDELITY RATHER THAN LOOSENESS. The
    #  canonical protobuf JSON mapping EMITS int64, uint64 and fixed64 as JSON strings, to survive
    #  consumers whose number type is a double, and ACCEPTS either form on input. A schema declaring
    #  `integer` alone would reject the encoding the upstream actually produces. Expressed as a JSON
    #  Schema type array, which OpenAPI 3.1 supports natively - there is no `nullable` keyword and no
    #  3.0-only construct anywhere in this document. 32-bit fields are plain integers, because the
    #  mapping emits them as JSON numbers.
    #
    #  AND THE SIGNEDNESS TRAVELS WITH THEM: `format` IS `int64` FOR A SIGNED FIELD AND `uint64` FOR AN
    #  UNSIGNED ONE. The two are not interchangeable and the difference is not cosmetic. A `uint64`
    #  declared `int64` produces a signed 64-bit generated model, and every value above
    #  `Int64.MaxValue` - half the legacy `unsignedlong` domain - is then rejected by validation or
    #  wrapped to a negative number, silently. Both formats are in the OpenAPI Formats Registry, so
    #  naming the right one costs nothing; `AnyValue.uint64Value` additionally states `minimum` and
    #  `maximum` so the domain is machine-checkable rather than inferred from a format name.
    # ==============================================================================================

    DwBuffer:
      title: DwBuffer
      x-proto-enum: common.v1.DwBuffer
      description: |-
        The PowerBuilder `dwbuffer` domain, mirrored from `common.v1.DwBuffer`.

        | Member | Number | Legacy buffer |
        | --- | --- | --- |
        | `DW_BUFFER_PRIMARY` | 0 | `Primary!` - the live rows |
        | `DW_BUFFER_DELETE` | 1 | `Delete!` - rows deleted but not yet flushed |
        | `DW_BUFFER_FILTER` | 2 | `Filter!` - filtered-out rows |

        **`Primary!` occupies zero on its own account.** PowerBuilder initialises an unassigned
        `dwbuffer` to `Primary!`, so in the legacy "no buffer was supplied" and "the default buffer" are
        one state rather than two - which is why the framework can synthesize an error with `Primary!`
        and row 0 to mean "not attributable to any buffer or row". There is no synthetic unspecified
        member, and inserting one would shift all three real members up by one and silently invalidate
        every stored characterization comparison that mentions a buffer ordinal.

        **`Filter!` row order is INVERTED relative to the source.** That is the legacy's own behaviour
        and it is preserved: a consumer that re-sorted it would produce wrong data that a row-count
        assertion would not catch.
      type: string
      enum: [DW_BUFFER_PRIMARY, DW_BUFFER_DELETE, DW_BUFFER_FILTER]
      x-enum-varnames: [DW_BUFFER_PRIMARY, DW_BUFFER_DELETE, DW_BUFFER_FILTER]
      x-enum-values: [0, 1, 2]

    ItemStatus:
      title: ItemStatus
      x-proto-enum: common.v1.ItemStatus
      description: |-
        The PowerBuilder `dwItemStatus` domain in full, mirrored from `common.v1.ItemStatus`.

        | Member | Number | Legacy status |
        | --- | --- | --- |
        | `ITEM_STATUS_NOT_MODIFIED` | 0 | `NotModified!` - existing row, unchanged |
        | `ITEM_STATUS_DATA_MODIFIED` | 1 | `DataModified!` - existing row, edited |
        | `ITEM_STATUS_NEW` | 2 | `New!` - inserted, not yet edited |
        | `ITEM_STATUS_NEW_MODIFIED` | 3 | `NewModified!` - inserted and edited |

        **All four are carried, including `New!`, which no in-scope legacy source names literally.** It
        is a legal runtime status - the DataWindow engine assigns it to a row inserted but not yet
        edited - so omitting it would make real rows unrepresentable on the wire and force a service to
        invent a substitute or drop the row. Carrying it is faithfulness to the legacy type, not an
        added capability: nothing accompanies it but the ability to say it.
      type: string
      enum:
        - ITEM_STATUS_NOT_MODIFIED
        - ITEM_STATUS_DATA_MODIFIED
        - ITEM_STATUS_NEW
        - ITEM_STATUS_NEW_MODIFIED
      x-enum-varnames:
        - ITEM_STATUS_NOT_MODIFIED
        - ITEM_STATUS_DATA_MODIFIED
        - ITEM_STATUS_NEW
        - ITEM_STATUS_NEW_MODIFIED
      x-enum-values: [0, 1, 2, 3]

    DecimalValue:
      type: object
      title: DecimalValue
      x-proto-message: common.v1.DecimalValue
      description: >-
        A legacy `dec` / `decimal(n)`, mirrored from `common.v1.DecimalValue`. **A decimal string, never
        a JSON number**: the legacy type is exact and a double is not, so routing a salary or a price
        through a binary floating-point type would change the value the database compared against. The
        one updatable DataWindow in the legacy estate declares a two-place decimal salary column, which
        is exactly the case this exists for.


        Its single member is `required` on a RESPONSE and on nothing else, and this schema travels in
        both directions - so nothing is declared `required` here. See the Tier 3 section note: the
        canonical parser reads an absent member as its default, so on a REQUEST absence and an empty
        string are the same payload and a `required` list would publish a check nothing performs.
      additionalProperties: false
      properties:
        value:
          type: string
          description: The decimal in its exact textual form.

    DateValue:
      type: object
      title: DateValue
      x-proto-message: common.v1.DateValue
      description: >-
        A legacy `date`, mirrored from `common.v1.DateValue`. A date-only value with no time component
        and no zone, carried as text so no zone is implied where the legacy implies none.


        Its single member is `required` on a RESPONSE and on nothing else, and this schema travels in
        both directions - so nothing is declared `required` here. See the Tier 3 section note: the
        canonical parser reads an absent member as its default, so on a REQUEST absence and an empty
        string are the same payload and a `required` list would publish a check nothing performs.
      additionalProperties: false
      properties:
        value:
          type: string
          description: The date in its textual form.

    TimeValue:
      type: object
      title: TimeValue
      x-proto-message: common.v1.TimeValue
      description: >-
        A legacy `time`, mirrored from `common.v1.TimeValue`. A time-of-day with no date and no zone.


        Its single member is `required` on a RESPONSE and on nothing else, and this schema travels in
        both directions - so nothing is declared `required` here. See the Tier 3 section note: the
        canonical parser reads an absent member as its default, so on a REQUEST absence and an empty
        string are the same payload and a `required` list would publish a check nothing performs.
      additionalProperties: false
      properties:
        value:
          type: string
          description: The time in its textual form.

    DateTimeValue:
      type: object
      title: DateTimeValue
      x-proto-message: common.v1.DateTimeValue
      description: >-
        A legacy `datetime`, mirrored from `common.v1.DateTimeValue`. Carried as text rather than as an
        instant because the legacy type carries no zone: converting it to one would invent information
        the source does not have, and converting it back would not necessarily return the same value.


        Its single member is `required` on a RESPONSE and on nothing else, and this schema travels in
        both directions - so nothing is declared `required` here. See the Tier 3 section note: the
        canonical parser reads an absent member as its default, so on a REQUEST absence and an empty
        string are the same payload and a `required` list would publish a check nothing performs.
      additionalProperties: false
      properties:
        value:
          type: string
          description: The timestamp in its textual form.

    AnyValue:
      type: object
      title: AnyValue
      x-proto-message: common.v1.AnyValue
      description: |-
        A single legacy column or variable value, mirrored from `common.v1.AnyValue`.

        **Exactly one member is present**, which is how the canonical protobuf JSON mapping encodes a
        `oneof` - hence `minProperties: 1` and `maxProperties: 1`. A payload carrying two members, or
        none, is not a valid `AnyValue`.

        The eleven arms are the legacy scalar domain, and three of the distinctions are load-bearing:

        * `isNull` is an **arm of its own**, not the absence of a value. The legacy has null for value
          types and the tri-state return algebra depends on it; collapsing null to zero would turn
          "no value" into "the value zero".
        * `decimalValue` is **not** `doubleValue`. A legacy `dec` is exact; a double is not.
        * `int64Value` carries the legacy `long` **and** `integer`, deliberately widened, because a
          narrower wire type would truncate silently rather than fail.
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        isNull:
          type: boolean
          description: >-
            Present and true when the value is null. An arm rather than an absence, so a consumer can
            tell "null" from "not supplied".
        boolValue:
          type: boolean
          description: A legacy `boolean`.
        int64Value:
          type: [integer, string]
          format: int64
          description: A legacy `long` or `integer`, widened. Emitted as a string by the canonical mapping.
        uint64Value:
          type: [integer, string]
          format: uint64
          minimum: 0
          maximum: 18446744073709551615
          description: >-
            A legacy `unsignedlong`. Emitted as a string by the canonical mapping.

            THE FORMAT IS `uint64` AND NOT `int64`, WHICH IS A CORRECTION RATHER THAN A DETAIL. The
            protobuf field is `uint64`, whose domain runs to 18446744073709551615 - more than twice
            `Int64.MaxValue`. Declared `int64` a generator emits a signed 64-bit model for it, and every
            value in the upper half of the legacy domain is then either rejected by validation or
            wrapped to a negative number, silently, on a member whose whole purpose is to carry a value
            the sender could not express as signed. `minimum` and `maximum` are stated so the domain is
            machine-checkable rather than implied by the format name alone.
        doubleValue:
          type: number
          format: double
          description: A legacy `double` or `real` - genuinely floating point at source.
        decimalValue:
          $ref: '#/components/schemas/DecimalValue'
        dateValue:
          $ref: '#/components/schemas/DateValue'
        timeValue:
          $ref: '#/components/schemas/TimeValue'
        datetimeValue:
          $ref: '#/components/schemas/DateTimeValue'
        stringValue:
          type: string
          description: A legacy `string`.
        blobValue:
          type: string
          format: byte
          description: >-
            A legacy `blob`, base64-encoded as the canonical protobuf JSON mapping requires for a
            `bytes` field.

    ColumnValue:
      type: object
      title: ColumnValue
      x-proto-message: common.v1.ColumnValue
      description: |-
        One column's value, mirrored from `common.v1.ColumnValue`.

        **The row-status convention is the surprising part, and it is preserved.** The legacy reads a
        ROW's status by asking for column index **0**, which is not a real column - it means "the row
        itself". The same object also reads a genuine per-column status with a real index, so both
        readings coexist and the distinction is carried entirely by whether the identifier is zero. A
        consumer must therefore read `columnId: 0` paired with an `itemStatus` as the row's own status,
        not as column zero's.

        **Nothing is `required`, and that is a correction rather than an omission.** This shape travels in
        BOTH directions - inside `RetrieveChunk` on the way out, inside `UpdateRequest` on the way in -
        so one `required` list cannot be true of both. An earlier
        revision required `value`, which a RESPONSE may legitimately omit: `value` has explicit protobuf
        presence and stays absent until set, so a strict consumer validating a real response against that
        list would have rejected a valid body. See the Tier 3 section note. On a RESPONSE `columnName` and
        `columnId` are always present.
      additionalProperties: false
      properties:
        columnName:
          type: string
          description: The column's name as the DataWindow declares it.
        columnId:
          type: [integer, string]
          format: int64
          description: >-
            The column's one-based identifier, or **0** to denote the row itself - see the row-status
            convention above.
        value:
          $ref: '#/components/schemas/AnyValue'
        itemStatus:
          $ref: '#/components/schemas/ItemStatus'

    DbError:
      type: object
      title: DbError
      x-proto-message: common.v1.DbError
      description: |-
        A database-layer failure, mirrored from `common.v1.DbError`, which mirrors the legacy
        `dberrordata` structure field for field.

        ## `sqlsyntax` IS REDACTED, AND THAT IS A CONTRACT COMMITMENT (C-G)

        The legacy field carries the **complete generated statement including interpolated literal
        values**, and the legacy logger performs **no** redaction at all. The literals are real user
        data rather than placeholders, because a `DisableBind=1` connection means the runtime does not
        use bind variables: it interpolates. Forwarding that field verbatim through an ingress would
        publish row data to whoever reads an error response.

        This member therefore carries **placeholders only**, and an empty value is valid and common. The
        commitment is published here rather than left to the implementation so that a consumer does not
        build a diagnostic flow on data that will never arrive.

        ## `sqldbcode` is NOT a `retCode`

        It is the driver's own numeric code, and three different code spaces reach it depending on
        provider. It is a plain integer here for exactly that reason, and a consumer must not interpret
        it with the `retCode` vocabulary.
      additionalProperties: false
      required: [sqldbcode, sqlerrtext, sqlsyntax, buffer, row]
      properties:
        sqldbcode:
          type: [integer, string]
          format: int64
          description: >-
            The driver's own numeric code, in the provider's code space rather than the framework's. Not
            a `retCode`.
        sqlerrtext:
          type: string
          description: >-
            The driver's message text, verbatim. **May be non-English** - the framework synthesizes
            Chinese diagnostics for some conditions it detects itself. Opaque display text: a consumer
            must classify with `sqldbcode` rather than by parsing this.
        sqlsyntax:
          type: string
          description: >-
            The statement text, **redacted**. Placeholders only, never interpolated literals; empty is
            valid and common. See the redaction rule above - this is the one member of this shape whose
            legacy content could not be forwarded as it stands.
        buffer:
          $ref: '#/components/schemas/DwBuffer'
        row:
          type: [integer, string]
          format: int64
          description: >-
            The offending row number, **one-based** like every legacy row ordinal. **0** means "no
            particular row", which is what the framework reports for a connection- or statement-level
            failure not attributable to one row.

    RowValidationIdentity:
      type: object
      title: RowValidationIdentity
      additionalProperties: false
      required: [buffer, row, columnName, columnId, columnType]
      description: |-
        Which row and which column a validation refusal names - **the identity of the fault and none of
        the data behind it**.

        **A GATEWAY-AUTHORED NARROWING of `dataservices.v1.RowValidationError`, and it deliberately
        carries no `x-proto-message` marker.** That marker declares a schema to be the faithful wire
        projection of a descriptor, and the fidelity gates hold every marked schema to declaring
        *exactly* its descriptor's members - correctly, because a marked schema that quietly dropped one
        would misdescribe the wire. This shape is not that: `RowValidationError` is already published
        under its own name as the full projection, and this is the ingress's screened subset of it. The
        provenance is stated here in prose instead, which is where a narrowing belongs.

        **What the narrowing removes is the sixth field**, the upstream record's own structured error,
        whose message is legacy operator prose. This gateway authors the one piece of prose in the
        problem body - the `detail` member - so that no upstream text reaches a caller and none can be
        inferred from the response shape. What a client needs in order to fix its request is the
        identity, and the identity is complete without the prose.

        **Every member below is schema metadata or the caller's own addressing.** The column name,
        ordinal and type describe the table; the buffer and row ordinal describe the row the caller just
        sent. Nothing here is a value, so nothing here can disclose data the caller did not supply -
        which is what makes this member safe to publish at the system's only external ingress while the
        whole upstream message is not.
      properties:
        buffer:
          $ref: '#/components/schemas/DwBuffer'
        row:
          type: [integer, string]
          format: int64
          description: >-
            The refused row, **one-based** like every legacy row ordinal - so a single-row payload
            reports row 1 and never row 0.
        columnName:
          type: string
          description: >-
            The column the refusal names, spelled as the schema spells it. This is the member that makes
            the refusal actionable: a caller told only that its data was refused has no corrective
            action available to it, and the column name is schema metadata rather than row data.
        columnId:
          type: [integer, string]
          format: int64
          description: >-
            The column's **one-based** ordinal, carried beside the name so a client addressing columns
            positionally does not have to resolve the name itself.
        columnType:
          type: string
          description: >-
            The column's declared type as the DataWindow reports it. Present because the legacy coerces
            a value by the first five characters of this type, so it is what explains WHY a value was
            refused rather than merely which column refused it.

    ConflictRow:
      type: object
      title: ConflictRow
      x-proto-message: common.v1.ConflictRow
      description: |-
        One row that lost an optimistic-concurrency check, mirrored from `common.v1.ConflictRow`.

        **Both value sets travel, and that is a requirement rather than a preference.** The one
        updatable DataWindow in the legacy estate declares `updatewhere=1` and marks **all six** of its
        columns `updatewhereclause=yes`. `updatewhere=1` is the "key and updateable columns" concurrency
        mode, so the generated `WHERE` clause carries the key column **plus the original value of every
        updateable column**. A payload carrying only current values could not express what the failed
        statement actually compared, and the caller could not tell which column moved underneath it.
      additionalProperties: false
      required: [buffer, row, itemStatus, currentValues, originalValues]
      properties:
        buffer:
          $ref: '#/components/schemas/DwBuffer'
        row:
          type: [integer, string]
          format: int64
          description: The one-based row ordinal within the buffer.
        itemStatus:
          $ref: '#/components/schemas/ItemStatus'
        currentValues:
          type: array
          description: The row's values as they stand now, per column.
          items:
            $ref: '#/components/schemas/ColumnValue'
        originalValues:
          type: array
          description: >-
            The values the failed statement's `WHERE` clause compared against, per column. This is the
            set that lets a caller identify which column moved.
          items:
            $ref: '#/components/schemas/ColumnValue'

    ConflictDetail:
      type: object
      title: ConflictDetail
      x-proto-message: common.v1.ConflictDetail
      description: |-
        The optimistic-concurrency mismatch payload, mirrored from `common.v1.ConflictDetail`.

        It originates on C-06's `Update` as the detail of a gRPC **`Aborted`** status, is relayed by
        C-03's `Update`, and **this projection surfaces the same payload unchanged as HTTP `409`.** It
        is forwarded rather than reshaped because a caller deciding between retrying and surfacing needs
        the current row state exactly as the database reported it.

        **`Aborted`, not `FailedPrecondition`, and the distinction is deliberate:** the operation MAY
        succeed if the caller re-reads and retries at a higher level, which is what `Aborted` means and
        what `FailedPrecondition` does not. `Aborted` is also the canonical gRPC mapping to HTTP 409.

        **There is no silent overwrite anywhere in the system.** This shape exists so a mismatch is
        always reported rather than resolved by guessing. The caller implements an explicit
        **retry-or-surface** policy; there is no last-writer-wins path and no member here that would
        enable one.
      additionalProperties: false
      required: [rows, updateTable, rowsExpected, rowsMatched]
      properties:
        rows:
          type: array
          description: >-
            The conflicting rows, each with both value sets. More than one row can conflict in a single
            update, so this is a collection rather than a single row.
          items:
            $ref: '#/components/schemas/ConflictRow'
        updateTable:
          type: string
          description: >-
            The table the update targeted. Present because multi-table update from one DataWindow is a
            real legacy capability, so "which table" is a genuine question.
        rowsExpected:
          type: [integer, string]
          format: int64
          description: How many rows the statement expected to affect.
        rowsMatched:
          type: [integer, string]
          format: int64
          description: >-
            How many it actually matched. The gap between this and `rowsExpected` is the mismatch, and
            reporting both lets a caller see the size of it rather than only its existence.

    DataWindowRow:
      type: object
      title: DataWindowRow
      x-proto-message: common.v1.DataWindowRow
      description: |-
        One row, mirrored from `dataservices.v1.DataWindowRow`. Used in both directions: it is what a
        retrieval chunk carries and what an update submits.

        **`originalValues` IS THE OPTIMISTIC-CONCURRENCY EVIDENCE, AND OMITTING IT ON A ROW THAT NEEDS
        IT IS REFUSED RATHER THAN TOLERATED.** On a freshly retrieved row its entries EQUAL the current
        ones, because the retrieval baselines every row; on an update it is what the `updatewhere=1`
        predicate compares against, so a producer that dropped a column's original would leave the
        caller reconstructing the predicate from an absence - and the other legal reading of that
        absence, "no baseline exists", drops the predicate and silently overwrites.

        The enforcement is a RUNTIME check in `Validators/UpdateRowValidator`, and it is stated here
        rather than expressed as `required` for a reason that is measured rather than stylistic. Two
        reasons, in fact. First, this shape travels in a REQUEST as well as a response, and the
        projection binds every request with the strict canonical protobuf JSON parser, which reads an
        absent member as its default - so a `required` list here would publish a check nothing performs
        and would make a validator reject a body the runtime accepts. Second, the obligation is
        CONDITIONAL on the row rather than universal: the validator requires a baseline for every column
        of a row whose originals become a `WHERE` clause - a `Delete!` row, or a `DataModified!` row in a
        modifiable buffer - and requires none for a `New!`/`NewModified!` row, which generates an
        `INSERT` with no predicate and no prior state, or a `NotModified!` row, which generates no
        statement at all. A blanket `required` would refuse both of those conforming payloads while
        preventing nothing.

        A row missing a baseline it needs is refused with `400` and `retCode -3`
        (`E_INVALID_ARGUMENT`) - the code is the STRUCTURAL one because what is wrong is the shape of the
        request rather than a value in it. `UpdateRowValidator` is the component that decides this, and it
        does identify the row, the column, its one-based ordinal and the reason class - but that detail
        reaches the OPERATOR CHANNEL and not the caller's body, which carries a fixed classifying `detail`
        plus the `traceId` that joins the two. An earlier revision of this sentence promised the naming
        in-band; see the update operation's own note for why the ingress withholds upstream detail and
        where a consumer that needs it in-band should get it.
      additionalProperties: false
      properties:
        buffer:
          $ref: '#/components/schemas/DwBuffer'
        row:
          type: [integer, string]
          format: int64
          description: The one-based row ordinal within its buffer.
        itemStatus:
          $ref: '#/components/schemas/ItemStatus'
        columns:
          type: array
          description: The row's current values, per column.
          items:
            $ref: '#/components/schemas/ColumnValue'
        originalValues:
          type: array
          description: >-
            The row's original values, one per column the row carries - what a subsequent update's
            `WHERE` clause will compare against. Equal to `columns` on a freshly retrieved row, and empty
            only for a row that has no prior state.
          items:
            $ref: '#/components/schemas/ColumnValue'

    RetrieveChunk:
      type: object
      title: RetrieveChunk
      x-proto-message: dataservices.v1.RetrieveChunk
      description: |-
        One chunk of a retrieval, mirrored from `dataservices.v1.RetrieveChunk`.

        **This is the chunking contract, and this projection does not change it.** Each chunk retains
        its own index, its own row count, the running cumulative count and the final-chunk flag, exactly
        as the gRPC server stream carries them. A consumer of the REST projection can therefore
        reconstruct precisely what a gRPC consumer sees, and can identify the last chunk **as** the last
        rather than inferring it from the collection ending.
      additionalProperties: false
      required: [rows, rowCount, chunkIndex, final, cumulativeRowCount]
      properties:
        rows:
          type: array
          description: The rows in this chunk.
          items:
            $ref: '#/components/schemas/DataWindowRow'
        rowCount:
          type: [integer, string]
          format: int64
          description: How many rows this chunk carries.
        chunkIndex:
          type: [integer, string]
          format: int64
          description: >-
            This chunk's position in the sequence. Retained so a consumer can detect a gap rather than
            assume there was none.
        final:
          type: boolean
          description: >-
            True on the last chunk. Explicit rather than inferred: a collection ending and a retrieval
            completing are different facts, and only the flag distinguishes a complete retrieval from a
            truncated one.
        cumulativeRowCount:
          type: [integer, string]
          format: int64
          description: The running total across this chunk and every chunk before it.
        buffer:
          $ref: '#/components/schemas/DwBuffer'
        error:
          $ref: '#/components/schemas/DbError'

    RetrieveResult:
      title: RetrieveResult
      description: |-
        The projection of C-03's `Retrieve` server stream: **the ordered sequence of chunks the stream
        would have delivered**, in the order it would have delivered them.

        A collection rather than an invented envelope, deliberately - the protobuf definition has no
        envelope message for a stream, so wrapping one here would add a member the gRPC contract does
        not have and the two halves of the boundary would stop corresponding. Element order is the
        stream's order and is significant; the last element carries `final: true`.

        An empty collection is valid and means the retrieval produced no chunk at all.
      type: array
      items:
        $ref: '#/components/schemas/RetrieveChunk'

    EventGate:
      type: object
      title: EventGate
      x-proto-message: dataservices.v1.EventGate
      description: |-
        The DataWindow event gate, mirrored from `dataservices.v1.EventGate`.

        The mask is composed from the legacy bit identifiers, whose spellings and values are preserved
        verbatim:

        | Bit | Value | Legacy event |
        | --- | --- | --- |
        | `EID_ROWFOCUSCHANGE` | **1** | row-focus change |
        | `EID_ITEMFOCUSCHANGE` | **2** | item-focus change |
        | `EID_ITEMCHANGE` | **4** | item change |

        ## The one non-obvious coupling, preserved rather than fixed (C-B)

        **Disabling `EID_ITEMCHANGE` also suppresses column-expression evaluation.** That is not a
        separate switch a caller can hold differently: the legacy couples the two, and the coupling is
        reproduced. A caller disabling item-change to stop validation firing will also stop expressions
        recalculating, and it needs to know that before it does so rather than after.

        It is legacy behaviour to preserve, not a bug to fix. Splitting the two would be a behaviour
        improvement, which the mandate forbids exactly as firmly as it forbids a regression.
      additionalProperties: false
      required: [mask]
      properties:
        mask:
          type: [integer, string]
          format: int64
          description: >-
            The composed mask of currently DISABLED events. Zero means every event is enabled. The mask
            is a sum of the three bit values above.

    DataWindowEventBit:
      title: DataWindowEventBit
      x-proto-enum: dataservices.v1.EventGate.Bit
      description: >-
        One event-gate bit, mirrored from `dataservices.v1.EventGate.Bit`. The spellings are the legacy
        `EID_*` identifiers, preserved verbatim because they appear in serialized payloads, log records
        and characterization recordings. `EID_UNSPECIFIED` is the protobuf zero enumerator and carries no
        event; the three real bits are 1, 2 and 4, and their composition rule and the item-change
        coupling are stated on `EventGate`.
      type: string
      enum: [EID_UNSPECIFIED, EID_ROWFOCUSCHANGE, EID_ITEMFOCUSCHANGE, EID_ITEMCHANGE]
      x-enum-varnames: [EID_UNSPECIFIED, EID_ROWFOCUSCHANGE, EID_ITEMFOCUSCHANGE, EID_ITEMCHANGE]
      x-enum-values: [0, 1, 2, 4]

    RetCodeValue:
      title: RetCodeValue
      x-proto-enum: common.v1.RetCode.Value
      description: |-
        The legacy return code **as a mirrored protobuf enum**, from `common.v1.RetCode.Value`.

        ## This is the same algebra as `ProblemDetails.retCode`, in the other of its two encodings

        `ProblemDetails.retCode` is an integer, because it is Gateway's own RFC 9457 extension member on
