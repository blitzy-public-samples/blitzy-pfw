        **One coupling must be carried and is easy to miss:** disabling item-change also **suppresses
        column-expression evaluation** [`se_cst_dw.sru:L109-L111`]. So a caller that disables item
        change to stop a validation cascade also silently stops every computed column from
        recalculating. That is legacy behaviour, reproduced under C-B, and the response states the
        coupling so a caller can see it before relying on the gate.
      parameters:
        - $ref: '#/components/parameters/SessionIdQuery'
      responses:
        '200':
          description: >-
            The current event gate. The bitmask and its decomposed bits are mirrored field for field from
            the protobuf message, so the legacy `EID_*` identifiers are part of the published body
            rather than only of its prose.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEventGateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'

