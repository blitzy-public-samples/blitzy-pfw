  # ================================================================================================
  #  C-09 - THE /v1/datawindow/expression PROJECTION OF C-04
  #  (dataservices.v1.ColumnExpressionService)
  #
  #  Twenty-four of C-04's twenty-six methods are projected, including `EventStream` - the engine's own
  #  SERVER stream of the three events it declares on itself, which projects as an ordered collection
  #  for the same reason `Retrieve` does.
  #
  #  Two are NOT: `InvokeMethodChannel` and `TraceChannel`, the two INVERTED bidirectional streams. The
  #  legacy expects the APPLICATION to implement the macro switch, so across a boundary DataServices
  #  must call back INTO its client - an inversion REST has no direction to express.
  # ================================================================================================

  /v1/datawindow/expression/sessions:
    post:
      operationId: openExpressionSession
      x-contract-id: C-04
      x-required-scope: datawindow
      x-grpc-method: dataservices.v1.ColumnExpressionService/OpenExpressionSession
      x-proto-request: dataservices.v1.OpenExpressionSessionRequest
      x-proto-response: dataservices.v1.OpenExpressionSessionResponse
      tags: [ColumnExpression]
      summary: Open an expression session, which scopes foreign-variable DataWindow handles.
      description: |-
        Opens the session that scopes cross-DataWindow variable references.

        ## This session carries the refactor's one deliberately narrowed contract

        `foreignvardata.expsvc` [`n_cst_dwsvc_columnexp.sru:L80-L83`] is a **live in-process object
        pointer** to another DataWindow's expression service, and a pointer cannot be serialized.

        Cross-DataWindow variables are therefore resolved by a **session-scoped DataWindow handle**,
        and are supported **only** when both DataWindows are co-resident in the same expression
        session inside one DataServices instance. A foreign reference spanning sessions or service
        instances is **BLOCKED and returns a defined error** - never a silently wrong value.

        This is a genuine, unavoidable narrowing of the legacy contract. It is published here rather
        than discovered during integration, because the alternative - approximating a pointer
        dereference across a network - would produce results wrong in a way no test would obviously
        catch.

        ## Call order, and why getting it wrong answers 502 rather than 4xx

        1. `POST /v1/datawindow/expression/sessions` - this operation. Mints the `<sessionId>/<ordinal>`
           handle every other route under `/v1/datawindow/expression/` takes.
        2. `POST /v1/datawindow/expression/enabled` with `enabled: true`. **The engine is created inert
           and does not auto-enable.**
        3. Bind what is to be evaluated: add an expression, add a variable, and so on.
        4. Calculate: `/calc`, `/calc-all`, `/calc-empty`, `/calc-item`.

        **Step 2 is the one that is easy to miss.** Skipping it answers `retCode` `FAILED`, projected as
        **502**. That reads like an upstream outage and is not one - the engine is merely inert, which is
        entirely caller-correctable. The code is nevertheless preserved rather than narrowed, because
        `FAILED` is the oracle's own answer for this condition at four separate call sites
        (`n_cst_dwsvc_columnexp.sru:L1158`, `:L1201`, `:L1976`, `:L2087`) and section 12.1 of
        `docs/CONTRACTS.md` freezes `FAILED` to 502 across the whole surface. Documented rather than
        special-cased.

        ## Where the rows a calculation evaluates over come from, and the Phase-1 gap that follows

        Every calculation operation on this service evaluates against **rows** of the DataWindow its
        handle names, and **this phase publishes no operation that places a row into one**. That is the
        frozen contract's shape rather than an omission: the C-04 method inventory carries no
        row-loading member, C-03 publishes none either, and `POST /v1/datawindow/retrieve` streams its
        rows **to the caller** rather than into a service-side model. In the oracle the DataWindow is a
        control owned by the *application* and filled by the application's own retrieval, so the
        population half sits on the presentation side of the split and is a reserved Gateway extension
        point under `/v1/design/**`.

        The observable consequence, stated rather than papered over: against an unpopulated DataWindow
        `/calc-all` and `/calc-empty` answer 200 with `OK` having iterated **zero rows**, and `/calc`
        answers 400 `E_INVALID_ARGUMENT` because row 1 is out of range on an empty buffer. A caller
        seeing "OK, no results" has found this gap rather than an empty answer. The *binding* half of
        the engine - add / set / get an expression, add / set a variable, the relative-column and flag
        setters, the two inverted streams - is complete and exercisable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenExpressionSessionRequest'
      responses:
        '200':
          description: >-
            The projected gRPC method returned `OK`. The body is the canonical protobuf JSON mapping
            of `dataservices.v1.OpenExpressionSessionResponse`, published as
            `OpenExpressionSessionResponse` below.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenExpressionSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/UpstreamBusy'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '503':
          $ref: '#/components/responses/UpstreamRefused'
        '504':
          $ref: '#/components/responses/UpstreamTimedOut'

