    UpdateRequest:
      type: object
      title: UpdateRequest
      x-proto-message: dataservices.v1.UpdateRequest
      description: >-
        `dataservices.v1.UpdateRequest` in `Proto/dataservices.v1.proto`, generated from the
        compiled descriptor. Request-only, so nothing is `required` - see the section note.
      additionalProperties: false
      properties:
        datawindowHandle:
          type: string
        sessionId:
          type: string
          description: >-
            The session, when the update is issued inside a validation chain. Optional: an update
            may be issued outside one.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/DataWindowRow'
          description: |-
            The rows to submit. EACH ROW MUST CARRY BOTH ITS CURRENT AND ITS ORIGINAL VALUES for
            every marked column - see common.v1.DataWindowRow.original_values and
            common.v1.ConflictDetail for why the original-value shadow is not optional under
            `updatewhere=1`. The originals are the values a preceding retrieval returned as its
            CURRENT values - and because a retrieval baselines every row it lands, it returns those
            same values in `originalValues` too, so a caller may echo the retrieved row's
            `originalValues` back unchanged or restate the retrieved CURRENT values; both name the
            same baseline. An earlier revision of this sentence claimed a retrieved row carries no
            `original_values` of its own, which contradicted
            `common.v1.DataWindowRow.original_values` - the authoritative statement, which mandates
            one entry per column IN BOTH DIRECTIONS with no omit-when-equal allowance - as well as
            the runtime, which populates it on every projected row.

            PER-COLUMN item_status IS OPTIONAL AND ITS ABSENCE IS DEFINED ON THIS PATH: when a
            MODIFIED row carries no per-column status at all, the row's own status governs every
            column WHOSE VALUE DIFFERS FROM ITS STATED ORIGINAL - and a column whose stated original
            proves the value did not move stays NotModified! - so the SET list names the columns
            that changed, exactly as the oracle's does, and the KEY column of an ordinary update is
            not stamped modified and does not trigger the updatekeyinplace=no delete-plus-insert
            path. A column with no stated original has no baseline and so adopts the row's status,
            which is the whole of an insert-shaped row. When ANY column carries a status, every
            column is taken at its word instead. A modified row whose every updatable column
            resolves to NotModified! cannot express an update and is refused with
            RetCode.E_INVALID_DATA - never as a concurrency conflict, because no statement was
            generated and nothing was contended. common.v1.ColumnValue.item_status states the rule
            in full, including how values are compared across the numeric arms.

    UpdateResponse:
      type: object
      title: UpdateResponse
      x-proto-message: dataservices.v1.UpdateResponse
      description: |-
        Response to Update.

        `dataservices.v1.UpdateResponse` in `Proto/dataservices.v1.proto`, generated from the
        compiled descriptor. Response-only, so `required` lists every member without explicit
        presence - see the section note.
      additionalProperties: false
      required: [retCode, rowsInserted, rowsUpdated, rowsDeleted, identity, validationErrors]
      properties:
        retCode:
          $ref: '#/components/schemas/RetCodeValue'
        rowsInserted:
          type: [integer, string]
          format: int64
          description: >-
            Row counts by operation, as the legacy's counts callback reports them.
        rowsUpdated:
          type: [integer, string]
          format: int64
        rowsDeleted:
          type: [integer, string]
          format: int64
        error:
          $ref: '#/components/schemas/DbError'
          description: |-
            A database failure that is NOT a concurrency conflict - a constraint violation, a
            connection fault. `sqlsyntax` is REDACTED by common.v1.DbError's own contract; nothing
            here widens it.

            A CONFLICT DOES NOT ARRIVE HERE. It arrives as the Aborted status above, which is why
            this field and that status are not two ways of saying one thing.
        identity:
          type: array
          items:
            $ref: '#/components/schemas/IdentityColumnData'
          description: |-
            ============ THE IDENTITY ROUND TRIP, RELAYED FROM C-06 UNCHANGED (C-K)
            ==================== Persistence's C-06 UpdateService.Update returns this payload, and
            WITHOUT THIS FIELD IT WOULD STOP AT THE DATASERVICES BOUNDARY - a caller that inserted
            rows could never learn the auto-increment values the database assigned them, so no
            inserted DataWindow row could be reconciled with its generated identity. That is a
            capability the legacy has and the wire would silently have dropped: in-process, the
            legacy hands both value arrays straight back to the application through
            OnIdentityColumnDataRetrieved's two `ref` array out-parameters
            [n_cst_thread_task_sqlupdate.sru:L243].

            RELAYED UNCHANGED IS PART OF THE CONTRACT, NOT A HOPE. common.v1.IdentityColumnData
            carries primary_values in FORWARD collection order and filter_values in BACKWARD order,
            because the Filter buffer's row order is inverted relative to the source [:L235-L241].
            DataServices MUST forward both arrays element for element as received, and Gateway must
            do the same: re-sorting either array, deduplicating it, or concatenating the two pairs
            values with the wrong rows - a defect that returns the right COUNT of identities and so
            survives every row-count assertion.

            ABSENT MEANS "NONE COLLECTED", NEVER AN ERROR. Collection is conditional at three levels
            in the legacy [:L215, :L226, :L242-L244], so an update that inserted nothing, or hit no
            identity column, legitimately reports no identity block at all.

            THE FIELD IS REPEATED BECAUSE C-06's IS, AND THE RELAY MUST NOT NARROW IT. One Update
            can emit one block per update table: the worker loops `for nIndex = 1 to
            UpperBound(Tables)` calling `_of_Update` per table
            [n_cst_thread_task_sqlupdate.sru:L358-L369], each call fires the callback at most once
            [:L243], and the caller-side proxy APPENDS each firing to an ordered array
            [n_cst_threading_task_sqlupdate.sru:L45, L73-L76] which it later replays in full [:L128,
            L142-L195]. A singular field here would have relayed the first block and dropped the
            rest - data loss that returns a plausible response, because no count in this message
            would disagree.

            THE RELAY IS ORDER-PRESERVING AT BOTH LEVELS: the BLOCKS travel in the order received,
            which is the order the tables were declared, AND each block's two arrays travel element
            for element as collected. Re-ordering, merging or de-duplicating either level pairs
            identity values with the wrong column or the wrong row.
            ==========================================================================================
        validationErrors:
          type: array
          items:
            $ref: '#/components/schemas/RowValidationError'
          description: |-
            ============ THE WRITE PATH'S OWN VALIDATION FAILURES, PER COLUMN AND PER ROW
            ==============

            Present only when `ret_code` reports a validation refusal, and EMPTY on every other
            outcome - including on a database failure, which is a different thing and travels on
            `error` above.

            WHY THIS FIELD EXISTS. The five `dwnvl*` validators are ported precisely so a value the
            declared column type cannot represent is refused rather than stored, and without a field
            to report them in they were unreachable from this operation: text that is not a number
            reached an `INT NOT NULL` column, an impossible date reached a `date` column, and a
            column name no definition carries was accepted and its value applied to whichever
            ordinal travelled beside it. Every one of those answered HTTP 200.

            WHY IT IS REPEATED AND NOT SINGULAR. One update carries many rows and each row many
            columns, and a caller fixing a payload needs EVERY rejected column rather than the first
            - a singular field would turn one correction into as many round trips as there are
            faults. The order is the order the rows and their columns were sent, so a consumer can
            index straight back into its own request.

            NOTHING IS APPLIED WHEN THIS FIELD IS NON-EMPTY. The refusal happens before the upstream
            is told anything at all, so the row counts above are zero and storage is untouched. That
            is the property that makes a validation refusal safe to retry with a corrected payload.

