      additionalProperties: false
      properties:
        datawindowHandle:
          type: string
        arguments:
          type: array
          items:
            $ref: '#/components/schemas/AnyValue'
          description: >-
            Optional retrieval arguments, positional and ONE-BASED, matching the legacy
            `Retrieve(args...)` shape. Each is an AnyValue so a null argument stays distinguishable
            from a zero or an empty string - common.v1.AnyValue records why that distinction is
            load-bearing.
        buffers:
          type: array
          items:
            $ref: '#/components/schemas/DwBuffer'
          description: >-
            Which buffers to stream. Empty means the primary buffer only, which is the legacy
            default: a freshly retrieved DataWindow has nothing in Delete! and nothing in Filter!
            until a filter or a delete has run.
        chunkSize:
          type: integer
          format: int32
          description: |-
            Requested rows per chunk. 0 means "the server chooses".

            NOTE THE ASYMMETRY WITH C-05, DELIBERATELY (C-K). Persistence's QueryService preserves a
            legacy guard whereby a chunk size at or below 1000 yields E_INVALID_ARGUMENT
            [n_cst_thread_task_sqlquery.sru:L410]. THAT GUARD IS NOT REPRODUCED HERE, because it is
            not this interface's guard - it belongs to the SQL task layer, which sits behind
            Persistence. Copying it onto this contract would invent a validation the legacy does not
            perform at this boundary, which C-B forbids as firmly as it forbids removing one.

            WHAT A CALLER OBSERVES, THEREFORE. Zero is the ONLY value this boundary drops, and it is
            dropped because a proto3 scalar cannot distinguish an absent field from a zero one - so
            zero is the only value that cannot have been stated deliberately, and asserting a size
            of zero upstream would be a different claim from stating none. EVERY OTHER VALUE
            TRAVELS, INCLUDING A NEGATIVE ONE, and C-05's guard adjudicates it: -5 and 500 are both
            refused with E_INVALID_ARGUMENT, which Gateway projects as HTTP 400, while 1001 and
            above are honoured. This is forwarding, NOT validating - the paragraph above is the
            reason. Forwarding only a POSITIVE size silently discards a nonsensical negative and
            answers with a successful retrieval at the server's own size while refusing a nonsensical
            500: two values equally wrong, two different outcomes, and the more obviously wrong of the
            two accepted. The layer that owns the rule answers for both instead.

