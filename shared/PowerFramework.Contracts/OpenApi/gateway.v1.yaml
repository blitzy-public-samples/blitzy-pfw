    ColumnExpEvent:
      type: object
      title: ColumnExpEvent
      description: |-
        One event the expression engine declares on itself, mirrored from
        `dataservices.v1.ColumnExpEvent`.

        **Exactly one member is present**, which is how the canonical protobuf JSON mapping encodes a
        `oneof`. The three arms are the engine's whole self-declared event surface: an item changed, a
        deferred item-changed notification, and a variable changed.
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        itemChanged:
          type: object
          title: ColumnExpEventItemChanged
          description: An item changed, identified by row and DataWindow object.
          additionalProperties: false
          required: [row]
          properties:
            row:
              type: [integer, string]
              format: int64
              description: The one-based row ordinal.
            dwo:
              $ref: '#/components/schemas/DwObjectRef'
        doItemChanged:
          type: object
          title: ColumnExpEventDoItemChanged
          description: >-
            The deferred item-changed notification, which additionally records whether the change
            originated from user input rather than programmatically.
          additionalProperties: false
          required: [row, colName, colId, fromInput]
          properties:
            row:
              type: [integer, string]
              format: int64
              description: The one-based row ordinal.
            colName:
              type: string
              description: The column's name.
            colId:
              type: [integer, string]
              format: int64
              description: The column's identifier.
            fromInput:
              type: boolean
              description: >-
                True when the change came from user input. Preserved because the legacy branches on it,
                so a consumer replaying events needs the same distinction.
        varChanged:
          type: object
          title: ColumnExpEventVarChanged
          description: A variable changed, identified by its index in the global variable table.
          additionalProperties: false
          required: [index, forceCalc]
          properties:
            index:
              type: integer
              format: int32
              description: The variable's index. A 32-bit field, emitted as a JSON number.
            forceCalc:
              type: boolean
              description: >-
                True when the change forces recalculation regardless of the cache state. The engine's
                calculation cache is tri-state, so "unknown" and "no" are different answers and this flag
                overrides both.

    OrderingDiscipline:
      title: OrderingDiscipline
      type: string
      enum: [ORDERING_DISCIPLINE_UNSPECIFIED, ORDERING_DISCIPLINE_SYNCHRONOUS, ORDERING_DISCIPLINE_SEQUENCED]
      x-enum-varnames: [ORDERING_DISCIPLINE_UNSPECIFIED, ORDERING_DISCIPLINE_SYNCHRONOUS, ORDERING_DISCIPLINE_SEQUENCED]
      x-enum-values: [0, 1, 2]
      description: |-
        Which of the two ordering patterns governs a stream, mirrored from
        `dataservices.v1.OrderingDiscipline`. Event ordering is the highest risk in this migration and
        the resolution is to choose **per capability area** between two patterns, so the choice has to be
        readable from the wire rather than from a table a consumer keeps privately in step.

        | Member | Number | Rule for an out-of-order arrival |
        | --- | --- | --- |
        | `ORDERING_DISCIPLINE_UNSPECIFIED` | 0 | Not supplied. A fault on any stream that carries this type |
        | `ORDERING_DISCIPLINE_SYNCHRONOUS` | 1 | **Pattern (b).** A HARD ERROR that fails the session. Reordering is not merely disallowed, it is semantically impossible - the validation-error handler reads and clears state the preceding item-change event stashed |
        | `ORDERING_DISCIPLINE_SEQUENCED` | 2 | **Pattern (a).** A gap or reversal a consumer MAY detect and reorder on, because these events carry no cross-event state |

        `docs/CONTRACTS.md` 6.6 assigns the two per capability area with the evidence for each. **The two
        rules are opposite**, which is why the discipline travels as data: an implementation that applied
        the wrong one would either reorder a chain that must not be reordered or fail a stream that may
        be, and both look like correct behaviour from inside the consumer.

    EventStreamResponse:
      type: object
      title: EventStreamResponse
      x-ordering-discipline: ORDERING_DISCIPLINE_SEQUENCED
      description: |-
        One element of the projected expression event sequence, mirrored from
        `dataservices.v1.EventStreamResponse`.

        **This stream is pattern (a), `ORDERING_DISCIPLINE_SEQUENCED`**, stated on the schema in
        `x-ordering-discipline` rather than left to be inferred. These events are notifications rather
        than a vetoable chain and carry no cross-event state, which is both why they project at all and
        why the monotonic sequence value carries **reorder authority**: a consumer uses it to detect a
        gap and may reorder on it, or may process elements as they arrive.

        The contrast is pattern (b), `ORDERING_DISCIPLINE_SYNCHRONOUS`, which governs the item-change and
        validation chain on C-03 and is **not** projected here. Under that discipline the same kind of
        token is for detection only and an out-of-order arrival is a hard error that fails the session.
        `docs/CONTRACTS.md` 6.6 assigns the two disciplines per capability area and
        `dataservices.v1.OrderingDiscipline` is the enumeration behind both names.
      additionalProperties: false
      required: [event, sequence, discipline]
      properties:
        event:
          $ref: '#/components/schemas/ColumnExpEvent'
        sequence:
          type: [integer, string]
          format: int64
          description: >-
            The event's monotonic sequence number. Under this stream's SEQUENCED discipline it is
            usable for gap detection AND for reordering; under the SYNCHRONOUS discipline that governs
            C-03's item-change chain the equivalent token is for detection only.
        discipline:
          allOf:
            - $ref: '#/components/schemas/OrderingDiscipline'
          description: >-
            Always `ORDERING_DISCIPLINE_SEQUENCED` on this stream. Carried as a member rather than left
            to be inferred from the event identity, so a consumer's ordering behaviour is driven by data
            it already holds.

    ExpressionEventStreamResult:
      title: ExpressionEventStreamResult
      description: >-
        The projection of C-04's `EventStream` server stream: the ordered sequence of events the stream
        would have delivered. A collection rather than an invented envelope, for the same reason
        `RetrieveResult` is one. Element order is the stream's order and is significant.
      type: array
      items:
        $ref: '#/components/schemas/EventStreamResponse'

    # ----------------------------------------------------------------------------------------------
    #  THE `$` VERSUS `$$` FAMILY
    #  --------------------------------------------------------------------------------------------
    #  These six schemas exist because the static-versus-dynamic expansion distinction DOES NOT
    #  SURVIVE NAIVE SERIALIZATION, and a projection that sent an already-expanded string would destroy
    #  it silently.
    #
    #  Static expansion (`$name`) substitutes the variable's value AT THE MOMENT THE EXPRESSION IS SET.
    #  The variable name is then GONE from the stored text, so a later assignment cannot reach it and
    #  the result is fixed permanently. Dynamic expansion (`$$name`) retains the variable AS A
    #  REFERENCE, resolved at calculation time, so a later assignment propagates. The legacy
    #  specification's worked example fixes a static result at 5 for ever while the identical sequence
    #  under dynamic expansion yields 6.
    #
    #  Three things must therefore travel together, and ExpressionBinding carries all three: the
    #  UNEXPANDED source text, the BIND-TIME snapshot, and the LIVE environment. Transmitting an
    #  expanded string would make a static binding indistinguishable from a literal and would strip a
    #  dynamic binding of the environment it needs to resolve against.
    #
    #  AND THE MODE IS TAGGED PER REFERENCE, NEVER PER EXPRESSION. The legacy specification documents an
    #  example mixing dynamic and static expansion INSIDE ONE EXPRESSION, so the mode is a property of
    #  each reference. `VarData.expansionMode` is that tag, mirrored from the proto exactly.
    # ----------------------------------------------------------------------------------------------

    ExpansionMode:
      title: ExpansionMode
      description: |-
        Which expansion applies to **one reference**, mirrored from `dataservices.v1.ExpansionMode`.

        | Member | Number | Meaning |
        | --- | --- | --- |
        | `EXPANSION_MODE_UNSPECIFIED` | 0 | The protobuf zero enumerator; no mode determined |
        | `EXPANSION_MODE_STATIC` | 1 | `$name` - substituted at bind time; later mutation cannot reach it |
        | `EXPANSION_MODE_DYNAMIC` | 2 | `$$name` - retained as a reference; later mutation propagates |
        | `EXPANSION_MODE_DYNAMIC_INDIRECT` | 3 | The variable NAME is itself computed at run time, and may be a DataWindow expression |
        | `EXPANSION_MODE_MACRO_DIRECT` | 4 | A macro invocation with a fixed function name |
        | `EXPANSION_MODE_MACRO_DYNAMIC` | 5 | A macro invocation whose FUNCTION name is itself a variable |

        Five real modes, and the mode belongs to the reference rather than to the expression that
        contains it.
      type: string
      enum:
        - EXPANSION_MODE_UNSPECIFIED
        - EXPANSION_MODE_STATIC
        - EXPANSION_MODE_DYNAMIC
        - EXPANSION_MODE_DYNAMIC_INDIRECT
        - EXPANSION_MODE_MACRO_DIRECT
        - EXPANSION_MODE_MACRO_DYNAMIC
      x-enum-varnames:
        - EXPANSION_MODE_UNSPECIFIED
        - EXPANSION_MODE_STATIC
        - EXPANSION_MODE_DYNAMIC
        - EXPANSION_MODE_DYNAMIC_INDIRECT
        - EXPANSION_MODE_MACRO_DIRECT
        - EXPANSION_MODE_MACRO_DYNAMIC
      x-enum-values: [0, 1, 2, 3, 4, 5]

    VarValue:
      type: object
      title: VarValue
      description: >-
        One expression-variable value, mirrored from `dataservices.v1.VarValue`. **Exactly one member is
        present** - the canonical `oneof` encoding. The seven arms are the seven distinct scalar types
        the legacy variable environment is typed across, carried as a discriminated union rather than a
        stringly-typed map because the coercion behaviour depends on the type: collapsing them to strings
        would lose exactly the information the engine branches on.
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        timeValue:
          $ref: '#/components/schemas/TimeValue'
        stringValue:
          type: string
          description: A legacy `string` variable.
        longValue:
          type: [integer, string]
          format: int64
          description: A legacy `long` variable. Emitted as a string by the canonical mapping.
        doubleValue:
          type: number
          format: double
          description: A legacy `double` variable.
        datetimeValue:
          $ref: '#/components/schemas/DateTimeValue'
        dateValue:
          $ref: '#/components/schemas/DateValue'
        boolValue:
          type: boolean
          description: A legacy `boolean` variable.

    VarData:
      type: object
      title: VarData
      description: >-
        **One variable reference inside an expression**, mirrored from `dataservices.v1.VarData`. This is
        where the per-reference expansion tag lives, and it is the member that makes the `$` / `$$`
        distinction survive the boundary.
      additionalProperties: false
      required: [name, fullName, index, isCtx, isMacro, expansionMode]
      properties:
        name:
          type: string
          description: The variable's name as written in the expression.
        fullName:
          type: string
          description: >-
            The reference as it appeared in the source text, sigils included - which is what makes a
            `$name` reference distinguishable from a `$$name` one after the fact.
        index:
          type: integer
          format: int32
          description: >-
            The reference's index into the global variable table. A dynamic reference resolves through
            this at calculation time; a static one has already been substituted and does not.
        isCtx:
          type: boolean
          description: True when the reference resolves from the calculation context rather than the table.
        isMacro:
          type: boolean
          description: True when the reference is a macro invocation rather than a plain variable.
        expansionMode:
          $ref: '#/components/schemas/ExpansionMode'

    FuncData:
      type: object
      title: FuncData
      description: >-
        One function reference inside an expression, mirrored from `dataservices.v1.FuncData`. An **empty
        `name`** is the legacy's own sentinel for a bare variable rather than a call, so an empty value
        here is meaningful and must not be treated as missing.
      additionalProperties: false
      required: [name, fullName, args, builtin]
      properties:
        name:
          type: string
          description: The function's name. Empty is the sentinel for a bare variable.
        fullName:
          type: string
          description: The reference as it appeared in the source text.
        args:
          type: array
          description: The argument expressions, in positional order.
          items:
            type: string
        builtin:
          type: boolean
          description: >-
            True for a function the engine implements itself, false for one the application must supply
            through the macro channel.

    ForeignVarRef:
      type: object
      title: ForeignVarRef
      description: |-
        A reference to a variable owned by **another** DataWindow's expression service, mirrored from
        `dataservices.v1.ForeignVarRef`.

        ## This is the one deliberately narrowed contract in the refactor, and it is published rather than hidden

        The legacy member behind this is a **live object pointer** to another DataWindow's expression
        service, and a pointer does not serialize. Cross-DataWindow references are therefore supported
        **only** when both DataWindows are co-resident in the same expression session inside one
        DataServices instance, addressed by the session-scoped handle below. A reference spanning
        sessions or service instances is **BLOCKED with a defined error** rather than approximated,
        because approximating a pointer dereference across a network would produce results that are wrong
        in a way no test would obviously catch.

        Narrow with a defined error; never widen with a guess.
      additionalProperties: false
      required: [index, foreignDatawindowHandle, resolvable]
      properties:
        index:
          type: integer
          format: int32
          description: The reference's index in the owning table.
        foreignDatawindowHandle:
          type: string
          description: >-
            The **session-scoped** handle of the DataWindow that owns the variable. Session-scoped rather
            than global precisely because the legacy pointer's reach could not be reproduced.
        resolvable:
          type: boolean
          description: >-
            False when the reference cannot currently be resolved - the co-resident session has ended, or
            the reference spans instances. A reference can be accepted and later become unresolvable,
            which is why this is reported per reference rather than only refused at registration.

    LocalVarData:
      type: object
      title: LocalVarData
      description: >-
        A variable whose value is **itself an expression**, mirrored from
        `dataservices.v1.LocalVarData`. Recursive by nature: the expression may carry its own variable
        and function references, each with its own expansion mode, so the structure nests exactly as the
        legacy one does.
      additionalProperties: false
      required: [exp, vars, fns, hasMacro]
      properties:
        exp:
          type: string
          description: The variable's own expression text, unexpanded.
        vars:
          type: array
          description: The variable references inside that expression, each with its own expansion mode.
          items:
            $ref: '#/components/schemas/VarData'
        fns:
          type: array
          description: The function references inside that expression.
          items:
            $ref: '#/components/schemas/FuncData'
        hasMacro:
          type: boolean
          description: True when the expression contains a macro invocation.
        value:
          $ref: '#/components/schemas/VarValue'

    GlobalVarData:
      type: object
      title: GlobalVarData
      description: |-
        One entry in the engine's global variable table, mirrored from `dataservices.v1.GlobalVarData`.

        `varType` decides which of the two value arms applies: a **local** variable resolves from this
        service's own table, and a **foreign** one resolves through another DataWindow's expression
        service subject to the narrowing `ForeignVarRef` documents.

        | `varType` | Number | Resolution |
        | --- | --- | --- |
        | `VAR_LOCAL` | 0 | From this service's own table |
        | `VAR_FOREIGN` | 1 | Through another DataWindow's expression service |

        **A foreign variable requires dynamic expansion**, which the legacy specification states
        directly: a statically expanded reference has already been substituted at bind time, so there is
        nothing left for a foreign lookup to resolve.
      additionalProperties: false
      required: [name, varType]
      properties:
        name:
          type: string
          description: The variable's name.
        varType:
          title: GlobalVarType
          description: >-
            Which arm resolves this variable. Numbers in order: 0 local, 1 foreign.
          type: string
          enum: [VAR_LOCAL, VAR_FOREIGN]
          x-enum-varnames: [VAR_LOCAL, VAR_FOREIGN]
          x-enum-values: [0, 1]
        local:
          $ref: '#/components/schemas/LocalVarData'
        foreign:
          $ref: '#/components/schemas/ForeignVarRef'
        links:
          type: array
          description: >-
            The onward foreign references this entry links to. Each is subject to the same co-residency
            narrowing, and each reports its own resolvability.
          items:
            $ref: '#/components/schemas/ForeignVarRef'

    ExpressionBinding:
      type: object
      title: ExpressionBinding
      description: |-
        **The three-part payload that makes the `$` versus `$$` distinction survive a network boundary**,
        mirrored from `dataservices.v1.ExpressionBinding`.

        All three parts travel together, and none is optional in practice:

        1. **`unexpandedExp`** - the source text as written, before any substitution. Sending an expanded
           string instead would make a static binding indistinguishable from a literal.
        2. **`bindTimeSnapshot`** - the variable values as they stood when the expression was set. This
           is what a static (`$name`) reference resolved against, and it is why a static result never
           changes afterwards.
        3. **`liveEnvironment`** - the variable values as they stand now. This is what a dynamic
           (`$$name`) reference resolves against at calculation time, and it is why a dynamic result
           tracks later mutation.

        The reference arrays then say, **per reference**, which of the two applied - or which of the
        three further modes did. Without the arrays a consumer holding both maps still could not tell
        which map any particular reference should be read from.

        ## Where this shape travels, and why it is published without a `$ref`

        It is the shape of the `bindings` member of C-04's `GetExpressionStateResponse`, returned by
        `POST /v1/datawindow/expression/engine-state` when the request asks for bindings. That response
        is a delegated envelope - its members are named in the operation's `x-proto-response` extension -
        so nothing in this document `$ref`s this schema, and a style linter will report it as unused.

        It is published anyway because this is the **one** contract detail the requirements single out as
        not surviving naive serialization. A consumer that could not see the three parts and the
        per-reference mode would reasonably send an already-expanded string, and the distinction would be
        destroyed silently rather than rejected. The Tier-1 section header records the trade in full.
      additionalProperties: false
      required: [unexpandedExp]
      properties:
        unexpandedExp:
          type: string
          description: The expression's source text, unexpanded. Part 1 of the three.
        bindTimeSnapshot:
          type: object
          description: >-
            The bind-time variable values, keyed by variable name. Part 2 of the three - what a static
            reference resolved against. A protobuf `map<string, VarValue>`.
          additionalProperties:
            $ref: '#/components/schemas/VarValue'
        liveEnvironment:
          type: object
          description: >-
            The current variable values, keyed by variable name. Part 3 of the three - what a dynamic
            reference resolves against now. A protobuf `map<string, VarValue>`.
          additionalProperties:
            $ref: '#/components/schemas/VarValue'
        vars:
          type: array
          description: >-
            The variable references, each carrying its own `expansionMode`. **Per reference, never per
            expression** - the legacy specification documents an example mixing static and dynamic
            expansion inside one expression.
          items:
            $ref: '#/components/schemas/VarData'
        fns:
          type: array
          description: The function references.
          items:
            $ref: '#/components/schemas/FuncData'
        globalVars:
          type: array
          description: The global variable table entries the references resolve through.
          items:
            $ref: '#/components/schemas/GlobalVarData'

    AggregateHealthReport:
      type: object
      title: AggregateHealthReport
      description: |-
        Gateway's readiness **and that of each of its three upstreams individually**.

        Gateway reports `Healthy` only after Persistence, DataServices and Security all do. The
        aggregate names each upstream with its own state rather than returning one opaque verdict,
        because an operator reading a failed aggregate needs to know which upstream is responsible.

        Gateway observes each upstream's anonymous `/health` and composes the three verdicts. **That
        observation is not a call into any upstream's capability**, which is what lets this aggregate
        name Persistence while Gateway never calls Persistence: the probe addresses are configured as a
        separate group from the two services Gateway invokes, and Gateway holds no Persistence client.
      additionalProperties: false
      required: [status, service, upstreams]
      properties:
        status:
          type: string
          enum: [Healthy, Degraded, Unhealthy]
          x-enum-varnames: [Healthy, Degraded, Unhealthy]
          description: |-
            The aggregate verdict, carrying the distinction contract C-10 requires between "not ready"
            and "unhealthy":

            - `Healthy` - Gateway and all three upstreams are ready. Reported with HTTP 200, and the
              only verdict that is.
            - `Degraded` - **not ready**, but not failed. Gateway is still completing startup
              validation, or an upstream is. Reported with HTTP **503**, because not ready is not
              ready: the readiness gate observes the status code, so answering 200 here would let a
              dependent start against an aggregate that had just said it was not usable.
            - `Unhealthy` - **failed**. Reported with HTTP 503.
        service:
          type: string
          const: gateway
          description: The reporting service.
        checkedAt:
          type: string
          format: date-time
          description: When this report was produced, so a consumer can detect a stale cached report.
        upstreams:
          type: array
          minItems: 3
          maxItems: 3
          description: >-
            The three upstreams Gateway aggregates, each named with its own state. Exactly three:
            Persistence, DataServices and Security. No entry exists for any deferred service, because
            no deferred service exists.
          items:
            $ref: '#/components/schemas/UpstreamHealth'
        checks:
          type: array
          description: >-
            Gateway's own component checks, behind its own contribution to the verdict. Carries no
            configuration value, no connection string and no key material.
          items:
            $ref: '#/components/schemas/HealthCheckResult'

    UpstreamHealth:
      type: object
      title: UpstreamHealth
      description: One upstream's individually reported state within Gateway's aggregate.
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          type: string
          enum: [persistence, dataservices, security]
          x-enum-varnames: [Persistence, DataServices, Security]
          description: >-
            Which upstream this entry describes. The enumeration is closed at three: the composition
            root depends on exactly these, and the 5103 slot in the port band is a commented Phase-2
            placeholder rather than a fourth participant.
        status:
          type: string
          enum: [Healthy, Degraded, Unhealthy, Unreachable]
          x-enum-varnames: [Healthy, Degraded, Unhealthy, Unreachable]
          description: >-
            This upstream's own verdict, or `Unreachable` when Gateway could not obtain one at all.
            `Unreachable` is distinguished from `Unhealthy` because they call for different operator
            action - a network or startup-ordering problem rather than a failed dependency inside a
            running service.
        detail:
          type: string
          description: >-
            A human-readable note about this upstream's state. Never carries a connection string, a
            key, or any configuration value.

    HealthCheckResult:
      type: object
      title: HealthCheckResult
      description: >-
        One component check behind a verdict. Present so an operator can tell which check is not yet
        satisfied rather than only that something is not.
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          description: The check's identifier.
        status:
          type: string
          enum: [Healthy, Degraded, Unhealthy]
          x-enum-varnames: [Healthy, Degraded, Unhealthy]
          description: This check's own verdict.
        detail:
          type: string
          description: >-
            A human-readable note. **Carries no configuration value, no connection string and no key
            material** - a health endpoint is anonymous, so anything it reports is public.

    PingResponse:
      type: object
      title: PingResponse
      description: >-
        The successful half of the authentication proof. Returned only when a valid token was
        presented; the absence of a token yields 401, and both outcomes are part of contract C-10. The
        body deliberately does not echo the presented token, any claim of it, or any part of the
        verification material.
      additionalProperties: false
      required: [service, authenticated]
      properties:
        service:
          type: string
          const: gateway
          description: The responding service.
        authenticated:
          type: boolean
          const: true
          description: >-
            Always true when this body is returned, because the operation cannot be reached without a
            valid token. It is present so that a conformance test asserting the authenticated path has
            something explicit to assert on rather than inferring success from a status code.
        timestamp:
          type: string
          format: date-time
          description: When the response was produced.

    CapabilityReport:
      type: object
      title: CapabilityReport
      description: |-
        The framework's eight-bit capability gate, projected as configuration.

        The bit identifiers are the legacy `SCREAMING_SNAKE` spellings from
        `ws_objects/pfw.shared.pbl.src/enums.sru:L41-L49`, preserved verbatim in deliberate departure
        from .NET naming convention because they appear in serialized payloads, log records and
        characterization recordings (Agent Action Plan 0.4.5.3).
      additionalProperties: false
      required: [effectiveMask, allMask, capabilities]
      properties:
        effectiveMask:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: |-
            The bitmask actually in effect in this deployment.

            The domain is the full **unsigned 32-bit** range, not the signed one. The configured value
            is projected with an **unchecked** conversion, so every one of the 2^32 values is
            representable and none is rejected - a negative configured value wraps rather than
            failing. That is deliberate: the legacy flag word is an unsigned long, and rejecting a
            wrapped value would make a configuration that the legacy accepted fail to start.
        allMask:
          type: integer
          format: int64
          const: 3847
          description: |-
            The value of `INIT_FLAG_ENABLE_ALL`, which is **3847** and is fixed by the legacy
            declaration rather than by this deployment - hence `const` rather than a range.

            `ws_objects/pfw.shared.pbl.src/enums.sru:L49` declares it as a **seven-term sum**:
            `INIT_FLAG_ENABLE_UI` (1) + `INIT_FLAG_ENABLE_SCITER` (2) + `INIT_FLAG_ENABLE_BLINK` (4)
            + `INIT_FLAG_ENABLE_ORCA` (256) + `INIT_FLAG_ENABLE_SQLITE` (512)
            + `INIT_FLAG_ENABLE_DPIAWARE` (1024) + `INIT_FLAG_ENABLE_WEBVIEW` (2048) = **3847**.

            **It deliberately omits `INIT_FLAG_ENABLE_BLINKFAST` (8).** That is not an oversight and
            must not be "corrected": `blink.dll` and `blinkfast.dll` are alternative builds of one
            engine, so enabling both is meaningless. The omission is reproduced verbatim under C-B, so
            `allMask` is **not** the bitwise union of every declared bit - that union would be 3855, and
            a consumer computing it that way would disagree with the framework by exactly the
            `BLINKFAST` bit.
        unrecognizedBits:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: >-
            Any bits set in `effectiveMask` that are not among the eight declared capabilities.
            Reported rather than rejected, so a configuration carrying a future or mistaken bit starts
            and says so instead of failing.
        capabilities:
          type: array
          minItems: 8
          maxItems: 8
          description: >-
            All eight declared capabilities with their values and enabled state. Exactly eight - the
            set is closed by the legacy declaration.
          items:
            $ref: '#/components/schemas/Capability'

    Capability:
      type: object
      title: Capability
      description: One declared capability bit.
      additionalProperties: false
      required: [name, value, enabled, phaseOneDestination]
      properties:
        name:
          type: string
          enum:
            - INIT_FLAG_ENABLE_UI
            - INIT_FLAG_ENABLE_SCITER
            - INIT_FLAG_ENABLE_BLINK
            - INIT_FLAG_ENABLE_BLINKFAST
            - INIT_FLAG_ENABLE_ORCA
            - INIT_FLAG_ENABLE_SQLITE
            - INIT_FLAG_ENABLE_DPIAWARE
            - INIT_FLAG_ENABLE_WEBVIEW
          x-enum-varnames:
            - INIT_FLAG_ENABLE_UI
            - INIT_FLAG_ENABLE_SCITER
            - INIT_FLAG_ENABLE_BLINK
            - INIT_FLAG_ENABLE_BLINKFAST
            - INIT_FLAG_ENABLE_ORCA
            - INIT_FLAG_ENABLE_SQLITE
            - INIT_FLAG_ENABLE_DPIAWARE
            - INIT_FLAG_ENABLE_WEBVIEW
          description: >-
            The legacy identifier, spelled exactly as `enums.sru:L41-L48` declares it. Preserved
            verbatim because it appears in stored characterization comparisons. The `x-enum-varnames`
            list is identical to the `enum` list here - deliberately, because the wire value *is* the
            legacy symbol, so a generator has nothing to translate and the pairing is what makes the
            member order line up with the numeric set on `value` below.
        value:
          type: integer
          format: int64
          # THE SAME CLOSED SET AS `name`, IN THE SAME ORDER, EXPRESSED NUMERICALLY. The pairing of an
          # exact numeric `enum` with `x-enum-varnames` carrying the SCREAMING_SNAKE identifiers is the
          # convention the sibling OpenApi/security.v1.yaml uses for every legacy constant set, and it
          # is used here for the same reason: the numbers are what appear in a serialized payload, a log
          # record and a characterization recording, and the identifiers are what a reader recognises.
          # Neither alone is sufficient, and `name[i]` corresponds to `value[i]` by construction.
          enum: [1, 2, 4, 8, 256, 512, 1024, 2048]
          x-enum-varnames:
            - INIT_FLAG_ENABLE_UI
            - INIT_FLAG_ENABLE_SCITER
            - INIT_FLAG_ENABLE_BLINK
            - INIT_FLAG_ENABLE_BLINKFAST
            - INIT_FLAG_ENABLE_ORCA
            - INIT_FLAG_ENABLE_SQLITE
            - INIT_FLAG_ENABLE_DPIAWARE
            - INIT_FLAG_ENABLE_WEBVIEW
          description: >-
            The bit's numeric value, exactly as `enums.sru:L41-L48` declares it. The eight are sparse -
            1, 2, 4, 8, 256, 512, 1024, 2048 - rather than the first eight powers of two, and the gap
            between 8 and 256 is the legacy's own: bits 16, 32, 64 and 128 are simply not declared. The
            set is closed because the legacy declaration is closed; a ninth capability would be a change
            to this published contract.
        enabled:
          type: boolean
          description: Whether this bit is set in `effectiveMask`.
        phaseOneDestination:
          type: string
          enum: [Persistence, DesignSystem, ScriptBridge, PackagingTooling]
          x-enum-varnames: [Persistence, DesignSystem, ScriptBridge, PackagingTooling]
          description: >-
            Where this capability's implementation lives in the Phase-1 slice. **Only
            `INIT_FLAG_ENABLE_SQLITE` maps to an in-scope service.** `PackagingTooling` is
            `INIT_FLAG_ENABLE_ORCA`, which is build tooling rather than a service at all - so a client
            can see from this field that enabling a bit whose destination is deferred has no runtime
            effect in this phase.

    ReservedRouteBody:
      type: object
      title: ReservedRouteBody
      description: |-
        The `501` body returned by each of the four reserved routes.

        **Machine-readable rather than a text message**, so a client can branch on it without parsing
        prose - which is the whole point of declaring the routes: the shape of the eventual system is
        legible from this contract, while nothing is implemented behind it.
      additionalProperties: false
      required: [status, service, deferredService, marker, route, retCode]
      properties:
        status:
          type: integer
          const: 501
          description: Always 501. Repeated in the body so a logged body is self-describing.
        service:
          type: string
          enum: [DesignSystem, Documents, Integration, ScriptBridge]
          x-enum-varnames: [DesignSystem, Documents, Integration, ScriptBridge]
          description: |-
            The deferred service this route will eventually reach. **The same value as
            `deferredService`, and it is retained because it is the member this document published for
            `v1` first.**

            AN UNVERSIONED WIRE MEMBER IS NOT A NAME TO IMPROVE. A later revision introduced
            `deferredService` for a real reason - `service` already means the *responding* service on
            `PingResponse` and an *upstream* service on `UpstreamHealth`, and a third meaning on one word
            makes a body ambiguous in exactly the place a client branches on it - and then removed
            `service`. That silently broke every `v1` consumer reading it, under a version number that
            promises it did not change. Both members are therefore emitted, carrying the identical value:
            a consumer written against the original contract keeps working, and one written against the
            unambiguous name gets it. Neither is deprecated in `v1`; retiring `service` is a `v2`
            decision, not a tidying one.
        deferredService:
          type: string
          enum: [DesignSystem, Documents, Integration, ScriptBridge]
          x-enum-varnames: [DesignSystem, Documents, Integration, ScriptBridge]
          description: |-
            The deferred service this route will eventually reach. The four are the Phase-2 half of the
            eight-service target roster; `docs/DEFERRED.md` is the authoritative roster and records
            which legacy objects each is assigned.

            **The name is the whole of what this member carries, and that is the point.** Naming the
            destination is required by the contract - it is what makes the eventual system legible - and
            nothing beyond the name is permitted, because anything further would begin to describe a
            capability that must not be modelled.

            The unambiguous spelling, and the one to prefer in new code: `service` is already used in
            this document for the **responding** service (`PingResponse`) and for an **upstream** service
            (`UpstreamHealth`), and a third meaning on the same word would make a body ambiguous in
            exactly the place a client branches on it. It also matches the `x-deferred-service` extension
            each reserved operation carries, so the wire member and the routing metadata read the same.

            It does not REPLACE `service` in `v1`, it accompanies it. Both are emitted with the identical
            value; see `service` above for why removing the original member was a compatibility break
            rather than a rename.
        marker:
          type: string
          const: reserved for Phase 2
          description: >-
            The literal marker `reserved for Phase 2`, exactly as specified. A constant rather than
            free text so a conformance test and a client can both match on it.
        route:
          type: string
          description: The matched route pattern, echoed so a client can log what it asked for.
        retCode:
          type: integer
          format: int64
          const: -2001
          description: |-
            `E_NO_IMPLEMENTATION`, which the legacy framework declares as **-2001**
            [`ws_objects/pfw.shared.pbl.src/retcode.sru:L78`].

            **The legacy's own not-implemented code, rather than a parallel vocabulary invented for
            this document.** It is the same value `common.v1.RetCode.Value.E_NO_IMPLEMENTATION` carries
            on the gRPC half of the boundary and the same value
            `PowerFramework.Shared.Kernel.RetCode.E_NO_IMPLEMENTATION` carries in process, so a client
            that branches on `retCode` handles a reserved route with the code it already knows. Its
            neighbour `E_NO_SUPPORT` (-2000) is a different statement - "this framework does not support
            that" rather than "this is not implemented here" - and is deliberately not used.

            A constant rather than an open integer, because a reserved route has exactly one outcome.
