  /v1/datawindow/expression/event-stream:
    post:
      operationId: getExpressionEventStream
      x-contract-id: C-04
      x-required-scope: datawindow
      x-grpc-method: dataservices.v1.ColumnExpressionService/EventStream
      x-proto-request: dataservices.v1.EventStreamRequest
      x-proto-response: dataservices.v1.EventStreamResponse
      x-grpc-streaming: server
      tags: [ColumnExpression]
      summary: Poll the engine's own event sequence as an ordered collection. Token required.
      description: |-
        The three events the expression engine declares **on itself**, projected from C-04's
        `EventStream`: the item-changed notification, the deferred item-changed notification, and the
        variable-changed notification that carries the recalculation-forcing flag.

        ## Projected because it is a SERVER stream, unlike the two that are not

        `EventStream` is server-streaming. The server produces a sequence and the client consumes it in
        order, so it has a faithful request/response projection: the ordered collection below, with each
        element retaining its own monotonic `sequence` value so a consumer can detect a gap rather than
        merely hope there was none.

        This is exactly the property `InvokeMethodChannel` and `TraceChannel` lack. Both are
        **inverted** - the legacy expects the *application* to implement the macro switch, so across a
        boundary DataServices calls back **into** its client - and an inverted stream has no
        request/response direction to project at all. Neither has a REST path here, and the introduction
        names them individually so the gap is checkable.

        ## The sequence value carries reorder authority here, and that is pattern (a)

        This stream is under **`ORDERING_DISCIPLINE_SEQUENCED`** - pattern (a) of the two disciplines
        `docs/CONTRACTS.md` 6.6 assigns per capability area, and the discipline is named on the response
        itself in `x-ordering-discipline` so a consumer reads it from the contract rather than inferring
        it from the event identity. These events are notifications rather than a vetoable chain: they
        carry no cross-event state, so the token is what a consumer uses to **detect a gap and, if it
        chooses, to reorder**. Processing them as they arrive is equally valid.

        **The other discipline is the one that forbids reordering, and the difference is the point.**
        Pattern (b), `ORDERING_DISCIPLINE_SYNCHRONOUS`, governs the item-change and validation chain on
        C-03 - which is *not* projected here - and there the token is for **detection only**: an
        out-of-order arrival is a hard error that fails the session, never a reorder opportunity, because
        the validation-error handler consumes state the preceding item-change event stashed and a
        re-sorted chain reads a stash written by the wrong predecessor. So a consumer must not carry
        either habit across: reordering is permitted where the discipline says SEQUENCED and is a fault
        where it says SYNCHRONOUS. Reading the discipline is how you tell, which is why it is on the
        wire.

        ## THIS OPERATION IS A BOUNDED POLL, NOT THE SUBSCRIPTION'S WHOLE LIFETIME

        **This is the one place where the projection deliberately does not mirror its gRPC twin, and a
        consumer that misses it will misread every empty response.** `EventStream` is a SUBSCRIPTION: the
        server ends it only when the client goes away. A request/response operation cannot wait for that -
        waiting is how a projection of an open-ended stream stops answering at all - so the collection is
        bounded by a **finite collection window** configured on the serving side, and the response is the
        records that arrived within it.

        Three consequences, each of which is contract rather than implementation:

        * **An empty array is a complete, successful answer.** It means *no event was emitted during the
          window*, and never *the subscription ended*. There is no status that means the latter, because
          the subscription does not end.
        * **A response is not the whole sequence, so poll again.** Each record carries its own monotonic
          `sequence`, which is how a consumer detects a gap between one poll and the next - the same token
          it uses to detect a gap within one response.
        * **A caller that needs continuous delivery should use the gRPC stream**, which carries no window
          because it needs none. The projection exists so the capability is reachable over HTTP, not so
          that HTTP becomes the better transport for it.

        The window is a deployment setting and is deliberately not published as a number here: it is a
        completeness rule rather than a service-level promise, and **no latency budget, throughput target
        or availability commitment is published anywhere in this system**, so a number in this document
        would read as one. The shipped value is two seconds, and both this gateway and the service behind
        it refuse to start on a window that could not fire before the request it bounds is abandoned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventStreamRequest'
      responses:
        '200':
          description: >-
            The collection window closed. The body is the ordered events the gRPC server stream delivered
            within it, each element carrying its own monotonic sequence value. An EMPTY array is a
            complete, successful answer meaning no event was emitted during the window - never that the
            subscription ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpressionEventStreamResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/UpstreamBusy'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamUnavailable'
        '503':
          $ref: '#/components/responses/UpstreamRefused'
        '504':
          $ref: '#/components/responses/UpstreamTimedOut'

  # ================================================================================================
  #  THE FOUR RESERVED EXTENSION POINTS  (docs/CONTRACTS.md 13)
  #
  #  Each returns 501 with a machine-readable body naming the deferred service. These are ROUTING
  #  DECLARATIONS. There is no project, no container definition, no test project, no partial
  #  implementation and no exception-throwing placeholder class for any of the four deferred services
  #  - see docs/CONTRACTS.md 13.1, which states the compliance position so it is auditable rather
  #  than argued.
  #
  #  The catch-all path parameter is what makes each a route FAMILY rather than a single route, so a
  #  Phase-2 consumer's eventual URL shape is already legible from this contract.
  #
  #  STRUCTURAL SYMMETRY IS PART OF THE COMPLIANCE POSITION, NOT A TIDINESS PREFERENCE.
  #  The four declarations below are IDENTICAL in shape: the same templated catch-all path, the same
  #  single path parameter, the same two methods, NO request body on either, and the same two responses
  #  - `401` referencing the shared Unauthorized response and `501` referencing one shared reserved body
  #  schema. They differ ONLY in the path segment and in the deferred service they name. If one of the
  #  four ever acquired more shape than the others - a request schema, a THIRD status, an extra field -
  #  that asymmetry would BE the evidence that capability modelling had crept in, which is precisely
  #  what C-D forbids. Diffing them against each other is therefore a meaningful audit, and it is meant
  #  to be performed.
  #
  #  WHY THE RESPONSE SET IS {401, 501} AND WHY 501 IS STILL THE ONLY OUTCOME THE ROUTE PRODUCES.
  #  These two statuses are not two outcomes of one handler; they are the two things a caller can
  #  actually receive, and both belong in the contract because a generated client and a conformance tool
  #  are told the response set is exhaustive.
  #
  #    401  What an UNAUTHENTICATED request meets. The document-level bearer requirement applies to all
  #         eight operations and none overrides it, so the deferred roster is not anonymously
  #         enumerable - the request is refused by the authentication middleware BEFORE any handler
  #         runs. Declaring {501} alone is the tempting reading, on the reasoning that a cross-cutting
  #         concern is not a response this ROUTE produces. The reasoning is sound about where the refusal comes
  #         from and wrong about what a consumer needs: a client generated from a set that omits 401 is
  #         told these operations cannot return the status they demonstrably do return, and a
  #         conformance tool checking response coverage reports a violation against a correct server.
  #    501  The only HANDLER result, and it is unconditional - every method, every path remainder, no
  #         evaluation of anything. That is the property the compliance position rests on, and it is
  #         unaffected by declaring the pre-handler refusal beside it.
  #
  #  WHAT WOULD STILL BE A VIOLATION, STATED SO THE LINE IS AUDITABLE: any 2xx, which would say part of
  #  a deferred service had been built; and any 4xx OTHER than the 401 above, which would say the route
  #  evaluates the request before answering. Neither appears. The eight declarations remain identical in
  #  shape, so diffing them against each other is still a meaningful audit.
  # ================================================================================================

