  # ================================================================================================
  #  THE FOUR RESERVED EXTENSION POINTS  (docs/CONTRACTS.md 13)
  #
  #  Each returns 501 with a machine-readable body naming the deferred service. These are ROUTING
  #  DECLARATIONS. There is no project, no container definition, no test project, no partial
  #  implementation and no exception-throwing placeholder class for any of the four deferred services
  #  - see docs/CONTRACTS.md 13.1, which states the compliance position so it is auditable rather
  #  than argued.
  #
  #  The catch-all path parameter is what makes each a route FAMILY rather than a single route, so a
  #  Phase-2 consumer's eventual URL shape is already legible from this contract.
  # ================================================================================================

  /v1/design/{path}:
    parameters:
      - $ref: '#/components/parameters/ReservedPath'
    get:
      operationId: reservedDesignSystem
      x-contract-id: C-09
      x-deferred-service: DesignSystem
      x-reserved-marker: reserved for Phase 2
      tags: [Reserved]
      summary: Reserved for the deferred DesignSystem service. Always 501.
      description: |-
        **Reserved for Phase 2. Not implemented.**

        This route family will eventually reach the **DesignSystem** service: theming, geometry
        structures, colour functions, the DPI conversion family, canvas, painter, font, image, image
        list, popup menu, tooltip, tray icon, timer, `win32` interop, the logo control, and the
        **presentational halves** of ColumnSort, ContextMenu and DropDownSearch.

        Three DataWindow services in scope are irreducibly part presentational and each is split: the
        **headless half ships** on C-03 - the data model, the filter and sort expression construction,
        the row-selection state machine, and the menu *item* model including labels, identifiers,
        enabled and split flags and computed logical text widths - while the **rendering half is
        deferred** and reached, eventually, through here. That is a documented capability gap with an
        enumerable boundary, not a silent omission.

        Nothing exists behind this route. It has no handler beyond the constant response below, it
        calls nothing, and it can reach nothing.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          $ref: '#/components/responses/ReservedForPhaseTwo'

