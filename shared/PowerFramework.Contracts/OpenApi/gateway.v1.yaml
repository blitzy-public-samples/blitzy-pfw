        This route family will eventually reach the **Documents** service: JSON and its helpers, the
        XML object family, ZIP, barcode and QR generation, file scanning, logging, and the
        date/number conversion set.

        Note one thing this route is **not** needed for: the shared Localization library reads
        `pfw.i18n.xml` with `System.Xml.Linq` rather than with the deferred XML object family, so
        localization acquires **no** Documents coupling and does not wait on this service.

        Nothing exists behind this route.
