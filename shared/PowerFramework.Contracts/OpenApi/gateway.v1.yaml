      summary: Add a column expression.
      description: |-
        Adds an expression to a column.

        ## The payload must carry three things, not one

        A variable reference expands in one of five modes - **static**, **dynamic**,
        **dynamic-indirect**, **macro-direct** and **macro-dynamic** - and the mode is a **per-
        reference** property, not a per-expression one: the legacy specification documents an example
        mixing static and dynamic expansion inside a single expression
        [`docs/n_cst_dwsvc_columnexp.md`].

        Static expansion (`$name`) substitutes the variable's value **at the moment the expression is
        set**, so the variable name is *gone* from the stored text and no later assignment can reach
        it. Dynamic expansion (`$$name`) retains a **reference**, resolved at calculation time, so
        later mutation propagates. The documented worked example fixes a static result at 5
        permanently while the dynamic one yields 6.

        Consequently the request carries **all three** of the unexpanded source expression text, the
        bind-time variable snapshot, and the live variable environment - plus, per reference, which
        expansion mode applied. Transmitting an already-expanded string would make static bindings
        indistinguishable from literals and strip dynamic bindings of their resolution environment.
