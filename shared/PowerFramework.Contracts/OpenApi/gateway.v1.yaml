    DropDownSearchState:
      type: object
      title: DropDownSearchState
      x-proto-message: dataservices.v1.DropDownSearchState
      description: |-
        DropDownSearchState - the headless half of the drop-down search service.

        `dataservices.v1.DropDownSearchState` in `Proto/dataservices.v1.proto`, generated from the
        compiled descriptor. Response-only, so `required` lists every member without explicit
        presence - see the section note.
      additionalProperties: false
      required:
        - showFilteredRows
        - columnName
        - filterExpression
        - rowCount
        - filteredCount
        - hasFilter
        - searchValues
      properties:
        filterType:
          type: [integer, string]
          format: uint64
          minimum: 0
          maximum: 18446744073709551615
          description: |-
            A bit-or of FilterType values [n_cst_dwsvc_dropdownsearch.sru:L50-L53].

            `unsignedlong` at source, so uint64 here per the scalar rule. THE LEGACY DEFAULT IS
            FILTER_DISP + FILTER_DISP_PY = 3, not FILTER_ALL [:L57] - the data column is NOT
            searched unless the caller asks. Preserved as the legacy's default rather than the more
            generous one.

            DECLARED proto3 `optional` BECAUSE THE LEGACY DEFAULT IS 3 AND A PROTOBUF NUMERIC
            DEFAULTS TO 0 (C-B, C-K). Without presence tracking, a caller that simply did not set
            this field would be indistinguishable from one that asked for FILTER_NONE - so an
            unpopulated message would silently request "search no columns at all", which is not
            merely a different default but a state the legacy never starts in. With presence, ABSENT
            MEANS "use the legacy default of 3" and 0 means the caller explicitly asked for
            FILTER_NONE. The two are different requests and the wire can now say which.
        showFilteredRows:
          type: boolean
          description: >-
            `#ShowFilteredRows` [:L58] - show the rows the filter removed.
        columnName:
          type: string
          description: >-
            The column the filter applies to.
        filterExpression:
          type: string
          description: |-
            THE CONSTRUCTED FILTER EXPRESSION, VERBATIM - the headless product of this service and
            the reason it can ship at all.

            The legacy builds it at [:L315-L330] as, for the display clause, `(Lower(<dispCol>) LIKE
            '%<data>%')` [:L319], optionally OR-ed with the pinyin clause below, and optionally
            OR-ed with a data-column clause.

            TWO DEFECTS TRAVEL WITH THIS FIELD AND ARE PRESERVED (C-B): 1. THE USER'S INPUT IS
            INTERPOLATED UNESCAPED. A quote in the search text lands inside a quoted expression
            literal. The observable generated expression is preserved byte for byte, and the
            exposure is recorded rather than silently fixed - fixing it would change the generated
            expression, which is the one thing parity measures. 2. The input is lower-cased and its
            spaces are replaced by `%` wildcards [:L316-L317] before interpolation, so a multi-word
            search becomes a wildcard chain. That is intended behaviour, but it means this field is
            NOT the user's text and must not be shown back to them as such.

            ============ COMPATIBILITY AND DIAGNOSTIC DATA. IT IS NOT AN EXECUTABLE INSTRUCTION.
            ========== THIS FIELD MUST NEVER BE HANDED TO AN EVALUATOR, A FILTER SETTER OR ANY OTHER
            EXPRESSION SINK BY A RECEIVER. It exists for exactly two purposes: byte-for-byte
            comparison against a characterization recording, and display in a diagnostic. The reason
            is defect 1 above - the search text is interpolated with NO quote escaping, so a crafted
            value can BALANCE the literal and append its own predicate, which is expression
            injection rather than a merely malformed string. Preserving the generated text is
            required for parity; executing text received over a network is not, and nothing in the
            legacy required it either, because in-process the string was built from local input.

            A RECEIVER THAT NEEDS TO APPLY A FILTER USES `search_values` BELOW and constructs the
            expression itself through the bound-literal path, so the untrusted value never reaches
            the sink as syntax. The two fields are therefore not redundant: this one records what
            the legacy WOULD HAVE PRODUCED, and that one carries what the filter is ABOUT.
            ==========================================================================================
        rowCount:
          type: [integer, string]
          format: int64
          description: >-
            Rows remaining and rows removed, matching `onddsfiltered`'s two count parameters.
        filteredCount:
          type: [integer, string]
          format: int64
        hasFilter:
          type: boolean
          description: >-
            `of_hasfilter()` [:L74] - whether a filter is currently applied.
        searchValues:
          type: array
          items:
            type: string
          description: |-
            THE RAW SEARCH VALUES, CARRIED SEPARATELY FROM THE EXPRESSION AND NEVER PRE-ESCAPED.

            This is the caller's actual input, exactly as typed, with none of the transformations
            `filter_expression` bakes in - not lower-cased, spaces not turned into `%` wildcards,
            and not wrapped in expression quotes. It is DATA, and a receiver treats it as data: it
            constructs any filter it needs from these values through a typed or bound-literal path,
            so an untrusted value is never spliced into syntax. Repeated because the legacy display,
            pinyin and data clauses are OR-ed together from the same input and a caller may supply
            more than one term.

            WHY BOTH THIS AND filter_expression EXIST: parity needs the exact generated text, and
            safe execution needs the unmodified input. One field cannot be both without either
            losing parity evidence or making the parity string the execution path - see the block on
            filter_expression.
        pinyinFlags:
          type: [integer, string]
          format: uint64
          minimum: 0
          maximum: 18446744073709551615
          description: |-
            THE PINYIN FLAG MASK, a bit-or of PinyinLike.Flag values [enums.sru:L1147-L1149].

            `optional` for the same reason as filter_type: the call site passes 7 - all three bits
            [n_cst_dwsvc_dropdownsearch.sru:L323] - so a zero default would silently mean "no
            case-folding, no width-folding, no fuzzy sound", which changes which rows match. ABSENT
            means the legacy's 7.

            Applies only when FILTER_DISP_PY is set in filter_type, and the legacy additionally
            takes the pinyin path only when the input matches `[a-zA-Z]` [:L322], so a non-Latin
            search never reaches it.

