        object and script invocation, and global-variable access.

        Note one thing this route is **not** needed for: the legacy's dynamic-invocation object is a
        *variadic-call escape hatch* - PowerScript cannot forward an arbitrary-length argument list,
        so the SQL task layer unrolls its calls positionally and falls back to dynamic invocation only
        past the unrolled maximum. C# has native variadic support, so the workaround has no analogue
        to port and Persistence acquires **no** ScriptBridge coupling.

        Nothing exists behind this route.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          $ref: '#/components/responses/ReservedForPhaseTwo'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        A JSON Web Token **issued by the Security service**, presented in the `Authorization` header.

        **Gateway validates; it does not issue.** Security is the sole minter in the system, and
        exactly one signing key exists anywhere in it - `SECURITY_JWT_SIGNING_KEY`, held by Security
        and injected through the options pattern from the orchestration secret layer. Gateway holds
        **verification material only**.

        Verification uses the **stock `Microsoft.AspNetCore.Authentication.JwtBearer` handler**,
        pointed at Security's `GET /.well-known/openid-configuration`. The handler performs signature
        checking, key fetching and rollover, issuer and audience validation and clock-skew tolerance
        by itself. That is the point rather than an implementation note: it keeps the
        security-critical path inside framework code rather than hand-written code.

        No key material appears in this repository, in any application settings file, or in any
        container image.

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: >-
        The correlation identifier returned when the session was opened. It is the handle for the
        server-held state that a stateless boundary cannot carry per request.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    SessionIdQuery:
      name: sessionId
      in: query
      required: true
      description: The correlation identifier of the session to read.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    ReservedPath:
      name: path
      in: path
      required: true
      description: >-
        The remainder of the requested path. Present so that each reserved entry is a route FAMILY
        rather than a single route, which is what makes the eventual URL shape of the deferred service
        legible from this contract. Its value is echoed in the `route` field of the 501 body and is
        otherwise unused, because nothing exists behind the route to use it.
      schema:
        type: string
      allowReserved: true

  responses:
    ProjectedSuccess:
      description: >-
        The projected gRPC method returned `OK`. The body is the canonical protobuf JSON mapping of
        the message named in the operation's `x-proto-response` extension.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProtoPayload'

    BadRequest:
      description: >-
        The projected gRPC method returned `InvalidArgument`, or the request failed Gateway's own
        binding. `retCode` carries the **originating legacy return code** so the specific legacy
        validation is identifiable rather than merely the HTTP class - `E_INVALID_ARGUMENT` (-3) for
        an argument outside its accepted domain, and the expression engine's own codes for a parse
        failure, which also carries the expression text and the caret position.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Unauthorized:
      description: >-
        No token was presented, or the token presented is expired, malformed, or not valid for this
        service. This response is part of the published contract rather than an implementation
        detail: it is the standing proof that the boundary is authenticated (C-G).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: >-
        The projected gRPC method returned `PermissionDenied`. The token is valid but does not carry
        the scope this operation requires. Deliberately distinguished from `401` so a caller can tell
        a missing credential from an insufficient one.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: >-
        The projected gRPC method returned `NotFound` - most often a session identifier that has
        expired or was already closed, or a column selector naming a column the DataWindow does not
        have.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Conflict:
      description: |-
        **The projected gRPC method returned `Aborted`: an optimistic-concurrency conflict.**

        The body carries the conflict detail **unchanged** from C-06, including the current row state,
        so a caller has what it needs to decide between retrying and surfacing.

        **Callers implement an explicit retry-or-surface policy, and there is no silent overwrite
        anywhere in the system.** Re-sending the same payload will produce the same 409, because the
        original values it carries are still stale - a retry must first re-read.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ConflictProblemDetails'

    CrossSessionReferenceBlocked:
      description: |-
        The request was rejected. On these operations one rejection reason is distinctive enough to
        document separately: a cross-DataWindow variable reference that **spans expression sessions or
        service instances**, which is BLOCKED.

        ## Why this is a 400 and not a status of its own

        A dedicated `422` was considered and REJECTED, because the status mapping in
        `docs/CONTRACTS.md` 12.1 is the specification for this contract and it does not sanction one.
        That mapping already provides the mechanism for exactly this need: `InvalidArgument` projects to
        `400` **carrying the originating `RetCode`**, so a caller distinguishes one rejection from
        another by reading `retCode` rather than by counting statuses. Introducing a ninth status would
        have been this document overriding its own specification for a case the specification already
        covers.

        So a caller identifies this outcome from the `retCode`, and from the expression-error category
        `CATEGORY_FOREIGN_REFERENCE_BLOCKED` — not from the HTTP status.

        ## Why the reason is worth documenting at all

        This is the refactor's one deliberately narrowed contract. `foreignvardata.expsvc` is a **live
        in-process object pointer** to another DataWindow's expression service, and a pointer cannot be
        serialized. References are therefore resolved by a session-scoped DataWindow handle and are
        supported only when both DataWindows are co-resident in one expression session inside one
        DataServices instance.

        Approximating a pointer dereference across a network would produce results wrong in a way no
        test would obviously catch, so the contract is **narrowed with a defined error rather than
        widened with a guess**. A caller receiving this must not retry: the topology, not the request,
        is what rejected it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    InternalError:
      description: >-
        The projected gRPC method returned `Internal`. **The statement field is redacted**: the legacy
        `sqlsyntax` field carries the complete generated statement including interpolated literal
        values and the legacy logger performs no redaction at all, so the projection redacts or
        parameter-separates it before it reaches a caller. `detail` never carries key material, a
        stack trace, a file path or a connection string.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UpstreamUnavailable:
      description: |-
        An upstream service could not be reached, or the call to it failed in transit after the
        configured retry policy was exhausted.

        **This response exists because of the decomposition itself.** An in-process call cannot fail
        in transit and a network call can, so handling the failure is required *by* the transition
        rather than being a behavioural improvement layered on top of it. Without it, the first
        transient network fault would surface as a defect the legacy could not have had - a regression
        introduced by the refactor rather than a preserved behaviour.

        The body names which upstream failed, so an operator does not have to correlate logs to find
        out.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ReservedForPhaseTwo:
      description: |-
        **Not implemented. Reserved for Phase 2.**

        The body is **machine-readable** rather than a text message, so a client can branch on it
        without parsing prose: it names the deferred service the route will eventually reach and
        carries the marker `reserved for Phase 2`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReservedRouteBody'

  schemas:

    ProblemDetails:
      type: object
      title: ProblemDetails
      description: |-
        The **one and only** error body in this document apart from its conflict specialization below.
        Every `4xx` and every `5xx` response uses one of the two, so a consumer writes one error
        handler.

        It is the RFC 9457 problem-details object, which is what ASP.NET Core Minimal APIs emit
        **without hand-written code**. Adopting the framework's own error shape rather than inventing
        one keeps the error path out of hand-written code, for the same reason token validation is
        left to the stock bearer handler.

        `retCode` carries the legacy PowerFramework return code. RFC 9457 explicitly permits extension
        members, which is why this schema sets `additionalProperties: true` rather than `false`.
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            A URI reference identifying the problem type. RFC 9457's own default of `about:blank` is
            used when no more specific type applies.
        title:
          type: string
          description: A short, human-readable summary of the problem type. Stable across occurrences.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code, repeated in the body so a logged body is self-describing.
        detail:
          type: string
          description: >-
            A human-readable explanation specific to this occurrence. **Never carries key material, a
            stack trace, a file path, a connection string, or an unredacted SQL statement.**
        instance:
          type: string
          format: uri-reference
          description: A URI reference identifying this specific occurrence.
        retCode:
          type: integer
          format: int64
          description: |-
            The legacy PowerFramework return code for this failure, transcribed from
            `ws_objects/pfw.shared.pbl.src/retcode.sru`. `Proto/common.v1.proto` is the numeric
            authority; `PowerFramework.Shared.Kernel.RetCode` is the same set in C#, and the sibling
            test project asserts the two agree numerically.

            **The tri-state algebra is preserved and matters when interpreting this field.**
            `IsSucceeded` tests `>= 0`, so `PREVENT` (1) reads as a SUCCESS; `IsFailed` tests `< 0`
            **with an explicit exclusion of `CANCELLED` (-2)**, so cancelled is **neither** succeeded
            nor failed. A consumer must not infer failure from a non-zero value.
        upstream:
          type: string
          enum: [persistence, dataservices, security]
          x-enum-varnames: [Persistence, DataServices, Security]
          description: >-
            Which upstream service the failure originated from, when it originated from one. Present
            on `502` and on any status the projection forwarded, so an operator can attribute the
            failure without correlating logs. Absent when Gateway itself produced the response.

    ConflictProblemDetails:
      title: ConflictProblemDetails
      description: |-
        The `409` body: a problem-details object carrying the optimistic-concurrency conflict detail.

        The detail is forwarded **unchanged** from C-06 rather than reshaped, because a caller
        deciding between retrying and surfacing needs the current row state exactly as the database
        reported it.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            conflict:
              $ref: '#/components/schemas/ProtoPayload'

    ProtoPayload:
      type: object
      title: ProtoPayload
      description: |-
        A payload whose shape is defined by the protobuf message named in the enclosing operation's
        `x-proto-request` or `x-proto-response` extension, encoded in the **canonical protobuf JSON
        mapping**.

        **This is a deliberate delegation, not an unspecified body.** The messages live in
        `Proto/dataservices.v1.proto` and `Proto/common.v1.proto` in this same project, and they are
        the single authority for the shapes. Transcribing well over a hundred of them into JSON Schema
        here would create a second source of truth in a different language with nothing keeping the
        two in step - and the first divergence would be silent, because nothing compiles this document
        against those definitions.

        The `x-proto-*` extensions are the alternative, and they are **checkable**: the sibling test
        project asserts that every one of them resolves to a real generated type. A schema copy would
        have been longer, less precise, and unverifiable.

        `additionalProperties: true` because the authority is elsewhere; a consumer validates against
        the generated message type, not against this placeholder.
      additionalProperties: true

    AggregateHealthReport:
      type: object
      title: AggregateHealthReport
      description: |-
        Gateway's readiness **and that of each of its three upstreams individually**.

        Gateway reports `Healthy` only after Persistence, DataServices and Security all do. The
        aggregate names each upstream with its own state rather than returning one opaque verdict,
        because an operator reading a failed aggregate needs to know which upstream is responsible.
      additionalProperties: false
      required: [status, service, upstreams]
      properties:
        status:
          type: string
          enum: [Healthy, Degraded, Unhealthy]
          x-enum-varnames: [Healthy, Degraded, Unhealthy]
          description: |-
            The aggregate verdict, carrying the distinction contract C-10 requires between "not ready"
            and "unhealthy":

            - `Healthy` - Gateway and all three upstreams are ready. Reported with HTTP 200.
            - `Degraded` - **not ready**, but not failed. Gateway is still completing startup
              validation, or an upstream is. Reported with HTTP 200, so a probe that tears down on any
              non-2xx does not kill a service that is merely still starting.
            - `Unhealthy` - **failed**. Reported with HTTP 503.
        service:
          type: string
          const: gateway
          description: The reporting service.
        checkedAt:
          type: string
          format: date-time
          description: When this report was produced, so a consumer can detect a stale cached report.
        upstreams:
          type: array
          minItems: 3
          maxItems: 3
          description: >-
            The three upstreams Gateway aggregates, each named with its own state. Exactly three:
            Persistence, DataServices and Security. No entry exists for any deferred service, because
            no deferred service exists.
          items:
            $ref: '#/components/schemas/UpstreamHealth'
        checks:
          type: array
          description: >-
            Gateway's own component checks, behind its own contribution to the verdict. Carries no
            configuration value, no connection string and no key material.
          items:
            $ref: '#/components/schemas/HealthCheckResult'

    UpstreamHealth:
      type: object
      title: UpstreamHealth
      description: One upstream's individually reported state within Gateway's aggregate.
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          type: string
          enum: [persistence, dataservices, security]
          x-enum-varnames: [Persistence, DataServices, Security]
          description: >-
            Which upstream this entry describes. The enumeration is closed at three: the composition
            root depends on exactly these, and the 5103 slot in the port band is a commented Phase-2
            placeholder rather than a fourth participant.
        status:
          type: string
          enum: [Healthy, Degraded, Unhealthy, Unreachable]
          x-enum-varnames: [Healthy, Degraded, Unhealthy, Unreachable]
          description: >-
            This upstream's own verdict, or `Unreachable` when Gateway could not obtain one at all.
            `Unreachable` is distinguished from `Unhealthy` because they call for different operator
            action - a network or startup-ordering problem rather than a failed dependency inside a
            running service.
        detail:
          type: string
          description: >-
            A human-readable note about this upstream's state. Never carries a connection string, a
            key, or any configuration value.

    HealthCheckResult:
      type: object
      title: HealthCheckResult
      description: >-
        One component check behind a verdict. Present so an operator can tell which check is not yet
        satisfied rather than only that something is not.
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          description: The check's identifier.
        status:
          type: string
          enum: [Healthy, Degraded, Unhealthy]
          x-enum-varnames: [Healthy, Degraded, Unhealthy]
          description: This check's own verdict.
        detail:
          type: string
          description: >-
            A human-readable note. **Carries no configuration value, no connection string and no key
            material** - a health endpoint is anonymous, so anything it reports is public.

    PingResponse:
      type: object
      title: PingResponse
      description: >-
        The successful half of the authentication proof. Returned only when a valid token was
        presented; the absence of a token yields 401, and both outcomes are part of contract C-10. The
        body deliberately does not echo the presented token, any claim of it, or any part of the
        verification material.
      additionalProperties: false
      required: [service, authenticated]
      properties:
        service:
          type: string
          const: gateway
          description: The responding service.
        authenticated:
          type: boolean
          const: true
          description: >-
            Always true when this body is returned, because the operation cannot be reached without a
            valid token. It is present so that a conformance test asserting the authenticated path has
            something explicit to assert on rather than inferring success from a status code.
        timestamp:
          type: string
          format: date-time
          description: When the response was produced.

    CapabilityReport:
      type: object
      title: CapabilityReport
      description: |-
        The framework's eight-bit capability gate, projected as configuration.

        The bit identifiers are the legacy `SCREAMING_SNAKE` spellings from
        `ws_objects/pfw.shared.pbl.src/enums.sru:L41-L49`, preserved verbatim in deliberate departure
        from .NET naming convention because they appear in serialized payloads, log records and
        characterization recordings (Agent Action Plan 0.4.5.3).
      additionalProperties: false
      required: [effectiveMask, allMask, capabilities]
      properties:
        effectiveMask:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: |-
            The bitmask actually in effect in this deployment.

            The domain is the full **unsigned 32-bit** range, not the signed one. The configured value
            is projected with an **unchecked** conversion, so every one of the 2^32 values is
            representable and none is rejected - a negative configured value wraps rather than
            failing. That is deliberate: the legacy flag word is an unsigned long, and rejecting a
            wrapped value would make a configuration that the legacy accepted fail to start.
        allMask:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: |-
            The value of `INIT_FLAG_ENABLE_ALL`.

            **It deliberately omits `INIT_FLAG_ENABLE_BLINKFAST` (8).** That is not an oversight and
            must not be "corrected": `blink.dll` and `blinkfast.dll` are alternative builds of one
            engine, so enabling both is meaningless. The omission is reproduced verbatim under C-B, so
            `allMask` is **not** the bitwise union of every declared bit.
        unrecognizedBits:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: >-
            Any bits set in `effectiveMask` that are not among the eight declared capabilities.
            Reported rather than rejected, so a configuration carrying a future or mistaken bit starts
            and says so instead of failing.
        capabilities:
          type: array
          minItems: 8
          maxItems: 8
          description: >-
            All eight declared capabilities with their values and enabled state. Exactly eight - the
            set is closed by the legacy declaration.
          items:
            $ref: '#/components/schemas/Capability'

    Capability:
      type: object
      title: Capability
      description: One declared capability bit.
      additionalProperties: false
      required: [name, value, enabled, phaseOneDestination]
      properties:
        name:
          type: string
          enum:
            - INIT_FLAG_ENABLE_UI
            - INIT_FLAG_ENABLE_SCITER
            - INIT_FLAG_ENABLE_BLINK
            - INIT_FLAG_ENABLE_BLINKFAST
            - INIT_FLAG_ENABLE_ORCA
            - INIT_FLAG_ENABLE_SQLITE
            - INIT_FLAG_ENABLE_DPIAWARE
            - INIT_FLAG_ENABLE_WEBVIEW
          description: >-
            The legacy identifier, spelled exactly as `enums.sru:L41-L49` declares it. Preserved
            verbatim because it appears in stored characterization comparisons.
        value:
          type: integer
          format: int64
          description: >-
            The bit's numeric value. The eight are sparse - 1, 2, 4, 8, 256, 512, 1024, 2048 - rather
            than the first eight powers of two, and the gap is the legacy's.
        enabled:
          type: boolean
          description: Whether this bit is set in `effectiveMask`.
        phaseOneDestination:
          type: string
          enum: [Persistence, DesignSystem, ScriptBridge, PackagingTooling]
          x-enum-varnames: [Persistence, DesignSystem, ScriptBridge, PackagingTooling]
          description: >-
            Where this capability's implementation lives in the Phase-1 slice. **Only
            `INIT_FLAG_ENABLE_SQLITE` maps to an in-scope service.** `PackagingTooling` is
            `INIT_FLAG_ENABLE_ORCA`, which is build tooling rather than a service at all - so a client
            can see from this field that enabling a bit whose destination is deferred has no runtime
            effect in this phase.

    ReservedRouteBody:
      type: object
      title: ReservedRouteBody
      description: |-
        The `501` body returned by each of the four reserved routes.

        **Machine-readable rather than a text message**, so a client can branch on it without parsing
        prose - which is the whole point of declaring the routes: the shape of the eventual system is
        legible from this contract, while nothing is implemented behind it.
      additionalProperties: false
      required: [status, service, marker, route]
      properties:
        status:
          type: integer
          const: 501
          description: Always 501. Repeated in the body so a logged body is self-describing.
        service:
          type: string
          enum: [DesignSystem, Documents, Integration, ScriptBridge]
          x-enum-varnames: [DesignSystem, Documents, Integration, ScriptBridge]
          description: >-
            The deferred service this route will eventually reach. The four are the Phase-2 half of the
            eight-service target roster; `docs/DEFERRED.md` is the authoritative roster and records
            which legacy objects each is assigned.
        marker:
          type: string
          const: reserved for Phase 2
          description: >-
            The literal marker `reserved for Phase 2`, exactly as specified. A constant rather than
            free text so a conformance test and a client can both match on it.
        route:
          type: string
          description: The matched route pattern, echoed so a client can log what it asked for.
