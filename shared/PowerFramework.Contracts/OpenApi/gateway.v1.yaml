      x-contract-id: C-04
      x-required-scope: datawindow
      x-grpc-method: dataservices.v1.ColumnExpressionService/AddForeignVariable
      x-proto-request: dataservices.v1.AddForeignVariableRequest
      x-proto-response: dataservices.v1.AddForeignVariableResponse
      tags: [ColumnExpression]
      summary: Add a cross-DataWindow variable. Subject to the session co-residency limit.
      description: |-
        Adds a variable resolved against **another DataWindow's** expression service.

        ## The narrowed contract, restated at the operation that reaches it

        The legacy holds a live object pointer for this
        [`foreignvardata.expsvc`, `n_cst_dwsvc_columnexp.sru:L80-L83`], and a pointer does not
        serialize. The reference is therefore resolved by a **session-scoped DataWindow handle**, and
        is supported **only** when both DataWindows are co-resident in the same expression session
        inside one DataServices instance.

        A reference spanning sessions or service instances returns **`400`** with a defined error
        rather than a wrong value, and the caller tells that outcome apart from an ordinary malformed
        request by reading the body rather than by counting statuses: `retCode` carries the
        originating return code and the expression-error category is
        `CATEGORY_FOREIGN_REFERENCE_BLOCKED`. A caller receiving it must not retry - the topology, not
        the request, is what rejected it.

        A distinct unprocessable-entity status is the intuitive reading, because the request is
        well-formed and its arguments are individually valid, and it is **deliberately not used**. The
        `CrossSessionReferenceBlocked` response records that decision in full, together with the
        sanctioned status set it follows from, and is the one place it is recorded - so this operation
        states the outcome its callers branch on and points there, rather than restating the reasoning
        and drifting from it. No status this operation names in prose is absent from its `responses`
        block, which is the property `GatewayContractTests` enforces.

        The legacy documentation notes that a foreign variable **requires** dynamic expansion, which
        this contract enforces: a static foreign reference is rejected as `400` as well, with its own
        return code.
