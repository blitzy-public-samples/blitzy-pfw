# yaml-language-server: $schema=./workflow.schema.json
# ==================================================================================================
#  dataservices-dwsvc-dropdownsearch - THE DROP-DOWN SEARCH SERVICE, HEADLESS HALF
#  ------------------------------------------------------------------------------------------------
#  THIS FILE SPECIFIES A CAPTURE. IT CONTAINS NO CODE AND NO CAPTURED VALUE.
#  It conforms to `./workflow.schema.json`, which is authoritative for shape. Store-wide conventions
#  - the capture rule's canonical text, the recording-file conventions, the seam register, the defect
#  roster and what must never enter a recording - belong to `../README.md` and to `../../docs/PARITY.md`
#  and are CITED here, never restated. A fourth copy of a rule three files already own word for word
#  is a fourth thing to drift.
#
#  ---- WHAT THIS WORKFLOW CARRIES THAT NO SIBLING DOES ------------------------------------------
#  THE ONE GENUINE PARITY RISK IN THE WHOLE IN-SCOPE SET. Pinyin first-letter matching cannot be
#  proven bit-exact from the repository alone, and `blockedBehaviours` below states that WITHOUT
#  SOFTENING. `../README.md` section 5.5 and `../../docs/PARITY.md` R1 are the authoritative
#  statements; this definition is their application to one capture.
#
#  ---- THE PINYIN FLAG QUESTION IS SETTLED, AND THIS FILE USES THE SETTLED READING ---------------
#  An earlier reading - carried in the migration plan's own wording and in an earlier revision of
#  `../../docs/PARITY.md` - said the flag value `7` passed at
#  `n_cst_dwsvc_dropdownsearch.sru:L323` had semantics "recorded nowhere in the repository". THAT
#  READING IS WITHDRAWN, and it is withdrawn by the document that made it:
#  `../../docs/PARITY.md` R1 states that the earlier claim "was wrong, and the correction narrows the
#  risk rather than widening it". `ws_objects/pfw.shared.pbl.src/enums.sru:L1146-L1149` declares the
#  flags under the comment `//PinyinFirstLetterLike:[flags]` as ignore-case = 1, ignore-width = 2 and
#  fuzzy-sound = 4, so `7` is all three enabled and NEEDS NO CHARACTERIZATION AT ALL.
#  `../../docs/DEFERRED.md` section 8 and `../../docs/ARCHITECTURE.md` section 13 L1 record the same
#  decoding, and `./workflow.schema.json`'s own `blockedBehaviours` description already describes the
#  gap as the matching relation and the fuzzy-equivalence set rather than as the flags.
#  THE BLOCKED VERDICT IS UNCHANGED BY THIS CORRECTION - only its reason becomes precise, and
#  precision is what keeps a blocked report from reading as an excuse. Four closed inputs remain, and
#  they are enumerated in `blockedBehaviours` below. Both readings are recorded so that a reader
#  arriving from the plan's wording is not left to rediscover the correction, and so that nobody
#  characterizes a flag decoding that `enums.sru` already supplies.
#
#  ---- TWO SEVENS, AND THEY ARE NOT THE SAME SEVEN ----------------------------------------------
#  `FILTER_ALL` is 7 [`n_cst_dwsvc_dropdownsearch.sru:L50-L53`], being the three filter bits summed.
#  The pinyin flag argument is also 7 [`:L323`], being the three pinyin flags summed. They are
#  unrelated values from unrelated constant sets that coincide numerically, and the oracle window
#  sets one of them [`w_test_dwsvc_dropdownsearch.srw:L43`] while the service hardcodes the other.
#  Recorded because conflating them would make a reader think the filter type reaches the matcher.
#
#  ---- LOCATOR CORRECTIONS MADE AGAINST THE SOURCE ----------------------------------------------
#  Every locator in this file was read line by line in the oracle rather than copied forward. Three
#  readings needed correcting, and each changes what the capture must record:
#    * THE PINYIN CLAUSE DOES NOT INTERPOLATE THE RAW INPUT. It interpolates the LOWER-CASED input:
#      `:L316` assigns the lower-cased form and `:L323` interpolates THAT, while the alphabetic guard
#      at `:L322` tests the RAW input. Guard and clause therefore read two different strings, and a
#      capture that used one for both would miss it.
#    * THERE ARE FOUR LIVE INTERPOLATION SITES IN THE SERVICE, NOT TWO - `:L319`, `:L323`, `:L331`
#      and `:L334` - and `:L334` is the sharpest of them because it interpolates unquoted into a
#      numeric comparison. The fixture's own override at
#      `w_test_dwsvc_dropdownsearch.srw:L62` is a fifth.
#    * THE `Find` INTERPOLATION AT `:L242` IS DORMANT, inside a commented-out block at `:L238-L246`
#      dated 2017-09-01. It is NOT a live site and is not counted as one; the capture proves it inert.
#
#  ---- WHAT THIS DEFINITION DELIBERATELY OMITS, AND WHY -----------------------------------------
#    * `redaction` - OMITTED because nothing this capture records is sensitive. Every value that
#      reaches a recording is a search input or a filter expression built from one, and every search
#      input is drawn from the read-only fixtures' own inline rows and their three-pair code table.
#      THE SEARCH INPUTS ARE FIXTURE-SOURCED TEST STRINGS AND ARE NOT CREDENTIALS. NO KEY, NO
#      PASSWORD, NO CERTIFICATE, NO TOKEN AND NO CONNECTION STRING IS READ, EMITTED OR RECORDED
#      HERE (C-F). This workflow issues no SQL, so the redacted-statement rule has no field to act
#      on - the expressions below are DataWindow filter expressions evaluated in-process against a
#      dropdown's own buffer, not statements sent to a database.
#    * `connectionUri` - OMITTED. This workflow opens no storage.
#
#  ---- ORDER AND EXPRESSIONS, NEVER SPEED (C-B, and `../README.md` section 6.4) ------------------
#  Filtering invites a throughput claim and this workflow makes none. NO ELAPSED VALUE IS RECORDED,
#  no rows-per-unit-time figure is derived, and no timing is asserted anywhere. The repository
#  publishes no service-level agreement, no latency budget, no throughput target and no availability
#  commitment, so there is nothing a timing assertion could be measured against. The only
#  quantitative gate in the brief is 80% per-service line coverage, and it is read from
#  `coverage.cobertura.xml` in CI - never from this store.
#
#  ---- GOVERNING CONSTRAINTS -------------------------------------------------------------------
#  NO USER-SPECIFIED RULES EXIST. The project's rules document returns exactly one line reporting
#  that none were provided, so no rule is invented, inferred or back-filled, and nothing in this file
#  exists because of one. Enterprise-standard best practice applies in their place. The binding
#  constraints are the migration plan's own: C-B (defects reproduced, never corrected - a corrected
#  capture is a parity FAILURE), C-C (the legacy tree is read-only and is the oracle; every claim
#  carries a locator), C-D (nothing for a deferred capability area), C-F (no secret value), C-K
#  (every decision carries its reason) and C-L (the shared-volume capture rule).
# ==================================================================================================

schemaVersion: "1"

workflowId: dataservices-dwsvc-dropdownsearch

title: >-
  Drop-down search: filter-expression construction, the search state machine, and the BLOCKED pinyin
  matcher

capabilityArea: >-
  The headless half of the drop-down search service `n_cst_dwsvc_dropdownsearch` - the construction of
  the dropdown filter expression from a user's input across its three composable filter bits, the
  composition of that expression with the dropdown's own original filter, the search state machine
  that drives incremental filtering and inline completion, and the row and filtered counts the service
  reports back through the event chain.

targetService: DataServices

description: >-
  ONE FILTER EXPRESSION, BUILT TWICE AND COMPARED BYTE FOR BYTE. The pair proves that the expression
  string this service constructs from a given input, the expression it finally applies after composing
  with the dropdown's original filter, the state its search machine carries between keystrokes, and
  the counts it reports are identical on the legacy master and on the .NET candidate after identical
  masking. THE CONSTRUCTED EXPRESSION IS THE PRIMARY ARTIFACT, because the expression IS the
  behaviour: it is the whole of what this service produces, and every other recorded output is
  downstream of it.


  THIS WORKFLOW IS SPLIT, AND THE SPLIT IS EVIDENCE-DRIVEN. Only the headless half of the service
  ships in this phase and only the headless half is captured here. The service's presentational
  coupling is BROAD rather than incidental - eight references across its 516 lines, enumerated in
  `deferredCapabilities` below - which is why it is split at all. The contrast that proves the split
  is not arbitrary: `n_cst_dwsvc_rowselect.sru` is 288 lines with exactly ONE presentation reference
  and ships whole, and `n_cst_dwsvc.sru` is 864 lines with ZERO
  [`../../docs/DEFERRED.md`](../../docs/DEFERRED.md) section 6.1. Eight against one against zero is
  the measurement, and it is the reason this definition has a `deferredCapabilities` member and the
  row-select definition does not.


  THIS WORKFLOW CARRIES THE STORE'S ONE GENUINE PARITY RISK, AND IT CARRIES IT SPLIT IN TWO. The
  pinyin clause's CONSTRUCTION is deterministic, fully specified by the source, and is compared byte
  for byte like every other clause. The pinyin clause's MATCH RESULTS depend on a lookup table that
  exists only inside a closed native binary and are BLOCKED. That separation is the difference between
  a workflow that is largely usable the moment an oracle runs and one that is entirely blocked, so it
  is made explicit in `observedOutputs` rather than left to be inferred - two distinct outputs, one
  compared and one withheld from comparison.


  ON THE IDENTIFIER. It follows the roster and the schema's derivation rule: the capability area
  followed by the oracle window's name with its underscores rendered as hyphens. A test hook pins a
  differently spelled constant for the same workflow; `./README.md`'s correction register owns that
  divergence, records that the ROSTER identifier is the canonical one because the schema's
  `workflowId` pattern rejects underscores, and states when the constant is reconciled. It is cited
  here rather than re-argued.


  NO DATA VALUE RECORDED HERE IS SENSITIVE. Every search input is a fixture-sourced test string drawn
  from the read-only definitions' own inline rows and their three-pair code table. Nothing is read
  from a credential, a key store or a connection string (C-F).

oracleFixtures:
  # THE OBJECT UNDER CHARACTERIZATION. Read, never edited, moved, renamed, reformatted, re-encoded or
  # copied into this tree (C-C). 516 lines; the locators below are the ones this definition's observed
  # outputs, defects and blocked entry cite.
  - path: ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_dropdownsearch.sru
    role: service-object
    locators:
      - "L43"         # its OWN window prototype, bound to user32.dll - split evidence, not headless
      - "L50-L53"     # FILTER_DISP=1, FILTER_DISP_PY=2, FILTER_DATA=4, FILTER_ALL=1+2+4=7
      - "L57"         # THE DEFAULT filter type is DISP+DISP_PY = 3: the data bit is OFF by default
      - "L84-L131"    # THE SEARCH STATE MACHINE - the edit-changed handler
      - "L88"         # the edit-context validity gate
      - "L90"         # a null input is coerced to empty, not rejected
      - "L94-L96"     # ONLY a dropdown-DataWindow column filters; a dropdown-list column never does
      - "L98-L101"    # THE BACKSPACE GUARD: no completion when the input did not grow
      - "L102"        # the last-input state field, written on every growing keystroke
      - "L104-L113"   # completion over the dropdown DataWindow: one-based scan, first match wins
      - "L114-L124"   # completion over the dropdown list, and its tab split at :L123
      - "L127-L130"   # the completed text and the selected remainder, in one-based character offsets
      - "L231-L249"   # the context-filter reset path
      - "L238-L246"   # THE DORMANT commented-out block, and the inert interpolation at :L242
      - "L247"        # the live reset: the filter is rebuilt from an EMPTY input
      - "L313-L345"   # THE FILTER-EXPRESSION CONSTRUCTOR - the primary artifact's source
      - "L315"        # an empty input yields an empty expression, and no clause is attempted
      - "L316"        # the lower-cased input, which the pinyin clause interpolates
      - "L317"        # the like-pattern form: trimmed, then every space becomes a wildcard
      - "L318-L320"   # the display bit; the clause at :L319 ASSIGNS rather than appends
      - "L319"        # interpolation site 1 of 4
      - "L321-L325"   # the pinyin bit
      - "L322"        # THE ALPHABETIC GUARD, tested against the RAW input
      - "L323"        # interpolation site 2 of 4, and the flag argument 7
      - "L326-L338"   # the data bit
      - "L327"        # the clause is emitted ONLY when the data column differs from the display one
      - "L328"        # the column-type query that precedes the clause
      - "L329-L336"   # the type dispatch, which has NO else arm
      - "L331"        # interpolation site 3 of 4, the character arm
      - "L334"        # interpolation site 4 of 4, unquoted into a numeric comparison
      - "L340"        # the outer wrap, applied only to a non-empty expression
      - "L342"        # THE REFERENCE-STRING OUT-PARAMETER, fired AFTER construction completes
      - "L368-L412"   # the apply path
      - "L372-L380"   # composition with the dropdown's own original filter
      - "L376"        # the conjunctive composition form
      - "L379"        # an empty input restores the original filter rather than clearing it
      - "L382"        # THE IDEMPOTENCE GUARD: an unchanged expression does nothing at all
      - "L389-L391"   # the ordered triple: set the filter, filter, sort
      - "L393-L394"   # the two counts, taken BEFORE the buffer move
      - "L408"        # the filtered notification
      - "L419-L456"   # the public original-filter update, and its four entry guards
      - "L474"        # split evidence
      - "L475"        # split evidence
      - "L489"        # split evidence
  # THE STRUCTURAL HOST. The service is reached through the event chain, and the two events this
  # workflow rides are declared on that chain rather than on the service.
  - path: ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru
    role: service-object
    locators:
      - "L13"         # THE REFERENCE-STRING OUT-PARAMETER in its declared form
      - "L28"         # the filtered notification's four arguments
      - "L83"         # the service member the chain owns
      - "L169-L171"   # the hand-off: semantic event, then broker, THEN this service
      - "L573"        # construction
      - "L578"        # initialization
      - "L587"        # teardown
  # THE ORACLE WINDOW. 65 lines, and the whole of its behaviour is the six statements the capture
  # depends on: it enables the service, widens the filter type, makes two columns editable, binds the
  # fixture, and overrides the filter request. The BEHAVIOUR lives in the service object above, which
  # is why both are cited and why neither alone is sufficient.
  - path: ws_objects/pfw.tests.pbl.src/w_test_dwsvc_dropdownsearch.srw
    role: oracle-window
    locators:
      - "L34-L38"     # the header comment stating the DEFAULT dropdown-DataWindow rule
      - "L41"         # the service is enabled
      - "L43"         # the filter type is widened to all three bits
      - "L45"         # the dropdown-list column is made editable
      - "L46"         # the dropdown-DataWindow column is made editable
      - "L55"         # the bound definition
      - "L59-L63"     # THE REFERENCE-STRING OVERRIDE, and :L59 calls the ancestor FIRST
      - "L61"         # the override's two-part condition: row 2 and the second string column
      - "L62"         # the fifth interpolation site, this one in the fixture itself
  # THE PRIMARY FIXTURE. Nine inline rows over six columns; one dropdown-list column and two
  # dropdown-DataWindow columns, which is what makes a list-versus-DataWindow comparison possible from
  # a single definition.
  - path: ws_objects/pfw.tests.pbl.src/dw_svc_sample.srd
    role: primary-fixture
    locators:
      - "L8-L14"      # the six columns and their declared types
      - "L11"         # the dropdown-list column's own three-pair code table, tab and slash delimited
      - "L14"         # the declared sort specification, which the apply path re-applies
      - "L15"         # THE NINE INLINE ROWS - the seed, and there is no other
      - "L25"         # the THIRD string column: a dropdown DataWindow left NOT editable
      - "L26"         # the SECOND string column: the dropdown DataWindow the override keys on
      - "L27"         # the FIRST string column: the dropdown list
      - "L28"         # a row-number computation, present and captured as unaffected by filtering
  # THE DROPDOWN SOURCE. Two columns and three rows. Its display-to-data mapping is recorded in the
  # seed phase because the display-versus-data resolution is one of the behaviours under test and a
  # capture cannot verify it without the mapping.
  - path: ws_objects/pfw.tests.pbl.src/dw_svc_sample_dddw.srd
    role: supporting-fixture
    locators:
      - "L8-L10"      # the display and data columns, both of character type
      - "L11"         # THE THREE DISPLAY-TO-DATA PAIRS
      - "L12"         # only the display column is laid out, which is why the data column needs a query
  # THE SIBLINGS' DROPDOWN SOURCE, cited for a reason that is easy to get wrong. This definition is
