  # only difference between the two sources is a header and two band heights. Recorded so that the
  # sameness is checked rather than assumed, and so that nobody substitutes one for the other.
  - path: ws_objects/pfw.tests.pbl.src/dw_test_dwsvc_dddw.srd
    role: supporting-fixture
    locators:
