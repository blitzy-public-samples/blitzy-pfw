# ==================================================================================================
#  THE SEED PHASE - DECLARED SEPARATELY BECAUSE IT RUNS ONCE, WHILE THE CAPTURE RUNS TWICE
#  ------------------------------------------------------------------------------------------------
#  THIS WORKFLOW'S SEED IS NOT A DATABASE SEED, AND THE DIFFERENCE MATTERS. The persistence workflows
#  seed storage: the oracle's own setup deletes the database file, recreates the schema and inserts
#  rows, which is precisely the destructive reseed the capture rule forbids between the two halves of a
#  pair. NOTHING OF THAT KIND HAPPENS HERE. The rows this workflow starts from are declared INLINE IN
#  THE READ-ONLY DATAWINDOW DEFINITION ITSELF - four rows at `dw_test_dwsvc_columnexp.srd:L14`, and the
#  same four, byte-identically, at `dw_svc_sample_columnexp.srd:L14`. So there is NO FILE DELETE, NO
#  DDL, NO INSERT, NO CONNECTION AND NO SCHEMA PROVISIONING anywhere in this seed phase. Binding the
#  definition IS the seed.
#
#  The two assertions below are nonetheless both true and both required: the binding and the expression
#  set-up happen ONCE per pair, and nothing here runs between the two captures.
#  `../README.md` section 4.4 carries the fuller rationale for the separation.
# ==================================================================================================
seedPhase:
  steps:
    - action: >-
        Bind the DataWindow definition the host controls name to BOTH hosts. The oracle window names
        the same definition on both - the second host at `:L169` and the first at `:L301` - and that
        co-residency is a precondition of the foreign-variable path rather than an incidental detail, so
        both bindings belong to the seed and neither may be skipped. Binding loads the definition's own
        inline rows; THIS STEP PERFORMS NO FILE DELETE, NO SCHEMA CREATION AND NO ROW INSERT, because
        the rows are part of the read-only fixture.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L169,L301"
    - action: >-
        Confirm the FOUR inline rows the bound definition declares are present and in declaration
        order, over the five declared columns - three two-place decimal columns and two
        hundred-character character columns, none of which is updateable - with the declared ascending
        sort on all three decimals applied. Confirm the two-fractional-digit edit mask on the three
        decimal columns, because the recorded values are numeric strings and the mask is part of how
        they are rendered.
      locator: "ws_objects/pfw.tests.pbl.src/dw_test_dwsvc_columnexp.srd:L8-L14"
    - action: >-
        Seed the two character columns as NULL, NOT as the empty string, in all four rows - which is
        what the fixture's own data line does, and it is DELIBERATE rather than incidental. The
        distinction is observable: the expression descriptor carries an empty-string-is-null flag, and
        the trace fire site renders a value as the literal placeholder text when the value is empty AND
        either that flag is set or the column is not a character column. Substituting empty strings for
        the nulls would change which branch of that condition is taken and would silently change the
        recorded trace on every row. The three decimal columns are seeded as zero for the same reason -
        zero is what the fixture declares, and the arithmetic the expressions perform starts from it.
      locator: "ws_objects/pfw.tests.pbl.src/dw_test_dwsvc_columnexp.srd:L14"
    - action: >-
        Run the oracle window's open sequence exactly as written and in its written order, because the
        ORDER IS THE SEED: enable the service, then enable the trace, then add the five expression
        variables, then the typed variable, then the four nested expression variables, then set the
        dynamic-indirect column expression, then calculate row one. Add order is what the calculation
        sequence later follows, so an out-of-order set-up seeds a different workflow.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L96-L117"
    - action: >-
        Enable the trace before any expression is set, not after. The oracle enables it at `:L98`,
        which is BEFORE the first variable is added at `:L104` and well before the first column
        expression is set at `:L116` - so the trace records the set-up calculation at `:L117` too. A
        capture that enabled tracing later would be missing its opening records on one side only, and
        the two recordings would differ by an offset that has nothing to do with behaviour.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L98"
    - action: >-
        Enable the second host's own expression service and add its aggregate expression variable
        BEFORE registering that variable as a foreign variable on the first host. The oracle does this
        in that order - the service at `:L136`, the variable at `:L140`, the registration at `:L143` -
        and the order is load-bearing: the registration resolves against the other host's live service,
        so registering first would resolve against a service that is not yet enabled.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L136-L143"
    - action: >-
        Set the precision input to the value the oracle's control declares as its initial text, so that
        the variable set captured later moves the precision from the value the typed variable was added
        with to the value the control holds. Both numbers are part of the fixture and neither is
        invented by the capture: the added value comes from `:L109` and the control's text from `:L272`.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L109,L272"
    - action: >-
        Configure the determinism seams declared below ONCE, and use that one configuration for both
        halves of the pair. A seam configured per capture is two configurations, and two configurations
        make the two recordings answer two different questions. This step has no legacy counterpart -
        the legacy has no seams to configure - which is why it carries no locator.
    - action: >-
        On the target side, open one expression session per host, register both hosts into THE SAME
        session scope, and record the ordinal each handle is assigned in creation order. This is what
        replaces the legacy's live in-process pointer, so it is seeded rather than left to the capture:
        the co-resident case below is only meaningful if co-residency was established deliberately. No
        schema provisioning and no row seeding runs on this side either - the candidate materializes
        the same four rows from the same read-only definition, transcribed rather than read at run
        time - so this step is idempotent and touches no persistent state.
    - action: >-
        Additionally open a SECOND, SEPARATE expression session containing only one host, and leave it
        open. It exists solely so that the cross-session foreign reference declared under
        `blockedBehaviours` has somewhere to fail: the capture must exercise the failure, and a failure
        that cannot be reached cannot be recorded. Nothing else uses this session, and it is created in
        the seed rather than mid-capture so that both halves of the pair start from the same two-session
        topology. THIS STEP CARRIES NO LOCATOR BECAUSE IT HAS NO LEGACY COUNTERPART AND CANNOT HAVE ONE:
        the legacy has no session concept at all - it holds a live in-process pointer instead - so a
        session boundary is precisely the thing the target introduces and the legacy cannot exhibit. The
        legacy side of this pair therefore has nothing to record here, and the recorded outcome on that
        side is its explicit absence rather than a value.
  runsOncePerPair: true
  neverBetweenCaptures: true

# ==================================================================================================
#  THE CAPTURE PHASE - RUNS TWICE, AGAINST THE STATE THE SEED ALREADY ESTABLISHED
# ==================================================================================================
capturePhase:
  behaviourUnderTest: >-
    THE EXPANSION AND CALCULATION OF COLUMN EXPRESSIONS BY THE ENGINE AT
    `ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru`, AND NOTHING ELSE. For each
    expression: its unexpanded source text, the rewritten text the parse routine produces in place, the
    expansion mode of every individual variable and function reference within it, the bind-time
    snapshot of every variable it referenced statically, the live environment every dynamic reference
    resolves against, and the value it computes for each row. Around that: the ORDER in which
    expressions are calculated, the SET of columns a single change causes to recalculate, every macro
    invocation with its ordered arguments and its returned value, every trace record field by field,
    and every error the engine reports.


    THREE BEHAVIOURS ARE THE POINT OF THE CAPTURE. First and above all, THE THREE-MODE CASE: the same
    variable referenced statically, dynamically and dynamically-by-computed-name on three adjacent
    lines of the oracle - `:L151`, `:L154` and `:L157` - captured BEFORE and AFTER that variable is
    given a new value at `:L292`. The static reference must be UNCHANGED by the set while the dynamic
    and the indirect references must both reflect the new value. Second, THE INVERTED MACRO STREAM at
    `:L305-L309`, where the oracle window itself implements the macro the expressions call, so across a
    service boundary the service must call BACK INTO ITS CLIENT and wait. Third, THE ADD-ORDER
    CALCULATION: recalculating every column executes in the order the expressions were ADDED, which the
    oracle states in its own comments at `:L159` and `:L222` and the engine implements by walking its
    expression array rather than the DataWindow's columns.


    WHAT THIS CAPTURE IS NOT. It is not a capture of the 22-event chain - `dataservices-dw-event-chain`
    owns that, and this capture records only the two events the engine reaches the client through and
    the one point at which the chain hands control to the engine. It is not a retrieval or update
    capture: no statement is generated, no storage is written, and the fixture's five columns are not
    updateable in the first place. It is not a capture of any presentational behaviour, because this
    engine has none. AND IT IS NOT A MEASUREMENT: no elapsed value is recorded and no timing is
    asserted, because recalculation here is about order and value and the repository publishes nothing a
    duration could be compared against.

  preconditions:
    # ---- THE MACRO GRAMMAR, FIVE FORMS, AS THE ORACLE AND THE SPECIFICATION BOTH STATE IT ---------
    # Taken from the oracle window's own header comment at `:L86-L91` and confirmed against
    # `../../docs/n_cst_dwsvc_columnexp.md`. Both halves of the pair are captured against this same
    # grammar, or the comparison compares two different languages.
    - >-
      GRAMMAR, FORM 1 of 5 - STATIC EXPANSION, spelled with a SINGLE sigil before a variable name.
      Declared at `w_test_dwsvc_columnexp.srw:L87` and specified at
      `docs/n_cst_dwsvc_columnexp.md:L37-L54`. The variable's value is substituted into the expression
      AT THE MOMENT THE EXPRESSION IS SET, and no later assignment to that variable can change the
      result. Exercised at `w_test_dwsvc_columnexp.srw:L151` and `:L247`.
    - >-
      GRAMMAR, FORM 2 of 5 - DYNAMIC EXPANSION, spelled with a DOUBLE sigil before a variable name.
      Declared at `w_test_dwsvc_columnexp.srw:L87` and specified at
      `docs/n_cst_dwsvc_columnexp.md:L56-L73`. The variable is retained AS A REFERENCE and resolved at
      calculation time, so a later assignment propagates. Exercised at
      `w_test_dwsvc_columnexp.srw:L154` and `:L250`.
    - >-
      GRAMMAR, FORM 3 of 5 - DYNAMIC-INDIRECT EXPANSION, spelled as the double-sigil parenthesized
      form, which fetches a variable BY COMPUTED NAME. Syntax at `docs/n_cst_dwsvc_columnexp.md:L79`,
      worked example at `:L92`. The name is not a literal: it is itself an expression evaluated at
      calculation time, and in the oracle it is a conditional over two other variables at
      `w_test_dwsvc_columnexp.srw:L116` and over two columns at `:L157` and `:L253`. This form is
      dynamic by construction - there is no static counterpart, because a name that is not known until
      calculation time cannot have been substituted at bind time.
    - >-
      GRAMMAR, FORM 4 of 5 - MACRO-DIRECT INVOCATION, spelled as a SINGLE sigil before a function name
      followed by an argument list. Declared at `w_test_dwsvc_columnexp.srw:L88` and specified at
      `docs/n_cst_dwsvc_columnexp.md:L104-L128`, syntax at `:L110`. The function is not built in: THE
      APPLICATION implements it, in the host event the oracle implements at
      `w_test_dwsvc_columnexp.srw:L305-L309`. Exercised in every expression the oracle sets.
    - >-
      GRAMMAR, FORM 5 of 5 - MACRO-DYNAMIC INVOCATION, spelled as the double-sigil reserved dispatch
      form, which calls a function BY NAME with an argument list where THE FUNCTION NAME MAY ITSELF BE A
      VARIABLE. Declared at `w_test_dwsvc_columnexp.srw:L91`, specified at
      `docs/n_cst_dwsvc_columnexp.md:L130-L151` with its syntax at `:L134` and a worked example at
      `:L138-L141` in which the function name is held in a variable and referenced statically. The
      engine models this form with a reserved sentinel function name; the bare-variable form of form 3
      is modelled with an EMPTY function name. Both spellings are recorded exactly as the engine holds
      them, because both travel in captured payloads.
    - >-
      THE EXPANSION MODE IS A PER-REFERENCE PROPERTY AND IS RECORDED PER REFERENCE, NEVER PER
      EXPRESSION. This is a precondition rather than an observation because it decides the SHAPE of
      every payload below. Two independent pieces of evidence: the specification's worked example at
      `docs/n_cst_dwsvc_columnexp.md:L68` places a dynamic reference and a static reference inside ONE
      expression; and the oracle's `w_test_dwsvc_columnexp.srw:L157` places a dynamic-indirect
      reference, a macro-direct call and a dynamic foreign reference inside another. The engine's own
      descriptor agrees - it carries an ARRAY of variable references and an ARRAY of function
      references per expression, each with its own flags - so a per-expression mode has nowhere to live
      even in the legacy.
    # ---- STATE THAT MUST HOLD BEFORE THE CAPTURE BEGINS -------------------------------------------
    - >-
      THE SERVICE IS ENABLED ON BOTH HOSTS. The engine gates every public entry point on its base
      class's enabled property, returning the plain failure code rather than doing nothing, so a
      capture taken with the service disabled records failures rather than behaviour. The oracle
      enables the first host at `w_test_dwsvc_columnexp.srw:L96` and the second at `:L136`.
    - >-
      THE TRACE IS ENABLED. Without it the trace outputs below are simply absent, and their absence is
      indistinguishable from an engine that calculated nothing. The oracle enables it at
      `w_test_dwsvc_columnexp.srw:L98`, and the engine's fire site at
      `n_cst_dwsvc_columnexp.sru:L758` is guarded on that property.
    - >-
      THE ITEM-CHANGE GATE ON THE HOST IS ENABLED. This is a precondition of THIS workflow even though
      the gate belongs to the sibling's surface, because of a documented second-order coupling:
      disabling the host's item-change bit returns before the changed dispatcher is reached, and that
      dispatcher is the ONLY place the host calls this engine's changed handler
      [`se_cst_dw.sru:L41-L43`, `:L295-L320`, `:L313-L315`]. A capture taken with that bit clear would
      record an engine that never recalculates on a data change, and would record it as if that were
      the engine's behaviour.
    - >-
      BOTH HOSTS ARE CO-RESIDENT IN ONE EXPRESSION SESSION on the target side, and a second session
      exists holding only one host. The first is what makes the foreign-variable case comparable to the
      legacy; the second is what makes the blocked case reachable. Both are established by the seed.
    - >-
      THE MACRO CALLBACK IS REGISTERED AND ANSWERS. The oracle implements exactly one macro name and
      returns a rounded value for it [`w_test_dwsvc_columnexp.srw:L305-L309`, the body at `:L308`];
      every expression the oracle sets calls that macro, so a capture in which the callback is absent
      records every expression as an error rather than as a value. On the target side the callback is the
      inverted stream's client end, reached through the host event declared at `se_cst_dw.sru:L14`, and
      it must be connected before the first calculation.
    - >-
      NO EXPRESSION IS PRE-CACHED. The engine creates a generated compute object per cacheable
      expression, named from the expression plus a fixed suffix [`n_cst_dwsvc_columnexp.sru:L95`], and
      checks for and creates it on the calculation path [`:L711-L713`], so a residual object from an
      earlier run would change which branch the calculation takes on its first pass. The capture begins
      with no such object present, on both sides.

  observedOutputs:
    # ---- A. THE THREE-PART PAYLOAD. THE MOST IMPORTANT GROUP IN THE FILE ---------------------------
    # An already-expanded expression string is NOT a faithful recording, and no amount of post-processing
    # can turn one into a faithful recording afterwards. These five outputs together are what makes the
    # static-versus-dynamic distinction detectable at all.
    - name: expression.sourceText
      description: >-
        PART 1 OF 3. The UNEXPANDED source expression exactly as it was passed to the engine, character
        for character, before any rewriting. This is the only artefact in which a static reference is
        still visible as a reference: after the parse routine has run, its name is gone. A difference
        here means the two sides were asked to expand different text, which invalidates every other
        comparison in the group, so this output is compared FIRST.
      format: >-
        The raw string, unnormalized and unescaped, recorded as a quoted JSON string value. Sigils,
        parentheses, commas, embedded quotes and Chinese identifiers are all preserved verbatim; no
        whitespace is collapsed, because the oracle's own text carries irregular spacing - `:L116` has a
        space before its comma - and normalizing it would mask a genuine change in the text.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L27"
    - name: expression.rewrittenText
      description: >-
        The text the parse routine produces IN PLACE from the source. This is where the distinction
        becomes visible mechanically rather than by inference: a statically expanded reference has been
        replaced by its bind-time value and its name is ABSENT here, while a dynamically expanded
        reference has left behind an entry indexing into the live variable table and is still resolvable.
        Recorded because it is the artefact that proves WHY a later assignment cannot reach a static
        reference, and a reviewer who sees only values has to take that on trust.
      format: >-
        The rewritten string verbatim, alongside the count of variable references and function
        references the routine emitted for it - the two arrays are part of the parse result and their
        lengths are behaviour.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L28-L29"
    - name: expression.referenceMode
      description: >-
        PER REFERENCE, NOT PER EXPRESSION - one record for every variable and function reference the
        parse routine emitted, in the order it emitted them, each tagged with exactly one of the FIVE
        modes: STATIC, DYNAMIC, DYNAMIC-INDIRECT, MACRO-DIRECT or MACRO-DYNAMIC. This is the output that
        makes a mixed expression legible. The oracle's `:L157` alone yields a dynamic-indirect
        reference, a macro-direct call and a dynamic foreign reference from one line, and the
        specification's `docs/n_cst_dwsvc_columnexp.md:L68` yields one dynamic and one static from
        another. A capture that lost the per-reference tagging would render both indistinguishable from
        an expression with a single mode.
      format: >-
        An ordered array of records, each carrying the reference's short name, its full name as the
        engine stored it, its index into the variable or function table, its mode, and the two boolean
        flags the engine's own reference descriptor carries - the context flag and the macro flag for a
        variable reference, and the built-in flag for a function reference. The flags are recorded as
        booleans rather than folded into the mode, because the engine keeps them separate.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L50-L63"
    - name: expression.bindTimeSnapshot
      description: >-
        PART 2 OF 3. The value of every variable that was resolved STATICALLY, as it stood at the moment
        the expression was set. Without this, a static binding in the recording is indistinguishable
        from a literal that happened to have the same value - and the whole behaviour under test is that
        a static binding STAYS at this value while the live environment moves away from it.
      format: >-
        A map from variable name to a DISCRIMINATED VALUE - the declared scalar type and the value's
        textual projection - captured once per expression at set time and never updated afterwards. Not
        a stringly-typed map: see the note on defect D-06.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L65-L78"
    - name: expression.liveEnvironment
      description: >-
        PART 3 OF 3. The complete variable table AS IT STANDS AT CALCULATION TIME, which is what every
        dynamic and dynamic-indirect reference resolves against. Recorded at each calculation rather than
        once, because the divergence this pair proves is precisely that this table moves while the
        bind-time snapshot does not. Comparing the two recordings' live environments at the same
        calculation point is how a reviewer confirms the dynamic side was resolving against the same
        state on both sides.
      format: >-
        An ordered array of variable records - name, kind, declared type where the variable is typed,
        current discriminated value, and for an expression variable its own unexpanded body and its own
        reference arrays, because a variable's value MAY ITSELF BE AN EXPRESSION with its own references
        and the structure is recursive.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L73-L78"

    # ---- B. THE DEFINITIVE THREE-MODE DIVERGENCE. THE REASON THIS WORKFLOW EXISTS ------------------
    # The same variable, referenced three ways on three adjacent lines, then given a new value from a
    # fourth control. Captured before and after. This is the whole behaviour.
    - name: threeMode.expressionsAsSet
      description: >-
        The three expressions the oracle sets on three adjacent lines, recorded as set. Reading them
        together is what makes the case definitive, because they differ ONLY in how they reference the
        precision variable: the first references it statically as `$精度` [`:L151`]; the second
        references the same variable dynamically as `$$精度` [`:L154`]; the third fetches it
        dynamically by computed name as `$$('精度')` and additionally consumes the foreign variable
        dynamically as `$$数据汇总` [`:L157`]. One sigil apart, and permanently divergent.
      format: >-
        The three source strings verbatim with the column each was bound to, plus the per-reference mode
        array for each. The Chinese variable names are recorded as they are written, because they ARE
        the identifiers and the grammar is case- and character-sensitive.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L151,L154,L157"
    - name: threeMode.valuesBeforeVariableSet
      description: >-
        The value each of the three expressions produces for every row, captured AFTER the
        recalculate-all at `:L160` and BEFORE the variable set at `:L292`. This is the baseline the
        divergence is measured from; without it, an unchanged static value is not distinguishable from a
        value that changed twice.
      format: >-
        Per row and per column: the computed value as its numeric string, exactly as the engine produced
        it, under an invariant numeric culture. Rendered through the fixture's declared two-fractional-
        digit mask, because that mask is part of the observable value.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L160"
    - name: threeMode.valuesAfterVariableSet
      description: >-
        The same three values per row, captured after the three-arity variable set with its recalculate
        flag at `:L292` has moved the precision variable from the value it was added with to the value
        the input control holds. THE ASSERTION THIS PAIR EXISTS FOR: the STATICALLY referenced
        expression's value must be BYTE-IDENTICAL to its before value, while the DYNAMIC and the
        DYNAMIC-INDIRECT expressions' values must both reflect the new precision. A capture in which the
        static value tracked the change is a PARITY FAILURE, not a more consistent result.
      format: >-
        The same per-row projection as the before capture, recorded in the same field order so the two
        are diffable line by line, plus an explicit per-column before-and-after pair so the invariance
        and the propagation are both visible in one place rather than reconstructed by the reader.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L292"
    - name: threeMode.specificationWorkedExample
      description: >-
        The specification's own worked example, run as a capture in its own right rather than only cited.
        The authoritative document states one outcome for the static form and a different outcome for the
        dynamic form from THE IDENTICAL SEQUENCE - add an expression variable, add a typed variable,
        define a derived variable referencing both, assign a new value to the typed variable, recalculate
        - and the two stated results differ by exactly the change in the assigned value. Capturing it
        gives the pair a second, independent witness to the same behaviour, drawn from the document
        rather than from the oracle window.
      format: >-
        The two sequences and the two resulting values, each labelled with the specification section and
        line range it comes from, so a reviewer can check the recorded outcome against the document's
        stated one without leaving the recording.
      locator: "docs/n_cst_dwsvc_columnexp.md:L43-L54 and :L62-L73"

    # ---- C. THE VARIABLE ENVIRONMENT: SEVEN TYPES, NESTING, AND RECURSION -------------------------
    - name: variable.declaredTypeAndValue
      description: >-
        Every variable the engine holds, with its DECLARED SCALAR TYPE and its value. The add entry
        point exists in SEVEN TYPED OVERLOADS - time, string, integral, floating point, timestamp, date
        and boolean - and the set entry point exists in all seven types across three separate arities,
        so the type a variable was declared with is a first-class property and not an artefact of how it
        was printed. The oracle exercises the integral overload directly at `:L109`.
      format: >-
        A DISCRIMINATED UNION per variable - the type tag and the typed value - and NEVER a
        stringly-typed map. Collapsing to strings would lose exactly the type information the engine's
        coercion behaviour depends on, and the loss would be silent.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L153-L159"
    - name: variable.expressionVariableBody
      description: >-
        For each EXPRESSION variable, its own unexpanded body and its own emitted reference arrays. The
        oracle declares five of these at `:L104-L108` whose bodies are plain values, and then four more
        at `:L111-L114` whose bodies REFERENCE OTHER VARIABLES and call the macro - so the structure is
        genuinely nested, and one variable's value cannot be recorded without recording the references
        it resolves through.
      format: >-
        Per variable: the body verbatim, its reference array with each reference's mode, and its
        has-macro flag. Recorded recursively to full depth, because the engine's local-variable
        structure is itself recursive and a fixed-depth projection would truncate the deeper case
        without saying so.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L104-L114"
    - name: variable.quotedStringLiteralBody
      description: >-
        The one expression variable among the oracle's five whose body is a QUOTED STRING LITERAL rather
        than a bare number - `'3'` at `:L106`, against `1`, `2`, `4` and `5` on the lines around it -
        and the value produced when a later expression coerces it back to a number inside an arithmetic
        term at `:L114`. Recorded on its own because it is the only place in this workflow where the
        engine's own type coercion is exercised through the expression language rather than through a
        typed overload, and because the quoting is easy to lose in a transcription: a body of `3` and a
        body of `'3'` are different bodies.
      format: >-
        The body verbatim WITH its quotes intact, the type the engine resolved it to, and the value the
        consuming expression computed from it.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L106,L114"
    - name: variable.recursiveExpressionCase
      description: >-
        An expression variable whose body references another expression variable which in turn
        references a third, calculated to full depth, together with the recursion flag state on the
        expressions involved and the depth the engine's own recursion stack reached. The engine carries
        an explicit recursive flag per expression, settable by index and by name, and the specification
        lists recursion control among the capability's declared features - so recursion is a supported
        configuration rather than an accident, and its depth is observable through the trace's call
        stack.
      format: >-
        The resolution chain in resolution order, the value at each level, the recursion flag on each
        expression, and the maximum stack depth reached. Depth is recorded as an ordinal count, never as
        a duration.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L110,L2421-L2422"
    - name: variable.addOrder
      description: >-
        The order in which variables and expressions were added, as an ordinal per entry. This is
        recorded as an output rather than assumed from the seed because it is the KEY THE CALCULATION
        SEQUENCE IS SORTED BY: the engine walks its expression array, and that array's order is
        insertion order. A recording that carried the calculation sequence without carrying the add
        order would show an ordering with nothing to check it against.
      format: >-
        Two ordered lists - variables and expressions - each entry carrying its name and its
        one-based ordinal in the engine's own array.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L101-L103"

    # ---- D. THE FOREIGN VARIABLE - THE CO-RESIDENT CASE THAT WORKS ---------------------------------
    # The blocked cross-session case is declared under `blockedBehaviours`; these outputs capture the
    # case that succeeds, plus the handle that replaces the legacy's pointer.
    - name: foreignVar.registration
      description: >-
        The registration of a variable declared on the SECOND host as a foreign variable on the FIRST,
        at `w_test_dwsvc_columnexp.srw:L143`, recorded with the name it is registered under, the host it
        names, and the resulting variable-kind discriminator on the first host's table. The kind matters:
        the engine's changed-column pass explicitly SKIPS variables of the foreign kind
        [`n_cst_dwsvc_columnexp.sru:L282`], so registering as foreign changes which dirty-propagation
        path the variable takes, not merely where its value comes from.
      format: >-
        The registered name, the target host's ordinal handle, the variable kind as its raw numeric
        discriminator, and the length of the links array the registration produced.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L143"
    - name: foreignVar.resolvedValue
      description: >-
        The value the foreign variable resolves to when consumed, and its propagation into the consuming
        expression's result. The oracle makes this checkable end to end: the second host's variable is an
        AGGREGATE over that host's own column [`:L140`], and the first host's third expression adds the
        foreign value to its own arithmetic [`:L157`]. Because both hosts bind THE SAME definition with
        the same four rows, the aggregate has a known relationship to the rows a reviewer can verify
        rather than merely diff.
      format: >-
        The aggregate's value on the owning host, the value observed through the foreign reference on the
        consuming host, and the consuming expression's result - all three, so a divergence can be
        localized to the aggregate, to the crossing or to the arithmetic.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L140,L157"
    - name: foreignVar.requiresDynamicExpansion
      description: >-
        THE EXPLICIT NEGATIVE, captured because the specification states the rule and a rule with no
        recorded consequence is untested. The specification notes at `docs/n_cst_dwsvc_columnexp.md:L34`
        that a foreign variable REQUIRES the dynamic form, and the oracle obeys it - `:L157` consumes the
        foreign variable with a double sigil. The capture additionally attempts the same consumption with
        a SINGLE sigil and records what the engine does with it, so that the requirement is documented by
        observation rather than by restatement.
      format: >-
        The two attempts side by side: the mode used, the engine's numeric return code, any structured
        error produced, and the value obtained or the absence of one.
      locator: "docs/n_cst_dwsvc_columnexp.md:L29-L35"
    - name: foreignVar.dataWindowHandle
      description: >-
        The session-scoped host handle through which a foreign reference is resolved on the target side,
        recorded as its creation-order ordinal. This field HAS NO LEGACY COUNTERPART IN FORM - the legacy
        holds a live in-process object pointer in the same descriptor position - and it is recorded
        precisely because it is the substitution: the pointer is what cannot cross a service boundary,
        and the handle is what replaces it. The IDENTITY RELATION is what is compared, not the value: two
        references that named the same host in the legacy must resolve to the same ordinal here.
      format: >-
        The ordinal, the session ordinal it belongs to, and the host name the legacy pointer's target
        was declared under - so the relation is checkable from the recording alone.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L80-L83"

    # ---- E. CALCULATION ORDERING AND SCOPE --------------------------------------------------------
    - name: calc.addOrderSequence
      description: >-
        THE ORDERED SEQUENCE OF COLUMN CALCULATIONS a recalculate-all performs, as an ordinal-tagged
        list. The oracle asserts the rule in its own comments at `:L159` and `:L222` - recalculating all
        columns executes in the order the expressions were ADDED - and the engine implements it by
        walking its expression array from its first element to its last
        [`n_cst_dwsvc_columnexp.sru:L1166-L1172`], which is insertion order. THE SEQUENCE MUST NOT MATCH
        COLUMN ORDER, and in this fixture it cannot by accident: the oracle sets its expressions in the
        order third-column, then second, then first at `:L116` then `:L151`, `:L154`, `:L157`, so add
        order and column order genuinely disagree.
      format: >-
        An ordered list of calculation records - ordinal, expression index, column name, row - captured
        for each recalculate-all, paired with the add-order list so the correspondence is checkable
        without cross-referencing another file.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L1166-L1172"
    - name: calc.forceFlagEffect
      description: >-
        What the FORCE flag actually does, captured as a difference between two recalculate-all passes -
        one without it at `:L160` and `:L256`, one with it at `:L223`. It is easy to assume the flag
        means "ignore the cache"; it does not. When the flag is CLEAR the pass SKIPS any expression that
        has one or more relative-INPUT columns configured [`n_cst_dwsvc_columnexp.sru:L1168-L1170`];
        when it is SET, nothing is skipped. So the observable effect is a DIFFERENT SET of expressions
        calculated, not a different value from the same set.
      format: >-
        The two calculated sets side by side with the flag's value, plus the per-expression
        relative-input-column array that decides membership. Where the two sets are equal the recording
        says so explicitly, because on a configuration with no input-relative expressions equality is the
        correct outcome and silence would look like a missing capture.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L160,L223,L256"
    - name: calc.singleRowScope
      description: >-
        A single-row calculation's scope, from the oracle's `:L117`, recorded as the set of expressions
        it evaluated and the row it evaluated them for - together with the engine's numeric return code
        for an out-of-range row, which is a distinct code rather than a plain failure
        [`n_cst_dwsvc_columnexp.sru:L1159`]. Recorded because the row-scoped and all-rows entry points
        share their per-row logic, and a port that scoped one of them wrongly would still produce
        correct values for the other.
      format: >-
        The row, the ordered expression set evaluated, and the raw numeric return code. THE CODE IS
        RECORDED AS ITS NUMBER, never as a boolean projection of it, because the engine's algebra
        distinguishes outcomes a boolean would merge.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L117"
    - name: calc.reentrancyGuardOutcome
      description: >-
        The outcome of a calculation entered while a calculation is already in progress. The engine holds
        a re-entrancy flag and returns the plain failure code IMMEDIATELY rather than recursing
        [`n_cst_dwsvc_columnexp.sru:L1160`], so the guard is observable through the return code. This is
        reachable from a macro callback, because the callback runs client-side code in the middle of a
        calculation and that code could call back into the engine - which makes the guard a real path
        rather than a defensive one, and worth driving deliberately.
      format: >-
        The nesting attempt, the raw numeric code returned, the flag's value at entry and at exit, and
        the confirmation that the outer calculation completed normally afterwards - the guard must not
        leave the flag set.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L1160"
    - name: calc.relativeColumnTrigger
      description: >-
        Which expressions a change to one column triggers when relative columns are configured, captured
        for the singular and the plural setter forms and for both the by-index and the by-name spellings.
        The engine exposes all four combinations, and the specification documents the plural by-name form
        at `docs/n_cst_dwsvc_columnexp.md:L162`. Recorded per form because four entry points that are
        supposed to converge on one behaviour are four chances for one of them to diverge.
      format: >-
        Per configuration: the setter form used, the resulting relative-column identifier array, the
        column changed, and the ordered set of expressions that recalculated.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L128,L135-L137"
    - name: calc.relativeInputColumnTrigger
      description: >-
        The same for relative-INPUT columns, which are NOT the same thing and must not be captured as if
        they were: the specification states at `docs/n_cst_dwsvc_columnexp.md:L163` that this form fires
        ONLY when the user inputs the column, and the engine's changed dispatcher carries a
        from-input discriminator on its own signature to tell the two cases apart. So the capture drives
        each configured column BOTH as a user input and as a programmatic change, and records that the
        two produce different recalculated sets.
      format: >-
        Per configuration and per driving mode: the setter form, the identifier array, whether the change
        was flagged as coming from input, and the ordered set of expressions that recalculated. The
        negative case - a programmatic change producing NO recalculation - is recorded explicitly.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L129,L138-L140,L229"
    - name: calc.alwaysCalcAndTriggerEventFlags
      description: >-
        The effect of the always-calculate and trigger-event flags, each settable by index and by name.
        Always-calculate makes an expression match every changed column unconditionally, short-circuiting
        the relative-column tests entirely [`n_cst_dwsvc_columnexp.sru:L241-L279`]; trigger-event decides
        whether a completed calculation raises the host's changed notification. Both are per-expression
        booleans and both change what a recording contains, so both are captured set and clear.
      format: >-
        A small matrix: flag, value, the expressions that calculated, and whether the notification fired.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L133-L134,L148-L149"

    # ---- F. THE TRI-STATE CACHE, THE REVERSE INDEX, AND MULTIPLE EXPRESSIONS PER COLUMN -----------
    - name: cache.columnFlagTransitions
      description: >-
        The per-column calculation flag and EVERY TRANSITION IT MAKES. The flag is TRI-STATE - unknown,
        yes, no - and not a boolean: a column starts unknown [`n_cst_dwsvc_columnexp.sru:L234-L235`], is
        set to no as the default before any match is sought [`:L239`], and is promoted to yes only when a
        match is found [`:L276`]. Thereafter the flag is CONSULTED rather than recomputed [`:L238`], so
        it is a cache and its state decides whether the match loop runs at all. Two of the three states
        would collapse under a boolean and the collapse would be invisible in the values.
      format: >-
        An ordered transition log per column: the raw numeric flag value before, the trigger, and the raw
        numeric value after. RAW NUMBERS, not names, because the numbers are what the engine holds and
        what a payload would carry.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L113-L115"
    - name: cache.reverseDependencyIndex
      description: >-
        The REVERSE DEPENDENCY INDEX built per column - the list of expression entries and the list of
        variable entries that depend on that column - and it is recorded as a first-class output because
        it is the structure that makes dirty propagation work. The engine appends to the expression half
        at `n_cst_dwsvc_columnexp.sru:L276-L277` and to the variable half at `:L285`, then walks the
        expression half to decide what to recalculate at `:L295-L303`. An index built differently
        produces a different recalculated set from the same change.
      format: >-
        Per column: the two ordered index arrays as arrays of one-based ordinals into the engine's own
        expression and variable arrays, captured after the first change that forces the column's flag to
        be resolved.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L44-L48"
    - name: cache.recalculatedColumnSet
      description: >-
        THE FULL SET OF COLUMNS THAT RECALCULATE as a result of changing ONE column - and that set IS the
        behaviour, not a by-product of it. This fixture makes the set non-trivial because its three
        expressions reference each other's columns: the first references the second and third, the second
        references the columns behind the first and third, and the third references the first and second
        by name. So one change propagates, and how far it propagates is exactly what the reverse index
        decides.
      format: >-
        Per changed column: the ordered set of columns recalculated, the ordinal each recalculation
        occurred at, and the value each produced. Recorded as an ORDERED set rather than a set, because
        the order is itself the add-order behaviour and discarding it would lose a second assertion.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L295-L303"
    - name: dupExp.selectionByChangedColumn
      description: >-
        A column carrying TWO expressions, and which of them is selected - the selection following WHICH
        COLUMN WAS MODIFIED, not which expression was added last. The expression descriptor carries a
        duplicate-expression array for exactly this [`n_cst_dwsvc_columnexp.sru:L32`], the specification
        lists it among the capability's declared features [`docs/n_cst_dwsvc_columnexp.md:L8`], and the
        engine clears the dirty flag across the whole duplicate group when it processes any member of it
        [`:L2059`]. The capture binds two expressions to one column, drives a change from each of two
        different columns, and records which expression answered each time.
      format: >-
        The duplicate-expression array's contents as ordinals, then per driving change: the column
        changed, the expression index selected, the value produced, and the dirty-flag state of every
        member of the group before and after.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L22-L42"

    # ---- G. THE INVERTED MACRO STREAM -------------------------------------------------------------
    # The legacy expects THE APPLICATION to implement the macro switch, and the oracle window does
    # exactly that. Across a service boundary the direction inverts: the service must call BACK INTO ITS
    # CLIENT and wait for the answer before the calculation can continue.
    - name: macro.invocation
      description: >-
        EVERY macro invocation, in invocation order: the macro NAME as the engine passed it, the ORDERED
        ARGUMENT ARRAY, and the VALUE RETURNED. The oracle implements one macro name and its body rounds
        the first argument to the precision given by the second [`:L305-L309`], so both arguments and the
        return are checkable rather than opaque. Every expression the oracle sets calls this macro, which
        makes the invocation log the densest output in the capture and the one that most directly shows
        whether the inverted stream carried the same values in the same order on both sides.
      format: >-
        An ordered array of records - invocation ordinal, macro name, argument array in positional order
        with each argument's textual projection, and the returned value as a DISCRIMINATED VALUE carrying
        its runtime type as well as its text. The type is part of the answer: the callback's declared
        return is untyped, and what the calculation then does with the value depends on the type it came
        back as.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L305-L309"
    - name: macro.invocationIsSynchronous
      description: >-
        THE EXPLICIT ORDERING FACT, recorded because it is what makes the inverted stream a stream rather
        than a notification: the calculation CANNOT PROCEED without the returned value, so the callback is
        strictly synchronous and no reordering is permitted. The capture records, per invocation, the
        calculation step that was suspended and the step that resumed after the answer arrived, so that a
        candidate which fired the callback and continued without waiting is detectable. An out-of-order
        arrival is a HARD ERROR here, never a reorder opportunity.
      format: >-
        Per invocation: the suspended step's ordinal, the resumed step's ordinal, and a monotonic
        sequencing ordinal. THE ORDINAL IS FOR DETECTION, NOT FOR TIMING - it is a counter, and nothing
        in this store derives a duration from two of them.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L14"
    - name: macro.dynamicDispatchCase
      description: >-
        A MACRO-DYNAMIC invocation, in which THE FUNCTION NAME IS ITSELF A VARIABLE rather than a literal
        - the reserved dispatch form. The specification's worked example holds the function name in a
        variable and references it statically inside the dispatch call
        [`docs/n_cst_dwsvc_columnexp.md:L138-L141`], which is the fifth of the five grammar forms and the
        only one the oracle window does not itself exercise. It is captured here because leaving it out
        would leave one of the five modes unproven, and the engine models it with a distinct reserved
        sentinel name that appears in payloads.
      format: >-
        The dispatch expression's source text, the reference mode of the name variable, the resolved
        function name, the argument array, and the returned discriminated value - plus the engine's
        built-in flag on the function reference, which distinguishes a reserved dispatch from an
        application macro.
      locator: "docs/n_cst_dwsvc_columnexp.md:L130-L151"
    - name: macro.sentinelNamesAndArityGuards
      description: >-
        The TWO SENTINEL CONSTANTS the engine uses to encode its grammar internally, recorded with their
        EXACT SPELLINGS because both appear in captured payloads: an EMPTY function name models a bare
        variable reference, and a specific reserved word models dynamic dispatch
        [`n_cst_dwsvc_columnexp.sru:L120-L121`]. Recorded alongside them: the two ARITY GUARDS the engine
        enforces on those sentinels - the bare-variable form requires exactly one argument [`:L1390`] and
        the dispatch form requires at least one [`:L1394`] - each of which reports through the parse-error
        builder and returns the invalid-argument code.
      format: >-
        The two spellings verbatim, including the empty one recorded as an explicit empty string rather
        than as an absent field, and per guard: the arity supplied, the raw numeric return code, and the
        structured error produced.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L120-L121"

    # ---- H. THE TRACE, FORMAT-EXACT --------------------------------------------------------------
    - name: trace.record
      description: >-
        THE ACCUMULATED TRACE, as an ordered sequence of records carrying SIX FIELDS IN THIS ORDER: the
        line counter, the column name, the row, THE CALL STACK, the value, and the UNEXPANDED EXPRESSION.
        That order is the oracle's own, from its handler's format string at `:L315`, and it is preserved
        because the trace is what a legacy operator actually read: reordering the fields would produce a
        recording that no longer corresponds to the artefact the behaviour was originally observed
        through. The handler appends each record to a growing text buffer terminated by a carriage-return
        and line-feed escape, then scrolls.
      format: >-
        One record per line in a text artefact, the six fields in the oracle's order and separated as the
        oracle separates them - the counter left-aligned in a four-wide field, the column name followed by
        the row in parentheses, then the call stack, then the value, then the expression behind its own
        label. Emitted as text rather than as structured data precisely BECAUSE the format is part of what
        is compared; a structured re-projection would compare the fields and lose the formatting.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L315-L316"
    - name: trace.callStack
      description: >-
        The CALL STACK field of each trace record, recorded verbatim rather than parsed. It is built by
        the engine's own recursion and calculation stack - a vector created in the engine's constructor
        with an initial reservation [`n_cst_dwsvc_columnexp.sru:L2421-L2422`] and declared at `:L110` -
        so its contents are the live nesting of the calculation at the moment the record was emitted, and
        it is the only output in this capture that exposes the recursion depth of a nested expression.
      format: >-
        The stack string exactly as the engine composed it, unparsed and unnormalized except for the
        newline convention the mask declares. Recorded verbatim because its internal separator is the
        engine's own and re-deriving it would substitute the capture's formatting for the oracle's.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L110"
    - name: trace.nullValueRendering
      description: >-
        The VALUE field's rendering when the computed value is EMPTY, which is where the fixture's
        deliberate null seeding becomes observable. The engine substitutes a literal placeholder text for
        an empty value when EITHER the expression's empty-string-is-null flag is set OR the column is not
        a character column [`n_cst_dwsvc_columnexp.sru:L758`], so the same empty value renders one way on
        a decimal column and potentially another on a character column. Replacing the fixture's nulls with
        empty strings would change which arm of that condition is taken and would silently change this
        field on every row.
      format: >-
        Per record where the value was empty: the placeholder text as emitted, the expression's
        empty-string-is-null flag, the column's type discriminator, and which of the two conditions was
        satisfied.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L758"
    - name: trace.enabledGate
      description: >-
        The trace property's own value, and the EXPLICIT NEGATIVE that no trace record is emitted while it
        is clear. Recorded because the absence of trace records is otherwise ambiguous - it looks exactly
        like an engine that calculated nothing - and because the property is declared private-write
        [`n_cst_dwsvc_columnexp.sru:L98`], so it is settable only through its own entry point at `:L208`
        and a port that exposed it as a plain field would widen the surface.
      format: >-
        The property's boolean value, the raw numeric code its setter returned, and the record count
        emitted under each value.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L98"

    # ---- I. ERRORS - STRUCTURED, WITH CARET POSITIONS, AND DELIBERATELY NOT LOCALIZED -------------
    - name: parseError.structured
      description: >-
        Every parse and calculation error the engine reports, as a STRUCTURED RESULT preserving the
        original message text, the caret position where the builder supplies one, the severity the dialog
        carried, and THE EXPLICIT FACT THAT THE TEXT IS NOT LOCALIZED. The engine has 28 dialog call
        sites, every one of them live and none of them routed through the localization layer, while the
        equivalent messages in this service's sibling row-select and context-menu services ARE routed
        through it. That inconsistency is legacy behaviour and is reproduced; see defect D-03.
      format: >-
        Per error: the message text verbatim, the caret position as a one-based character offset or an
        explicit absence, the severity, the expression the error was raised against, the raw numeric
        return code, and a boolean recording that the text was NOT localized. Only the delivery channel
        changes from dialog to structured result; every field the dialog carried is preserved.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L1308"
    - name: parseError.caretPosition
      description: >-
        The CARET POSITION specifically, captured on its own because it is computed rather than recorded
        and the computation is not obvious: the builder is handed a position derived from the macro's own
        start offset plus HALF the distance from that offset to the current scan position
        [`n_cst_dwsvc_columnexp.sru:L1308`, `:L1383`, `:L1390`, `:L1394`]. Whatever the reason for the
        halving, IT IS THE OBSERVABLE VALUE, and a port that reported the plain scan position would place
        the caret somewhere else in the expression while every other field matched.
      format: >-
        Per error: the caret position as its raw integer, the expression's length, and the substring the
        position points at - so a reviewer can see where the caret landed rather than recompute it.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L1308,L1383,L1390,L1394"
    - name: calcError.expressionErrorSentinels
      description: >-
        The general expression error, raised when a calculated value comes back as EITHER of two
        single-character sentinel strings [`n_cst_dwsvc_columnexp.sru:L762`]. Both spellings are recorded
        exactly, because the check is on the value's literal text: an expression that legitimately
        evaluated to one of those characters would be reported as an error, which is a real edge of the
        legacy contract rather than a hypothetical one.
      format: >-
        The two sentinel spellings verbatim, and per occurrence: the value returned, which sentinel
        matched, the message produced, and the boolean the engine returned.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L762"
    - name: cacheError.reportsWrongExceptionVariable
      description: >-
        The cache error's message text, captured for one specific reason: the engine reports THE WRONG
        EXCEPTION VARIABLE'S TEXT there. Inside the inner handler at
        `n_cst_dwsvc_columnexp.sru:L738-L739` the message reads the OUTER handler's throwable, bound at
        `:L703` in a block that closed at `:L704`, rather than the throwable the inner handler actually
        caught. So the text that reaches the operator is not the text of the exception that occurred.
        Recorded so the reproduction is deliberate and visible - see defect D-03's note.
      format: >-
        The message text verbatim, the exception the inner handler caught, the exception whose text was
        actually reported, and an explicit note that the two differ by design of the reproduction rather
        than by accident of the port.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L739"

    # ---- J. THE REMAINING SURFACE -----------------------------------------------------------------
    - name: service.enabledProperty
      description: >-
        The engine's enabled property and the EXPLICIT NEGATIVE behind it. The property is declared
        protected-write on the engine's base class [`n_cst_dwsvc.sru:L38`] and set through an entry point
        that returns early when the value is unchanged [`:L89-L92`], and every public entry point on the
        engine gates on it - returning the plain FAILURE code rather than silently doing nothing, which is
        an observable difference. The capture records a call made while disabled and the code it returned.
      format: >-
        The property's value, the raw numeric code the setter returned for a changing and for an unchanged
        assignment, and the raw numeric code a gated entry point returned while disabled.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc.sru:L38,L89-L92"
    - name: itemChanged.notification
      description: >-
        The item-changed notification the oracle handles at `w_test_dwsvc_columnexp.srw:L312`, recorded as
        an arrival with its arguments and its position in the sequence. The oracle's handler body does
        nothing but chain to its ancestor, which is itself the observation: the notification's OBSERVABLE
        contribution here is that it FIRED, and when. The engine declares its own changed events
        [`n_cst_dwsvc_columnexp.sru:L86-L88`] and the trigger-event flag decides whether a completed
        calculation raises one, so the arrival is coupled to a flag this capture also records.
      format: >-
        Per arrival: the ordinal, the row, the column, and the trigger-event flag state of the expression
        that caused it. No return value is recorded, because the event declares none.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L312"
    - name: api.entryPointReturnCodes
      description: >-
        The raw numeric return code of every engine entry point the capture calls, recorded as a matrix.
        This exists because the engine's API surface is FAR LARGER than the nine methods the
        specification documents - see defect D-06's note for the enumeration - and the codes are the only
        uniform observable across all of it. Each is recorded as ITS NUMBER, never as a boolean
        projection: the surrounding return-code algebra is deliberately tri-state, so a boolean
        projection merges outcomes the algebra keeps distinct.
      format: >-
        One row per call: the entry point, its arity, the arguments' types, and the raw numeric code
        returned. The out-of-range and invalid-argument codes are recorded as their own distinct numbers
        rather than folded into a generic failure.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L125-L208"

  recordingArtifacts:
    # Seven text-based, diffable files, one workflow's output in one workflow's own directory. THE
