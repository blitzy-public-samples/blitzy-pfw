# ==================================================================================================
#  THE ONE HARD LIMIT, STATED WITHOUT SOFTENING
#  ------------------------------------------------------------------------------------------------
#  This store reports exactly two behaviours BLOCKED, and this workflow owns one of them - a division
#  `dataservices-dw-event-chain` records from its own side, naming pinyin first-letter matching as
#  `dataservices-dwsvc-dropdownsearch`'s and cross-session foreign expression variables as this
#  definition's. A KNOWN GAP IS REPORTABLE; AN APPROXIMATION IS AN UNKNOWN ONE, and approximating a
#  pointer dereference across a network would produce results wrong in a way no test would obviously
#  catch. Recorded here, before implementation, rather than discovered during it.
# ==================================================================================================
blockedBehaviours:
  - behaviour: >-
      CROSS-SESSION FOREIGN EXPRESSION VARIABLES - a foreign variable resolved against another host's
      expression service that is NOT co-resident in the same expression session, or that lives in a
      different service instance altogether. The co-resident case IS supported, is exercised by this
      capture, and is compared normally; it is the crossing of a session or an instance boundary that is
      blocked.
    reason: >-
      THE LEGACY'S FOREIGN-VARIABLE DESCRIPTOR HOLDS A LIVE IN-PROCESS OBJECT POINTER, AND A POINTER
      CANNOT BE SERIALIZED. Its second field is typed as the expression service class itself
      [`ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L80-L83`], so what the
      legacy stores is not a name, a handle or an address that could be re-resolved at the far end - it
      is a direct reference to another live object in the same process, dereferenced synchronously
      whenever the variable is consumed.


      TWO OPERATIONS DEPEND ON THAT SYNCHRONOUS ACCESS AND NEITHER HAS A REMOTE FORM. Registering a
      foreign variable resolves against the other host's live service at registration time
      [`:L201`, driven at `ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L143`] - which is
      why the oracle must enable that service at `:L136` before registering at `:L143`, and why the
      seed phase declares that ordering. And resolving the LINKS ARRAY on the global-variable
      descriptor [`n_cst_dwsvc_columnexp.sru:L65-L71`] walks a chain of such references, with the
      changed-column pass explicitly branching on whether that array is non-empty [`:L281-L292`, the
      branch at `:L285`]. A chain of pointers is not a payload.


      THE LEGACY ALSO REQUIRES THE DYNAMIC FORM FOR THIS PATH, which removes the one escape that might
      otherwise have existed. The specification states it at `docs/n_cst_dwsvc_columnexp.md:L34`, and
      the oracle obeys it at `w_test_dwsvc_columnexp.srw:L157`. A static reference is substituted at
      bind time and would need the value only once; a dynamic reference is resolved AT EVERY
      CALCULATION, so the far service must be reachable for the whole life of the expression rather
      than for one instant during its binding.


      THE RESOLUTION, AND WHAT IS NOT BEING CLAIMED. Cross-DataWindow variables are resolved through a
      SESSION-SCOPED HOST HANDLE, and they are supported ONLY where both hosts are co-resident in the
      same expression session inside one service instance - which is the case the oracle exercises,
      because it binds the same definition to two controls in one window. A foreign reference that
      spans sessions or service instances is BLOCKED AND RETURNS A DEFINED ERROR AT THE BOUNDARY, NEVER
      A SILENTLY WRONG VALUE AND NEVER A NULL THAT READS AS AN EMPTY AGGREGATE. THIS IS A GENUINE,
      UNAVOIDABLE NARROWING OF THE LEGACY CONTRACT and it is recorded as one rather than described as a
      design improvement.


      WHAT THE CAPTURE MUST THEREFORE CONTAIN - BOTH CASES, NOT ONE. The co-resident case, which
      succeeds and whose value is compared normally against the legacy master. AND the cross-session
      case, driven against the second session the seed phase opens for exactly this purpose, whose
      EXPECTED RECORDED OUTCOME IS THE DEFINED ERROR: its identifier, its message, and the raw numeric
      code, recorded field by field like any other structured error in this capture. A CAPTURE IN WHICH
      THE CROSS-SESSION CASE RETURNS A VALUE IS A FAILURE - the value would be either fabricated or
      resolved through a coupling that is not supposed to exist, and both are worse outcomes than the
      error. Equally, a capture in which the CO-RESIDENT case returns the error is a failure in the
      other direction: the narrowing is exactly as wide as this paragraph says and no wider.
    disposition: narrowed-with-defined-error

# ==================================================================================================
#  THE DETERMINISM MASK - INLINE, SYMMETRIC, AND EVERY ENTRY WITH ITS REASON
#  ------------------------------------------------------------------------------------------------
#  The mask is a MEMBER of this definition rather than a pointer to one, because a mask that drifts away
#  from its workflow silently invalidates every pair captured under it. There is no reference, path or
#  see-also member in the schema by which it could be delegated, and that omission is deliberate.
#  EVERY ENTRY APPLIES TO BOTH SIDES: masking only the candidate leaves the master holding a value that
#  can never be matched, and masking only the master inverts the same problem. One configuration, used
#  for both captures. `../../docs/PARITY.md` section 5.1 is the authoritative seam register and carries
#  each seam's injection point and status; the entries below are this workflow's application of it.
#
#  PREFER THE SEAM TO THE MASK, and four of the six entries below do: they make a field REPRODUCIBLE
#  rather than removing it from the comparison. Only where a value cannot be made reproducible without
#  changing observable behaviour is the field masked out instead, and the entry says so.
# ==================================================================================================
determinismMask:
  - seam: >-
      THE TRACE RECORD'S LINE COUNTER - the first of the trace's six fields, which the oracle's handler
      derives from the LINE COUNT OF THE ACCUMULATED TEXT BUFFER rather than from a counter of its own
      [`ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L315`].
    method: >-
      RENUMBER FROM ONE PER CAPTURE, on both sides, and compare the renumbered ordinals. The field is
      not dropped and is not blanked: renumbering makes it reproducible, so the comparison keeps its
      ability to detect a MISSING or a DUPLICATED trace record, which blanking the field would forfeit.
    appliesTo: [legacy, dotnet]
    reason: >-
      Because the counter is read off the buffer's line count, its value depends on HOW MUCH HAS
      ALREADY BEEN TRACED rather than on the behaviour under test - so any earlier tracing, any wrapped
      long line, and any difference in the multi-line rendering of a call stack shifts every subsequent
      number. Left unmasked it reports a difference on every record after the first divergence and buries
      the real finding under an offset. WHAT IS EXPLICITLY NOT MASKED HERE IS THE RELATIVE ORDER OF THE
      RECORDS: that order is behaviour - it is the add-order calculation sequence made visible - and it
      is compared in full.
  - seam: >-
      EVERY CLOCK READ reachable from this engine - any timestamp that reaches a recorded field or a
      recorded decision, on either side. Two of the engine's seven typed variable overloads take a
      timestamp and a date, so a clock value can enter the variable environment through the public API
      even though the engine reads no clock of its own.
    method: >-
      Inject the clock and substitute a deterministic double that advances only when the test advances
      it. Nothing in this engine BRANCHES on a clock value, so the substitution changes no path; it only
      makes a recorded timestamp reproducible.
    appliesTo: [legacy, dotnet]
    reason: >-
      A timestamp differs on every run BY DEFINITION RATHER THAN BY BEHAVIOUR, so an unmasked one reports
      a difference on every comparison and trains a reviewer to ignore red results. NOTE WHAT THIS IS
      NOT: seaming the clock does not introduce a timing assertion. NO ELAPSED VALUE IS RECORDED OR
      COMPARED ANYWHERE IN THIS WORKFLOW - the seam exists so that a date or timestamp VARIABLE is
      reproducible, not so that a duration can be measured.
  - seam: >-
      NEWLINE CONVENTION in every multi-line recorded field - most consequentially the trace artefact,
      whose records the oracle's handler terminates with an explicit CARRIAGE-RETURN AND LINE-FEED escape
      [`ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L315`], and secondarily the multi-line
      error messages, which the engine composes with embedded newline escapes.
    method: >-
      Declare ONE newline convention for this workflow and apply it identically to both halves AT
      COMPARISON TIME. This is a comparison-time normalization only: IT DOES NOT LICENSE EDITING A
      STORED MASTER, which the technique forbids outright.
    appliesTo: [legacy, dotnet]
    reason: >-
      The master is produced on Windows by the legacy framework while the candidate runs in a Linux
      container, so raw line endings differ BY PLATFORM RATHER THAN BY BEHAVIOUR - and the repository's
      root `.gitattributes` declares ONLY language mappings, with NO `text` and NO `eol` rule at all, so
      nothing normalises them on the way into version control. This workflow makes the difference
      unusually visible because its principal artefact is a line-oriented text trace whose terminator
      the oracle spells out explicitly, so without this entry a byte-exact comparison reports a
      difference on EVERY line of it. Changing `.gitattributes` is NOT in scope and would be the wrong
      place to solve it: the normalization belongs to the comparison, not to the repository's checkout
      behaviour.
  - seam: >-
      MODIFY-CALL ORDERING on the DataWindow property path - the describe and modify calls the engine
      issues while BINDING an expression, including the creation of the generated compute object per
      cacheable expression and the property reads the parse routine performs to resolve column
      identifiers and column types.
    method: >-
      Fix the order in which the engine issues its describe and modify calls, and record them in that
      fixed order on both sides.
    appliesTo: [legacy, dotnet]
    reason: >-
      Two orderings that reach the same state can emit different INTERMEDIATE output, so an unpinned
      order surfaces as a difference where no behaviour changed - and this engine issues a dense burst of
      such calls on every set, because it resolves a column identifier and a column type for every
      reference it emits. Fixing the ORDER is not the same as fixing the OUTCOME: the properties' VALUES
      remain fully compared, and a genuine change in what a property returns is still detected.
  - seam: >-
      SESSION AND HOST HANDLE IDENTIFIERS - allocated per run on the target side, where the legacy has an
      in-process object identity instead. This includes the handle stored in place of the legacy's live
      pointer in the foreign-variable descriptor, and the generated compute-object names the engine
      derives per expression.
    method: >-
      Replace each identifier with a STABLE ORDINAL assigned in creation order, on both sides, and record
      the ordinal rather than the identifier. Equality between two ordinals still means what equality
      between two identifiers meant.
    appliesTo: [legacy, dotnet]
    reason: >-
      The identifier is allocated per run and can never match across two runs, let alone across two
      sides. But THE IDENTITY RELATION IS BEHAVIOUR - which host a foreign reference resolves against,
      and therefore whether two references reach the same expression service - and an ordinal preserves
      that relation exactly while removing the variation. THIS MATTERS MOST FOR THE FOREIGN-VARIABLE
      CASE, where the handle is the very thing that replaces the legacy pointer: masking the field out
      entirely would remove the relation along with the variation and would leave the blocked case's
      boundary undetectable, which is why an ordinal is used instead.
  - seam: >-
      DECIMAL FORMATTING CULTURE in every numeric value rendered into a recording - the expression
      results, the macro arguments and returns, and the value field of every trace record.
    method: >-
      Pin an INVARIANT culture for numeric rendering on both sides, and render through the fixture's own
      declared two-fractional-digit edit mask
      [`ws_objects/pfw.tests.pbl.src/dw_test_dwsvc_columnexp.srd:L20-L22`] rather than through whatever
      default the host platform supplies.
    appliesTo: [legacy, dotnet]
    reason: >-
      The oracle's macro ROUNDS ITS FIRST ARGUMENT TO A PRECISION [`w_test_dwsvc_columnexp.srw:L308`] and
      every recorded value is therefore a numeric string, so a culture difference in the decimal separator
      or the group separator would present as a VALUE DIVERGENCE WHEN THE VALUE IS IDENTICAL - a false
      finding that looks exactly like the real one this pair is hunting. Pinning the culture is a seam and
      not a mask: THE NUMBERS THEMSELVES REMAIN FULLY COMPARED, and a genuine change of precision, of
      rounding direction or of magnitude is still detected. That distinction is the point of pinning
      rather than blanking, because precision is what the variable set at `:L292` actually changes.

# ---- WHAT IS DELIBERATELY NOT MASKED, STATED EXPLICITLY ---------------------------------------------
#  FOR THIS WORKFLOW THIS IS THE MOST IMPORTANT PARAGRAPH IN THE MASK. Everything below is the behaviour
#  under test. Masking any one of them would produce a comparison that passes while proving nothing,
#  which is strictly worse than a comparison that fails - a red result gets investigated, a green one
#  that proves nothing does not:
#    * EVERY EXPRESSION VALUE, per row and per column, before and after every variable set;
#    * THE STATIC-VERSUS-DYNAMIC DIVERGENCE ITSELF - the one output this whole pair exists for. A mask
#      here would defeat the workflow completely and silently;
#    * THE EXPANSION MODE OF EVERY INDIVIDUAL REFERENCE, all five of them, per reference and never
#      aggregated to the expression;
#    * THE UNEXPANDED SOURCE EXPRESSION TEXT, character for character, including its irregular spacing;
#    * THE REWRITTEN TEXT the parse routine produces in place, and the lengths of the two reference
#      arrays it emits alongside it;
#    * THE BIND-TIME SNAPSHOT and THE LIVE ENVIRONMENT, both, as the two halves of one comparison -
#      masking either makes the other unfalsifiable;
#    * THE CALCULATION ORDER, and the add-order list it is checked against;
#    * THE RECALCULATED-COLUMN SET produced by a change to one column, AND its order;
#    * THE TRI-STATE CACHE TRANSITIONS, as raw numbers, all three states;
#    * THE REVERSE DEPENDENCY INDEX, both of its arrays, as ordinals;
#    * THE MACRO NAME AND ITS ORDERED ARGUMENT ARRAY, and the runtime type of what the callback returned;
#    * THE CARET POSITION in every parse error, and the PARSE-ERROR TEXT verbatim - including the fact
#      that it is not localized;
#    * THE TWO SENTINEL SPELLINGS, including the empty one;
#    * THE RAW NUMERIC RETURN CODES, never a boolean projection of any of them.
#  And nothing is masked on one side only, anywhere, ever.

# ==================================================================================================
#  THE DEFECTS THIS PAIR EXISTS TO PROVE SURVIVED
#  ------------------------------------------------------------------------------------------------
#  THE INVERSION IS LOAD-BEARING: a capture that shows CORRECTED behaviour is a parity FAILURE, not an
#  improvement. Where the target produces output that looks more correct than the oracle, the finding is
#  a divergence in the target and is filed as a defect (C-B). A legacy defect is reproduced and annotated
#  AT ITS POINT OF REPRODUCTION, never repaired. `../../docs/PARITY.md` section 7 is the authoritative
#  catalogue of behaviour groups - section 7.3 for the expansion distinction and section 7.8 for the
#  non-localized messages - and the entries below record which of them THIS pair pins.
# ==================================================================================================
provesDefects:
  - defect: >-
      D-01. STATIC EXPANSION IS PERMANENTLY FIXED AT BIND TIME WHILE DYNAMIC EXPANSION IS RESOLVED AT
      CALCULATION TIME - two behaviours ONE CHARACTER APART in the source. The single-sigil form has its
      variable's value substituted into the expression at the moment the expression is set, so no later
      assignment to that variable can ever change the result; the double-sigil form retains the variable
      as a reference into the live table, so a later assignment propagates. The oracle proves it without
      construction: the SAME variable is referenced statically at `:L151`, dynamically at `:L154` and
      dynamically-by-computed-name at `:L157`, and is then given a new value at `:L292`. The static
      expression's value must be unchanged; the other two must move.
    locator: >-
      ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L151, :L154, :L157 and :L292, with the
      authoritative worked examples at docs/n_cst_dwsvc_columnexp.md:L43-L54 and :L62-L73
    note: >-
      ANY CAPTURE IN WHICH A STATIC REFERENCE TRACKS A LATER VARIABLE CHANGE IS A PARITY FAILURE, and it
      is the specific failure most likely to be mistaken for an improvement: a reviewer seeing all three
      columns agree after the set would reasonably read it as consistency. It is not - it is the loss of
      the behaviour. THE SECOND WAY TO GET THIS WRONG IS SUBTLER AND IS A RECORDING FAILURE RATHER THAN
      AN IMPLEMENTATION ONE: recording only the already-expanded expression string. That capture cannot
      detect this defect in either direction, because an expanded static reference is indistinguishable
      from a literal and an expanded dynamic reference has lost the environment it resolves against - so
      the comparison passes whatever the implementation does. This is why the three-part payload is
      mandatory and why the mode is tagged per reference. Note finally that the specification's own
      inline comments at `docs/n_cst_dwsvc_columnexp.md:L67` and `:L85` describe a double-sigil reference
      as statically expanded, which is the opposite of what the code beside them does; the code and the
      stated outcomes at `:L48`, `:L50` and `:L69` are authoritative, and the document is read-only and
      is not corrected.
  - defect: >-
      D-02. RECALCULATING ALL COLUMNS FOLLOWS EXPRESSION ADD ORDER, NOT COLUMN ORDER. The oracle states
      it in its own comments, twice, at `:L159` and `:L222`, and the engine implements it by walking its
      own expression array from first element to last - insertion order - rather than iterating the
      DataWindow's columns [`n_cst_dwsvc_columnexp.sru:L1166-L1172`].
    locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnexp.srw:L222-L223"
    note: >-
      IT LOOKS LIKE AN IMPLEMENTATION DETAIL AND IT IS OBSERVABLE, which is what makes it a defect to
      preserve rather than a fact to note. These three expressions reference each other's columns, so the
      order they are evaluated in decides which of them sees an already-updated neighbour and which sees a
      stale one. THE FIXTURE MAKES THE TWO ORDERS GENUINELY DISAGREE, so a port that iterated columns
      would not get away with it by coincidence: the oracle sets its expressions third-column, then
      second, then first, and the fixture independently declares its own column controls OUT of
      identifier order - identifier five before identifier four at
      `ws_objects/pfw.tests.pbl.src/dw_test_dwsvc_columnexp.srd:L23-L24`. Two independent orderings
      already differ from add order before the capture starts. One adjacent fact worth not conflating:
      the FORCE flag on the same entry point does NOT change this order - it changes MEMBERSHIP, by
      stopping input-relative expressions from being skipped [`n_cst_dwsvc_columnexp.sru:L1168-L1170`].
  - defect: >-
      D-03. THE PARSE-ERROR AND CALCULATION-ERROR MESSAGES ARE HARDCODED AND DO NOT ROUTE THROUGH
      LOCALIZATION - 28 dialog call sites, EVERY ONE LIVE and none commented out, and not a single
      localization call anywhere in the 2,435-line object. The equivalent messages in this service's
      sibling row-select and context-menu services DO route through localization. That inconsistency is
      legacy behaviour. Three sites are worth naming individually: cache-creation failure, a cache error
      carrying an exception's text, and a general expression error; parse failures are built by a
      dedicated formatter taking the expression, a CARET POSITION and a message.
    locator: >-
      ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L713, :L739, :L762, with the
      error builder at :L1308, :L1383 and :L1390 and its declarations at :L206-L207
    note: >-
      HARMONIZING THIS WOULD BE A SILENT CORRECTION ON 28 PATHS. Routing these messages through the
      localization layer "for consistency" would change the text a recording pins, everywhere at once,
      and would do it while looking like a cleanup. Each site becomes a structured error preserving the
      original text, the caret position where the builder supplies one, the severity, AND the explicit
      fact that the text is NOT localized - only the delivery channel changes, because a headless service
      cannot show a dialog. TWO REFINEMENTS FOUND BY READING THE SOURCE RATHER THAN THE SUMMARY. First,
      the site at `:L739` does not report the exception it caught: it sits inside an inner handler that
      binds one throwable at `:L738` and reads a DIFFERENT one - the outer handler's, bound at `:L703` in
      a block that closed at `:L704` - so the text that reaches the operator belongs to another
      exception entirely, and no local throwable of that name is declared in the enclosing function to
      explain it away. Reproduce it; do not repair it. Second, the caret the builder receives is not the
      scan position: it is the macro's start offset plus HALF the distance from there to the scan
      position, so a port that passed the plain position would place the caret elsewhere in the
      expression while every other field matched.
  - defect: >-
      D-04. THE PER-COLUMN CALCULATION CACHE IS TRI-STATE - UNKNOWN, YES, NO - AND NOT A BOOLEAN. A
      column starts unknown, is set to NO as the default before any match is sought, and is promoted to
      YES only when a match is found; thereafter the flag is CONSULTED rather than recomputed, which is
      what makes it a cache rather than a result. Alongside it the engine holds two re-entrancy flags and
      a recursion stack - a vector reserved in the constructor and released in the destructor.
    locator: >-
      ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L113-L115 declared,
      :L234-L239 and :L295 consulted, with the re-entrancy flags at :L105-L106 and the recursion stack
      at :L110 created at :L2421-L2422
    note: >-
      TWO OF THE THREE STATES COLLAPSE UNDER A BOOLEAN AND THE COLLAPSE IS INVISIBLE IN THE VALUES. A
      port that stored "does this column need calculating" as a boolean cannot distinguish NOT YET
      DETERMINED from DETERMINED: NOTHING TO DO, so it would either recompute the match loop on every
      change - correct results, different recorded describe traffic - or cache a false as though the
      question had been answered, and skip a column that should have been resolved. The transitions are
      therefore recorded as RAW NUMBERS, in order, rather than as names or as a boolean projection. The
      re-entrancy flags belong in the same entry because they are reachable from the macro callback: the
      callback runs client-side code in the middle of a calculation, so a nested entry is a real path and
      the guard's numeric return code is observable.
  - defect: >-
      D-05. TWO SENTINEL CONSTANTS ENCODE THE GRAMMAR INTERNALLY, and both are spellings rather than
      flags: an EMPTY function name models a bare variable reference, and a specific reserved word models
      dynamic dispatch. The engine branches on these string values directly when it validates a parsed
      function reference's arity - the empty name requires exactly one argument, the reserved name at
      least one - so the spellings are load-bearing and both appear in captured payloads.
    locator: >-
      ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L120-L121 declared, with the
      two arity guards branching on them at :L1390 and :L1394
    note: >-
      PRESERVE BOTH SPELLINGS EXACTLY, AND PRESERVE THE EMPTY ONE AS AN EXPLICIT EMPTY STRING RATHER THAN
      AS AN ABSENT FIELD - a serializer that omits empty strings would erase the distinction between a
      bare variable reference and a reference with no function at all, which is the same distinction.
      A SECOND, UNRELATED SPELLING NOTE, RECORDED HERE BECAUSE THIS IS THE ENTRY ABOUT SPELLINGS AND
      BECAUSE IT IS FIXTURE BEHAVIOUR RATHER THAN ENGINE BEHAVIOUR: the oracle window spells the
      expression-variable add call with TWO DIFFERENT LETTER CASES ON ADJACENT LINES - one casing across
      `:L104-L108` and `:L140`, a different casing across `:L111-L114`. The language tolerates it,
      because PowerScript method names are case-insensitive; it resolves to the same method and it changes
      nothing. IT IS HARMLESS AND IT IS STILL NOT TO BE "FIXED" IN A TRANSCRIPTION - the fixture is
      read-only (C-C), and a transcription that silently regularized the casing would be editing the
      oracle. Note the sharp asymmetry that makes this worth stating at all: METHOD names are
      case-insensitive here, but the oracle's own grammar comment states at `:L92` that VARIABLE AND
      FUNCTION names ARE case-sensitive - so the same regularizing instinct applied one line lower, to a
      variable name, would silently break resolution rather than merely tidy it.
  - defect: >-
      D-06. THE ITEM-CALCULATION ENTRY POINT IS DECLARED PUBLIC DESPITE CARRYING THE PRIVATE-CONVENTION
      UNDERSCORE PREFIX. Every other underscore-prefixed member of this object is genuinely private -
      the dirty marker, the index finders, the parse routine, the pre-processor, the value calculators
      and the error builder - and this one, alone among them, is public. It is the per-item calculation
      the row and all-rows entry points both funnel through.
    locator: >-
      ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L142 declared public,
      implemented at :L658, within the declaration block at :L125-L208
    note: >-
      AN ANOMALY TO CARRY RATHER THAN TIDY. Narrowing it to private would remove a member of the public
      surface a caller may legitimately be using, and renaming it to drop the prefix would change a
      symbol that appears in recordings and in payloads - so both "obvious" corrections are behavioural
      changes wearing the clothes of a style fix (C-B). THE REAL API SURFACE IS FAR LARGER THAN THE NINE
      METHODS THE SPECIFICATION DESCRIBES, and this entry is where that is recorded because the
      declaration block is where it is visible: expression add, set in FOUR arities, get in two, remove
      in two, and remove-all; variable add across SEVEN TYPED OVERLOADS - time, string, integral,
      floating point, timestamp, date and boolean; variable set across those same seven types in THREE
      SEPARATE ARITIES EACH, which is twenty-one overloads on its own; expression-variable add, set in
      three arities, and get; relative-column and relative-input-column setters in BOTH SINGULAR AND
      PLURAL ARRAY FORMS, EACH BY INDEX AND BY NAME; always-calculate, recursive and trigger-event
      setters each by index and by name; calculate in FOUR arities; and calculate-all in two. Beyond even
      that: cacheability by index and by name, empty-row calculation in two arities, foreign-variable
      registration, and the trace setter. AND BECAUSE THE VARIABLE ENVIRONMENT IS STRONGLY TYPED ACROSS
      SEVEN DISTINCT SCALAR TYPES, ITS RECORDED REPRESENTATION MUST BE A DISCRIMINATED UNION AND NEVER A
      STRINGLY-TYPED MAP. Collapsing it to strings would discard exactly the type information the
      coercion behaviour depends on, and the discard would be silent: every value would still round-trip,
      and every type-dependent behaviour would stop being checkable.
  - defect: >-
      D-07. ONE COLUMN MAY CARRY SEVERAL EXPRESSIONS, AND WHICH ONE ANSWERS IS SELECTED BY WHICH COLUMN
      WAS MODIFIED - not by which expression was added last and not by which was added first. The
      selection is carried by a DUPLICATE-EXPRESSION ARRAY on the expression descriptor, and the engine
      clears the dirty flag across the whole duplicate group whenever it processes any single member of
      it. The specification lists this among the capability's declared features.
    locator: >-
      ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L22-L42, the duplicate array
      at :L32, populated at :L491 and :L1575, the group-wide dirty clear at :L694 and :L2059, and the
      feature declared at docs/n_cst_dwsvc_columnexp.md:L8
    note: >-
      THE GROUP-WIDE DIRTY CLEAR IS THE PART A PORT LOSES. Clearing the flag on only the member that
      answered would leave its siblings dirty, and the next pass would calculate a SECOND expression into
      the same column and overwrite the first one's result - a plausible-looking value produced by the
      wrong expression, which no row count and no null check would catch. The capture therefore binds two
      expressions to one column, drives a change from each of two different source columns, and records
      the dirty state of EVERY member of the group before and after each - so a port that cleared
      narrowly is detected by the flags rather than inferred from a wrong value.
  - defect: >-
      D-08. THE REVERSE DEPENDENCY INDEX FROM A COLUMN TO THE EXPRESSIONS AND VARIABLES THAT DEPEND ON IT
      IS WHAT MAKES DIRTY PROPAGATION WORK. The column descriptor carries two index arrays beside its
      tri-state flag, and the engine builds them lazily on the first change that forces the column's flag
      to be resolved - appending an expression entry when a match is found and a variable entry when a
      global variable's body textually references the column - and then walks the expression array to
      decide exactly what to recalculate.
    locator: >-
      ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnexp.sru:L44-L48 declared, built at
      :L276-L277 and :L285 within the match loop at :L241-L292, and walked at :L295-L303
    note: >-
      THE FULL SET OF COLUMNS THAT RECALCULATE FROM A SINGLE CHANGE IS ITSELF BEHAVIOUR, and it is the
      output this entry exists to pin - not merely the values, which a wrong set can still get right by
      accident when the arithmetic happens to agree. Three parts of the build are easy to lose and each
      changes the set. The FALLBACK: where an expression declares no relative columns at all, membership
      is decided by whether its text TEXTUALLY REFERENCES the changed column, so a port that required
      explicit relative columns would produce an empty set for the oracle's own expressions, none of
      which declares any. The FOREIGN SKIP: the variable pass explicitly passes over variables of the
      foreign kind [`:L282`], so a foreign variable does not participate in this propagation and a port
      that included it would recalculate more columns than the legacy does. And the LINKS BRANCH: a
      variable whose links array is non-empty is added to the variable half of the index [`:L285`] on a
      different condition from the one that adds to the expression half. The capture records the two
      arrays as ordinals, then a change per column, then the ordered set that recalculated.

# ---- THE SHARED-VOLUME CAPTURE RULE ------------------------------------------------------------
#  `applies: true`. THE RULE'S CANONICAL TEXT IS OWNED BY `../README.md` SECTION 2.1 AND IS CITED HERE
#  RATHER THAN REPRODUCED - the same text is carried word for word by that file, by
#  `../../docs/PARITY.md` section 4.2 and by `../../orchestration/README.md` section 7.2, and a fourth
#  copy would be a fourth thing to drift, which is the failure this store exists to prevent rather than
#  to commit.
#
#  WHY IT APPLIES EVEN THOUGH THIS WORKFLOW'S ROWS ARE INLINE IN A READ-ONLY FIXTURE AND IT ISSUES NO
#  SQL. The exemption in `../README.md` section 2.7 is narrow and is not a loophole: it holds only while
#  a workflow reads and writes NOTHING, and the store grants it to exactly one row - the paging
#  rewrites, which are pure string transforms. THIS WORKFLOW DOES NOT QUALIFY. The target half is
#  captured against the running service rather than an in-process host; every calculation WRITES a
#  computed value into a live buffer; the engine creates generated compute objects as a side effect of
#  binding; and the two expression sessions the seed opens persist across the capture. A volume state
#  that moved between the two halves would change the input the second half ran against, and nothing
#  would report it. The rule is therefore honoured in full, INCLUDING ITS TEARDOWN COROLLARY at
#  `../README.md` section 2.6: between the two halves, tear the stack down with a plain down and never
#  with the flag that removes named volumes.
sharedVolume:
  applies: true

# ---- HONEST STATE ------------------------------------------------------------------------------
#  NOTHING HERE HAS BEEN RUN, AND THE ONLY LEGAL VALUE SAYS SO. No paired capture exists on either
#  side: the legacy half needs a PowerBuilder toolchain that is not present, and no recording directory
#  for this identifier exists. NOTHING IN THIS DEFINITION MAY BE READ AS REPORTING A PARITY RESULT -
#  in particular, the divergence described throughout as what the capture "must" show is the
#  SPECIFICATION of the comparison, not an observation of one.
executionStatus: specified-not-executed

# ---- SIBLINGS ----------------------------------------------------------------------------------
#  A cross-reference only: each pair stays independently comparable under its own identifier, and none
#  of these definitions is merged with another. The event chain is the substrate this engine observes
#  the world through, and the coupling is bidirectional - its changed dispatcher calls this engine
#  first, and its item-change gate suppresses this engine's evaluation as a second-order effect. The
#  row-select definition shares this service's host class and its sibling structure. The drop-down
#  search definition is named because it owns the store's OTHER blocked behaviour, pinyin first-letter
#  matching, so a reader looking for the pair of them finds both from either one.
relatedWorkflows:
  - dataservices-dw-event-chain
  - dataservices-dwsvc-rowselect
  - dataservices-dwsvc-dropdownsearch
