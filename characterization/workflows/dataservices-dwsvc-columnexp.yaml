# yaml-language-server: $schema=./workflow.schema.json
# ==================================================================================================
#  dataservices-dwsvc-columnexp - THE COLUMN-EXPRESSION EXPANSION ENGINE
#  ------------------------------------------------------------------------------------------------
#  WHY THIS DEFINITION EXISTS
#  `n_cst_dwsvc_columnexp.sru` is 2,435 lines - THE LARGEST IN-SCOPE LEGACY OBJECT - and it carries
#  one of the two hardest contracts in the refactor. At its centre is the static-versus-dynamic
#  expansion distinction, which the requirements correctly identify as a behaviour that "DOES NOT
#  SURVIVE NAIVE SERIALIZATION". That is not a formatting problem to be tidied at the edge; it is a
#  semantic one, and a recording that captures only the expanded string cannot detect a regression in
#  it at all. This pair exists to pin that distinction, reference by reference.
#
#  THIS FILE SPECIFIES A CAPTURE. IT CONTAINS NO CODE AND NO CAPTURED VALUE.
#  It conforms to `./workflow.schema.json`, which is authoritative for shape. Store-wide conventions
#  - the capture rule's canonical text, the recording-file conventions, the seam register, the defect
#  roster and what must never enter a recording - belong to `../README.md` and to `../../docs/PARITY.md`
#  and are CITED here, never restated. A fourth copy of a rule three files already own word for word
#  is a fourth thing to drift.
#
#  IT RUNS INSIDE THE EVENT CHAIN, NOT BESIDE IT
#  `dataservices-dw-event-chain` pins the 22-event substrate this service observes the world through,
#  and the coupling runs both ways: the chain's changed-event dispatcher calls THIS service's changed
#  handler before it triggers the broker, and disabling the chain's item-change gate therefore
#  suppresses expression evaluation as a second-order effect. That ordering contract is the sibling's
#  to prove and is cross-referenced rather than re-derived. What is captured here is what the engine
#  itself does once control reaches it.
#
#  ORDER AND VALUE, NEVER SPEED (`../README.md` section 6.4, `README.md` section "No timing assertions")
#  Recalculation in this engine is about the ORDER expressions execute in and the VALUES they produce.
#  NO ELAPSED VALUE IS RECORDED AND NO TIMING IS ASSERTED ANYWHERE IN THIS DEFINITION. The oracle
#  window emits no timing field of its own - unlike the SQL-parser window, which does and which handles
#  it by recording the field as explicitly non-behavioural - so there is nothing here to mask on that
#  account and nothing to drop. The repository publishes no service-level agreement, no latency budget,
#  no throughput target and no availability commitment, so no timing assertion could be measured
#  against anything. The only quantitative gate in the brief is 80% per-service line coverage, read
#  from `coverage.cobertura.xml` in CI - NOT from this store.
#
#  ---- ONE LOCATOR REFINED AGAINST THE SOURCE, BECAUSE THE REFINEMENT IS A DEFECT ----------------
#  `../../docs/PARITY.md` section 7.8 describes the site at `n_cst_dwsvc_columnexp.sru:L739` as "a
#  cache error that carries the text of a caught runtime exception". Read line by line, it is worse
#  than that and the difference is itself legacy behaviour. There are two nested handlers in
#  `_of_calcitem`: an OUTER `try` at `:L700` whose `catch` binds one throwable at `:L703` and closes at
#  `:L704`, and an INNER `try` at `:L721` whose `catch` binds a DIFFERENT throwable at `:L738`. The
#  message built at `:L739` sits inside the inner handler and reads the OUTER handler's variable -
#  whose own `try` block closed thirty-five lines earlier - not the exception the inner handler
#  actually caught. No local throwable of that name is declared anywhere in the function, so the
#  reference can only resolve to the outer catch clause. THE REPORTED TEXT THEREFORE COMES FROM THE
#  WRONG EXCEPTION VARIABLE. It is reproduced, not repaired (C-B), and defect D-03 below records it so
#  a reader does not "fix" it while transcribing.
#
#  ---- ONE CAUTION ABOUT THE SPECIFICATION ITSELF ------------------------------------------------
#  `../../docs/n_cst_dwsvc_columnexp.md` is the authoritative statement of these semantics and its
#  worked examples are definitive - but two of its inline CODE COMMENTS are copy-paste artifacts that
#  say the opposite of the code beside them. At `:L67` and again at `:L85` the comment describes a
#  reference as statically expanded while the code on the following line uses the DOUBLE-sigil dynamic
#  form, and both comments additionally mistype the second variable's name. The CODE and the stated
#  outcomes at `:L48`, `:L50` and `:L69` are authoritative; the two comments are not. Said here
#  because a reader who trusted `:L67` would conclude the double sigil is static, which would invert
#  the single behaviour this entire pair exists to prove. The document is read-only and is NOT
#  corrected (C-C).
#
#  ---- WHAT THIS DEFINITION DELIBERATELY OMITS, AND WHY ------------------------------------------
#    * `redaction` - OMITTED because nothing this capture records is sensitive. Every value that
#      reaches a recording originates either in the read-only fixture's own four inline rows - three
#      zero decimals and two nulls - or in the expression variables the oracle window declares, which
#      are the small integers one to five, a quoted digit and a precision. NO KEY, NO PASSWORD, NO
#      CERTIFICATE, NO TOKEN AND NO CONNECTION STRING IS READ, EMITTED OR RECORDED HERE (C-F,
#      `../README.md` section 6.2). This engine issues no SQL, so the redacted-statement rule has no
#      field to act on.
#    * `deferredCapabilities` - OMITTED because this workflow's capability is in scope IN FULL. The
#      expansion engine, its variable environment, its calculation ordering, its macro callback and
#      its trace are all headless and all ship. Three of this service's five sibling sub-services do
#      split into a shipped headless half and a presentational half; THIS ONE DOES NOT, and claiming a
#      gap it does not have would be as misleading as hiding one it did (C-D).
#
#  ---- GOVERNING CONSTRAINTS -------------------------------------------------------------------
#  NO USER-SPECIFIED RULES EXIST. The project's rules document returns exactly one line reporting
#  that none were provided - a single line, with nothing further to page through - so no rule is
#  invented, inferred or back-filled, and nothing in this file exists because of one. Enterprise-
#  standard best practice applies in their place. The binding constraints are the migration plan's
#  own: C-B (defects reproduced, never corrected - a corrected capture is a parity FAILURE), C-C (the
#  legacy tree is read-only and is the oracle; every claim carries a locator), C-D (nothing for a
#  deferred capability area), C-F (no secret value), C-K (every decision carries its reason) and C-L
#  (the shared-volume capture rule).
# ==================================================================================================

schemaVersion: "1"

workflowId: dataservices-dwsvc-columnexp

title: >-
  Column-expression engine: static versus dynamic expansion, the inverted macro stream, and the
  format-exact calculation trace

capabilityArea: >-
  The DataWindow column-expression expansion engine of `n_cst_dwsvc_columnexp` - its five-form macro
  grammar and the STATIC-VERSUS-DYNAMIC EXPANSION distinction that grammar encodes, the seven-structure
  descriptor model, the strongly-typed variable environment across seven scalar types, the nested and
  recursive expression variables, the foreign cross-DataWindow variable, the tri-state per-column
  calculation cache and the reverse dependency index that drives dirty propagation, the add-order
  calculation sequence, MACRO INVOCATION as an inverted callback into the client, and the format-exact
  six-field calculation TRACE.

targetService: DataServices

description: >-
  ONE EXPANSION ENGINE, CAPTURED TWICE. The pair proves that the value every expression produces, the
  order the expressions are calculated in, the mode each individual variable reference was expanded
  under, and the trace and error output the engine emits are identical on the legacy master and on the
  .NET candidate after identical masking.


  THE MECHANICAL REASON THE DISTINCTION IS A SERIALIZATION PROBLEM, because it is what drives the
  payload requirement below and not merely context. The parse routine REWRITES THE EXPRESSION IN PLACE
  and emits reference arrays alongside the rewritten text. A STATIC reference - the single-sigil form -
  is resolved and substituted into the rewritten text AT BIND TIME, so the variable's name is GONE from
  the stored expression and no later assignment can reach it. A DYNAMIC reference - the double-sigil
  form - leaves behind an entry indexing into the LIVE variable table, so a later assignment
  propagates. The two forms are one character apart in the source and produce permanently divergent
  behaviour.


  THEREFORE THE RECORDING MUST CARRY ALL THREE OF: the UNEXPANDED source expression text; the
  BIND-TIME variable snapshot; and the LIVE variable environment at calculation time - plus, PER
  REFERENCE, which expansion mode applied. Recording only the already-expanded string is not a
  faithful capture and cannot be made into one afterwards: it makes a static binding indistinguishable
  from a literal, and it strips a dynamic binding of the environment it resolves against. Both
  failures are silent, and both produce a comparison that passes while proving nothing.


  THE MODE IS A PER-REFERENCE PROPERTY AND NEVER A PER-EXPRESSION ONE. Five modes must be
  representable - static, dynamic, dynamic-indirect, macro-direct and macro-dynamic - and a single
  expression may mix them freely. The specification's own worked example at
  `../../docs/n_cst_dwsvc_columnexp.md:L68` puts a dynamic reference and a static reference inside ONE
  expression, and the oracle window's `:L157` puts a dynamic-indirect reference, a macro-direct call
  and a dynamic foreign reference inside another. A capture that tagged the expression rather than the
  reference would have nowhere to record either.


  WHY THIS WORKFLOW'S ORACLE IS UNUSUALLY GOOD EVIDENCE. The window binds THE SAME fixture data object
  to TWO `se_cst_dw` controls - `:L169` and `:L301` both name `dw_test_dwsvc_columnexp` - and that is
  what makes the cross-DataWindow path reachable at all. It then references THE SAME variable three
  different ways on three adjacent lines and changes that variable's value from a fourth control. The
  divergence is therefore not constructed by the capture; it is constructed by the oracle, and the
  capture only has to record it.

# ==================================================================================================
#  THE ORACLE. READ, NEVER EDITED, MOVED, RENAMED, REFORMATTED, RE-ENCODED OR COPIED INTO THIS TREE
#  ------------------------------------------------------------------------------------------------
#  Every locator below was read at source rather than carried forward from a plan. The host window is
#  318 lines and every line cited from it is within that range. The Chinese identifiers reproduced in
#  this file are reproduced because they ARE the identifiers: the oracle declares its variables in
#  Chinese, and its own grammar comment states at `w_test_dwsvc_columnexp.srw:L92` that VARIABLE AND
#  FUNCTION NAMES ARE CASE-SENSITIVE. A translated name is therefore a DIFFERENT name, a re-cased name
#  is a different name too, and neither would resolve. Names are carried verbatim, never translated,
#  and no block of legacy source is pasted around them.
# ==================================================================================================
