  - defect: >-
      D-09. THE DEFERRED ACCEPT IS POSTED, AND ONLY CONDITIONALLY. The kill-focus handler hands a private
      accept-text continuation to the platform message queue so that it runs after the current event
      returns - but only when the item-change flag is clear.
    locator: >-
      ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L387-L393, the continuation declared
      at :L112 and defined at :L537-L558
    note: >-
      A headless container has no message pump, so the target expresses the deferral as an explicitly
      queued continuation on the validation session. THE MECHANISM CHANGES AND THE ORDERING DOES NOT, and
      the ordering is what the pair compares: the continuation runs after the event that queued it has
      returned, which matters because its body re-checks that focus has actually moved away before
      accepting and restores focus when the accept fails. Executing it inline would perform that re-check
      too early and would change the outcome. Whether it is queued at all is equally observable, so the
      capture records the flag's value and the negative case.
  - defect: >-
      D-10. THE BROKER'S PREVENTION IS TRI-VALUED - prevent-once, prevent-deep, and continue - and must
      never be flattened to a boolean, even though every one of the chain's own topic comments suggests a
      binary convention.
    locator: "ws_objects/pfw.utility.invoker.pbl.src/n_cst_eventful.sru:L111-L112"
    note: >-
      THE COMMENTS ARE NOT A DEFECT TO CORRECT AND ARE ALSO NOT THE CONTRACT. Eight comment sites in the
      service class read `0:continue,1:prevent` [`se_cst_dw.sru:L46,L51,L56,L59,L62,L65,L68,L71`], and all
      eight are accurate about what a handler on those particular topics is expected to return - they are
      simply not a statement about what the broker can carry. The shape is therefore taken from the
      broker's own declarations. FLATTENING WOULD SILENTLY CONVERT A DEEP PREVENTION INTO A SHALLOW ONE:
      the dispatch chain would resume after the vetoing handler and the events the caller intended to stop
      would fire. `shared-eventful-broker-ordering` owns the broker's own characterization; this pair
      records the raw tri-valued outcome of every dispatch the chain issues.
  - defect: >-
      D-11. TWO OF THE TWELVE BROKER TOPICS CARRY A LEXICAL ORDERING PREFIX BAKED INTO THE TOPIC STRING -
      the item-changed topic, spelled "0-itemchanged", and the edit-changed topic, spelled
      "1-editchanged" - WHILE THE OTHER TEN CARRY NONE. Dispatch order derives from the lexical sort of
      the subscription name, so the prefix is ordering data hidden inside an identity string. Both
      spellings are written here quoted, because a bare scalar beginning with a digit and a hyphen is
      exactly the shape a reader - or a serializer - reinterprets as something other than a string.
    locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L54 and :L57, among the twelve at :L47-L76"
    note: >-
      THE SPARSITY IS THE HAZARD. Because ten topics carry no prefix, transmitting the fused string loses
      the ordering invisibly: the two prefixed topics still sort correctly by accident of their spelling
      while nothing in the payload says that ordering was ever encoded. Worse, an unprefixed topic and a
      zero-prefixed topic both decompose to a sequence of zero, so a flag for whether a prefix was
      actually present is what separates them - a lexical sort places the zero-prefixed item-changed topic
      before the unprefixed clicked topic, and the absence of a prefix is not the same statement as a
      prefix of zero. This pair records both the decomposed fields and the exact fused spelling;
      `shared-eventful-broker-ordering` owns the decomposition itself.
  - defect: >-
      D-12. THE SERVICE CLASS IS A SELF-SHADOWING GLOBAL AUTO-INSTANCE - a global variable declared with
      the same name as its own type, immediately after the type definition ends.
    locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L35, with the type at :L10"
    note: >-
      The legacy's single flat namespace tolerated it: there are no namespaces and no import statements,
      and symbol resolution follows the ORDER of the library list in the target file, so a name may denote
      a type or an instance depending on position. The target keeps the descriptive type name and injects
      the instance instead of shadowing it. The reason this belongs in a characterization definition rather
      than only in a design note is that it decides WHOSE STATE a recorded field belongs to: the four
      cross-event fields are per-instance, and a port that resolved the shadowed name to the global
      auto-instance would record one shared session where the legacy has one per control - which the
      two-control oracle window makes observable.
  - defect: >-
      D-13. THE FIVE SUB-SERVICES ARE CONSTRUCTED IN ONE ORDER AND INITIALIZED IN ANOTHER. Construction
      runs context menu, row select, column sort, drop-down search, column expressions; initialization runs
      context menu, row select, DROP-DOWN SEARCH, COLUMN SORT, column expressions. The middle two are
      swapped between the two loops, in adjacent lines of the same event.
    locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L570-L581, with teardown at :L583-L589"
    note: >-
      IT LOOKS LIKE A TYPO AND IT IS REPRODUCED ANYWAY, because initialization is where each sub-service
      receives its host and may subscribe to a topic, and the broker's dispatch order derives from the
      lexical sort of subscription names rather than from arrival - so the initialization order is
      observable wherever two sub-services subscribe to comparable names. Reordering the second loop to
      match the first is exactly the tidy-up C-B forbids: it is unverifiable from the repository whether
      the order matters, and unverifiable is not the same as harmless. Teardown adds a third order -
      unsubscribe-all first, then destroy in construction order - and all three are recorded.
  - defect: >-
      D-14. THE DELETE-ROW OVERRIDE SYNTHESIZES A ROW-CHANGE EVENT WITH NO PLATFORM MESSAGE BEHIND IT, and
      passes ROW ZERO when the delete emptied the DataWindow - a row number that is not a valid row.
    locator: >-
      ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L416-L446, the synthesized calls at
      :L435 and :L437
    note: >-
      It is captured by this workflow rather than by a sub-service's because it injects an event into the
      very sequence this pair compares, and a handler written against the platform's own row-change
      contract will not expect a zero. The second synthesis is conditional in a way that is easy to
      mis-port: it fires only when the deleted row was the current row AND is still the current row after
      the delete. There is also a redraw call on the last-row path whose effect is presentational, and the
      capture records that the call was made without asserting anything about what it drew.

# ---- THE SHARED-VOLUME CAPTURE RULE ------------------------------------------------------------
#  `applies: true`. THE RULE'S CANONICAL TEXT IS OWNED BY `../README.md` SECTION 2.1 AND IS CITED HERE
#  RATHER THAN REPRODUCED - the same text is carried word for word by that file, by
#  `../../docs/PARITY.md` section 4.2 and by `../../orchestration/README.md` section 7.2, and a fourth
#  copy would be a fourth thing to drift.
#
#  WHY IT APPLIES EVEN THOUGH THIS WORKFLOW'S ROWS ARE INLINE IN A READ-ONLY FIXTURE. The exemption in
#  `../README.md` section 2.7 is narrow and is not a loophole: it holds only while a workflow reads and
#  writes NOTHING. This workflow does not qualify. The target half is captured against the running
#  service rather than an in-process host, the chain writes into a live buffer through its restore and
#  coercion arms, and the deferred continuation accepts text after the event that queued it has
#  returned. A volume state that moved between the two halves would change the input the second half ran
#  against, and nothing would report it - so the rule is honoured in full, including its teardown
#  corollary: between the two halves, tear the stack down with a plain down and never with the flag that
#  removes named volumes.
sharedVolume:
  applies: true

# ---- HONEST STATE ------------------------------------------------------------------------------
#  NOTHING HERE HAS BEEN RUN, AND THE ONLY LEGAL VALUE SAYS SO. No paired capture exists on either
#  side: the legacy half needs a PowerBuilder toolchain that is not present, and no recording directory
#  for this identifier exists. Nothing in this definition may be read as reporting a parity result.
executionStatus: specified-not-executed

# ---- SIBLINGS ----------------------------------------------------------------------------------
#  The five sub-service workflows run INSIDE the chain characterized here, and the broker workflow owns
#  the topic decomposition and the tri-valued veto that this one records the effects of. A
#  cross-reference only: each pair stays independently comparable under its own identifier, and the two
#  behaviours this store reports BLOCKED belong to two of these siblings rather than to this workflow -
#  pinyin first-letter matching to the drop-down search definition, and cross-session foreign expression
#  variables to the column-expression definition.
relatedWorkflows:
  - dataservices-dwsvc-rowselect
  - dataservices-dwsvc-columnsort
  - dataservices-dwsvc-contextmenu
  - dataservices-dwsvc-dropdownsearch
  - dataservices-dwsvc-columnexp
  - shared-eventful-broker-ordering
