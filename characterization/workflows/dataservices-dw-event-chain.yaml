      1, 2 and 4, because those values travel in payloads, in logs and in these recordings.
  - defect: >-
      D-08. A COMMENTED-OUT BYTE-LENGTH CHECK WITH ITS OWN DIALOG SITS INSIDE THE PRE-CHANGE HANDLER - a
      dormant validation path that would measure input against the column's declared character width and
      reject over-long input with a message about byte counts.
    locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L256-L293, the dormant block at :L280-L290"
    note: >-
      IT IS CARRIED ACROSS AS COMMENTED AND INERT AND MUST NOT BE REVIVED. Reviving it would add a
      validation the legacy does not perform - the exact "improvement" C-B forbids - and it would change
      results on a fixture whose declared column widths and whose stored values do not agree in the first
      place. The capture drives an over-long value into a hundred-character column and records the explicit
      negative: no message, and no rejection on that account. A recording in which this path fires is a
