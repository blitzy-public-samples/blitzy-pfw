seedPhase:
  # THE SEED SHAPE HERE IS GENUINELY DIFFERENT FROM THE PERSISTENCE WORKFLOWS, AND THE DIFFERENCE IS
  # WORTH STATING. Those workflows seed a database: the oracle's own setup deletes the file, recreates
  # the schema and inserts rows, which is precisely the destructive reseed the capture rule forbids
  # between the two halves of a pair. THIS workflow seeds nothing of the kind. The rows it starts from
  # are declared INLINE IN THE READ-ONLY DATAWINDOW DEFINITION ITSELF - nine rows at
  # `dw_test_dwsvc.srd:L15` and the same nine at `dw_svc_sample.srd:L15` - so there is NO FILE DELETE,
  # NO DDL, NO INSERT AND NO CONNECTION anywhere in this seed phase. Binding the definition IS the
  # seed. The two assertions below are still both true and still both required: the binding happens
  # once per pair, and nothing here runs between the two captures.
  steps:
    - action: >-
        Bind the DataWindow definition named by the driving oracle window's dataobject property. On the
        legacy side that is the definition the window declares; on the target side it is the
        transcribed definition the catalogue registers under the same column model. Binding loads the
        definition's own inline rows - this step performs no file delete, no schema creation and no row
        insert, because the rows are part of the read-only fixture.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_rowselect.srw:L51"
    - action: >-
        Confirm the nine inline rows the bound definition declares are present and in declaration
        order, with the six columns in their declared types - three two-place decimals and three
        hundred-character strings - and the declared sort specification applied.
      locator: "ws_objects/pfw.tests.pbl.src/dw_test_dwsvc.srd:L15"
    - action: >-
        Confirm the child drop-down definition's three display-and-data pairs are resolvable, because
        the item-change and validation-error restore arms put a display value back and cannot be
        captured without them.
      locator: "ws_objects/pfw.tests.pbl.src/dw_test_dwsvc_dddw.srd:L11"
    - action: >-
        Enable exactly the one sub-service the driving window enables in its open event and leave the
        other four disabled. This is a seed step rather than a precondition check because the chain's
        observable order depends on it: the changed-event dispatcher calls the column-expression
        service only when that service is enabled, and the raw editing event calls the drop-down
        search service only when that one is.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_rowselect.srw:L40"
    - action: >-
        Set every event-gate bit to enabled - the gate bitmask starts at zero, meaning nothing
        disabled - so that the baseline capture exercises the full chain and the gate cases below are
        departures from a known starting state rather than from an unknown one.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L89"
    - action: >-
        Configure the determinism seams declared below once, and use that one configuration for both
        halves of the pair. A seam configured per capture is two configurations, and two
        configurations make the two recordings answer two different questions.
    - action: >-
        On the target side, open one validation session per host and record the identifier it
        allocates. No schema provisioning and no row seeding runs on this side either: the candidate
        materializes the same nine rows from the same read-only definition, transcribed rather than
        read at run time, so this step is idempotent and is safe to repeat without touching any
        persistent state.
  runsOncePerPair: true
  neverBetweenCaptures: true

capturePhase:
  behaviourUnderTest: >-
    THE ORDERED DISPATCH OF THE 22 EVENTS THE SERVICE CLASS DECLARES AT
    `ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L11-L32`, AND NOTHING ELSE. For each
    event: the position at which it arrives, the arguments it receives, the numeric value it returns,
    the delegation path it took to get there - which semantic handler it called, whether it triggered
    the broker, and whether it inspected what the broker returned - and the state of the four
    cross-event session fields immediately afterwards. Within that, three behaviours are the point of
    the capture: the item-change micro-protocol at `:L182-L253` with its own four-value return
    alphabet; the changed-event dispatcher's strict three-step sequence at `:L295-L320`; and the
    validation-error handler at `:L322-L385`, which consumes and clears the code the item-change event
    stashed and is therefore a function of the preceding event's return value.


    WHAT THIS CAPTURE IS NOT. It is not a capture of any sub-service's own behaviour - the five
    sibling workflows own those - and it records only the points at which the chain hands control to a
    sub-service. It is not a retrieval or update capture: no statement is generated and no storage is
    written. AND IT IS NOT A MEASUREMENT. No elapsed value is recorded and no timing is asserted; the
    sequencing token exists to DETECT a displaced arrival, never to time one.

  preconditions:
    # ---- THE ORDERING DISCIPLINE, ASSIGNED PER CAPABILITY AREA WITH ITS REASON (C-K) --------------
    # The discipline is mandated per area rather than globally, so it is recorded per area. The two
    # names are the wire enumeration's own, from
    # `../../shared/PowerFramework.Contracts/Proto/dataservices.v1.proto`: ORDERING_DISCIPLINE_SYNCHRONOUS
    # is a strictly synchronous request and response inside one session on one stream, where NO
    # reordering is permitted and a displaced arrival fails the session;
    # ORDERING_DISCIPLINE_SEQUENCED carries a monotonic token a consumer may use to detect and reorder.
    # Both halves of the pair are captured under the same assignment, or the comparison compares two
    # different contracts.
    - >-
      ORDERING DISCIPLINE - ITEM-CHANGE AND VALIDATION CHAIN, covering the raw item-change event, the
      pre-change handler, the two changed handlers, the validation-error handler and the kill-focus
      handler's deferred-accept decision: ORDERING_DISCIPLINE_SYNCHRONOUS, strictly synchronous with no
      reordering permitted. REASON: reordering is not merely undesirable here, it is semantically
      impossible. The validation-error handler READS AND CLEARS the code the item-change event stashed
      [`:L331-L332`] and pre-sets its own result when that code was 1 or 3 [`:L338-L340`], so its
      behaviour is a function of the prior event's return value; the item-change handler fires a NESTED
      event from inside itself [`:L204-L208`]; and the kill-focus handler queues a deferred accept only
      when the item-change flag is clear [`:L387-L390`]. A token that let a consumer re-sort this group
      would let it read the stash before it was written.
    - >-
      ORDERING DISCIPLINE - FOCUS, MOUSE AND ROW-FOCUS NOTIFICATIONS, covering set-focus, kill-focus in
      its notification half, row-change, row-changing, left-button click, left-button double-click,
      left-button up, right-button down and right-button up: ORDERING_DISCIPLINE_SEQUENCED, a monotonic
      sequencing token. REASON: these carry no cross-event state and their only return contract is the
      prevention convention, so a token is sufficient for a consumer to detect a displaced arrival and
      reorder. THE TOKEN IS FOR DETECTION, NOT FOR TIMING - it is an ordinal, and nothing in this store
      derives a duration from two of them.
    - >-
      ORDERING DISCIPLINE - THE KILL-FOCUS EVENT BELONGS TO BOTH GROUPS ABOVE, AND THE OVERLAP IS
      DELIBERATE RATHER THAN AN INCONSISTENCY. Its notification half is sequenced with the other focus
      events; its deferred-accept decision at [`:L387-L390`] is synchronous with the item-change chain,
      because whether the accept is queued at all depends on the item-change flag that chain owns. A
      capture that assigned it to one group only would lose one of the two behaviours.
    - >-
      ORDERING DISCIPLINE - CONTEXT MENU, the initializer followed by the selection:
      ORDERING_DISCIPLINE_SYNCHRONOUS. REASON: initialization must COMPLETE before the menu identifier
      the second event receives can be meaningful - the application adds and configures the items in the
      first event, and the identifier that comes back names one of them.
    - >-
      ORDERING DISCIPLINE - DROP-DOWN SEARCH, the filter request followed by the filtered notification:
      ORDERING_DISCIPLINE_SYNCHRONOUS. REASON: the first event produces its result through a REFERENCE
      STRING OUT-PARAMETER [`:L13`] and declares no return type, so the caller blocks on the filter the
      handler writes into it and the answer has no fire-and-forget form.
    - >-
      ORDERING DISCIPLINE - MACRO INVOCATION, the column-expression method call:
      ORDERING_DISCIPLINE_SYNCHRONOUS. REASON: the calculation cannot proceed without the returned
      value, and the return is typed as an untyped value over a string array [`:L14`], so there is
      nothing to continue with until it arrives.
    - >-
      ORDERING DISCIPLINE - EXPRESSION TRACE: ORDERING_DISCIPLINE_SEQUENCED. REASON: pure diagnostics,
      fire and forget. It returns nothing, nothing waits on it, and no other event's behaviour depends
      on when it arrives.
    # ---- STATE THE CAPTURE STARTS FROM ----------------------------------------------------------
    - >-
      The event-gate bitmask starts at zero - nothing disabled - so every gate case below is a departure
      from a recorded baseline. The three bits are composable values 1, 2 and 4 [`:L41-L43`] and the
      capture drives each independently as well as in combination.
    - >-
      Exactly one sub-service is enabled per capture, matching the driving oracle window, and a further
      baseline capture is taken with all five disabled. This is observable rather than cosmetic: the
      changed-event dispatcher calls the column-expression service only when it is enabled
      [`:L313-L315`] and the raw editing event calls the drop-down search service only when that one is
      [`:L169-L171`], so the enabled set changes the recorded order.
    - >-
      One validation session is open per host on the target side, and its identifier is recorded. The
      four cross-event fields have nowhere to live on a stateless boundary, so they are fields of a
      server-held session opened and closed by dedicated calls; a capture taken without one would have
      no place to read the stash from.
    - >-
      The broker's default return value is zero - continue - established in its constructor
      [`:L594-L597`]. Every dispatch with no subscriber therefore reads as continue rather than as
      prevent, and a capture taken against a different default would invert every veto in the recording.
    - >-
      The broker subscription set is identical across both halves of the pair, including which of the
      twelve topics has a subscriber. The changed-event dispatcher triggers only when the item-changed
      topic has one [`:L316-L318`] and the raw editing event only when the edit-changed topic has one
      [`:L166-L168`], so an unequal subscription set produces an unequal order for reasons that are not
      behaviour.
    - >-
      The broker's argument-injection rule is active and its four exclusions hold [`:L599-L607`]: the
      parent is injected as the first argument of a dispatch EXCEPT when the subscription passes no
      arguments, when the target is the parent itself, when it is the column-expression or drop-down
      search sub-service, or when it descends from the DataWindow service base. The injected argument is
      visible in the recorded dispatch, so the exclusions are part of what is compared.
    - >-
      The same six-column model and the same nine rows are bound on both halves - three two-place
      decimal columns and three hundred-character string columns, with the two drop-down DataWindow
      columns and the one drop-down list-box column all declaring that editing is disallowed. That last
      detail is the configuration the restore arms exist for, so it is a precondition rather than a
      detail.
    - >-
      The target half is captured against the running service, not against an in-process test host. A
      test host mounts no volume and so cannot be the candidate half of a pair however thorough it is;
      `../README.md` section 7 is the authority for that distinction.
    - >-
      Both halves of this pair are taken in ONE working tree. Where several clones run concurrently each
      needs its own compose project and its own volume, so that one clone's teardown cannot invalidate
      another clone's half-finished pair.

  observedOutputs:
    # ==============================================================================================
    #  PART 1 OF 3 - THE 22 EVENTS, ONE RECORDED OUTPUT EACH
    #  ---------------------------------------------------------------------------------------------
    #  NINE SEMANTIC EVENTS AND THIRTEEN RAW PLATFORM EVENTS, TOTALLING EXACTLY 22, enumerated in the
    #  order the service class declares them at `se_cst_dw.sru:L11-L32`. Each is its own output rather
    #  than a line item inside one, for two reasons: each traces to its own locator, and - more
    #  importantly - THE DELEGATION SHAPE IS NOT UNIFORM ACROSS THE RAW EVENTS. Two call the broker and
    #  no semantic handler at all; one triggers the broker and IGNORES what it returns while its
    #  near-twin INSPECTS it; two wrap the broker in an object-validity guard; one gates the broker on
    #  whether the topic has a subscriber and then calls a sub-service. Recording a single "the events
    #  fired in this order" output would compare the order and lose all of that, and harmonizing the
    #  shapes into one would be exactly the silent correction C-B forbids.
    #
    #  The name of each output is the wire enumeration's own member name, from
    #  `../../shared/PowerFramework.Contracts/Proto/dataservices.v1.proto`, so a legacy record and a
    #  target record key on the same identifier. Every record carries the sequencing token, the
    #  arguments, the numeric return value and the session-state snapshot taken after the event
    #  returned; `format` below is used where the projection is not obvious from that.
    # ==============================================================================================

    # ---- THE NINE SEMANTIC EVENTS ----------------------------------------------------------------
    - name: event.EVENT_ID_ONINITCONTEXTMENU
      description: >-
        SEMANTIC 1 of 9. `oninitcontextmenu(long row, dwobject dwo)` returning long - the first half of
        the context-menu pair, in which the application populates and configures the menu. Recorded with
        its arguments and its numeric return, because the identifier the second event receives is only
        meaningful once this one has completed.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L11"
    - name: event.EVENT_ID_ONCONTEXTMENU
      description: >-
        SEMANTIC 2 of 9. `oncontextmenu(long row, dwobject dwo, long mid)` returning long - the
        selection half of the pair, carrying the chosen menu identifier. The identifier is declared long
        on the event even though the context-menu service's own constants are declared unsigned, and the
        recording carries the value the signature admits rather than the one the constants imply.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L12"
    - name: event.EVENT_ID_ONDDSGETFILTER
      description: >-
        SEMANTIC 3 of 9. `onddsgetfilter(long row, dwobject dwo, string data, ref string filter)` - it
        returns NOTHING and produces its result by writing into a REFERENCE STRING OUT-PARAMETER. That
        is why its area is synchronous: the caller blocks on the filter text the handler writes, so the
        answer has no fire-and-forget form.
      format: >-
        The out-parameter's value is recorded as the filter expression text the handler wrote, exactly as
        written and unnormalized, alongside the value it held on entry - so a handler that leaves it
        untouched is distinguishable from one that writes an empty string.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L13"
    - name: event.EVENT_ID_ONCOLUMNEXPINVOKEMETHOD
      description: >-
        SEMANTIC 4 of 9. `oncolumnexpinvokemethod(long row, dwobject dwo, string name, string args[])`
        returning an untyped value over a string array - the macro-invocation callback. The legacy
        expects the APPLICATION to implement the macro switch, so across a service boundary this is an
        inverted call: the service calls back into its client and waits.
      format: >-
        The untyped return is recorded as a discriminated value - its runtime type and its textual
        projection - never as a bare string, because the type the handler returned is part of what the
        calculation then does with it.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L14"
    - name: event.EVENT_ID_ONDOITEMCHANGE
      description: >-
        SEMANTIC 5 of 9. `ondoitemchange(long row, dwobject dwo, string data)` returning long - fired
        BEFORE the edit reaches the buffer, so the value it validates is the text rather than the stored
        item. Its handler delegates onward to the item-changed semantic event [`:L292`] and its return is
        the value the micro-protocol stashes and then dispatches on. THE DORMANT VALIDATION LIVES HERE,
        commented out at [`:L280-L290`], and this output is what proves it stayed dormant.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L24"
    - name: event.EVENT_ID_ONITEMCHANGED
      description: >-
        SEMANTIC 6 of 9. `onitemchanged(long row, dwobject dwo)` - the application-facing notification
        that the buffer now holds the new value. It returns nothing, and it is fired LAST of the three
        steps the changed-event dispatcher performs, unconditionally [`:L319`].
      format: >-
        Recorded as an arrival with its arguments and no return value. Its position in the sequence is
        the behaviour under test, so the record carries the token and the two steps that preceded it.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L25"
    - name: event.EVENT_ID_ONDOITEMCHANGED
      description: >-
        SEMANTIC 7 of 9. `ondoitemchanged(long row, dwobject dwo)` - the dispatcher whose three-step
        order at [`:L295-L320`] is itself contract: the column-expression service's changed handler
        first and only if that service is enabled, then the broker trigger and only if the item-changed
        topic has a subscriber, then the semantic notification unconditionally. Both conditions are
        observable, so all three steps and both conditions are recorded.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L26"
    - name: event.EVENT_ID_ONDDSFILTERED
      description: >-
        SEMANTIC 8 of 9. `onddsfiltered(long row, dwobject dwo, long rowcount, long filteredcount)` -
        the second half of the drop-down search pair, carrying both counts. It returns nothing; the two
        counts ARE its output and both are compared, because a filter that produced the right rows with
        the wrong counts is a divergence.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L28"
    - name: event.EVENT_ID_ONCOLUMNEXPTRACE
      description: >-
        SEMANTIC 9 of 9. `oncolumnexptrace(long row, dwobject dwo, string stack, string expr, string
        value)` - the expression trace, pure diagnostics. It returns nothing and nothing waits on it,
        which is why its area is sequenced rather than synchronous. The call stack it carries is built
        by the expression engine's recursion stack, so the string is recorded verbatim rather than
        parsed.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L32"

    # ---- THE THIRTEEN RAW PLATFORM EVENTS, IN DECLARATION ORDER ----------------------------------
    - name: event.EVENT_ID_ONDWNRBUTTONDOWN
      description: >-
        RAW 1 of 13, declared at [`:L15`]. DELEGATION SHAPE - the fullest of them: it calls the semantic
        right-button-down event and returns 1 if that returned 1, then triggers the broker's
        right-button-down topic and returns 1 if THAT returned 1, otherwise 0. Both returns are
        inspected, and the recording carries both so the two prevention sources stay distinguishable.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L115-L118"
    - name: event.EVENT_ID_ONDWNRBUTTONUP
      description: >-
        RAW 2 of 13, declared at [`:L16`]. DELEGATION SHAPE - BROKER ONLY. There is no semantic event in
        its path at all: it triggers the right-button-up topic, returns 1 if that returned 1, otherwise
        0. Recorded explicitly as a broker-only shape, because a port that added the missing semantic
        event for symmetry would fire an event the legacy does not fire.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L120-L122"
    - name: event.EVENT_ID_ONDWNROWCHANGE
      description: >-
        RAW 3 of 13, declared at [`:L17`]. DELEGATION SHAPE - gated on the row-focus bit and returning 0
        immediately when it is disabled; then the semantic row-focus-changed event, whose 1 returns 1;
        then the broker trigger WHOSE RETURN IS DISCARDED [`:L126`]; then 0. The discarded return is the
