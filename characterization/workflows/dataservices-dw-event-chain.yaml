    - name: event.EVENT_ID_ONDWNROWCHANGING
      description: >-
        RAW 4 of 13, declared at [`:L18`]. DELEGATION SHAPE - identical to its near-twin above in every
        respect EXCEPT that it INSPECTS the broker's return and returns 1 on a prevention [`:L132`]. The
