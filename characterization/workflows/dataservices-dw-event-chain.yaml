# yaml-language-server: $schema=./workflow.schema.json
# ==================================================================================================
#  dataservices-dw-event-chain - THE DATAWINDOW EVENT CHAIN
#  ------------------------------------------------------------------------------------------------
#  WHY THIS DEFINITION IS AUTHORED FIRST AMONG ITS SIBLINGS
#  Event-ordering preservation is the highest risk in the whole refactor, and the item-change
#  micro-protocol is the most intricate behaviour in the in-scope set. Every one of the five
#  `dataservices-dwsvc-*` workflows runs INSIDE this chain rather than beside it: each of the five
#  oracle windows enables exactly one sub-service, and every event that sub-service observes arrives
#  through the 22-event surface characterized here. So this pair pins the substrate, and the five
#  siblings cross-reference it rather than re-deriving it.
#
#  THIS FILE SPECIFIES A CAPTURE. IT CONTAINS NO CODE AND NO CAPTURED VALUE.
#  It conforms to `./workflow.schema.json`, which is authoritative for shape. Store-wide conventions
#  - the capture rule's canonical text, the recording-file conventions, the seam register, the defect
#  roster and what must never enter a recording - belong to `../README.md` and to `../../docs/PARITY.md`
#  and are CITED here, never restated. A fourth copy of a rule three files already own word for word
#  is a fourth thing to drift.
#
#  ORDER, NEVER SPEED (C-B, and `../README.md` section 6.4)
#  This workflow is about the ORDER in which events arrive and the values they return. It records no
#  elapsed value and asserts no timing. The monotonic sequencing token below exists FOR DETECTION
#  ONLY - an out-of-order arrival is a hard error, never a reorder opportunity and never a latency
#  measurement. The repository publishes no service-level agreement, no latency budget, no throughput
#  target and no availability commitment, so there is nothing a timing assertion could be measured
#  against. The only quantitative gate in the brief is 80% per-service line coverage, and it is read
#  from `coverage.cobertura.xml` in CI - not from this store.
#
#  ---- THE CASE-1 QUESTION IS SETTLED, AND THIS FILE USES THE SETTLED READING ---------------------
#  The migration plan describes the item-change dispatch's `case 1` as "falling through" to `case 2`.
#  IT DOES NOT. `se_cst_dw.sru:L212` is an arm with no statements, and PowerScript `CHOOSE CASE` does
#  not fall through the way a C `switch` does, so a result of 1 leaves the construct with value and
#  status UNTOUCHED. `../../docs/PARITY.md` section 7.7 and `../../docs/CONTRACTS.md` section 6.5 both
#  settle it from the dispatch text and explicitly withdraw the fall-through reading, and
#  `../../shared/PowerFramework.Contracts/Proto/dataservices.v1.proto` models the four arms as four
#  distinct outcomes. The distinction is OBSERVABLE - whether a restore happens before the
#  validation-error event fires - so a capture written against the withdrawn reading would assert a
#  behaviour the oracle does not exhibit, which is the one failure a characterization suite cannot
#  survive. Defect D-01 below records both the settled reading and the withdrawn one, so a reader
#  arriving from the plan's wording is not left to rediscover the correction.
#
#  ---- TWO LOCATORS CORRECTED AGAINST THE SOURCE -------------------------------------------------
#  Both were read line by line in `se_cst_dw.sru` rather than copied forward:
#    * the edit-changed topic's ordering prefix is declared at `:L57`, not `:L58` (`:L58` is the
#      comment introducing the clicked topic);
#    * the type-directed coercion switch spans `:L231-L244`, inside the default arm at `:L226-L250`.
#  Every locator in this file was verified the same way.
#
#  ---- WHAT THIS DEFINITION DELIBERATELY OMITS, AND WHY ------------------------------------------
#    * `blockedBehaviours` - OMITTED because this workflow blocks nothing. The store's two blocked
#      cases both belong to siblings: pinyin first-letter matching to `dataservices-dwsvc-dropdownsearch`
#      and cross-session foreign expression variables to `dataservices-dwsvc-columnexp`. Neither is
#      reachable from the event surface characterized here, and claiming either would misattribute a
#      known gap. Said here so a reader does not read the member's absence as an oversight.
#    * `redaction` - OMITTED because nothing this capture records is sensitive. Every data value that
#      reaches a recording originates in the read-only fixtures' own inline rows (six columns of
#      status codes and small decimals), and the one path that surfaces user data in a message is the
#      validation-error path, whose text comes from the same rows. NO KEY, NO PASSWORD, NO
#      CERTIFICATE, NO TOKEN AND NO CONNECTION STRING IS READ, EMITTED OR RECORDED HERE (C-F).
#      This chain issues no SQL, so the redacted-statement rule has no field to act on.
#    * the deferred-capability member - OMITTED. This workflow's capability is in scope in full: the
#      event chain, its gates and its session state are headless and ship complete. The structural
#      parent cited below is REFERENCE-ONLY and is not ported, which is a citation rather than a gap
#      in what this workflow covers (C-D).
#
#  ---- GOVERNING CONSTRAINTS -------------------------------------------------------------------
#  NO USER-SPECIFIED RULES EXIST. The project's rules document returns exactly one line reporting
#  that none were provided, so no rule is invented, inferred or back-filled, and nothing in this file
#  exists because of one. Enterprise-standard best practice applies in their place. The binding
#  constraints are the migration plan's own: C-B (defects reproduced, never corrected - a corrected
#  capture is a parity FAILURE), C-C (the legacy tree is read-only and is the oracle; every claim
#  carries a locator), C-D (nothing for a deferred capability area), C-F (no secret value), C-K
#  (every decision carries its reason) and C-L (the shared-volume capture rule).
# ==================================================================================================

schemaVersion: "1"

workflowId: dataservices-dw-event-chain

title: >-
  DataWindow event chain: 22 events, the item-change micro-protocol, and the ordering discipline per
  capability area

capabilityArea: >-
  The DataWindow event chain of the service class `se_cst_dw` - its 22-event surface (9 semantic
  events and 13 raw platform events), the non-uniform delegation shape each raw event applies to its
  semantic handler and to the event broker, the composable event gate, the four cross-event session
  fields, the item-change micro-protocol and its own four-value return alphabet, the validation-error
  handler that consumes the stash the item-change event leaves behind, and the ordering discipline
  assigned to each capability area within the chain.

targetService: DataServices

description: >-
  ONE ORDERED CHAIN, CAPTURED TWICE. The pair proves that the order in which the 22 events fire, the
  value each returns, and the session state carried between them are identical on the legacy master
  and on the .NET candidate after identical masking.


  THE FIVE SERVICE WORKFLOWS RUN INSIDE THIS CHAIN. `dataservices-dwsvc-rowselect`,
  `dataservices-dwsvc-columnsort`, `dataservices-dwsvc-contextmenu`, `dataservices-dwsvc-dropdownsearch`
  and `dataservices-dwsvc-columnexp` each characterize one sub-service, and each of those sub-services
  observes the world through this surface: the changed-event dispatcher calls the column-expression
  service before it triggers the broker, the raw editing event calls the drop-down search service after
  it, the filter override calls the row-select service, and the context-menu pair is two of the nine
  semantic events. Those five definitions therefore cross-reference this one for the ordering contract
  instead of restating it, and this one records no sub-service behaviour of its own beyond the points at
  which the chain hands control to a sub-service.


  ON THE IDENTIFIER, BECAUSE IT DEVIATES FROM THE STORE'S CONVENTION AND THE DEVIATION IS DELIBERATE.
  `../README.md` section 3.2 fixes workflow identifiers to the legacy oracle window that produces the
  recording, on the sound reasoning that a window name is traceable where an invented name is arbitrary.
  This workflow has no single such window: the behaviour under characterization belongs to the service
  CLASS, and all five `w_test_dwsvc_*` windows drive it. The identifier is therefore derived from the
  service object and its capability area, and every one of the five driving windows is cited below with
  the line at which it enables its sub-service - so the identifier stays as checkable as a
  window-derived one, by naming five windows rather than one.


  THE STRUCTURAL PARENT IS CITED AND IS NOT PORTED. `se_cst_dw` derives from `se_cst_datawindow`
  [`se_cst_dw.sru:L4,L10`], which is REFERENCE-ONLY in this refactor. That edge is structural rather
  than a call, so no refactoring of a call site removes it; the target instead defines its own abstract
  host contract carrying only the ancestral members the service class actually consumes - the DataWindow
  accessor surface it reads and writes through, the two overridden methods it calls upward at
  [`:L406`] and [`:L431`], and the two constructor and destructor chains at [`:L570`] and [`:L583`].
  The parent's own content is theming and redraw behaviour that the service class never references, and
  none of it is captured, implemented or stubbed here. THE CITATION IS EVIDENCE FOR THE HOST CONTRACT'S
  SHAPE; IT IS NOT A WORKFLOW FOR THE CAPABILITY AREA THAT OWNS THE PARENT, AND NOTHING IN THIS STORE
  IS (C-D).


  NO DATA VALUE RECORDED HERE IS SENSITIVE. Every captured value originates in the read-only fixtures'
  own inline rows; nothing is read from a credential, a key store or a connection string (C-F).

