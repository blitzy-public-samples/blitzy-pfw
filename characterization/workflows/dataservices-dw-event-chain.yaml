    # ==============================================================================================
    #  PART 2 OF 3 - THE THREE ORDERED BEHAVIOURS, STEP BY STEP
    #  ---------------------------------------------------------------------------------------------
    #  The item-change micro-protocol, the changed-event dispatcher's strict sequence, and the
    #  validation-error handler. Each step is its own output because each is individually observable and
    #  individually reversible by a well-meaning port; a single "the protocol behaved" output would
    #  compare the endpoint and lose every step that led to it.
    # ==============================================================================================
    - name: itemChange.gateEarlyOut
      description: >-
        STEP 1. Whether the handler returned 0 immediately because the item-change bit was disabled, and
        the bitmask value it tested. The early-out is captured with the bit set and with it clear, so the
        recording proves the gate was consulted rather than assumed.
      format: >-
        The bitmask as a decimal integer and a boolean for whether the early-out was taken. The bit's
        value is 4 and the mask is composable, so the number is recorded rather than a bit name.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L187"
    - name: itemChange.snapshotBeforeDispatch
      description: >-
        STEP 2. THE TWO SNAPSHOTS, and they are two rather than one: the column's original value from the
        primary buffer [`:L189`] and the row's item status [`:L190`]. They are restored independently
        later, so a recording that carried only the value could not detect a status that was restored when
        it should not have been.
      format: >-
        The value with its runtime type and an explicit null marker, and the item status by its legacy
        name. Null is recorded as null and never as an empty string or a zero, because the equality test
        in step 4 treats two nulls as equal and a coerced null would make that arm unobservable.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L189-L190"
    - name: itemChange.reentrancyFlagWindow
      description: >-
        STEP 3. The item-change re-entrancy flag is SAVED, set, and then RESTORED TO ITS SAVED VALUE
        rather than cleared [`:L192-L196`], which is what makes nesting work. Recorded as the flag value
        before, during and after, together with the value the semantic pre-change handler returned and
        THE STASH THAT VALUE WAS WRITTEN INTO [`:L195`].
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L192-L196"
    - name: itemChange.equalityTest
      description: >-
        STEP 4. The outcome of the equality test between the snapshot and the buffer's current value,
        INCLUDING WHICH ARM DECIDED IT - the direct comparison at [`:L198`] or the EXPLICIT NULL-AND-NULL
        ARM at [`:L200-L201`]. Two nulls compare equal here. Without that arm the null case would fall
        into the unequal branch and fire an event the legacy does not fire, so which arm matched is
        recorded, not merely the boolean it produced.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L198-L202"
    - name: itemChange.nestedChangingEvent
      description: >-
        STEP 5. When the values differed: the value RE-READ from the buffer [`:L206`] - re-read rather
        than reused, because the handler may have altered it - and the nested raw editing event fired
        from inside the item-change handler [`:L207`]. The nesting is recorded as a nesting, with the
        outer event still open, because a port that flattened it into a sibling would produce the same
        set of events in a different shape.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L204-L208"
    - name: itemChange.dispatchArm
      description: >-
        STEP 6. WHICH OF THE FOUR ARMS THE STASHED RESULT SELECTED, and what that arm did. The four are
        distinct and none is merged: the arm for 1 has NO STATEMENTS [`:L212`] so 1 is returned exactly
        as produced with value and status UNTOUCHED; the arm for 2 restores value and status but only if
        the step-4 equality held [`:L216-L222`]; the arm for 3 keeps the value, does not move focus, and
        REWRITES THE RESULT TO 1 [`:L223-L225`]; and the default arm coerces, fires the changed
        dispatcher and forces 2 [`:L226-L250`]. The recorded arm plus the recorded value and status
        afterwards is what distinguishes them - see defect D-01, which also records the withdrawn
        fall-through reading so a reader cannot mistake the empty arm for an omission.
      format: >-
        The arm identifier, the incoming stashed value, the outgoing value, and the value and item status
        after the arm ran. All four numbers are recorded as the raw numbers of the item-change alphabet -
        never mapped onto the return-code algebra, in which 1 means prevented and reads as succeeded,
        which is not what 1 means here at all.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L211-L251"
    - name: itemChange.coercionOutcome
      description: >-
        STEP 6, DEFAULT ARM. The type-directed coercion, per column, keyed on THE FIRST FIVE CHARACTERS
        of the declared column type across a fixed set of ten prefixes [`:L231-L244`] - the two character
        prefixes, the three decimal and numeric prefixes, the two integral prefixes, and the datetime,
        date and time prefixes - each with its own conversion, and the whole switch guarded by the step-4
        equality [`:L229`]. Recorded per column of the fixture, so the two-place decimal columns and the
        hundred-character string columns each demonstrate their own arm, and any type reaching no arm
        demonstrates that too.
      format: >-
        Per column: the declared type, its first five characters, the arm that matched or the absence of
        one, the input text and the stored value with its runtime type. A prefix that matches no arm
        leaves the buffer untouched, and that outcome is recorded rather than inferred.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L231-L244"
    - name: itemChange.forcedResult
      description: >-
        STEP 6, DEFAULT ARM. The FORCED result: after firing the changed dispatcher [`:L247`] the arm
        overwrites whatever it held with 2 [`:L250`], so the platform will not re-apply the edit text over
        a buffer the changed handler may itself have altered. Recorded as the value before the overwrite
        and the value after, because only the pair shows the overwrite happening.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L247-L250"
    - name: changedDispatcher.strictSequence
      description: >-
        THE FIRST OF THE TWO ADJACENT ORDERINGS, and the sequence IS the behaviour [`:L295-L320`]: the
        column-expression sub-service's changed handler first and ONLY IF THAT SERVICE IS ENABLED
        [`:L313-L315`]; then the broker's item-changed trigger and ONLY IF THE TOPIC HAS A SUBSCRIBER
        [`:L316-L318`]; then the semantic changed notification, unconditionally [`:L319`]. A recalculation
        that happens before a subscriber sees the change is a different observable order from one that
        happens after, so all three steps and both conditions are recorded in order.
      format: >-
        Three ordered entries, each with the condition that admitted or skipped it. A skipped step is
        recorded as skipped with its condition's value, never omitted - an omitted step and a skipped
        step look identical in a diff and mean different things.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L295-L320"
    - name: validationError.reentrancyGuard
      description: >-
        THE SECOND ADJACENT ORDERING, step 1. The handler returns 1 IMMEDIATELY when it is already inside
        itself [`:L327`], before anything else - before the stash is read, before any snapshot. Recorded
        as the guard's value on entry and whether the early return was taken, and driven re-entrantly at
        least once so the recording contains a case in which it fired.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L327"
    - name: validationError.stashConsumption
      description: >-
        Step 2. THE STASH IS READ AND THEN CLEARED [`:L331-L332`] - read-and-clear is the only legal way
        to consume it, and the clearing is part of the behaviour rather than housekeeping. Recorded as the
        value read and the value left behind, so a port that read without clearing is detected on the very
        next validation error rather than eventually.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L331-L332"
    - name: validationError.presetFromStash
      description: >-
        Step 3. The result PRE-SET to 1 when the consumed stash was 1 or 3 [`:L338-L340`], which is
        precisely why this area cannot be reordered: the handler's behaviour is a function of the
        preceding event's return value. Recorded as the stash value and whether the pre-set applied.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L338-L340"
    - name: validationError.errorEventNullCoercion
      description: >-
        Step 4. When no pre-set applied, the semantic error event is fired and A NULL RETURN IS COERCED
        TO ZERO [`:L342-L345`]. Here null IS coerced, deliberately and locally - which is not a licence to
        coerce null anywhere else, and specifically not in the return-code predicates where null is
        neither succeeded nor failed. Recorded as the raw return including its null marker AND the value
        after coercion, so the coercion is visible rather than implied.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L342-L345"
    - name: validationError.validationMessage
      description: >-
        Step 5, THE NON-EMPTY DATA PATH. The column's validation message is read [`:L350`], HAS ITS OUTER
        TWO CHARACTERS STRIPPED under a length guard [`:L351-L353`], and falls back to a localized string
        when the result is empty or is a single question mark [`:L354-L356`]. All four states are recorded
        - the raw message, the stripped message, whether the fallback fired and why - because the strip is
        the kind of transformation a port silently drops and the fallback is the kind it silently widens.
      format: >-
        The raw text exactly as the property returned it, the text after stripping, the fallback
        condition that matched or none, and the final text. Text is recorded verbatim and unnormalized
        apart from the newline convention the mask declares.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L350-L356"
    - name: validationError.structuredError
      description: >-
        Step 6. THE DIALOG, RE-EXPRESSED AS A MACHINE-READABLE RESULT. The legacy shows a modal message
        box with a localized title and the stop-sign severity [`:L357`] and then sets its result to 1
        [`:L358`]. ONLY THE DELIVERY CHANNEL CHANGES: the exact message text, the localization category
        it routed through, the substitution arguments and the severity are all preserved and all compared
        field by field. This is the one path in this chain that surfaces user data in a message, and the
        data is the fixture's own seeded row values - no credential, key or certificate is reachable from
        it (C-F).
      format: >-
        A field-by-field record - title text, body text, localization category, substitution arguments in
        order, severity - with the severity carried by name. The severity here is the stop sign; the
        enumeration's other members are not reachable from this call site and are recorded as absent
        rather than as defaults.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L357-L358"
    - name: validationError.emptyDataReturnsThree
      description: >-
        Step 7, THE EMPTY-DATA PATH, WHICH IS A DISTINCT PATH AND NOT A DEGENERATE CASE OF THE OTHER. On
        empty data the handler CLEARS ITS OWN GUARD and RETURNS 3 [`:L359-L363`] - no message, no restore,
        and an early return that skips the restore dispatch entirely. Recorded as its own outcome, because
        3 here and 3 in the item-change alphabet mean different things and the recording must keep them
        apart.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L359-L363"
    - name: validationError.restoreGuard
      description: >-
        Step 8. The value-and-status restore, performed for results 1 and 3 only, and only when TWO
        conditions hold: THE ROW STILL EXISTS and the consumed stash was not 3 [`:L369`], and then the
        snapshot still matches the buffer or both are null [`:L372`]. The row-existence check is
        DEFENSIVE BECAUSE THE MESSAGE'S POSTED CONTINUATION MAY HAVE DELETED THE ROW - the source comment
        at [`:L368`] says so - and it must survive. Recorded as both conditions' values, the restore's
        occurrence, and the value and status afterwards.
      format: >-
        The result being dispatched on, the row number, the row count, the consumed stash, the equality
        outcome, whether the restore ran, and the value and item status before and after it. A capture
        that includes a row deleted from inside a validation error is taken deliberately, because that is
        the only way the guard's necessity appears in a recording.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L366-L380"
    - name: validationError.result
      description: >-
        Step 9. The guard cleared [`:L382`] and the value returned [`:L384`], recorded as the raw number.
        The three reachable outcomes - 1 from a pre-set or a message, 3 from empty data, and whatever the
        semantic error event produced after null coercion - are distinguished in the recording by the path
        that produced them, not by the number alone.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L382-L384"

    # ==============================================================================================
    #  PART 3 OF 3 - THE CHAIN-WIDE OUTPUTS
    #  ---------------------------------------------------------------------------------------------
    #  What holds across the whole dispatch rather than inside one event: the sequence itself, the
    #  session fields carried between events, the gate, the broker's dispatch record, and four ordering
    #  facts that live outside the 22 events but change the order they arrive in.
    #
    #  NO OUTPUT IN THIS DEFINITION CARRIES `maskedAsNonBehavioural`, AND THE ABSENCE IS DELIBERATE
    #  RATHER THAN AN OVERSIGHT. That flag exists for a field the oracle emits which carries no
    #  behaviour - canonically its own elapsed-time field. This chain emits no such field: every value
    #  below is behaviour, and the variation that does enter is neutralised by the seams in
    #  `determinismMask` instead. Preferring a seam to a mask is the store's own rule, because a masked
    #  field is a field in which a regression can hide.
    # ==============================================================================================
    - name: eventSequence
      description: >-
        THE ORDERED SEQUENCE ITSELF - every dispatched event in arrival order with its monotonic
        sequencing token, its nesting depth, and the discipline its capability area was captured under.
        This is the primary output of the workflow and the one a reordering regression shows up in.
        THE TOKEN IS A DETECTION DEVICE AND NOTHING ELSE: a token at or below the ordering mark is a
        reversal or a duplicate and is a hard error, the server does not buffer and re-sort, and NO
        DURATION IS DERIVED FROM ANY PAIR OF TOKENS.
      format: >-
        One record per line in arrival order, each carrying the token, the event identifier, the nesting
        depth, the ordering discipline, and a reference to the session it belongs to. The order of the
        lines is the comparison; a stable serialization order inside each line keeps a field reordering
        from reading as a behavioural difference.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L11-L32"
    - name: eventReturnValues
      description: >-
        THE NUMERIC RETURN VALUE OF EVERY EVENT THAT HAS ONE, AS A NUMBER. Never a boolean projection of
        one, and never mapped through another alphabet. Three distinct numeric alphabets meet in this
        chain and the recording keeps them apart: the prevention convention the raw handlers return (0 to
        continue, 1 to prevent), the four-value item-change alphabet, and the broker's tri-valued
        prevention. Two of them share the digit 1 and mean different things by it.
      format: >-
        The raw integer, plus the alphabet it belongs to, plus a null marker where the handler returned
        null. An event declared without a return records the absence explicitly rather than a zero.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L11-L32"
    - name: sessionState
      description: >-
        THE FOUR CROSS-EVENT FIELDS AT EVERY TRANSITION [`:L89-L96`] - the disabled-event bitmask
        [`:L89`], the flag recording that execution is inside the item-change handler [`:L92`], the flag
        recording that it is inside the validation-error handler [`:L94`], and THE STASH: the
        item-changed return value held for the validation-error event to consume [`:L96`]. A stateless
        boundary has nowhere to put these, so on the target side they are fields of a server-held session
        correlated by identifier. A fifth field is recorded alongside them and is target-side only -
        whether a deferred accept is pending - because a queued continuation, unlike a posted platform
        message, has to be representable or a consumer cannot tell that work is outstanding.
      format: >-
        A snapshot per transition: the session's ordinal, the event that caused the transition, and all
        five fields. The stash is recorded with the item-change alphabet's raw number rather than as a
        bare integer, because that is what it holds.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L89-L96"
    - name: itemStatusTransitions
      description: >-
        THE ITEM VALUE AND THE ITEM STATUS BEFORE AND AFTER EVERY STEP THAT COULD CHANGE EITHER - the two
        snapshots, the two restores, the coercion, and each nested event. The two are recorded
        independently because they are restored independently: the arms set the value and the status in
        separate calls [`:L219-L220`, `:L375-L376`], so a port that restored one and not the other
        produces a row that looks right and saves wrong.
      format: >-
        Per step: the row, the column, the value with its runtime type and null marker, and the item
        status by its legacy name. Statuses are recorded by name rather than by ordinal, because the name
        is what the buffer contract is written against.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L189-L190"
    - name: eventGateMatrix
      description: >-
        THE GATE, DRIVEN EXHAUSTIVELY. The three bits are composable values 1, 2 and 4 [`:L41-L43`] and
        the four guards that test them sit at [`:L124`], [`:L130`], [`:L176`] and [`:L187`]. The capture
        drives each bit independently disabled and independently enabled, and then in combination,
        recording for every case which events fired and which returned early. The row-focus bit guards TWO
        handlers while the other two bits guard one each, so a per-bit summary would be ambiguous where a
        per-event matrix is not.
      format: >-
        A row per gate combination and event, carrying the bitmask, the event identifier, whether the
        guard admitted it, and the value returned. Recorded as a table rather than as prose so a reviewer
        can diff a cell.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L41-L43"
    - name: eventGateColumnExpressionCoupling
      description: >-
        THE COUPLING, CAPTURED AS ITS OWN CASE. The source comment on the item-change bit records that
        disabling it ALSO SUPPRESSES COLUMN-EXPRESSION CALCULATION [`:L43`], and the mechanism is visible
        in the chain: the item-change gate returns before the handler reaches the changed dispatcher
        [`:L187`], and the dispatcher is the only place the chain calls the column-expression sub-service's
        changed handler [`:L313-L315`]. The capture disables that one bit with the column-expression
        service ENABLED and records that no recalculation occurred - a second-order effect that no
        per-event return value reveals on its own.
      format: >-
        The bitmask, the sub-service's enabled state, the events that fired, and whether a recalculation
        was observed. The absence of the recalculation is recorded as an explicit negative, because an
        absent record and an absence are not the same evidence.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L43"
    - name: gateMutatorResults
      description: >-
        THE GATE'S PUBLIC SURFACE AND WHAT IT RETURNS [`:L109-L111`] - the query, the disable and the
        enable. Both mutators reject a zero argument with the invalid-argument return code [`:L506`,
        `:L530`] and otherwise return the success code, and the recording carries those raw numeric codes.
        TWO SIGNATURE DETAILS ARE RECORDED BECAUSE THEY ARE OBSERVABLE AT THE BOUNDARY AND ASYMMETRIC: the
        disable function is declared returning a long while the enable function is declared returning an
        integer [`:L110`, `:L111`], and the enable function's own header comment states a long. The
        asymmetry is reproduced rather than tidied.
      format: >-
        Per call: the function, the argument, the raw numeric return, and the resulting bitmask. The codes
        are the return-code algebra's - a different alphabet from the item-change values, and labelled as
        such in the record.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L109-L111"
    - name: brokerDispatch
      description: >-
        EVERY BROKER TRIGGER THE CHAIN ISSUES, with its topic, its outcome and its argument list. Four
        things are recorded per dispatch and each is a distinct failure mode if lost. THE TOPIC IS
        RECORDED BOTH DECOMPOSED AND FUSED - the ordering prefix as a number, a flag for whether the
        legacy spelling actually carried one, and the logical name, alongside the exact legacy string -
        because two of the twelve topics carry a prefix and ten do not, so an unprefixed topic and a
        zero-prefixed topic both report zero and only the flag separates them. THE OUTCOME IS TRI-VALUED
        - continue, prevent-once, prevent-deep - and is recorded as its raw number. THE INJECTED FIRST
        ARGUMENT is recorded, together with which of the four exclusions applied when it was not injected
        [`:L599-L607`]. And WHETHER THE TOPIC HAD A SUBSCRIBER is recorded, because two of the triggers
        are gated on exactly that [`:L166`, `:L316`] and the broker's own default return of zero
        [`:L594-L597`] makes an unsubscribed dispatch read as continue.
      format: >-
        One record per dispatch: the fused topic string quoted verbatim, the decomposed fields, the
        subscriber flag, the argument list with the injection marker, and the raw tri-valued outcome. The
        fused string is quoted because two of them begin with a digit and a hyphen.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L47-L76"
    - name: deferredAcceptContinuation
      description: >-
        THE DEFERRED ACCEPT, AND ITS CONDITION. The kill-focus handler queues the private accept-text
        continuation ONLY when the item-change flag is clear [`:L388-L390`]; the legacy achieves the
        deferral by posting to the platform message queue, which a headless container does not have, so
        the target expresses it as an explicitly queued continuation on the validation session. THE
        ORDERING IS WHAT IS COMPARED, not the mechanism: the continuation runs AFTER the event that
        queued it has returned, and its body re-checks that focus has moved away before accepting and
        restores focus if the accept fails [`:L537-L558`]. That re-check is why it cannot be executed
        inline.
      format: >-
        The condition's value, whether a continuation was queued, its position in the sequence relative
        to the event that queued it, and the outcome of its two internal checks. A capture in which the
        flag was set records the continuation as NOT queued, which is half the behaviour.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L387-L393"
    - name: dormantByteLengthCheck
      description: >-
        THE DORMANT PATH, PROVEN DORMANT. The pre-change handler contains a commented-out byte-length
        check with its own dialog [`:L280-L290`] which would measure the input against the column's
        declared character width and reject over-long input. It is carried across commented and inert and
        MUST NOT BE REVIVED. The capture drives an over-long value into a hundred-character string column
        and records that NO message was produced and the value was NOT rejected on that account - the
        explicit negative that proves the path stayed dormant on both sides.
      format: >-
        The input length in bytes, the column's declared width, the messages produced (none), and the
        handler's return. A recording in which this path fires is a parity FAILURE on the target side,
        not an improvement in validation.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L280-L290"
    - name: subServiceCompositionOrder
      description: >-
        THE ORDER THE FIVE SUB-SERVICES ARE CONSTRUCTED IN AND THE ORDER THEY ARE INITIALIZED IN, WHICH
        ARE NOT THE SAME ORDER [`:L570-L581`]. Construction runs context menu, row select, column sort,
        drop-down search, column expressions [`:L570-L574`]; initialization runs context menu, row select,
        DROP-DOWN SEARCH, COLUMN SORT, column expressions [`:L576-L580`] - the middle two are swapped.
        Teardown runs the broker's unsubscribe-all first and then destroys in construction order
        [`:L583-L589`]. All three orders are recorded because each is an observable sequence of calls into
        objects that may subscribe, and normalizing them into one order would be a silent correction.
      format: >-
        Three ordered lists of sub-service names - constructed, initialized, destroyed - captured once per
        host lifecycle.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L570-L581"
    - name: syntheticRowChangeOnDelete
      description: >-
        A ROW-CHANGE EVENT THE CHAIN FIRES ITSELF, WITH NO PLATFORM MESSAGE BEHIND IT. The delete-row
        override [`:L416-L446`] rejects an out-of-range row, resolves a zero argument to the current row,
        remembers whether the row was the current one and whether it was the last, delegates upward, and
        then SYNTHESIZES the raw row-change event - with row zero when the delete emptied the DataWindow
        [`:L435`], or with the row number when the deleted row was current and remains current [`:L437`].
        It is captured here rather than left to a sub-service workflow because it injects an event into
        the very sequence this workflow compares.
      format: >-
        The requested row, the resolved row, the two remembered flags, the delegated return, and the
        synthesized event with its argument and its position in the sequence. A capture in which nothing
        was synthesized records that outcome too.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L416-L446"
    - name: filterOverrideHook
      description: >-
        THE OTHER PLACE THE CHAIN HANDS CONTROL TO A SUB-SERVICE. The filter override delegates upward
        and, ONLY on a successful filter and ONLY when the row-select sub-service is enabled, fires that
        service's filtered event [`:L403-L414`]. Recorded as the delegated return, the enabled state, and
        whether the hook fired - the third of the three conditional hand-offs in the chain, alongside the
        changed dispatcher's and the raw editing event's.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L403-L414"
    - name: orderingDisciplineTag
      description: >-
        THE DISCIPLINE EACH RECORD WAS CAPTURED UNDER, carried on the record rather than inferred from the
        event identifier. It is recorded because the assignment is per capability area and is therefore
        part of the contract the capture was taken against: a pair whose two halves disagree about which
        events were synchronous is comparing two different contracts, and the tag is what makes that
        detectable instead of invisible.
      format: >-
        The wire enumeration's own member name per record - the synchronous discipline or the sequenced
        one - and never a boolean, because a third member exists for the unspecified state and collapsing
        the three would hide a record that was captured under no assignment at all.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L11-L32"

  recordingArtifacts:
    # Six text-based, diffable files, one workflow's output in one workflow's own directory. THE
    # EXTENSIONS ARE NOT A STYLE CHOICE: the root `.gitignore` carries six extensions UNANCHORED - one
    # log extension and five archive and dump extensions, enumerated in `../README.md` section 3.5 - so
    # they match at every depth including inside this store, and its only negations are anchored elsewhere
    # and rescue nothing here. A capture named that way is silently untracked - present on the machine
    # that produced it, absent from `git status`, from review and from CI, so the comparison looks taken
    # and cannot be found. The root `.gitignore` is not to be modified; naming the file correctly is the
    # fix, and the schema's own filename pattern makes the six unspellable here in any case.
    - filename: event-sequence.jsonl
    - filename: session-state.jsonl
    - filename: item-change-dispatch.json
    - filename: validation-error-paths.json
    - filename: event-gate-matrix.csv
    - filename: broker-dispatch.jsonl

# ==================================================================================================
#  THE DETERMINISM MASK - INLINE, SYMMETRIC, AND EVERY ENTRY WITH ITS REASON
#  ------------------------------------------------------------------------------------------------
#  The mask is a member of this definition rather than a pointer to one, because a mask that drifts
#  away from its workflow silently invalidates every pair captured under it. EVERY ENTRY APPLIES TO
#  BOTH SIDES: masking only the candidate leaves the master holding a value that can never be matched,
#  and masking only the master inverts the same problem. One configuration, used for both captures.
#  `../../docs/PARITY.md` section 5.1 is the authoritative seam register and carries each seam's
#  injection point and status; the entries below are this workflow's application of it.
# ==================================================================================================
determinismMask:
  - seam: >-
      Every clock read reachable from this chain - any timestamp that reaches a recorded field or a
      recorded decision, on either side.
    method: >-
      Inject the clock and substitute a deterministic double that advances only when the test advances
      it. Nothing in this chain branches on a clock value, so the substitution changes no path; it only
      makes a recorded timestamp reproducible. Prefer this to masking the field out, because a masked
      field is a field a regression can hide in.
    appliesTo: [legacy, dotnet]
    reason: >-
      A timestamp differs on every run by definition rather than by behaviour, so an unmasked one
      reports a difference on every comparison and trains a reviewer to ignore red results. NOTE WHAT
      THIS IS NOT: seaming the clock does not introduce a timing assertion. No elapsed value is
      recorded or compared anywhere in this workflow.
  - seam: >-
      Modify-call ordering on the DataWindow property path - the describe and modify calls the chain
      issues, including the property read in the focusless row move and the validation-message read in
      the validation-error handler.
    method: >-
      Fix the order in which the chain issues its describe and modify calls, and record them in that
      fixed order on both sides.
    appliesTo: [legacy, dotnet]
    reason: >-
      Two orderings that reach the same state can emit different intermediate output, so an unpinned
      order surfaces as a difference where no behaviour changed. Fixing the order is not the same as
      fixing the OUTCOME: the properties' values remain fully compared, and a genuine change in what a
      property returns is still detected.
  - seam: >-
      Line endings in every multi-line recorded field - most consequentially the validation message
      text and the expression trace's call stack.
    method: >-
      Declare one newline convention for this workflow and apply it identically to both halves at
      comparison time. This is a comparison-time normalization only: IT DOES NOT LICENSE EDITING A
      STORED MASTER, which the technique forbids outright.
    appliesTo: [legacy, dotnet]
    reason: >-
      The master is produced on Windows by the legacy framework while the candidate runs in a Linux
      container, so raw line endings differ BY PLATFORM RATHER THAN BY BEHAVIOUR - and the repository's
      root `.gitattributes` declares only language mappings with no text or end-of-line rule, so nothing
      normalises them on the way into version control. Without this entry a byte-exact comparison
      reports a difference on every line of every multi-line field. Changing `.gitattributes` is NOT in
      scope and would be the wrong place to solve it: the normalization belongs to the comparison, not
      to the repository's checkout behaviour.
  - seam: >-
      Validation-session correlation identifiers, and the host handles scoped to them - allocated per
      run on the target side, where the legacy has an in-process object identity instead.
    method: >-
      Replace each identifier with a stable ordinal assigned in creation order, on both sides, and
      record the ordinal rather than the identifier. Equality between two ordinals still means what
      equality between two identifiers meant.
    appliesTo: [legacy, dotnet]
    reason: >-
      The identifier is allocated per run and can never match across two runs, let alone across two
      sides. But THE IDENTITY RELATION IS BEHAVIOUR - which events belong to the same session, and
      therefore which event reads the stash another event wrote - and an ordinal preserves that relation
      exactly while removing the variation. Masking the field out entirely would remove the relation
      with it and is why the ordinal is used instead.
  - seam: >-
      Any random or globally-unique value reachable from a payload this chain records - including one
      arriving from a sub-service or from a client-supplied argument rather than generated inside the
      chain itself.
    method: >-
      Seam the generator and substitute a deterministic sequence for the capture. Where a value cannot be
      made reproducible without changing observable behaviour, mask that field out of the comparison and
      record why at the field.
    appliesTo: [legacy, dotnet]
    reason: >-
      Such a value is non-deterministic by construction and can never match. The entry is present even
      though the chain generates none of its own, because a payload it merely carries - a client-supplied
      correlation value, or a value produced by a sub-service the chain hands control to - would otherwise
      reach a recording unmasked, and a mask discovered after a pair was captured invalidates the pair.

# ---- WHAT IS DELIBERATELY NOT MASKED, STATED EXPLICITLY --- -----------------------------------------
#  These are the behaviour under test. Masking any one of them would produce a comparison that passes
#  while proving nothing, which is worse than a comparison that fails:
#    * THE EVENT ORDER, and every nesting relationship inside it;
#    * THE SEQUENCING TOKENS - they are ordinals and they are compared as ordinals;
#    * EVERY EVENT'S RETURN VALUE, as its raw number, in whichever of the three alphabets it belongs to;
#    * THE THREE GATE BITS and every bitmask value derived from them;
#    * THE FOUR CROSS-EVENT SESSION FIELDS, including the stash and including its cleared state;
#    * THE ITEM STATUSES AND THE ITEM VALUES, before and after every step;
#    * THE COERCION OUTCOMES per column type, including a type that matches no arm;
#    * THE TRI-VALUED VETO OUTCOMES, as raw numbers;
#    * THE TOPIC STRINGS, both decomposed and in their exact fused legacy spelling.
#  And nothing is masked on one side only, anywhere, ever.

# ==================================================================================================
#  THE DEFECTS THIS PAIR EXISTS TO PROVE SURVIVED
#  ------------------------------------------------------------------------------------------------
#  THE INVERSION IS LOAD-BEARING: a capture that shows CORRECTED behaviour is a parity FAILURE, not an
#  improvement. Where the target produces output that looks more correct than the oracle, the finding is
#  a divergence in the target and is filed as a defect (C-B). A legacy defect is reproduced and annotated
#  at its point of reproduction, never repaired. `../../docs/PARITY.md` section 7 is the authoritative
#  catalogue of behaviour groups; the entries below record which of them THIS pair pins.
# ==================================================================================================
provesDefects:
  - defect: >-
      D-01. THE ITEM-CHANGE RETURN ALPHABET IS `{0, 1, 2, 3}` AND IT IS NOT THE RETURN-CODE ALGEBRA. Four
      distinct dispatch arms, none merged: the arm for 1 has no statements and returns 1 with value and
      status untouched; the arm for 2 restores value and status but only if the earlier equality test
      held; the arm for 3 keeps the value, does not move focus and rewrites its result to 1; and the
      default arm - which catches every value outside `{1, 2, 3}`, not only zero - coerces by column type,
      fires the changed dispatcher and then forcibly returns 2.
    locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L182-L253, with the dispatch at :L211-L251"
    note: >-
      TWO WAYS TO GET THIS WRONG, AND THE SECOND IS THE SUBTLE ONE. First, mapping these values onto the
      return-code algebra: there 1 is prevented and reads as SUCCEEDED, while here 1 means reject the edit
      and raise the validation error, and 2 means the buffer is already written so do not re-apply the edit
      text. The two alphabets share digits and share nothing else, so the wire models this as its own
      enumeration with these four numeric values preserved. Second, THE CASE-1 QUESTION, WHICH IS SETTLED:
      the migration plan describes the arm for 1 as "falling through" to the arm for 2, and that reading is
      WITHDRAWN by `../../docs/PARITY.md` section 7.7 and `../../docs/CONTRACTS.md` section 6.5. PowerScript
      `CHOOSE CASE` does not fall through the way a C `switch` does - an arm with no statements executes
      nothing and control leaves the construct - so 1 returns UNTOUCHED. The empty arm is load-bearing
      precisely while empty: delete it and 1 reaches the default arm, is coerced, fires the changed event
      and is rewritten to 2. The source's own comment immediately above the dispatch [`:L210`] says why -
      returning 1 is what raises the validation error, and it is THAT handler which restores value and
      status [`:L369-L379`] after reading the stash, so restoring here as well would restore twice and
      would do it before the stash had been read. The difference is observable, which is why this pair
      records the arm AND the value and status after it.
  - defect: >-
      D-02. THE STASHED ITEM-CHANGE CODE IS CONSUMED AND CLEARED BY A DIFFERENT EVENT. The item-change
      handler writes its semantic handler's result into a private field, and the validation-error handler
      reads that field and then zeroes it, pre-setting its own result to 1 when the value was 1 or 3.
      Cross-event mutable state with a read-and-clear contract, in a chain that otherwise looks stateless.
    locator: >-
      ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L96 declared, :L195 written,
      :L331-L332 read and cleared
    note: >-
      THIS IS THE REASON THE ITEM-CHANGE AREA CANNOT BE REORDERED - the second event's behaviour is a
      function of the first event's return value, so a consumer permitted to re-sort them could read the
      stash before it was written. The clearing is behaviour rather than housekeeping: a port that read
      without clearing would pre-set the result on the NEXT validation error too, and the recording detects
      that immediately because the cleared state is compared.
  - defect: >-
      D-03. THE VALIDATION MESSAGE HAS ITS OUTER TWO CHARACTERS STRIPPED, under a length guard, and then
      falls back to a localized string when what remains is empty or is a single question mark.
    locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L350-L356"
    note: >-
      Both halves are easy to lose in a port and each fails differently. Drop the strip and every message
      carries two stray delimiter characters. Widen the fallback condition - to any short string, say -
      and messages the legacy shows are replaced by the generic text. The recording therefore carries the
      raw text, the stripped text, the condition that matched, and the final text, so which half broke is
      visible rather than inferred.
  - defect: >-
      D-04. EMPTY DATA CLEARS THE GUARD AND RETURNS 3 - a distinct path, not a degenerate case of the
      non-empty one. No message is shown, no restore is attempted, and the handler returns before reaching
      its restore dispatch at all.
    locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L359-L363"
    note: >-
      The source comment records the intent: empty input is refused here and re-checked at save time. Note
      the 3 returned here is in the validation-error handler's own return contract and is NOT the 3 of the
      item-change alphabet, even though the same digit appears in both - the recording labels each with the
      alphabet it belongs to so the two cannot be conflated. The guard is cleared on this path
      specifically, which a port that clears only at the end of the handler would get wrong.
  - defect: >-
      D-05. THE ROW-EXISTENCE GUARD BEFORE THE RESTORE. The restore of value and status happens for results
      1 and 3 only when the row still exists AND the consumed stash was not 3.
    locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L366-L380, the guard at :L368-L369"
    note: >-
      IT LOOKS REDUNDANT AND IT IS NOT - IT MUST SURVIVE. The source comment at [`:L368`] states the
      reason: the message box processes posted messages while it is open, so the row may have been DELETED
      before control returns. A port that drops the check is one deleted row away from an out-of-range
      access on a path a user reaches by clicking a dialog. This is the standing shape of a defensive
      legacy check that a well-meaning cleanup removes because no test exercised it, which is exactly why
      the capture drives a delete from inside a validation error.
  - defect: >-
      D-06. THE BROKER-RETURN ASYMMETRY BETWEEN TWO NEAR-IDENTICAL HANDLERS. The row-change handler
      triggers the broker and DISCARDS what it returns; the row-changing handler triggers the broker and
      RETURNS 1 when it returns 1. Everything else about the two handlers matches, including the gate bit
      they test and the shape of their semantic call.
    locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L126 discarded, :L132 inspected"
    note: >-
      HARMONIZING THE TWO WOULD BE A SILENT CORRECTION IN EITHER DIRECTION. Make the row-change handler
      inspect the return and a subscriber gains the power to prevent an event the legacy does not let it
      prevent. Make the row-changing handler discard it and a subscriber loses a prevention it has. The
      two are recorded side by side precisely because the asymmetry is invisible when only one is examined.
  - defect: >-
      D-07. DISABLING THE ITEM-CHANGE GATE ALSO SUPPRESSES COLUMN-EXPRESSION EVALUATION - a second-order
      effect of a bit whose name says nothing about expressions. The source comment on the bit's
      declaration records it.
    locator: >-
      ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L41-L43, with the public gate surface
      at :L109-L111
    note: >-
      The mechanism is visible in the chain rather than hidden in the sub-service: the item-change gate
      returns before the handler reaches the changed dispatcher [`:L187`], and that dispatcher is the only
      place the chain calls the column-expression service's changed handler [`:L313-L315`]. So the coupling
