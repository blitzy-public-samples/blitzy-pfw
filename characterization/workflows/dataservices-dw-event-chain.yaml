      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L136-L143"
    - name: event.EVENT_ID_ONDWNLBUTTONCLK
      description: >-
        RAW 6 of 13, declared at [`:L20`]. DELEGATION SHAPE - the longest: semantic clicked event, then a
