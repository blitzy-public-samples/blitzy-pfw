        [`:L126`] and [`:L132`] is only visible when both are recorded.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L130-L134"
    - name: event.EVENT_ID_ONDWNLBUTTONDBLCLK
      description: >-
        RAW 5 of 13, declared at [`:L19`]. DELEGATION SHAPE - semantic double-clicked event first, then
