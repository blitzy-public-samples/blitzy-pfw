# yaml-language-server: $schema=./workflow.schema.json
#
# ==============================================================================
# persistence-thread-task-lifecycle
#
# The golden-master workflow definition for the THREADING SUBSTRATE the SQL task
# layer is built on: thread and task lifecycle, the ordering of the six lifecycle
# callbacks, the veto convention carried by two of them, and the three primitives
# that are deliberately NOT PORTED.
#
# ONE PRECISION ABOUT THOSE SIX, because a reader checking the declarations will
# otherwise think this file has miscounted. FOUR of the six are declared with a long
# return type [ws_objects/pfw.tests.pbl.src/w_test_thread.srw:L29, :L31, :L32, :L34]
# and two carry no return type at all [:L30, :L33]. But only TWO of the four carry the
# DOCUMENTED VETO CONVENTION - the thread-start handler and the task-start handler,
# each of whose own trailing comment records that answering one prevents [:L54, :L71].
# The other two typed handlers answer zero with no documented prevent meaning [:L66,
# :L83]. "Return-valued" and "vetoing" are therefore not the same set here, and the
# capture records them as two different things.
#
# WHY THIS WORKFLOW IS NOT NAMED AFTER THE TRANSACTION POOL, stated first because
# the name is the one thing a reader meets before any evidence.
# `ws_objects/pfw.thread.ext.pbl.src/n_cst_thread_trans_pool.sru` is exercised by NO
# test window anywhere in the repository - a search for `trans_pool` across both
# fixture libraries returns nothing - so naming a workflow after the pool would
# promise a capture that cannot be taken, and a promised capture that cannot be taken
# is worse than an absent one because it reads as coverage. The pool's
# processor-clock-based idle-expiry seam is therefore masked inside the sibling
# `persistence-thread-sqlquery-chunked`, which is the workflow that actually sets the
# transaction descriptor. The oracle HERE is the threading substrate in its own
# right, and the identifier says so.
#
# THE KEY INSIGHT, because every member below is shaped by it. What this pair
# characterizes is an ORDERED EVENT LOG, not a returned value. The oracle window
# subscribes six callbacks onto two threads and two tasks and appends one labelled
# line per callback to a single accumulating text control, so the whole observable
# surface of the substrate is a sequence. That makes exactly one distinction
# load-bearing, and it is asymmetric: the sequence WITHIN one thread and WITHIN one
# task is behaviour and must match position by position, while the interleaving
# BETWEEN independent threads is decided by the operating system's scheduler and is
# not behaviour at all. Masking the wrong one of those two either hides a real
# regression or manufactures a permanent false failure. The mask below draws that
# boundary explicitly rather than leaving it to a reader's judgement.
#
# This is a declarative data file. It contains no code, no test and no executable
# step. It SPECIFIES a paired capture that has NOT been run - see `executionStatus`
# at the foot of the file, whose only legal value says so.
#
# Every legacy path below is cited, never touched. `ws_objects/**` is read-only and
# is the behavioural oracle, and `docs/PB多线程绕坑提示.md` is a read-only legacy
# specification: no fixture and no document is edited, moved, renamed, reformatted,
# re-encoded or copied into this tree, and this file holds no fixture content for
# exactly that reason - a vendored copy is a second master, and a second master
# drifts from the oracle without anybody noticing.
#
# NO TIMING IS ASSERTED ANYWHERE IN THIS FILE, and this is THE workflow most likely
# to tempt one. The fixture declares a platform sleep of its own
# [ws_objects/pfw.tests.pbl.src/w_test_thread.srw:L45], the substrate reads a
# processor clock inside its own wait loop
# [ws_objects/pfw.thread.pbl.src/n_cst_threading.sru:L329], and the worker task's
# body loops on a one-second wait
# [ws_objects/pfw.tests.pbl.src/n_test_thread_task.sru:L36]. None of that is
# recorded as an assertion. ORDERING IS BEHAVIOUR, TIMING IS NOT. No elapsed value,
# no wait duration and no thread count per unit time is recorded or compared, and
# the corollary is easy to miss: A COUNT THAT IS A FUNCTION OF ELAPSED TIME IS A
# TIMING ASSERTION IN DISGUISE, which is why the iteration count has a seam of its
# own in the mask instead of an assertion. The repository publishes no service-level
# agreement, no latency budget, no throughput target and no availability commitment
# to assert one against, and the only quantitative gate in the brief - 80%
# per-service line coverage - is measured in CI from `coverage.cobertura.xml`, never
# from this store.
#
# Conventions this store owns elsewhere are CITED here, never restated:
#   - the shared-volume capture rule ....... characterization/README.md section 2.1
#   - the volume name and its rename ....... characterization/README.md section 2.4
#   - the one exemption, which is not this . characterization/README.md section 2.7
#   - recording-file conventions ........... characterization/README.md section 3.4
#   - the ignored-extension trap ........... characterization/README.md section 3.5
#   - newline normalization ................ characterization/README.md section 3.7
#   - a mask is not a substitute for a seam  characterization/README.md section 5.2
#   - compared, and never compared ......... characterization/README.md section 5.4
#   - no secret value ...................... characterization/README.md section 6.2
#   - no performance measurement ........... characterization/README.md section 6.4
#   - the determinism-seam register ........ docs/PARITY.md section 5.1
#   - why the pool has no workflow of its own characterization/workflows/README.md
#
# There are NO user-specified rules: the project's rules document returns exactly
# one line reporting that none were provided, and it was re-checked while this file
# was written. No rule is invented in its place and nothing in this file exists
# because of one. Enterprise-standard best practice applies instead, and the binding
# constraints are the migration plan's own - C-B, C-C, C-D, C-E, C-F, C-K and C-L,
# each honoured at the point it bites below.
# ==============================================================================

# Quoted: the schema fixes this as the STRING "1". Unquoted it would load as an
# integer and fail validation against the constant.
schemaVersion: "1"

# The pairing key, and the only thing that makes two recordings comparable. It names
# both characterization/recordings/legacy/persistence-thread-task-lifecycle/ and
# characterization/recordings/dotnet/persistence-thread-task-lifecycle/, and it is
# traceable to its oracle window `w_test_thread` with that name's underscores
# rendered as hyphens, which is the derivation the schema prescribes. Never renamed
# once a recording exists under it: a rename orphans both halves of every pair
# already captured, and nothing reports that it happened.
workflowId: persistence-thread-task-lifecycle

title: Thread and task lifecycle event ordering across the caller-side and worker-side marshalling boundary

capabilityArea: >-
  Thread and task lifecycle ordering and the marshalling boundary - the six
  lifecycle callbacks in their subscription order, the veto convention carried by the
  two whose own comments document it, the exit code and last-error string each stop
  callback carries, and the caller-side / worker-side boundary every one of them
  crosses.

# Closed enum. The threading substrate is assigned to Persistence because
# Persistence is the asynchronous substrate's only in-scope consumer: the SQL task
# layer is built on it, and no other in-scope service touches it. No deferred
# capability area is named anywhere in this file, and the enum makes naming one as a
# target structurally impossible rather than merely discouraged.
targetService: Persistence

description: >-
  The golden master for the threading substrate that the SQL task layer sits on top
  of. Its oracle creates two threading hosts in a loop, tags each, subscribes the
  thread-level start and stop callbacks, requests a processor affinity, adds one
  task by its CALLER-SIDE class name, tags the task, and subscribes four
  task-level callbacks - start, stop, notify and a custom one delivering a random
  value. Four buttons then drive the control surface: run, stop, suspend and resume,
  with terminate driven from the window's close event. Every callback appends one
  labelled line to a single accumulating text control, so the observable output of
  the whole substrate is an ORDERED, APPEND-ONLY EVENT LOG rather than a returned
  value - which is why this definition's mask is mostly about ordering and its
  outputs are mostly sequences. This workflow is deliberately NOT named after the
  transaction pool: the pool has no oracle window anywhere in the repository, so a
  workflow named after it would promise a capture nobody can take, and its
  processor-clock idle-expiry seam is masked inside the sibling
  persistence-thread-sqlquery-chunked, which is the workflow that actually sets the
  transaction descriptor. Three things make this pair worth its own identifier
  rather than an appendix to that sibling. First, it is the only capture in the store
  whose subject is the LIFECYCLE ITSELF - the sibling captures one SQL task's
  crossings, this one captures the lifecycle those crossings sit inside. Second, it
  is where the three deliberate non-ports are pinned as documented capability gaps
  rather than silently dropped: the processor affinity request, thread suspend and
  resume, and the message pump with the posted-continuation idiom it enables. Third,
  it carries the two veto alphabets, which are genuinely different and are easy to
  conflate: the caller-side subscription callbacks answer zero to continue and one to
  prevent, while the worker-side task events answer the success code to continue and
  anything else both to prevent AND to become the exit code. The seed phase is empty
  and says why. Ordering is behaviour here; timing is not, and a count derived from
  elapsed time is timing wearing an ordinal's clothes.

