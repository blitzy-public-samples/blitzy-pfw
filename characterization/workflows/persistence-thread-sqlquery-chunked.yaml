# yaml-language-server: $schema=./workflow.schema.json
#
# ==============================================================================
# persistence-thread-sqlquery-chunked
#
# The golden-master workflow definition for the ASYNCHRONOUS SQL query path:
# chunked retrieval, the caller-side / worker-side PROXY PAIR, and the cross-thread
# transfer of DataWindow buffer state.
#
# THE KEY INSIGHT, stated first because every member below is shaped by it. Each
# concurrency class in this capability area exists TWICE - a caller-side
# `n_cst_threading_task_*` half and a worker-side `n_cst_thread_task_*` half - and
# the legacy encodes each half's required execution context in that object's OWN
# export comment on its second line. Six of the SQL classes are annotated as
# running on the worker thread, exactly one on the main thread, and four are
# calling-thread proxies. That duality is a CONTRACT, not an implementation detail.
# This capture therefore records the marshalling boundary AS OBSERVABLE - which
# task ran where, and what crossed between them - rather than flattening the pair
# into a single asynchronous call. A port that collapses the pair passes a naive
# round-trip test and diverges on exactly the cases the boundary exists to handle.
#
# This is a declarative data file. It contains no code, no test and no executable
# step. It SPECIFIES a paired capture that has NOT been run - see `executionStatus`
# at the foot of the file, whose only legal value says so.
#
# Every legacy path below is cited, never touched. `ws_objects/**` is read-only and
# is the behavioural oracle: no fixture is edited, moved, renamed, reformatted,
# re-encoded or copied into this tree, and this file holds no fixture content for
# exactly that reason - a vendored copy is a second master, and a second master
# drifts.
#
# NO TIMING IS ASSERTED ANYWHERE IN THIS FILE. This workflow is asynchronous, which
# is precisely what makes a timing assertion tempting, and it is forbidden:
# COMPLETION ORDERING IS BEHAVIOUR, COMPLETION TIMING IS NOT. No elapsed value, no
# wait duration and no row rate is recorded or compared. The repository publishes no
# service-level agreement, no latency budget, no throughput target and no
# availability commitment to assert one against, and the only quantitative gate in
# the brief - 80% per-service line coverage - is measured in CI from
# `coverage.cobertura.xml`, never from this store.
#
# Conventions this store owns elsewhere are CITED here, never restated:
#   - the shared-volume capture rule ....... characterization/README.md section 2.1
#   - recording-file conventions ........... characterization/README.md section 3.4
#   - the ignored-extension trap ........... characterization/README.md section 3.5
#   - newline normalization ................ characterization/README.md section 3.7
#   - what must never be recorded .......... characterization/README.md section 6.2
#   - the determinism-seam register ........ docs/PARITY.md section 5.1
#   - the four cross-thread defects ........ docs/PARITY.md section 7.5
#   - the C-05 query contract .............. docs/CONTRACTS.md section 8
#
# There are NO user-specified rules: the project's rules document returns exactly
# one line reporting that none were provided. No rule is invented in its place and
# nothing in this file exists because of one. Enterprise-standard best practice
# applies instead, and the binding constraints are the migration plan's own -
# C-B, C-C, C-E, C-F, C-K and C-L, each honoured at the point it bites below.
# ==============================================================================

# Quoted: the schema fixes this as the STRING "1". Unquoted it would load as an
# integer and fail validation against the constant.
schemaVersion: "1"

# The pairing key, and the only thing that makes two recordings comparable. It
# names both
# characterization/recordings/legacy/persistence-thread-sqlquery-chunked/ and
# characterization/recordings/dotnet/persistence-thread-sqlquery-chunked/, and it
# is traceable to its oracle window `w_test_thread_sqlquery` with that name's
# underscores rendered as hyphens, which is the derivation the schema prescribes.
# Never renamed once a recording exists under it: a rename orphans both halves of
# every pair already captured, and nothing reports that it happened.
workflowId: persistence-thread-sqlquery-chunked

title: Asynchronous chunked SQL retrieval and cross-thread DataWindow buffer transfer

capabilityArea: >-
  Asynchronous chunked retrieval and cross-thread buffer transfer - the query task
  proxy pair, the chunked changeset and full-state transfer styles, and the paging
  triple the caller-side proxy reports.

# Closed enum. Persistence is the only service that generates or executes SQL and
# the only one holding a storage provider, so it is the only legal candidate for
# this workflow's target half.
targetService: Persistence

description: >-
  The golden master for the asynchronous SQL query path. Its oracle is the
  framework's own threaded-query test window, which creates a threading host,
  registers one query task by CLASS NAME, subscribes to that task's start and stop
  events, dispatches it, and - in its stop handler - moves the finished result out
  of the task's caller-side carrier and into a DataWindow. Four things make this
  workflow worth a pair of its own rather than an appendix to the retrieve triple.
  First, the marshalling boundary is real and observable: the worker half calls
  back into its caller-side proxy for every notification and for every chunk, and
  the legacy annotates the required execution context of each half in the object's
  own export comment. Second, the transfer has TWO STYLES that are not
  interchangeable optimizations - a chunked changeset style and a whole-state
  style, selected by the DataWindow's processing mode - and they differ in what
  they carry, in what must be synchronized first, and in which defects they
  exhibit. Third, this is the workflow that carries the transaction descriptor, so
  it is the workflow whose mask owns the transaction pool's clock seam. Fourth,
  the four documented cross-thread transfer defects all live on this path, and
  proving they SURVIVED is the reason this pair exists. The seed phase is declared
  separately from the capture phase because the oracle's own storage setup is
  destructive, and re-running it to start clean between the two halves of a pair is
  exactly the reseed the capture rule forbids. The seed therefore runs once; the
  capture phase is what runs twice. This workflow characterizes SQLite and nothing
  else - no other engine is provisioned, required or reachable - and it does not
  characterize the byte-exact paging rewrites, which are pure string transforms
  owned by the sibling workflow persistence-sql-paging-rewrite.

