# yaml-language-server: $schema=./workflow.schema.json
#
# PowerFramework characterization workflow definition
# ---------------------------------------------------
# Capability: the SELECT-statement clause model - parse, the six clause accessors, the six
# clause modifiers, and re-rendering the whole statement.
#
# This file DECLARES one paired golden-master capture. It contains no code, no expectation
# value and no recording: it states what is captured, from which read-only legacy oracle,
# under which mask, and which legacy behaviours the pair exists to prove survived.
#
# It conforms to ./workflow.schema.json - draft 2020-12, additionalProperties false, closed
# enums - and that schema is the authority on shape. characterization/README.md is the
# authority on the store-wide conventions this file obeys and deliberately does not
# restate: the capture rule's canonical text (section 2.1), the recording-file conventions
# (section 3.4), the newline-normalization convention (section 3.7), the determinism-seam
# register (section 5.1), and what must never enter a recording (section 6).
#
# Two optional schema members are deliberately absent. blockedBehaviours is absent because
# nothing in this capability is blocked: the single gap this workflow carries is an
# ORACLE-COVERAGE gap that candidate-side unit tests already cover, which is a different
# thing and is recorded as such under provesDefects. deferredCapabilities is absent because
# no half of this capability is deferred - the clause model is entirely headless string
# transformation and has no presentation half to leave behind.

schemaVersion: "1"

workflowId: persistence-sqlparser-clause-model

title: >-
  SELECT-statement clause model - parse, six clause accessors, six clause modifiers and
  full statement re-render, compared byte-exactly

capabilityArea: >-
  The six-clause SELECT statement model owned by Persistence: parse of a statement into
  select blocks, the column, table, where, group-by, having and order-by clause accessors,
  the six matching clause modifiers driven by a modification style, and re-render of the
  whole statement. The acceptance criterion for the capability is byte-exact clause-level
  string output - every clause string and every re-rendered statement must agree character
  for character, whitespace included.

targetService: Persistence

description: >-
  Why this pair exists. The clause model is reimplemented in-repo rather than delegated to
  a package, and the reason is recorded so the choice is auditable: no BCL SQL parser
  exists, and the one obvious managed candidate is dialect-specific and therefore cannot
  serve the second paging dialect at all. A reimplementation whose acceptance criterion is
  byte-exact clause-level output needs evidence that it matches, and this definition is
  that evidence. It is also the specific gap docs/PARITY.md section 6.2 names: the paging
  matrix already in the tree transcribes its expectations from a run of the target
  rewriters rather than deriving them from the legacy generator, because the legacy
  statement model is a closed native binary with no source in this repository - so that
  suite detects drift in the target and cannot certify agreement with the oracle. Closing
  that gap needs a legacy-side capture, which is what this workflow specifies.

  The storage position, stated carefully because the distinction matters. The shared-volume
  capture rule APPLIES to this workflow - sharedVolume.applies is true - because the oracle
  is a window inside the same PowerBuilder oracle application whose state both halves of
  the pair share. It is recorded here, as a clarification and not as an exemption, that the
  parse and clause-manipulation behaviour ITSELF touches no database and needs no schema of
  any dialect: the oracle window opens no connection, declares no transaction object,
  creates no datastore, retrieves nothing and commits nothing, and its only inputs are
  statement text and replacement clause text typed into two editor controls. The one
  exemption characterization/README.md section 2.7 records belongs to the sibling paging
  workflow, which has no oracle window at all. This workflow claims no exemption and is
  captured under the rule in full.

  The timing position. This is the one workflow in the store where the ORACLE ITSELF emits
  a timing value: the parse handlers render an elapsed-millisecond figure beside the select
  count. It is recorded with maskedAsNonBehavioural set to true and masked out of the
  comparison on both sides, so that it is visibly present-but-not-asserted rather than
  quietly dropped, while the select count standing beside it in the same line IS compared.
  No timing value is an assertion anywhere in this definition. The repository publishes no
  service-level agreement, no latency budget, no throughput target and no availability
  commitment, so there is nothing to assert one against; the only quantitative gate in the
  brief is the 80 per cent per-service line-coverage floor, and it is measured in CI from
  coverage.cobertura.xml, never from this store.

  The redaction position. The statements this capture records are the fixture's own literal
  test inputs - a bare select against a dummy table and a bracketed placeholder clause -
  so they are neither credentials nor interpolated user data and are recorded as they
  stand. The contingency is nevertheless declared under capturePhase.redaction rather than
  left to judgement: if a captured statement ever carries an interpolated literal that
  could be sensitive, the treatment for this workflow's own recorded statement fields is
  split-statement-and-parameters. That decision is scoped to this recording and does not
  reach the published database-error payload's statement field, which
  characterization/README.md section 6.2 rules is carried as one redacted field with
  nothing beside it. No key, password, certificate, token or fragment of one appears
  anywhere in this definition or in any recording taken under it.

