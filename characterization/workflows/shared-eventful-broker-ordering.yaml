# yaml-language-server: $schema=./workflow.schema.json
# ==================================================================================================
#  shared-eventful-broker-ordering - THE EVENT BROKER ITSELF
#  ------------------------------------------------------------------------------------------------
#  WHAT THIS DEFINITION IS FOR, AND HOW IT DIFFERS FROM ITS NEAREST SIBLING
#  `dataservices-dw-event-chain` characterizes the broker AS USED - twelve topics reached through a
#  22-event surface, where every dispatch arrives already shaped by the DataWindow service class that
#  owns them. THIS definition characterizes the broker ITSELF: the subscription table, the order
#  handlers are invoked in, the way a single opaque subscription string is taken apart into separate
#  stored fields, how "processed" is decided, and the THREE-VALUED veto. The sibling records the
#  EFFECTS of these mechanics inside one consumer; this pair pins the mechanics.
#
#  THIS FILE SPECIFIES A CAPTURE. IT CONTAINS NO CODE AND NO CAPTURED VALUE.
#  It conforms to `./workflow.schema.json`, which is authoritative for shape. Store-wide conventions
#  - the capture rule's canonical text, the recording-file conventions, the seam register, the defect
#  roster and what must never enter a recording - belong to `../README.md` and to `../../docs/PARITY.md`
#  and are CITED here, never restated. A fourth copy of a rule three files already own word for word
#  is a fourth thing to drift.
#
#  ORDER, NEVER SPEED (C-B, and `../README.md` section 6.4)
#  This workflow is about ORDER, and only about order. It records no elapsed value, no dispatch rate
#  and no count-per-unit-time, and it asserts no timing anywhere. That discipline needs stating twice
#  here rather than once, because THE ORACLE ITSELF OFFERS A TIMING TEMPTATION: the fixture's own
#  grammar note at `ws_objects/pfw.tests.pbl.src/w_test_eventful.srw:L238` records that subscriptions
#  are held in ascending name order and remarks that a short name improves lookup and dispatch
#  performance. THE SORT IS BEHAVIOUR AND IS CAPTURED. THE PERFORMANCE REMARK IS NOT, AND NOTHING
#  BELOW MEASURES IT. The repository publishes no service-level agreement, no latency budget, no
#  throughput target and no availability commitment, so there is nothing a timing assertion could be
#  measured against. The only quantitative gate in the brief is 80% per-service line coverage, read
#  from `coverage.cobertura.xml` in CI - not from this store.
#
#  ---- THE VETO IS THREE-VALUED. IT IS NEVER A BOOLEAN. -------------------------------------------
#  `PREVENT_ONCE` is 1, `PREVENT_DEEP` is 2, and continue is the third state, carried as 0 in the
#  broker's own prevention field. The two named values are declared at
#  `ws_objects/pfw.utility.invoker.pbl.src/n_cst_eventful.sru:L111-L112`, selected at `:L1295` and
#  `:L1297`, enforced at `:L822`, and - the part a boolean cannot express - UNWOUND DIFFERENTLY at
#  `:L954-L957`, where a once-prevention is cleared as the dispatch returns while a deep prevention
#  SURVIVES for as long as the nesting depth stays above zero. Flatten the three values to a boolean
#  and a deep prevention silently becomes a shallow one: the enclosing dispatch resumes handlers the
#  legacy would never have reached, and every one of them looks like a correct invocation. The trap is
#  live rather than theoretical - eight inline comments in the consuming service class read
#  `0:continue,1:prevent` and suggest a two-valued convention, one of them at
#  `ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L46`. Cross-reference
#  `dataservices-dw-event-chain`, which cites this same object precisely because its own comments
#  cannot be trusted on this point.
#
#  ---- ONE LOCATOR CORRECTED AGAINST THE SOURCE ---------------------------------------------------
#  The edit-changed topic's ordering prefix is declared at
#  `ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L57`, NOT at `:L58` - `:L58` is the
#  comment introducing the clicked topic. Defect D-07 below carries the corrected locator. Every
#  locator in this file was read line by line in the source rather than copied forward, and the
#  fixture window was confirmed to be 402 lines with every citation inside that range.
#
#  ---- WHAT THIS DEFINITION DELIBERATELY OMITS, AND WHY ------------------------------------------
#    * `blockedBehaviours` - OMITTED because this workflow blocks nothing. The broker is pure legacy
#      script with no native binding anywhere in it, so there is no closed binary to characterize
#      around: every mechanic below is readable in the source and reproducible from it. The store's
#      two blocked cases both belong to siblings. Said here so the member's absence is not read as an
#      oversight.
#    * `deferredCapabilities` - OMITTED, and the omission is load-bearing rather than incidental. The
#      broker's library is SPLIT: the broker object is in scope as a shared library, while the
#      dynamic-invocation objects beside it in the same library do not ship in this phase. That is a
#      fact about the LIBRARY, not a missing half of THIS capability - the broker's own behaviour
#      ships complete - so recording it as a deferred capability would misdescribe it, and the
#      schema's member for it can only name one of the four capability areas that receive no code at
#      all. `../../docs/DEFERRED.md` owns those destinations and this definition makes no claim about
#      them. D-07's note carries the split-library fact instead, since D-07 is the one defect proved
#      from a library other than the broker's own and is therefore where a reader is already asking
#      which library owns what.
#    * `redaction` - OMITTED because nothing this capture records is sensitive. Every value that
#      reaches a recording is the fixture's own literal test data - two small integer pairs, a short
#      greeting string, and two Chinese status words - and the broker reads no configuration, opens no
#      connection and issues no statement. NO KEY, NO PASSWORD, NO CERTIFICATE, NO TOKEN AND NO
#      CONNECTION STRING IS READ, EMITTED OR RECORDED HERE (C-F).
#
#  ---- GOVERNING CONSTRAINTS ---------------------------------------------------------------------
#  NO USER-SPECIFIED RULES EXIST. The project's rules document returns exactly one line reporting
#  that none were provided, so no rule is invented, inferred or back-filled, and nothing in this file
#  exists because of one. Enterprise-standard best practice applies in their place. The binding
#  constraints are the migration plan's own: C-B (defects reproduced, never corrected - a corrected
#  capture is a parity FAILURE), C-C (the legacy tree is read-only and is the oracle; every claim
#  carries a locator), C-D (nothing for a capability area that receives no code this phase), C-F (no
#  secret value), C-K (every decision carries its reason) and C-L (the shared-volume capture rule).
# ==================================================================================================

schemaVersion: "1"

workflowId: "shared-eventful-broker-ordering"

title: "Event broker: subscription ordering, the decomposed topic identity, and the tri-valued veto"

capabilityArea: >-
  The event broker `n_cst_eventful` in its own right - the ordered subscription table and the lexical
  name sort it is held in; the single opaque subscription string and the five encodings it fuses;
  priority bands, the head-versus-tail insertion tie-break and the insertion-order tie within a band;
  the three capture modes and the processed-state determination that drives them; the retrievable
  return value and the overriding rule; nested dispatch and its own depth-scoped state; the
  TRI-VALUED veto and its two different unwind behaviours; the argument-passing contract with its
  surplus and missing cases; the unsubscribe and disable grammar, which is a smaller grammar than the
  subscribe one; and the exception capture that rewrites a handler's failure into a four-field block.

targetService: "Shared.Eventful"

description: >-
  ONE BROKER, EXERCISED DIRECTLY, CAPTURED TWICE. The pair proves that the order in which subscribed
  handlers are invoked, the value each returns, the value the dispatch finally returns, and the
  surviving subscription set after every mutation are identical on the legacy master and on the .NET
  candidate after identical masking.


  HOW THIS DIFFERS FROM `dataservices-dw-event-chain`, STATED FIRST BECAUSE THE TWO ARE EASY TO
  CONFUSE. That sibling drives the broker through a consumer: twelve fixed topic constants, one
  subscriber per topic, and a dispatch order fixed by the service class rather than chosen by the
  capture. It therefore cannot vary a priority, cannot exercise a capture mode the consumer never
  uses, and cannot observe what happens when two subscriptions contend for one position. THIS
  workflow drives the broker's own public surface from the fixture window, so priority, capture mode,
  namespace, insertion side, argument count and veto value are all inputs the capture varies
  deliberately. The two definitions therefore prove different things about the same object and are
  both required: neither subsumes the other, and each stays independently comparable under its own
  identifier.


  THE BROKER IS A SHARED LIBRARY, AND TWO INDEPENDENT PROOFS SAY SO. It is an instance member of the
  DataWindow service class - `ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L6-L7` nests
  the type and `:L33` declares the instance - and it is INHERITED by a threading class,
  `ws_objects/pfw.thread.pbl.src/n_cst_threading_eventful.sru:L4,L10` deriving from it directly. One
  consumer could be refactored away; an inheritance edge and a member declaration in two different
  libraries cannot both be, which is why the broker is a shared library rather than a member of
  either consumer.


  THE BROKER'S LIBRARY IS A SPLIT LIBRARY, AND THIS WORKFLOW CHARACTERIZES ONLY THE BROKER. The
  broker object is in scope as a shared library; the dynamic-invocation objects that sit beside it in
  the same legacy library receive no code, no test and no container in this phase. The boundary is
  visible inside the broker's own subscription record, whose `invoker` field at
  `ws_objects/pfw.utility.invoker.pbl.src/n_cst_eventful.sru:L21` is typed as one of those objects -
  so this definition cites that TYPE as the mechanism the broker calls a handler through, and records
  nothing about the object's own behaviour. NO ORACLE FIXTURE, NO PRECONDITION, NO OBSERVED OUTPUT, NO
  MASK ENTRY AND NO DEFECT BELOW TARGETS A CAPABILITY AREA THAT DOES NOT SHIP IN THIS PHASE (C-D).


  THE TOPIC IDENTITY IS FUSED IN THE API AND ALREADY DECOMPOSED IN THE IMPLEMENTATION, WHICH IS WHY
  THE CONTRACT DECOMPOSES IT TOO (C-K). A subscription is created from ONE string that fuses three
  independent encodings the wire contract must carry apart - a lexical ordering prefix, the logical
  name, and a lifetime-or-namespace suffix - so the contract carries `sequence`, `name` and
  `lifetime` as three separate fields and reconstitutes the fused legacy spelling only at the
  compatibility edge. The evidence for that decision is not an argument from taste: THE BROKER
  ALREADY DOES IT INTERNALLY. Its subscription record at `:L12-L25` stores `ns`, `name`, `capture` and
  `priority` as four separate fields, and the parse at `:L334-L381` is what fills them. Only the
  public surface is fused. The capture therefore records BOTH the fused legacy string AND the
  decomposed fields on every subscription, so reconstitution is verifiable in both directions - which
  matters because a wrong reconstitution does not raise: a trigger whose name does not match a stored
  name exactly falls through to the default return value at `:L797-L798`, silently, and reads as an
  event nobody subscribed to.


  NO VALUE RECORDED HERE IS SENSITIVE. Every captured value originates in the read-only fixture's own
  literals; nothing is read from a credential, a key store, a configuration file or a connection
  string (C-F).

