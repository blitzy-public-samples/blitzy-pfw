# yaml-language-server: $schema=./workflow.schema.json
# ==================================================================================================
#  dataservices-dwsvc-rowselect - THE ROW-SELECTION STATE MACHINE
#  ------------------------------------------------------------------------------------------------
#  THIS FILE SPECIFIES A CAPTURE. IT CONTAINS NO CODE AND NO CAPTURED VALUE.
#  It conforms to `./workflow.schema.json`, which is authoritative for shape. Store-wide conventions
#  - the capture rule's canonical text, the recording-file conventions, the seam register, the defect
#  roster and what must never enter a recording - belong to `../README.md` and to `../../docs/PARITY.md`
#  and are CITED here, never restated. A fourth copy of a rule three files already own word for word is
#  a fourth thing to drift.
#
#  ---- THIS SERVICE SHIPS WHOLE. THAT IS WHAT SEPARATES THIS WORKFLOW FROM ITS THREE SIBLINGS -----
#  Of the five DataWindow sub-services, THREE are irreducibly presentational and ship only as a
#  headless half: the drop-down search service positions a window and reads its rectangle, the
#  context-menu service converts device units and measures a font and exposes a popup-menu-typed
#  submenu surface, and the column-sort service converts units to place a sort indicator. The closure
#  analysis counted MANY presentation references in each of those three. It counted EXACTLY ONE in
#  this service - the dialog at `n_cst_dwsvc_rowselect.sru:L239` - and a dialog is not a rendering
#  dependency, it is a DELIVERY CHANNEL. Replacing it with a structured error result preserves the
#  message text, the localization category, the substitution argument and the severity, and leaves no
#  residue behind. So the row-selection state machine ships COMPLETE: its state, its transitions, its
#  style bits, its guard chain and its one error path are all headless. NOTHING IS SPLIT OFF AND
#  NOTHING IS DEFERRED, which is why the deferred-capability member is absent below - see the note at
#  the foot of this file, where the absence is recorded as a FINDING rather than left to read as an
#  oversight (C-D).
#
#  ---- STATE AND ORDER, NEVER SPEED (C-B, and `../README.md` section 6.4) ------------------------
#  Selection is a state machine. What this pair compares is WHICH ROWS ARE SELECTED, IN WHAT ORDER,
#  which row holds focus, and which events fired with which returns. It records no elapsed value and
#  asserts no timing. The repository publishes no service-level agreement, no latency budget, no
#  throughput target and no availability commitment, so there is nothing a timing assertion could be
#  measured against; `../README.md` section 5.4 states the same position as "never compared: execution
#  time". The only quantitative gate in the brief is 80% per-service line coverage, and it is read from
#  `coverage.cobertura.xml` in CI - not from this store.
#
#  ---- THE SEED SHAPE IS DIFFERENT FROM THE PERSISTENCE WORKFLOWS' ------------------------------
#  Those workflows seed a database, and the oracle's own setup deletes the file and recreates the
#  schema first - precisely the destructive reseed the capture rule forbids between the two halves of a
#  pair. THIS workflow seeds nothing of the kind. Its nine rows are declared INLINE IN THE READ-ONLY
#  DATAWINDOW DEFINITION ITSELF, at `dw_svc_sample.srd:L15`, so there is NO FILE DELETE, NO DDL, NO
#  INSERT AND NO CONNECTION anywhere in its seed phase. Binding the definition IS the seed.
#
#  ---- WHY THE HOST WINDOW ALONE WOULD UNDER-SPECIFY THIS CAPTURE --------------------------------
#  `w_test_dwsvc_rowselect.srw` is FIFTY-FOUR LINES and contains three statements of substance: it
#  binds the definition, enables the service, and sets the style. Every transition this pair compares
#  lives in the 288-line service object, and the event gate that suppresses one of them lives in the
#  616-line service class. Citing the window alone would name the driver and omit the behaviour, so
#  all three are cited below with locators (C-C).
#
#  ---- TWO FINDINGS READ OFF THE SOURCE, NOT COPIED FORWARD --------------------------------------
#  Both change what a correct capture records, so both are stated here rather than discovered during
#  implementation:
#    * THE STYLE IS SUMMED BUT EVERY GUARD COMPARES IT WHOLE. `:L42` of the window sets the style to
#      the arithmetic SUM of the two constants, and the fixture's own header comment at `:L34-L38`
#      confirms the styles are combinable. Yet every guard in the service tests the composite with an
#      EQUALITY or an INEQUALITY against a bare constant - never with a bit test. Defect D-01 records
#      the consequence, which is observable and is not what a reader of the constants would predict.
#    * THE DIALOG PATH IS GUARD-BLOCKED BY THIS FIXTURE. The batch-toggle guard chain probes for a
#      checkbox edit style at `:L195`, and `dw_svc_sample.srd` declares NO checkbox column - only
#      edit-mask, drop-down-DataWindow and drop-down-list-box styles. The chain therefore exits at
#      `:L195` and the dialog at `:L239` is not reached from this fixture as bound. That is captured
#      as the guard chain's EXIT POINT, and the dialog's own payload shape is captured separately
#      under the precondition that supplies a checkbox column. Recording an unreachable dialog as
#      though it fired would be a fabricated capture; recording nothing at all would leave the one
#      error path in this service unproven.
#
#  ---- WHAT THIS DEFINITION DELIBERATELY OMITS, AND WHY -----------------------------------------
#    * `deferredCapabilities` - OMITTED, and the omission is the finding. See the note at the foot of
#      this file and the ships-whole reasoning above (C-D).
#    * `blockedBehaviours` - OMITTED because this workflow blocks nothing. The store's two blocked
#      cases belong to siblings: pinyin first-letter matching to the drop-down search definition and
#      cross-session foreign expression variables to `dataservices-dwsvc-columnexp`. Neither is
#      reachable from the row-selection state machine, and claiming either would misattribute a known
#      gap to a workflow that does not have one.
#    * `redaction` - OMITTED because nothing this capture records is sensitive. Every data value that
#      reaches a recording originates in the read-only fixture's own inline rows - three two-place
#      decimals and three status codes per row - and the one path that surfaces a value in a message
#      is the rejected-edit path, whose substitution argument is a ROW NUMBER. NO KEY, NO PASSWORD, NO
#      CERTIFICATE, NO TOKEN AND NO CONNECTION STRING IS READ, EMITTED OR RECORDED HERE (C-F). This
#      service issues no SQL, so the redacted-statement rule has no field to act on.
#    * `connectionUri` - OMITTED. This workflow opens no storage; its rows arrive with the definition.
#
#  ---- GOVERNING CONSTRAINTS -------------------------------------------------------------------
#  NO USER-SPECIFIED RULES EXIST. The project's rules document returns exactly one line reporting that
#  none were provided, so no rule is invented, inferred or back-filled, and nothing in this file exists
#  because of one. Enterprise-standard best practice applies in their place. The binding constraints
#  are the migration plan's own: C-B (defects reproduced, never corrected - a corrected capture is a
#  parity FAILURE), C-C (the legacy tree is read-only and is the oracle; every claim carries a
#  locator), C-D (nothing for a deferred capability area), C-F (no secret value), C-K (every decision
#  carries its reason) and C-L (the shared-volume capture rule).
# ==================================================================================================

schemaVersion: "1"

workflowId: dataservices-dwsvc-rowselect

title: >-
  Row-selection state machine: the summed style bitmask, the modifier-driven transitions, the ordered
  selection set, and the one error path

capabilityArea: >-
  The row-selection state machine of the DataWindow sub-service `n_cst_dwsvc_rowselect` - its two
  combinable style constants and the composite value the oracle window actually sets, the four events
  it binds, the three transition arms a left click dispatches into, the range and toggle behaviours the
  two modifier keys select, the two private state fields that survive between events, the ordered
  batch-toggle guard chain and its single rejected-edit error path, and the coupling by which the
  service class's row-focus event gate suppresses the selection maintenance this service performs.

targetService: DataServices

description: >-
  ONE STATE MACHINE, CAPTURED TWICE. The pair proves that the set of selected rows, THE ORDER IN WHICH
  THOSE ROWS ENTERED THE SET, the row holding focus, the composite style value in force, the events
  emitted into the chain with their numeric returns, and the structured error where the one error path
  is taken are identical on the legacy master and on the .NET candidate after identical masking.


  THIS SERVICE SHIPS WHOLE, AND THAT IS THE FINDING THAT DISTINGUISHES THIS WORKFLOW FROM ITS THREE
  SIBLING SERVICE WORKFLOWS. The closure analysis counted MANY presentation references in each of the
  drop-down search, context-menu and column-sort services - window positioning and rectangle reads,
  device-unit conversion, font measurement, a popup-menu-typed submenu surface - and each of those
  three therefore ships as a headless half with its rendering half deferred and named as a reserved
  gateway extension point. It counted EXACTLY ONE in this service: the dialog at
  `ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_rowselect.sru:L239`. A dialog is a DELIVERY
  CHANNEL, not a rendering dependency. Replacing it with a structured error result that preserves the
  message text, the localization category, the one substitution argument and the severity leaves no
  residue, so the state machine ships COMPLETE - state, transitions, style bits, guard chain and error
  path all headless. THAT IS WHY THIS DEFINITION DECLARES NO DEFERRED CAPABILITY: there is no split to
  record, and the member's absence is a finding rather than an oversight (C-D).


  THE SEED SHAPE IS GENUINELY DIFFERENT FROM THE PERSISTENCE WORKFLOWS'. The nine rows this capture
  starts from are declared INLINE IN THE READ-ONLY DATAWINDOW DEFINITION at
  `ws_objects/pfw.tests.pbl.src/dw_svc_sample.srd:L15`, so the seed phase performs NO FILE DELETE, NO
  SCHEMA CREATION, NO ROW INSERT AND NO CONNECTION. Binding the definition is the seed. The two seed
  assertions below are nonetheless both true and both required: the binding happens once per pair, and
  nothing in the seed phase runs between the two captures.


  THIS WORKFLOW RUNS INSIDE THE EVENT CHAIN, IT DOES NOT RESTATE IT. `dataservices-dw-event-chain`
  owns the 22-event surface, the composable event gate and the ordering discipline assigned per
  capability area. This service observes the world through that surface: its click handler is
  subscribed to the chain's clicked topic, its double-click handler to the double-clicked topic, and
  its row-focus handler to the row-focus-changed topic, all at
  `n_cst_dwsvc_rowselect.sru:L274-L276`; and its filtered event is reached from the chain's filter
  override. This definition therefore CROSS-REFERENCES the chain for the ordering contract instead of
  re-deriving it, and records only what the state machine itself does with what the chain delivers.


  NO DATA VALUE RECORDED HERE IS SENSITIVE. Every captured value originates in the read-only fixture's
  own inline rows - three two-place decimals and three status codes per row - and the single message
  path substitutes a ROW NUMBER and nothing else. Nothing is read from a credential, a key store or a
  connection string, and no such value is emitted or recorded (C-F).

