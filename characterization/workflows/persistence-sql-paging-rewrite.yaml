# yaml-language-server: $schema=./workflow.schema.json
#
# PowerFramework characterization workflow definition
# ---------------------------------------------------
# Capability: the two dialect paging rewrites - the SQL Server family and the Oracle form -
# together with the row-count wrapper that stands beside them, all of them PURE STRING
# TRANSFORMS: a statement plus a page size and a page index in, statement text out.
#
# This file DECLARES one paired golden-master capture. It contains no code, no expectation
# value and no recording: it states what is captured, from which read-only legacy oracle,
# under which mask, and which legacy behaviours the pair exists to prove survived.
#
# It conforms to ./workflow.schema.json - draft 2020-12, additionalProperties false, closed
# enums - and that schema is the authority on shape. characterization/README.md is the
# authority on the store-wide conventions this file obeys and deliberately does not
# restate: the capture rule's canonical text (section 2.1), THE ONE EXEMPTION and why it is
# not a loophole (section 2.7), the recording-file conventions (section 3.4), the extension
# trap (section 3.5), the newline-normalization convention (section 3.7), the
# determinism-seam register (section 5.1), the defect roster (section 5.3), what is compared
# and what is never compared (section 5.4), and what must never enter a recording
# (section 6).
#
# THIS IS THE ONE EXEMPT WORKFLOW IN THE STORE, and the exemption is the reason it is a
# separate definition rather than a section of its sibling. It is claimed explicitly in the
# sharedVolume member at the foot of this file, never inferred from silence: the schema makes
# exemptionReason mandatory whenever applies is false precisely so that it cannot be.
#
# One discipline note, because this file has to hold two things at once. The store's rule is
# that definitions carry LOCATORS, never values. The sentinel identifiers below are the
# single deliberate exception, and they are not an exception to the spirit of it: an
# identifier that must survive a rewrite character for character is part of the CONTRACT
# rather than an expected result, and the reviewer's checklist is useless if the thing being
# checked off is not spelled out. Everything that genuinely is a result - every generated
# statement, every error message text, every returned code - is cited by locator and is
# never reproduced here.
#
# Two optional schema members are deliberately absent, and each absence is a decision.
# blockedBehaviours is absent because nothing in this capability is BLOCKED: there is no
# missing evidence to go and find. The generators are pure PowerScript, they are present in
# full in the read-only tree, and the two gaps this workflow carries are ORACLE-COVERAGE
# gaps - inputs the legacy authors never exercised - which is a different thing and is
# recorded as such under provesDefects, exactly as the sibling clause-model workflow records
# its own never-exercised modification style. deferredCapabilities is absent for a harder
# reason: no half of this capability is deferred, since a string transform has no
# presentation half to leave behind, and the member's own two enums are the four deferred
# capability-area names, so using it at all would write one of those names into a definition
# that has no business naming any of them.

schemaVersion: "1"

workflowId: persistence-sql-paging-rewrite

title: >-
  Dialect paging rewrites and the row-count wrapper - three SQL Server strategies, the
  Oracle nested form, the not-implemented arm, and byte-exact generated SQL

capabilityArea: >-
  The dialect paging rewrites owned by Persistence, characterized as PURE STRING TRANSFORMS:
  the dispatch on database type, the three SQL Server paging strategies, the single Oracle
  triple-nested row-number form, the empty-order-by substitution each of them applies when
  the input statement carries no ordering, the not-implemented arm the dispatch reserves for
  any other database type, and the row-count wrapper that reduces the same statement to a
  single aliased projected column. Input is a statement plus a page size and a page index;
  output is statement text. Nothing is read and nothing is written. The acceptance criterion
  for the capability is BYTE-EXACT generated SQL - every emitted statement must agree
  character for character, whitespace included, and every sentinel identifier must survive
  spelled exactly as the legacy spells it.

targetService: Persistence

description: >-
  Why this pair exists. The two dialect rewriters are reimplemented in-repo as a focused
  clause-level model rather than delegated to a package, and this definition is the evidence
  that the reimplementation matches. The rewriters are the one place in Persistence where
  the entire observable contract IS a string: there is no rowset to compare, no buffer state
  and no return payload beyond a code, so if the generated text is not compared character
  for character then nothing about these behaviours is compared at all. That is why the
  criterion is byte-exact rather than semantic, and why a "cleaner" statement that a
  database would execute identically is still a parity failure.

  The storage position, which is what makes this definition unusual and is stated first
  because everything else in it follows from it. THE SHARED-VOLUME CAPTURE RULE DOES NOT
  APPLY TO THIS WORKFLOW. sharedVolume.applies is false and sharedVolume.exemptionReason
  carries the reason in full; characterization/README.md section 2.7 is the authority for the
  exemption and section 2.1 is the authority for the rule being exempted from, and both are
  cited rather than restated because three upstream files already carry that rule's text word
  for word and a fourth copy would be a fourth thing to drift. This is the ONLY exempt
  workflow of the fifteen in the roster. The exemption is narrow and it is not a loophole: it
  holds only while the workflow reads and writes nothing, and the moment any part of it
  touched the persistence volume the rule would govern it in full.

  The no-database position, stated as a prohibition rather than as an observation. Neither
  SQL Server nor Oracle has a schema, a connection string or any DDL anywhere in this
  repository - only two dialect constants and two statement generators exist - and NO
  INSTANCE OF EITHER DIALECT IS PROVISIONED, REQUIRED OR REACHABLE, here or anywhere in this
  refactor, and none may be. Standing one up in order to "really test" a rewriter would
  fabricate a database that the repository has no evidence for, which is forbidden outright,
  and it would not improve the comparison by a single byte: the transform is complete before
  any statement is sent, so a captured statement is the whole of the observable behaviour.
  Nothing in this definition or in any recording taken under it carries a connection string,
  a server or service name, a data-source name or a credentialed URI for either dialect, and
  the seed phase is empty for the same reason the exemption holds.

  The oracle position, which is the second unusual thing about this definition. NO ORACLE
  WINDOW DRIVES THIS BEHAVIOUR. No window in the 47-window corpus exercises the paging
  rewrites end to end, so every fixture below carries the specification role rather than
  oracle-window: the objects are read as the authoritative statement of intended behaviour,
  not executed by a fixture. The evidence is unusually direct. The one window that carries
  the paging setter surface has all three of its paging calls COMMENTED OUT, and a
  repository-wide search finds no live call to any paging setter anywhere in the legacy tree
  - the only other references are the caller-side proxy forwarders, which forward and drive
  nothing. Two of the setters, the native-implementation flag and the unique-index column
  list, are not referenced even in commented form, and those two are precisely the inputs
  that select among the three SQL Server strategies. The legacy master side of this pair is
  therefore produced by exercising the legacy generators DIRECTLY through the public
  caller-side setter surface the read-only tree already exposes, driven from a harness that
  lives outside the legacy tree - never by driving a window, and never by editing the legacy
  tree to create one. The commented-out calls stay commented out.

  The timing position. A pure string transform is exactly the sort of behaviour that invites
  a throughput claim, and this definition records none. NO TIMING VALUE IS AN ASSERTION
  ANYWHERE IN IT, no elapsed, duration, latency or throughput figure is recorded as a result,
  and unlike the sibling clause-model workflow the oracle emits no timing field of its own on
  this path, so there is not even a masked figure to carry. Characterization compares
  observable outputs and never compares execution time. The repository publishes no
  service-level agreement, no latency budget, no throughput target and no availability
  commitment, so there would be nothing to assert one against; the only quantitative gate in
  the whole brief is the 80 per cent per-service line-coverage floor, and it is measured in CI
  from coverage.cobertura.xml, never from this store.

  The redaction position. The statements this capture records are synthetic inputs built over
  the supporting fixture's own six column names and its own retrieve statement, so they are
  neither credentials nor interpolated user data and are recorded as they stand. The
  contingency is nevertheless declared under capturePhase.redaction rather than left to
  judgement: if a captured statement ever carries an interpolated literal that could be
  sensitive, the treatment for this workflow's own recorded statement fields is
  split-statement-and-parameters. That decision is scoped to this recording and does not reach
  the published database-error payload's statement field, which characterization/README.md
  section 6.2 rules is carried as one redacted field with nothing beside it. No key, password,
  certificate, token or fragment of one appears anywhere in this definition or in any
  recording taken under it.

  The not-masked position, stated positively because on this workflow the mask is very nearly
  empty and a reader is entitled to know what that leaves exposed rather than to infer it. The
  mask below has three entries and covers only platform and enumeration artifacts. NOTHING
  ELSE IS MASKED, and specifically: no sentinel identifier is masked, in whole or in part, and
  none is normalized for case or spelling; no interior whitespace inside a generated statement
  is masked; no keyword casing is masked; no nesting depth and no derived-table alias is
  masked; no arithmetic on the page bounds is masked; and no strategy-selection outcome is
  masked. Those are exactly the bytes the criterion compares, and masking any of them would
  leave the comparison unable to detect the only kind of regression this workflow can have.
  The determinismMask member carries no prose member in which to state this, which is why it
  is stated here and repeated as a comment beside the mask itself.

# Four cited fixtures, and EVERY ONE of them carries the specification role. That is not an
# oversight and it is not a downgrade: no window in the corpus drives the paging rewrites, so
# there is no oracle-window to cite and borrowing one would misrepresent where the behaviour
# is actually written down. The two generator objects are the behaviour; the window is cited
# for its setter surface and its default page size, both of which are real even though its
# calls are commented out; the DataWindow definition is cited for a concrete column shape and
# a concrete base statement to page over. All four are read-only and none is edited, moved,
# renamed, reformatted, re-encoded or copied into this tree.
