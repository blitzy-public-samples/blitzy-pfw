      - "L11"                 # THE FIRST STATUS COLUMN'S OWN INLINE VALUE LIST: three display-and-data pairs
      - "L14"                 # the declared sort specification
      - "L15"                 # THE NINE INLINE ROWS - the seed, carried by the definition itself
      - "L16-L21"             # the six header text objects, each named with a two-character suffix
      - "L22-L27"             # the column controls, DECLARED OUT OF IDENTIFIER ORDER - 6, then 5, then 4
      - "L24"                 # THE CHECKBOX-RENDERED COLUMN: its on value is one and its off value is zero
      - "L25"                 # a drop-down-DataWindow column, edit disallowed
      - "L26"                 # a second drop-down-DataWindow column, edit disallowed
      - "L27"                 # THE DROP-DOWN LIST BOX column - backed by its own value list, not by the child

  # THE CHILD DEFINITION THE TWO DROP-DOWN-DATAWINDOW COLUMNS RESOLVE THROUGH. Also release 12.5.
  - path: ws_objects/pfw.tests.pbl.src/dw_svc_sample_dddw.srd
    role: supporting-fixture
    locators:
      - "L2"                  # release 12.5, matching its parent
      - "L8-L9"               # the display column and the data column, both hundred-character strings
      - "L11"                 # THE THREE DISPLAY-AND-DATA PAIRS - three labels, three three-letter codes

  # CITED FOR CONTRAST AND NOT BOUND BY THIS WORKFLOW. It is the release-19 member of the other
  # fixture family, and the release difference is the reason this row exists at all.
  - path: ws_objects/pfw.tests.pbl.src/dw_test_dwsvc_contextmenu.srd
    role: supporting-fixture
    locators:
      - "L2"                  # RELEASE 19 - a DIFFERENT release from the definition the window binds
      - "L15"                 # nine rows that differ from the bound fixture's in whitespace AND in one value

  # THE CONTAINER CONTRACT, READ AS SPECIFICATION. Thirty-one lines, and every one of them is a
  # declaration: the type is bound to a closed native binary, so it is SUBSTITUTED rather than
  # ported, and this file is the whole statement of what the substitute must preserve.
  - path: ws_objects/pfw.utility.container.pbl.src/n_map.sru
    role: specification
    locators:
      - "L8"                  # BOUND TO A CLOSED NATIVE BINARY - hence substituted, hence this pair matters
      - "L9"                  # add, by key
      - "L10"                 # get, BY KEY
      - "L11"                 # GET, BY INTEGER INDEX - the positional accessor this pair proves survived
      - "L12"                 # the key at an integer index - the other half of the positional contract
      - "L13"                 # every key, in order - how insertion order is observed at all
      - "L15"                 # existence, by key
      - "L17"                 # the count
      - "L20"                 # a global auto-instance SHADOWING ITS OWN TYPE NAME. See defect D-04

# ==================================================================================================
#  THE SEED PHASE - RUNS ONCE, BEFORE THE PAIR BEGINS
#  ------------------------------------------------------------------------------------------------
#  THERE IS NO DATABASE IN THIS SEED, AND SAYING SO IS THE POINT. The persistence workflows seed one:
#  their oracle deletes a file, recreates a schema and inserts rows, which is precisely the
#  destructive reseed the capture rule forbids between the two halves of a pair. THIS SEED HAS NO
#  FILE DELETE, NO SCHEMA CREATION, NO INSERT STATEMENT AND NO CONNECTION. The nine rows the capture
#  starts from are declared INLINE IN THE READ-ONLY DEFINITION ITSELF, at
#  `dw_svc_sample_contextmenu.srd:L15`, so BINDING THE DEFINITION IS THE SEED. Both assertions below
#  are nonetheless true and both are still required: the binding happens once per pair, and nothing
#  here runs between the two captures.
#
#  THE RELEASE DIFFERENCE, BECAUSE THE TWO FIXTURE FAMILIES ARE NOT INTERCHANGEABLE. The definition
#  the window binds at `w_test_dwsvc_contextmenu.srw:L80` is `dw_svc_sample_contextmenu.srd`, which
#  declares RELEASE 12.5 at its `:L2`. The similarly-named `dw_test_dwsvc_contextmenu.srd` declares
#  RELEASE 19 at its `:L2`, and its nine-row data line differs from the bound fixture's in whitespace
#  AND in one value's rendering. Substituting one family for the other changes the fixture and voids
#  the comparison, so THIS WORKFLOW DRIVES THE RELEASE-12.5 DEFINITION and the release-19 one is
#  cited for contrast only. `./README.md` carries the same hazard for the whole roster, including the
#  trap that one member of the release-12.5 naming family is itself release 19.
# ==================================================================================================
seedPhase:
  steps:
    - action: >-
        Bind the DataWindow definition the host window names in its data-object property. On the
        legacy side that is the definition the window declares; on the target side it is the
        transcribed definition registered under the same column model. Binding loads the definition's
        own inline rows - THIS STEP PERFORMS NO FILE DELETE, NO SCHEMA CREATION AND NO ROW INSERT,
        because the rows are part of the read-only fixture. Confirm the bound definition declares
        release 12.5 and not release 19 before going further.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_contextmenu.srw:L80"
    - action: >-
        Confirm the nine inline rows are present in declaration order with their six columns in their
        declared types - two two-place decimals, one plain numeric, and three hundred-character
        strings - and the declared sort specification applied. Confirm the first decimal column's nine
        values CONTAIN DUPLICATES and the three status columns' values do too: the duplication is
        already in the fixture, so the insertion-order-under-duplication case needs nothing invented
        for it.
      locator: "ws_objects/pfw.tests.pbl.src/dw_svc_sample_contextmenu.srd:L15"
    - action: >-
        Confirm the definition is a grid. The two automatic-column-width items are added only for a
        grid, so whether they appear in the item model at all depends on this property - and their
        presence in the model is a headless output even though their effect is deferred.
      locator: "ws_objects/pfw.tests.pbl.src/dw_svc_sample_contextmenu.srd:L3"
    - action: >-
        Confirm the numeric column is rendered as a checkbox and that its on value is one and its off
        value is zero. The three check features and the copy features both read those two values, so a
        column rendered any other way exercises neither.
      locator: "ws_objects/pfw.tests.pbl.src/dw_svc_sample_contextmenu.srd:L24"
    - action: >-
        Confirm the two drop-down-DataWindow columns resolve their child definition and that its three
        display-and-data pairs are readable. The paste feature resolves a display value to its data
        value through those pairs, so the value map is empty without them.
      locator: "ws_objects/pfw.tests.pbl.src/dw_svc_sample_dddw.srd:L11"
    - action: >-
        Confirm the first status column's own inline value list is readable. That column is a drop-down
        LIST BOX rather than a drop-down DataWindow, so its three pairs come from the column
        definition itself and not from the child - and it reaches the same value-map accessor by a
        different branch, which is why both are seeded rather than only the child.
      locator: "ws_objects/pfw.tests.pbl.src/dw_svc_sample_contextmenu.srd:L11"
    - action: >-
        Enable exactly the one sub-service the host window enables in its open event, and leave the
        other four disabled. This is a seed step rather than a precondition check because the item
        model is a function of it: with the service disabled no model is built at all, and the base
        class's enable path returns immediately when the requested state already holds.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_contextmenu.srw:L54"
    - action: >-
        Leave all five feature-gating flags at their declared default of enabled, so that the baseline
        item model is the full one and every filtering case below is a departure from a known starting
        state rather than from an unknown one.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L49-L53"
    - action: >-
        Seed the clipboard from FIXTURE DATA before the paste case, and never from ambient system
        state. The service reads the clipboard while it is BUILDING the menu rather than when the
        selection is dispatched, so an ambient read would change both whether the paste item appears
        and what a selection of it does. The seeded payload is a carriage-return-and-newline-separated
        list of display values taken from the fixture's own rows, and it carries nothing sensitive
        (C-F).
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L297-L302"
    - action: >-
        Configure the determinism seams declared below ONCE, and use that one configuration for both
        halves of the pair. A seam configured per capture is two configurations, and two
        configurations make the two recordings answer two different questions.
    - action: >-
        On the target side, construct the headless service against the transcribed definition and
        record nothing else: no schema provisioning and no row seeding runs on this side either,
        because the candidate materializes the same nine rows from the same read-only definition. This
        step is idempotent and is safe to repeat without touching any persistent state.
  runsOncePerPair: true
  neverBetweenCaptures: true

# ==================================================================================================
#  THE CAPTURE PHASE - RUNS TWICE, AGAINST THE STATE THE SEED ALREADY ESTABLISHED
# ==================================================================================================
capturePhase:
  behaviourUnderTest: >-
    THE ITEM MODEL THE CONTEXT-MENU SERVICE BUILDS, THE IDENTIFIER A SELECTION CARRIES, AND WHAT THE
    HEADLESS BUILT-IN FEATURES DO TO THE FIXTURE'S VALUES. Concretely, the pipeline at
    `ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L136-L202` end to end:
    the popup-suppression guard at `:L143`; the service's own preparation hook at `:L146`, which is
    where every built-in item is added; the host's initializer hook at `:L147`, which is where the
    fixture adds its separator and its three custom items; the empty-model outcome at `:L149-L150`;
    THE MODEL BUILD LOOP AT `:L156-L185`, which is the headless core - feature filtering, separator
    encoding and suppression, and the submenu-versus-plain branch; the no-selection return at
    `:L193`; the host's selection hook at `:L194`; the built-in dispatch at `:L196` and `:L204-L222`;
    and the discard at `:L197-L200` that rebuilds the model from scratch on the next right-click.


    AND THE COLUMN-VALUE ORDERED MAP, as the second job this definition carries. The map is built by
    `n_cst_dwsvc.sru:L561` with the container created at `:L585`, and it is consumed by the paste
    feature at `n_cst_dwsvc_contextmenu.sru:L948`, `:L987` and `:L1006-L1007`. Two properties are the
    whole observable contract and both are recorded: THE FULL CONTENTS IN INSERTION ORDER, and THE
    VALUE RETURNED BY A POSITIONAL GET BY INTEGER INDEX. The container is substituted rather than
    ported - its type is bound to a closed native binary - so this pair is the proof that the
    substitution preserved both, and it is the container's only paired coverage anywhere in the store.


    WHAT THIS CAPTURE IS NOT. It is not a capture of the 22-event chain: `dataservices-dw-event-chain`
    owns that, and this definition records only the two semantic events of the context-menu pair and
    the two raw right-button events that reach them. It is not a retrieval or update capture - no
    statement is generated and no storage is written. AND IT IS NOT A MEASUREMENT: no elapsed value is
    recorded and no timing is asserted, anywhere, for any case.


    WHAT THIS CAPTURE DOES NOT RECORD, STATED SO THE GAP IS EXPLICIT RATHER THAN INFERRED. NO WINDOW
    RECTANGLE, NO DEVICE-UNIT CONVERSION RESULT, NO MEASURED TEXT EXTENT, NO EFFECT OF THE THEME
    BACKGROUND STYLE AND NO RENDERING OF ANY KIND IS RECORDED AS AN OUTPUT. Those five belong to the
    deferred half declared below, which enumerates every one of them with its own locator, and the
    boundary is drawn where the source draws it: every measurement site and every conversion site in
    the object sits inside the two automatic-column-width functions beginning at `:L1085` and
    `:L1260`, and nothing else in the object measures or converts anything. So the two automatic-width
    ITEMS are recorded as ITEMS - their labels, identifiers and submenu metadata are part of the model
    a header right-click produces - while their EFFECT is not recorded at all. The one width this
    capture does record is the LOGICAL one, and the width mask entry below states precisely which side
    of that line each recorded width sits on.

  preconditions:
    # ---- ORDERING, CROSS-REFERENCED RATHER THAN RE-DERIVED ---------------------------------------
    - >-
      ORDERING DISCIPLINE - THE CONTEXT-MENU PAIR IS STRICTLY SYNCHRONOUS, with no reordering
      permitted, and both halves of the pair are captured under that same assignment.
      `dataservices-dw-event-chain` assigns and justifies it; the reason it holds is visible in this
      service's own pipeline rather than only in the chain's: the identifier the selection hook
      receives is produced by the popup the initializer hook populated, so initialization must have
      COMPLETED before the selection identifier means anything. A token that let a consumer re-sort
      this pair would let it dispatch a selection against a menu that had not been built.
    - >-
      THE TWO ENTRY POINTS ARE DISTINCT AND BOTH ARE EXERCISED, because the fixture's own on-screen
      hint names both: a right-click on a COLUMN HEADER, and a right-click on a CELL. They are not two
      inputs to one behaviour - they produce STRUCTURALLY DIFFERENT MODELS, because the copy-cell
      branch returns from the preparation hook immediately after adding its single item.
    - >-
      THE MODEL IS REBUILT FROM EMPTY ON EVERY RIGHT-CLICK. The pipeline's cleanup clears the clicked
      column, clears the cached clipboard text and removes every item, so no case inherits an item
      from the case before it. Confirm the item count is zero before each case begins; a non-zero
      count means the previous case's cleanup did not run and the capture is not comparable.
    - >-
      A RIGHT-CLICK IS TWO PLATFORM EVENTS, AND THE MENU APPEARS ONLY IF THEY AGREE ON THE ROW. The
      button-down event stamps its row and the button-up event fires the click only when its own row
      equals that stamp, then clears it. Every case therefore synthesizes a matched down-and-up pair
      on one row; the deliberately mismatched pair is its own case below.
    - >-
      ALL FIVE FEATURE-GATING FLAGS START ENABLED, per the seed phase, so the baseline model is the
      full one. The flag-filtering case below is the only one that departs from that, and it departs
      from it one flag at a time.
    # ---- THE CAPTURE MATRIX - ONE CASE PER ROW, EACH TAKEN FROM THE SEEDED STATE -----------------
    - >-
      CASE 01 - HEADER ENTRY POINT. Right-click the header text object of the two-place decimal
      column. Starting condition: the column is editable, the row count is nine, and the item list is
      empty. This is the case that produces the FULL model, and it is the baseline every other model
      is read against.
    - >-
      CASE 02 - CELL ENTRY POINT. Right-click a cell of the same column on a row greater than zero,
      with that cell not being the focused editable cell. Starting condition: as case 01. This case
      exercises the preparation hook's EARLY RETURN, so the expected model is a SINGLE item and the
      absence of every other item - including the separator and the three custom items - is itself the
      observation.
    - >-
      CASE 03 - THE THREE CUSTOM IDENTIFIERS, SELECTED ONE AT A TIME. From the case 01 model, select
      identifier 100, then repeat the case and select 101, then repeat and select 102. Starting
      condition: as case 01. THE THIRD IS THE ITEM THE FIXTURE DECLARES DISABLED, and it is selected
      anyway: the capture records what the model says about it and what a selection of it does, rather
      than assuming the model omitted it.
    - >-
      CASE 04 - THE FOUR BUILT-IN FEATURES THE FIXTURE'S HEADER COMMENT NAMES, each selected from the
      case 01 model by its own identifier at or above 10000: check whole column at 10002 and clear
      check whole column at 10003, which the comment names as one feature; copy whole column at 10005;
      paste over whole column at 10006; and copy single cell at 10007, which is selected from the case
      02 model because that is the only model it appears in. Starting condition: as case 01, plus the
      seeded clipboard payload for the paste selection.
    - >-
      CASE 05 - THE FIFTH CHECK IDENTIFIER THE COMMENT DOES NOT NAME. Select invert check whole column
      at 10004 from the case 01 model. Starting condition: as case 01. It is captured because it is
      headless, because the fixture's four-feature comment folds it away, and because the check
      feature's own filter does not mention it - all three are recorded under defect D-01.
    - >-
      CASE 06 - THE INITIALIZER VETO. Repeat case 01 with the host's initializer hook returning one
      instead of zero. Starting condition: as case 01. The expected outcome is NO MENU AT ALL, and the
      observation is that the pipeline returns before the model is built rather than building an empty
      one.
    - >-
      CASE 07 - THE SELECTION VETO OVER A BUILT-IN IDENTIFIER. Repeat case 01, select copy whole
      column at 10005, and have the host's selection hook return one. Starting condition: as case 01,
      with the clipboard's prior contents recorded first. The expected outcome is that THE DEFAULT
      BEHAVIOUR DOES NOT RUN - the clipboard is unchanged - which is a different meaning of the same
      return value as case 06 and is recorded as such.
    - >-
      CASE 08 - THE CHECKBOX-RENDERED COLUMN. Right-click the header of the numeric column whose on
      value is one and whose off value is zero, then select each of the three check identifiers in
      turn, and separately select copy whole column. Starting condition: the column's nine values are
      six zeroes and three ones, in the fixture's declared order. This is the only column for which
      the check items appear at all, and its copy output is the case in which the one-and-zero
      representation is not copied literally.
    - >-
      CASE 09 - A DROP-DOWN-DATAWINDOW COLUMN. Right-click the header of a status column backed by the
      child definition and select copy whole column. Starting condition: the child resolves and its
      three display-and-data pairs are readable. The observation is WHICH OF THE TWO VALUES THE COPY
      EMITS - the display label or the stored code - because the paste feature in case 11 consumes the
      other one.
    - >-
      CASE 10 - THE DROP-DOWN LIST BOX COLUMN. Repeat case 09 against the status column whose three
      pairs come from its own inline value list rather than from the child definition. Starting
      condition: that value list is readable. It is a separate case because it reaches the same
      value-map accessor through a different branch, and a capture that covered only the child-backed
      form would leave that branch unproven.
    - >-
      CASE 11 - PASTE OVER A WHOLE COLUMN, WITH FIXTURE-SOURCED CLIPBOARD CONTENT. Select paste over
      whole column at 10006 against each of the two translating column kinds and against the
      checkbox-rendered column. Starting conditions, each its own sub-case: a payload of nine display
      values that all resolve; a payload of nine whose fourth line resolves for a translating column
      but not for an enumerated one; a payload of TEN lines against nine rows; and a payload whose
      lines correspond to rows of which one is protected. Every payload is assembled from the
      fixture's own values (C-F).
    - >-
      CASE 12 - THE MISMATCHED RIGHT-CLICK. Synthesize a button-down on one row and a button-up on a
      different row. Starting condition: as case 01. The expected outcome is that NO CLICK IS RAISED
      and therefore no model is built, and the stamp is left cleared afterwards.
    - >-
      CASE 13 - THE ITEM-TEXT ACCESSOR UNDER BOTH FLAG VALUES. From the case 01 model, read each
      item's text twice: once with the flag false, passing the item's IDENTIFIER, and once with the
      flag true, passing its ONE-BASED POSITION. Starting condition: as case 01, with the model's
      length recorded first. Also read one position above the last valid one and one below the first,
      because the accessor's bounds check is written against the last valid index rather than against
      a length.
    - >-
      CASE 14 - THE ORDERED MAP, DIRECTLY. For each of the three translating columns and for the
      checkbox-rendered column, capture the map the value-map accessor returns: its count, its keys in
      order, the key at each integer position, the value at each integer position, and the value for
      each key. Starting condition: as case 01. Then repeat for a column name that is unusable, whose
      expected result is an EMPTY map rather than an error or a null.
    - >-
      CASE 15 - INSERTION ORDER UNDER DUPLICATION. Capture the map for a column whose nine rows
      contain repeated values - the fixture's first decimal column repeats each of its three values
      three times, and each status column repeats each of its three codes three times - so that the
      capture shows what the container does with a duplicate: whether the order is the order of first
      insertion, and whether the count reflects distinct values or rows. Starting condition: as case
      01. Nothing is invented for this case; the duplication is already in the fixture's own data line.
    - >-
      CASE 16 - THE FEATURE FLAGS, ONE AT A TIME. Repeat case 01 four times, each with exactly one of
      the four flags that the build loop's filter mentions turned off, and once more with the flag the
      filter does NOT mention turned off. Starting condition: as case 01 in every repetition. The
      observation is which items leave the model, WHICH SEPARATORS COLLAPSE OR DISAPPEAR as a
      consequence, and which item stays despite its flag being off.
    # ---- THE GUARD THAT KEEPS THE DEFERRED HALF OUT OF THE RECORDING -----------------------------
    - >-
      NO CASE ABOVE DRIVES THE DEFERRED HALF, AND THAT IS A PRECONDITION RATHER THAN A HOPE. Neither
      automatic-width identifier is selected in any case; the theme background style the fixture sets
      is left exactly as the fixture sets it and its effect is never read back; and no recorded output
      names a window rectangle, a converted device unit or a measured text extent. Confirm before each
      capture that the two automatic-width identifiers appear in the model and are never dispatched -
      their presence is the observation, and their effect is the documented gap.

  # ================================================================================================
  #  WHAT THE CAPTURE RECORDS
  #  ----------------------------------------------------------------------------------------------
  #  Every name below is the identifier the recording keys on, and each is chosen to match the
  #  candidate's own member name so that a legacy record and a target record key identically - a
  #  renamed field is a field that stops matching its counterpart on the other side. `format` is used
  #  wherever the projection is not obvious from the description. EVERY ONE OF THESE IS COMPARED:
  #  nothing here carries the non-behavioural marker, because this service emits no field of its own
  #  that carries no behaviour - it emits no timing value, so there is nothing to record-and-exclude.
  # ================================================================================================
  observedOutputs:
    # ---- THE MODEL ITSELF -----------------------------------------------------------------------
    - name: contextMenu.outcome
      description: >-
        WHICH OF THE FIVE PIPELINE OUTCOMES THE RIGHT-CLICK REACHED, as its own enumerated value
        rather than as a boolean: a model was built and is awaiting a selection; the popup was
        suppressed by the guard; the service's preparation hook vetoed; the host's initializer hook
        vetoed; or the model came out empty. A difference here means the pipeline took a different
        branch, which is a more serious finding than a difference in the model's contents, so the
        outcome is recorded before the contents and compared first. Collapsing the five into
        "menu or no menu" would make three distinct causes indistinguishable.
      format: >-
        The enumerated member name, not its ordinal, so that a reordering of the enumeration cannot
        silently re-label a recording.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L143"
    - name: contextMenu.itemModel
      description: >-
        THE COMPLETE ORDERED ITEM MODEL, and the central output of this whole workflow. For every
        entry, in the order the build loop emits it: its label; its image argument; its tip text; its
        identifier; its enabled flag; its split flag; its menu-owner flag; whether it carries a
        submenu and, if so, that submenu's own entries in their own order; and whether the entry is a
        SEPARATOR. A difference in the order is as much a finding as a difference in an entry, because
        the order is what the user sees and it is produced by a loop whose filtering and suppression
        rules are the behaviour under test.
      format: >-
        One record per entry, in emitted order, with the entry's position recorded as a ONE-BASED
        index to match the legacy's own array. TWO LITERALS ARE PART OF THE ENCODING GRAMMAR RATHER
        THAN OF THE DATA, so they are named here and both are quoted because YAML would otherwise fold
        the second one away: a separator is an entry whose text is exactly `"-"`, and the fixture's
        image argument for each of its three custom entries is exactly `""` - an empty image path, not
        an absent argument and not a single space. A separator is therefore recorded as an entry whose
        separator flag is set AND whose text is `"-"`, both, because a substitute that carried the flag
        without the text would differ from the oracle in a way a flag-only comparison could not see.


        THE FIXTURE'S OWN LABEL AND VALUE STRINGS ARE DELIBERATELY NOT REPRODUCED HERE, AND THAT IS A
        DECISION WITH A REASON RATHER THAN AN OMISSION. The three custom entries' labels and the three
        display-and-data pairs the status columns resolve through are cited by locator -
        `ws_objects/pfw.tests.pbl.src/w_test_dwsvc_contextmenu.srw:L88-L90`,
        `ws_objects/pfw.tests.pbl.src/dw_svc_sample_dddw.srd:L11` and
        `ws_objects/pfw.tests.pbl.src/dw_svc_sample_contextmenu.srd:L11` - and are read from there. The
        schema carries no member able to hold fixture content precisely because A VENDORED COPY IS A
        SECOND MASTER, and a second master can drift from the oracle without anybody noticing. The
        labels are non-Latin script in this fixture, so they are neither translated nor transliterated
        anywhere in this definition; the RECORDING carries them verbatim, which is where a comparison
        needs them.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L156-L185"
    - name: contextMenu.itemModel.headerEntryPoint
      description: >-
        THE MODEL A COLUMN-HEADER RIGHT-CLICK PRODUCES - the full one. Recorded as its own output
        rather than folded into the model above, because the two entry points produce structurally
        different models and a single output would average them into something neither side actually
        produces. Includes the column name the service derived from the header text object, which it
        obtains by STRIPPING THE TRAILING TWO CHARACTERS of that object's name and then requiring the
        result to describe as a column or a computed field.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L253-L266"
    - name: contextMenu.itemModel.cellEntryPoint
      description: >-
        THE MODEL A CELL RIGHT-CLICK PRODUCES - a SINGLE ITEM, because the preparation hook adds the
        copy-cell item and RETURNS IMMEDIATELY. The absence of everything else is the observation: no
        automatic-width item, no check items, no copy-column item, no paste item, and NOT EVEN THE
        HOST'S OWN SEPARATOR AND THREE CUSTOM ITEMS - the host's initializer hook still runs and still
        adds them, so what this output proves is which of the two hooks' contributions survive the
        early return and in what order they sit relative to each other.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L241-L251"
    - name: contextMenu.separatorHandling
      description: >-
        THE SEPARATOR SUPPRESSION RULES, recorded as a decision per separator rather than only as a
        presence in the model: whether a separator was suppressed because nothing preceded it, whether
        two adjacent separators collapsed into one, and whether a trailing separator was dropped. This
        matters here specifically because THE FIXTURE ADDS ITS SEPARATOR BEFORE ITS FIRST CUSTOM ITEM,
        so whether it survives depends on whether any built-in item was emitted ahead of it - which
        makes it a function of the feature flags and of the entry point, not a constant.
      format: >-
        One record per separator the item list contained, each carrying its one-based position in the
        item list, the decision taken, and the reason the loop's own state gave for it.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L173-L178"
    - name: contextMenu.splitFlagPropagation
      description: >-
        WHETHER EACH ENTRY'S SPLIT FLAG REACHED THE BUILT MENU. The item model declares a split flag
        for every entry, but the build loop passes it ONLY on the submenu branch: the plain branch's
        call has no split parameter at all, so a plain entry's split flag is carried in the model and
        then dropped on the way out. Recorded per entry as the flag the model holds AND the flag the
        built menu received, because the two differ and the difference is legacy behaviour.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L179-L183"
    - name: contextMenu.featureFlagFiltering
      description: >-
        WHICH ENTRIES EACH FEATURE FLAG REMOVED, per flag, and which entries survived a flag that was
        off. The filter names four identifiers across four flags and does not name the fifth check
        identifier or either automatic-width identifier, so turning a flag off does not always remove
        everything that flag's feature owns. Recorded as the identifier set removed and the identifier
        set retained, per flag, so that a substitute which filtered "correctly" is visible as a
        divergence rather than passing as an improvement.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L157-L168"
    - name: contextMenu.identifierClassification
      description: >-
        FOR EVERY IDENTIFIER IN THE MODEL, WHETHER THE HOST'S SELECTION HOOK CLASSIFIED IT AS CUSTOM
        OR AS BUILT-IN, together with the identifier's own value. The fixture's classification is a
        single strict comparison against 10000: the three custom identifiers 100, 101 and 102 fall
        below it and every built-in identifier is at or above it. Both the boundary value and the
        strictness are behaviour - an identifier exactly equal to 10000 exists in the model and is
        classified as built-in - so the capture records the comparison's outcome per identifier rather
        than assuming the two ranges never meet.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_contextmenu.srw:L96"
    - name: contextMenu.disabledItemPresence
      description: >-
        THAT THE THIRD CUSTOM ITEM IS PRESENT IN THE MODEL WITH ITS LABEL AND ITS IDENTIFIER 102 AND
        ITS ENABLED FLAG CLEAR - not absent. The output is the entry itself plus its one-based position
        in the model, so the capture proves presence-with-disabled rather than absence. A substitute
        that omitted a disabled entry would produce a shorter model in which every following entry's
        position had shifted, and every position-based read after it would be wrong.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_contextmenu.srw:L90"
    - name: contextMenu.itemTextByIdentifier
      description: >-
        EVERY ENTRY'S TEXT AS READ BACK THROUGH THE ITEM-TEXT ACCESSOR WITH ITS FLAG FALSE, which is
        the form the fixture uses: the argument is an IDENTIFIER and is resolved through the
        identifier-to-index lookup before the text is returned. Recorded per identifier, including the
        disabled entry's, and including an identifier that is not in the model at all.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L554-L560"
    - name: contextMenu.itemTextByPosition
      description: >-
        THE SAME ACCESSOR WITH ITS FLAG TRUE, where the argument is instead used DIRECTLY AS A
        ONE-BASED POSITION. The two flag values are captured together because the flag changes what
        the argument MEANS, not how the result is rendered, and because the two agree only where an
        entry's identifier happens to equal its position - which in this fixture it never does.
        Recorded for every valid position and for the two invalid ones either side of the range.
      format: >-
        One record per position, each carrying the position asked for, the text returned, and whether
        the accessor's bounds check rejected it. The bounds check is written against the LAST VALID
        INDEX rather than against a length, so the position one past the end and the position zero are
        both recorded explicitly - they are the two values a zero-based port gets wrong.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L597"
    # ---- SELECTION, AND THE TWO VETOES ----------------------------------------------------------
    - name: contextMenu.selectedIdentifier
      description: >-
        THE IDENTIFIER THE POPUP RETURNED, as its raw number, before any classification. Zero means no
        selection was made, and the pipeline returns on it before either the host's selection hook or
        the default behaviour runs - so zero is a distinct outcome and is recorded as one rather than
        as a missing value.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L193"
    - name: contextMenu.selectionRecord
      description: >-
        THE FORMATTED RECORD THE HOST BUILDS FOR A CUSTOM SELECTION, field by field: the entry's text
        as returned by the accessor with its flag false, the identifier, the ROW, and the COLUMN
        OBJECT'S NAME. Recorded as the four fields separately AND as the assembled string, because the
        assembly uses the legacy's own substitution helper and its line separator, and a difference in
        the assembly is a different finding from a difference in a field.
      format: >-
        The four fields as named values, plus the assembled text with its line separators preserved as
        the legacy writes them. The row and the column are recorded as the legacy reports them, which
        means the row is a ONE-BASED index.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_contextmenu.srw:L97"
    - name: contextMenu.initializerVeto
      description: >-
        THE OUTCOME WHEN THE HOST'S INITIALIZER HOOK RETURNS ONE: the whole menu is prevented. What is
        recorded is that the pipeline returned at the initializer's own call site - BEFORE the item
        count was read, before any menu object was created and before any selection could exist - so
        the observable result is no model, not an empty one. The distinction is visible in the outcome
        output above, which is why both are recorded.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L147"
    - name: contextMenu.selectionVeto
      description: >-
        THE OUTCOME WHEN THE HOST'S SELECTION HOOK RETURNS ONE: the DEFAULT BEHAVIOUR of the selected
        built-in entry is prevented, and nothing else is. The menu was built, a selection was made and
        its identifier is known - only the dispatch is skipped. Recorded as the identifier selected,
        the hook's return value, whether the default dispatch ran, and the unchanged state of whatever
        that dispatch would have altered. TWO ADJACENT HOOKS, ONE RETURN VALUE, TWO DIFFERENT
        MEANINGS: this output and the one above it are what keep them apart.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L194"
    - name: contextMenu.rightButtonRowStamp
      description: >-
        THE ROW THE BUTTON-DOWN EVENT STAMPED, WHETHER THE BUTTON-UP EVENT RAISED A CLICK, AND THE
        STAMP'S VALUE AFTERWARDS. The click is raised only when the two events agree on the row, and
        the stamp is cleared unconditionally afterwards. Recorded because a mismatched pair produces NO
        MENU AT ALL, which is a legitimate outcome that a capture driving only matched pairs would
        never exercise.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L124-L134"
    - name: contextMenu.modelDiscard
      description: >-
        THE STATE LEFT BEHIND AFTER EVERY RIGHT-CLICK: the item count, the remembered clicked column
        and the cached clipboard text, all read immediately after the pipeline returns. The cleanup
        runs on every path including the vetoed ones, so THE MODEL IS REBUILT FROM EMPTY EVERY TIME.
        Recorded because a substitute that retained items between clicks would produce a model that
        grew, and the second capture of the same case would then disagree with the first for reasons
        that have nothing to do with the port.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L197-L200"
    - name: eventChain.contextMenuPair
      description: >-
        THE TWO SEMANTIC EVENTS OF THE CONTEXT-MENU PAIR AND THE TWO RAW RIGHT-BUTTON EVENTS THAT
        REACH THEM, in arrival order, each with its arguments and its numeric return. Recorded here
        only at the points where the chain and this sub-service meet - the chain itself belongs to the
        sibling definition named below, and this output exists so the two pairs can be cross-checked
        against each other without either duplicating the other. Note the asymmetry the chain
        declares: the raw button-DOWN event calls a semantic handler and then the broker and inspects
        both returns, while the raw button-UP event reaches the broker ONLY.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L115-L122"
    # ---- WHAT THE HEADLESS BUILT-IN FEATURES ACTUALLY DO ----------------------------------------
    - name: builtIn.checkColumn.columnValues
      description: >-
        THE CHECKBOX-RENDERED COLUMN'S NINE VALUES AFTER EACH OF THE THREE CHECK IDENTIFIERS IS
        DISPATCHED - set the whole column, clear the whole column, and invert the whole column - each
        taken from the same seeded starting values of six zeroes and three ones. Recorded as the nine
        stored values in row order plus each row's item status, because the features write through the
        buffer and a value that changed without its status changing is a divergence.
      format: >-
        Nine records per dispatch, each with its ONE-BASED row number, the stored value before, the
        stored value after, and the item status after.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L767"
    - name: builtIn.copyColumn.clipboardText
      description: >-
        THE EXACT TEXT COPY-WHOLE-COLUMN WRITES TO THE CLIPBOARD, per column kind, byte for byte
        including its trailing separator. THREE DISTINCT RULES ARE IN PLAY AND THE OUTPUT PROVES WHICH
        ONE EACH COLUMN TOOK: a checkbox-rendered column's stored one and zero are NOT copied
        literally - they are compared against the column's declared on and off values and copied as two
        single letters instead; a computed column copies its evaluated value; and EVERY OTHER COLUMN
        COPIES ITS DISPLAY VALUE RATHER THAN ITS STORED DATA VALUE, which for the three status columns
        means the label rather than the three-letter code. An invisible item contributes an EMPTY value
        and still contributes its line, so the line count matches the row count either way.
      format: >-
        The whole clipboard text verbatim, and separately the per-row values as a list in row order so
        that a difference is attributable to a row rather than only to the blob. Lines are joined with
        the carriage-return-and-newline pair the legacy uses, recorded as written and normalised only
        at comparison time under the newline seam below.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L543"
    - name: builtIn.copyItem.clipboardText
      description: >-
        THE TEXT COPY-SINGLE-CELL WRITES, for one cell of each column kind, under the same three rules
        as the column copy. Recorded separately because it is the ONLY built-in feature reachable from
        the cell entry point, and because its guard differs: a non-positive row is refused as an
        invalid argument rather than producing an empty result.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L602-L632"
    - name: builtIn.pasteColumn.columnValues
      description: >-
        THE COLUMN'S VALUES AFTER PASTE-OVER-WHOLE-COLUMN, per payload sub-case, and the three
        behaviours that make this the most intricate of the four headless features. FIRST, the payload
        is split on the carriage-return-and-newline pair and its line count drives the loop - so A
        PAYLOAD LONGER THAN THE ROW COUNT INSERTS ROWS, and the inserted rows are recorded with their
        statuses. SECOND, an invisible or protected item is SKIPPED, but the payload is still indexed
        BY ROW NUMBER rather than consumed sequentially, so a skipped row CONSUMES ITS LINE and the
        lines after it do not shift up. THIRD, a translating column's value is resolved through the
        ordered map before it is stored. All three are recorded per row so that a substitute which
        consumed the payload sequentially - the natural way to write it - shows up as a misalignment
        rather than as a plausible-looking result.
      format: >-
        One record per payload line, each with its ONE-BASED position, the raw line, whether the row
        was skipped and why, the value after any map resolution, the value stored, and the row's item
        status afterwards. Plus the row count before and after, so an insertion is visible.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L942-L1076"
    - name: builtIn.dispatchArm
      description: >-
        WHICH ARM OF THE BUILT-IN DISPATCH A SELECTED IDENTIFIER REACHED, recorded as the arm's own
        identifier constant. The dispatch has EIGHT ARMS AND NO ELSE ARM, so an identifier at or above
        the boundary that matches none of them falls through silently and does nothing at all - which
        is a legitimate outcome and is recorded as one rather than as an error. The two automatic-width
        arms are named in this output as ARMS THAT EXIST AND ARE NEVER DISPATCHED by any case here.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L204-L222"
    # ---- THE ORDERED MAP: THE CONTAINER'S ONLY PAIRED COVERAGE IN THE STORE ----------------------
    - name: valueMap.insertionOrder
      description: >-
        THE VALUE MAP'S FULL CONTENTS IN INSERTION ORDER, per column kind - the first of the two
        properties that together ARE the container's observable contract. Recorded as the count, then
        every key in the order the map enumerates them, then the value under each key. The order is
        not incidental: it is the order the builder inserted pairs in while walking the child
        definition's rows or the column's own value list, so a substitute backed by a hash-ordered
        dictionary would produce the same pairs in a different order and every positional read after it
        would return a different value.
      format: >-
        The count first, then an ordered list of key-and-value records, each carrying its ONE-BASED
        position. Recorded for both drop-down-DataWindow columns, for the drop-down list box column and
        for the checkbox-rendered column, so all three branches of the builder are covered.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc.sru:L561"
    - name: valueMap.positionalGet
      description: >-
        THE VALUE RETURNED BY A POSITIONAL GET BY INTEGER INDEX, for every position in each captured
        map - the second of the two properties. The container declares this as a SEPARATE OVERLOAD of
        the same accessor name as the by-key form, distinguished only by its argument type and
        returning the same untyped result, so a substitution that collapsed the two into one
        stringly-typed lookup would still compile and would return the wrong thing for a map whose keys
        happen to look like numbers. Recorded alongside the key at each position, because the two
        together are what prove the positional contract rather than either alone.
      format: >-
        One record per position, each with the ONE-BASED index asked for, the key at that index, the
        value at that index, and the value the by-key form returns for that same key - so the two
        accessors are shown to agree entry by entry. The index one past the end and the index zero are
        both included.
      locator: "ws_objects/pfw.utility.container.pbl.src/n_map.sru:L11"
    - name: valueMap.duplicateValueStability
      description: >-
        WHAT THE MAP DOES WITH A REPEATED VALUE, captured against columns whose nine rows repeat each
        of their three values three times. Recorded as the count, the ordered keys and the positional
        reads, so the capture answers three questions the container's declaration alone does not:
        whether a repeated pair is added again or ignored, whether re-adding an existing key moves it to
        the end or leaves it where it was, and whether the count reflects distinct keys or rows walked.
        INSERTION-ORDER STABILITY UNDER DUPLICATION is the property at issue, and it is exactly where a
        substituted container is most likely to differ while looking correct.
      locator: "ws_objects/pfw.tests.pbl.src/dw_svc_sample_contextmenu.srd:L15"
    - name: valueMap.displayToDataResolution
      description: >-
        THE DIRECTION THE MAP RESOLVES IN, per lookup, and the ASYMMETRY BETWEEN THE TWO FEATURES THAT
        USE IT. Copy-whole-column emits a column's DISPLAY value; paste-over-whole-column consumes a
        display value and resolves it to the STORED DATA VALUE through this map. The round trip is
        therefore the map's real contract in situ, and it is recorded as such: the value copied out,
        the value pasted back in, the key the map matched, and the value it returned. Recorded per
        column kind, because the checkbox-rendered column resolves through the same map with a
        different pair set.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L1006-L1007"
    - name: valueMap.emptyForUnusableColumn
      description: >-
        THAT AN UNUSABLE COLUMN NAME YIELDS AN EMPTY MAP - not a null, and not an error. The builder
        creates the container BEFORE it validates its argument and returns that empty container on the
        guard path, so a caller always receives a usable object. Recorded as the returned object's
        validity, its count and the result of a positional read against it, because a substitute that
        returned a null reference here would fail at the caller's own existence check rather than at
        the lookup, and the two produce different observable outcomes.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc.sru:L587"
    - name: valueMap.accessorOverloadAgreement
      description: >-
        THAT THE BY-NUMBER OVERLOAD OF THE VALUE-MAP ACCESSOR AGREES WITH THE BY-NAME ONE, entry for
        entry. The by-number form does not build a map of its own: it resolves the ONE-BASED column
        number to a column name through a describe call and then delegates. Recorded for every column
        number in the fixture, paired with the name it resolved to - which matters here because THE
        FIXTURE'S COLUMN CONTROLS ARE DECLARED OUT OF IDENTIFIER ORDER, so a port that confused
        declaration position with column number would resolve the wrong name and still return a
        perfectly valid map.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc.sru:L666"
    # ---- STRUCTURED ERRORS: THE DIALOGS, WITH ONLY THE DELIVERY CHANNEL CHANGED ------------------
    - name: structuredError.payload
      description: >-
        EVERY ERROR THE HEADLESS FEATURES RAISE, AS A STRUCTURED RESULT RATHER THAN AS A DIALOG, with
        the exact message text, the localization category, the substitution arguments, the severity and
        the returned numeric code all preserved. Only the delivery channel changes. The service has TEN
        live dialog sites and ALL TEN route through localization under the same category - which is the
        contrast that makes the expression engine's non-localized messages a defect rather than a style
        difference, and `../../docs/DEFERRED.md` section 6.3 is the authority for both counts. Three
        message keys are reachable from the cases here: a rejected modification, an unresolvable value
        on an enumerated column, and a data-type mismatch. Every one of them is prefixed by a
        row-number substitution whose argument is a ONE-BASED row.
      format: >-
        One record per raised error: the message key before substitution, the substituted arguments in
        order, the assembled text, the localization category, the severity, and the numeric code the
        feature returned to its caller. The assembled text is recorded verbatim; it is fixture data
        throughout and carries nothing sensitive.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L1009"
    - name: structuredError.acceptTextGuard
      description: >-
        WHETHER PENDING EDIT TEXT WAS ACCEPTED BEFORE A COPY RAN, AND WHAT HAPPENED WHEN IT COULD NOT
        BE. Both copy features accept pending text first and return a plain failure when that accept
        is refused - before reading a single value. Recorded as the accept's own result and the
        feature's returned code, because the ordering is behaviour: a port that copied first and
        accepted afterwards would emit a stale value and still report success.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L519"
    # ---- THE LOGICAL WIDTH MEASURE, AND THE LINE IT SITS ON --------------------------------------
    - name: contextMenu.logicalTextWidthMeasure
      description: >-
        THE LOGICAL SIDE OF THE WIDTH COMPUTATION, AND ONLY THE LOGICAL SIDE. One correction belongs
        here and it is stated rather than worked around: THE ITEM MODEL DECLARES NO WIDTH FIELD OF ITS
        OWN. Its eight fields are enabled, text, image, tip text, identifier, submenu, split and
        menu-owner, and none of them is a width - the width the service computes is a COLUMN width, in
        the two automatic-width functions, and the popup class the built menu is handed to does its own
        sizing in the deferred half. So what is recorded here is the width computation's LOGICAL INPUT:
        the ordered set of texts the computation enumerates - the column's heading text object and each
        visible row's display text, in enumeration order - together with the two logical constants the
        object declares for padding and for the arrow-button allowance. A narrow-and-wide character
        count is DERIVED from each recorded text at comparison time by the same rule on both sides, so
        it adds no claim that the oracle emits a number it does not.
      format: >-
        The enumerated texts in order, each with its band and its object name and its object type, plus
        the two declared logical constants as numbers. Character counts are derived at comparison time
        and are not stored as oracle emissions. NOTHING DEVICE-RESOLVED APPEARS IN THIS OUTPUT - see
        the width entry in the mask below, which is where the device-resolved width is excluded and why.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L63"
    # ---- THE INDEXING BASIS, DECLARED RATHER THAN ASSUMED ---------------------------------------
    - name: indexingBasis
      description: >-
        THE INDEXING BASIS EVERY OTHER OUTPUT IN THIS CAPTURE IS RECORDED UNDER, stated as its own
        field so that no reader has to infer it. EVERY ROW NUMBER, EVERY COLUMN NUMBER, EVERY ITEM
        POSITION AND EVERY MAP POSITION IN THIS RECORDING IS A ONE-BASED LEGACY INDEX. The legacy's
        arrays begin at one and its upper-bound function returns the LAST VALID INDEX, whereas the
        target's arrays begin at zero and its length is one past the end. A recording that did not
        declare its basis would be silently ambiguous, and a silent off-by-one is indistinguishable
        from a behavioural regression. This output exists so that the comparison is between two
        recordings that agree on what a "3" means.
      format: >-
        A single declarative record naming the basis, the upper-bound convention, and the four kinds of
        index it governs. Recorded identically on both sides; the CANDIDATE converts at its boundary and
        records the legacy basis, rather than recording its own and leaving the comparison to translate.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L57"

  # Text-based and diffable, one workflow's output in one workflow's own directory. THE EXTENSIONS ARE
  # NOT A STYLE CHOICE: the root `.gitignore` carries SIX extensions UNANCHORED at `:L7-L12` - one dump,
  # one log, one backup, one batch and two archive patterns - so they match at every depth including
  # inside this store, and the file's only negations at `:L14-L15` are anchored elsewhere in the tree
  # and rescue nothing here. A capture named that way is silently untracked: present on the machine
  # that produced it, absent from `git status`, from review and from CI, so the comparison looks taken
  # and cannot be found. The root `.gitignore` is NOT to be modified; naming the file correctly is the
  # fix, and the schema's own filename pattern makes all six unspellable here in any case.
  # `../README.md` sections 3.4 and 3.5 are the authority.
  recordingArtifacts:
    - filename: item-model.jsonl
    - filename: menu-outcomes.jsonl
    - filename: selection-dispatch.json
    - filename: builtin-feature-effects.json
    - filename: column-values.csv
    - filename: clipboard-text.txt
    - filename: value-map-contents.jsonl
    - filename: structured-errors.json
    - filename: indexing-basis.json

# ==================================================================================================
#  THE DEFERRED HALF - A DOCUMENTED GAP, AND NOTHING ELSE
#  ------------------------------------------------------------------------------------------------
#  READ THIS ENTRY AS A NOTE ABOUT THE EVENTUAL SYSTEM, BECAUSE THAT IS ALL IT IS. It documents a gap
#  and implements nothing. There is NO project, NO container, NO test, NO partial implementation and
#  NO placeholder that throws behind the route named below, and there is no workflow anywhere in this
#  store for the capability area that will eventually own it - the schema's target enum is CLOSED and
#  the four deferred names are absent from it, so a definition that tried to target one could not be
#  written down at all. Naming the area here says where the gap will be filled; it cannot claim that
#  it has been. `../../docs/DEFERRED.md` carries the deferred roster, the objects assigned to each
#  area and the reserved-route metadata, and IT IS NOT RESTATED HERE (C-D).
# ==================================================================================================
deferredCapabilities:
  - capability: >-
      MENU RENDERING, AND EVERYTHING THE SERVICE DOES IN ORDER TO PERFORM IT: the window-rectangle
      query that anchors the popup and the placement conversions applied to the click coordinates
      [`ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L187`, `:L189`]; the
      four device-unit conversions [`:L1241`, `:L1243`, `:L1409`, `:L1411`]; the four font objects
      created to measure text [`:L1092`, `:L1098`, `:L1266`, `:L1277`], all eight of which sit inside
      the two automatic-column-width functions that begin at [`:L1085`] and [`:L1260`] and nowhere
      else in the object; the popup-menu-typed submenu surface - the item model's own member at
      [`:L18`] and the overload block at [`:L96-L106`]; and the theme background style the fixture
      sets at [`ws_objects/pfw.tests.pbl.src/w_test_dwsvc_contextmenu.srw:L86`], which is present in
      the oracle and is deliberately left out of the capture. TO COVER THIS WOULD REQUIRE a window
      system to query, a device context to convert against and a font engine to measure with - none of
      which exists in a headless service, and none of which is created in this phase.


      WHAT SHIPS INSTEAD, SO THE GAP IS BOUNDED RATHER THAN OPEN-ENDED: the complete menu ITEM MODEL,
      characterized above - labels, images, tip texts, identifiers, enabled and split flags,
      menu-owner flags, separator entries with their suppression decisions, submenu presence as
      headless metadata in place of the popup-menu-typed member, and the LOGICAL side of the width
      computation. The two automatic-width entries THEMSELVES ship in the model and are recorded
      there; only their effect is absent. Each deferred piece is surfaced as DATA over the contract
      rather than dropped, which is what makes the gap enumerable: a reader can list precisely what
      does not ship by reading this entry.
    deferredTo: DesignSystem
    reservedRoute: "/v1/design/**"

# ==================================================================================================
#  THE DETERMINISM MASK - INLINE, SYMMETRIC, AND EVERY ENTRY WITH ITS REASON
#  ------------------------------------------------------------------------------------------------
#  The mask is a MEMBER of this definition rather than a pointer to one, because a mask that drifts
#  away from its workflow silently invalidates every pair captured under it. EVERY ENTRY APPLIES TO
#  BOTH SIDES: masking only the candidate leaves the master holding a value that can never be matched,
#  and masking only the master inverts the same problem. One configuration, used for both captures.
#  `../../docs/PARITY.md` section 5.1 is the authoritative seam register and carries each seam's
#  injection point and its own status; the first two entries below are this workflow's application of
#  two of its four rows, and the last four are seams specific to this oracle that no register row
#  anticipates - which the schema explicitly admits, since the seam member is deliberately not a
#  closed list. PREFER A SEAM TO A MASK: a seam makes a field reproducible and leaves the comparison
#  able to detect something in it, whereas a mask removes the field from the comparison entirely.
#  Four of the six below are seams; two are genuine exclusions and say so.
# ==================================================================================================
determinismMask:
  - seam: >-
      Every clock read reachable from this service - any timestamp that reaches a recorded field or a
      recorded decision, on either side.
    method: >-
      Inject the clock and substitute a deterministic double that advances only when the test advances
      it. Nothing in this service branches on a clock value, so the substitution changes no path; it
      only makes a recorded timestamp reproducible. This is a SEAM rather than a mask, deliberately: a
      masked field is a field a regression can hide in.
    appliesTo: [legacy, dotnet]
    reason: >-
      A timestamp differs on every run BY DEFINITION RATHER THAN BY BEHAVIOUR, so an unmasked one
      reports a difference on every comparison and trains a reviewer to ignore red results. NOTE WHAT
      THIS IS NOT: seaming the clock does not introduce a timing assertion. No elapsed value is
      recorded or compared anywhere in this workflow, and this service emits no timing field of its own
      for one to be derived from.
  - seam: >-
      Modify-call ordering - the sequence of describe and modify calls the service issues while
      building the item model and while writing values back. The build path is describe-heavy: the band
      at the pointer, the header height, the clicked column's type, its edit style, its editability, its
      protection, the checkbox on and off values, and the drop-down display and data column names are
      all read through describe calls before a single item is added.
    method: >-
      Fix the order in which the service issues its describe and modify calls, route them through one
      injected surface whose calls a test records in order, and record them in that fixed order on both
      sides.
    appliesTo: [legacy, dotnet]
    reason: >-
      Two orderings that reach the same state can emit different intermediate output, so an unpinned
      order surfaces as a difference where no behaviour changed. FIXING THE ORDER IS NOT THE SAME AS
      FIXING THE OUTCOME: every property's value remains fully compared, and a genuine change in what a
      describe returns is still detected. Whether a modify was issued AT ALL is carried separately, for
      the same reason - a port that emits a write the legacy would not have made is a divergence even
      when the resulting value agrees.
  - seam: >-
      The right-click coordinates carried in the two platform mouse-event payloads, and the pointer
      position the band fallback reads when the band at the pointer resolves to a background or
      foreground band.
    method: >-
      Substitute ONE FIXED LOGICAL COORDINATE PER CASE, chosen so that it resolves to the row and
      column object that case intends, and record the substituted coordinate rather than a synthesized
      device one. THEN COMPARE THE RESOLUTION, NOT THE COORDINATE: the band the service resolved, the
      row it resolved, the column object it resolved and the column name it derived from that object
      are all recorded and all fully compared.
    appliesTo: [legacy, dotnet]
    reason: >-
      A raw device coordinate is an ARTIFACT OF HOW THE CLICK WAS SYNTHESIZED - it depends on the
      window's position, its scroll offset and the display it was synthesized against, none of which is
      behaviour. WHAT THE COORDINATE RESOLVES TO IS ENTIRELY BEHAVIOUR, and it is the thing this
      workflow actually turns on: the two entry points are distinguished by nothing else. So the
      coordinate is masked and the resolution is compared, which is the only split that keeps the entry
      points comparable while leaving them detectable.
  - seam: >-
      Line endings in every multi-line recorded field - most consequentially the clipboard text the
      copy features write, the payload the paste feature splits, and the assembled selection record the
      host formats.
    method: >-
      Declare one newline convention for this workflow and apply it identically to both halves AT
      COMPARISON TIME. This is a comparison-time normalization only: IT DOES NOT LICENSE EDITING A
      STORED MASTER, which the technique forbids outright. The legacy's own separators - the
      carriage-return-and-newline pair the copy features join with and the paste feature splits on, and
      the single newline the selection record uses - are recorded as written, because WHICH separator
      the legacy chose is behaviour and only the platform's rendering of it is not.
    appliesTo: [legacy, dotnet]
    reason: >-
      The master is produced on Windows by the legacy framework while the candidate runs in a Linux
      container, so raw line endings differ BY PLATFORM RATHER THAN BY BEHAVIOUR - and the repository's
      root `.gitattributes` declares only language mappings, with NO text rule and NO end-of-line rule
      at all, so nothing normalises them on the way into version control. Without this entry a
      byte-exact comparison reports a difference on every line of every multi-line field. Changing
      `.gitattributes` is NOT in scope and would be the wrong place to solve it: the normalization
      belongs to the comparison, not to the repository's checkout behaviour.
  - seam: >-
      Absolute text widths derived from font metrics - the device-resolved extent the automatic-width
      computation produces once a text has been measured and converted.
    method: >-
      RECORD THE LOGICAL SIDE AND MASK THE DEVICE-RESOLVED SIDE, and be precise about which side each
      recorded value sits on. ON THE LOGICAL SIDE, RECORDED AND FULLY COMPARED: the ordered set of texts
      the computation enumerates, each with its band, its object name and its object type; the two
      logical constants the object declares for padding and for the arrow-button allowance; and the
      narrow-and-wide character count derived from each recorded text at comparison time by the same
      rule on both sides. ON THE DEVICE SIDE, MASKED OUT OF THE COMPARISON ENTIRELY: any extent
      returned by a font measurement, any value that has passed through a unit conversion, and any
      column width applied as a result. The item model itself declares no width field, so no entry in
      it carries a width on either side of the line.
    appliesTo: [legacy, dotnet]
    reason: >-
      The logical side is the headless output and IS behaviour - it is a function of the read-only
      definition and its rows, it is reproducible, and a difference in it means the port enumerated
      different text. The device side BELONGS TO THE DEFERRED RENDERING HALF and must not be compared
      at all: it varies with the display, the device context and the installed font, none of which the
      candidate has, so comparing it would report a difference on every run for a capability that does
      not ship. This is the one entry in the mask that is a genuine exclusion rather than a seam, and it
      is an exclusion because the value cannot be made reproducible without implementing the very half
      that is deferred (C-D).
  - seam: >-
      Clipboard content provenance - the ambient system clipboard the service reads WHILE IT IS
      BUILDING THE MENU, not when the selection is dispatched.
    method: >-
      SEED THE CLIPBOARD FROM FIXTURE DATA before the paste case rather than reading ambient system
      state, and pass the seeded text in as an explicit input on both sides so that the read is an
      injected value rather than an environmental one. Record the seeded payload verbatim alongside the
      values it produced.
    appliesTo: [legacy, dotnet]
    reason: >-
      Ambient clipboard content is ENVIRONMENTAL, NOT BEHAVIOURAL: it depends on whatever was last
      copied on the machine, so it can differ between the two halves of one pair and makes the paste
      case unrepeatable - which fails the golden-master technique's one hard prerequisite. The read's
      TIMING makes it worse than it first looks: because the clipboard is read at menu-build time, an
      ambient read changes not only WHAT a paste selection does but WHETHER THE PASTE ITEM APPEARS IN
      THE MODEL AT ALL, so an unseeded clipboard would perturb the item model itself and not merely one
      feature's result. Seeding it is therefore a seam on the item model as much as on the paste. The
      seeded payload is assembled from the fixture's own values and carries nothing sensitive (C-F).

# ---- WHAT IS DELIBERATELY NOT MASKED, STATED EXPLICITLY --------------------------------------------
#  These are the behaviour under test. Masking any one of them would produce a comparison that passes
#  while proving nothing, which is worse than a comparison that fails:
#    * EVERY ITEM LABEL, IMAGE ARGUMENT AND TIP TEXT, byte for byte, including the empty image string
#      the fixture passes and including every label that is not written in Latin script;
#    * EVERY ITEM IDENTIFIER, as its raw number - the three custom ones and all eight built-in ones;
#    * EVERY ENABLED FLAG, including the third custom item's cleared one;
#    * EVERY SPLIT FLAG, both as the model holds it and as the built menu received it - they differ;
#    * EVERY SEPARATOR ENTRY, its single-hyphen text, and every suppression or collapse decision;
#    * THE ITEM ORDER, and every one-based position derived from it;
#    * THE LOGICAL TEXT WIDTH MEASURE - the enumerated texts, their order and the two logical constants;
#    * THE SELECTED IDENTIFIER and the pipeline outcome it was reached through;
#    * THE FORMATTED SELECTION RECORD, field by field and as assembled;
#    * BOTH VETO OUTCOMES, as raw return values, and the different effect each one has;
#    * EVERY RESULTING CELL AND COLUMN VALUE after every headless built-in feature, with its item status;
#    * EVERY CLIPBOARD TEXT the copy features write, verbatim;
#    * THE MAP'S INSERTION ORDER, its count, its keys and its positional-get results;
#    * EVERY STRUCTURED ERROR'S message key, arguments, assembled text, category, severity and code.
#  And nothing is masked on one side only, anywhere, ever.

# ==================================================================================================
#  THE DEFECTS AND QUIRKS THIS PAIR EXISTS TO PROVE SURVIVED
#  ------------------------------------------------------------------------------------------------
#  THE INVERSION IS LOAD-BEARING: a capture that shows CORRECTED behaviour is a parity FAILURE, not an
#  improvement. Where the target produces output that looks more correct than the oracle, the finding
#  is a divergence IN THE TARGET and is filed as a defect (C-B). A legacy defect is reproduced and
#  annotated at its point of reproduction, never repaired. `../../docs/PARITY.md` section 7 is the
#  authoritative catalogue of behaviour groups; the entries below record which of them THIS pair pins.
# ==================================================================================================
provesDefects:
  - defect: >-
      D-01. THE BOUNDARY BETWEEN CUSTOM AND BUILT-IN IDENTIFIERS IS A SINGLE STRICT COMPARISON AGAINST
      10000, AND THE BOUNDARY VALUE IS ITSELF A REAL DISPATCHABLE IDENTIFIER. The host classifies a
      selection by testing whether the identifier is strictly less than 10000: the fixture's three
      custom identifiers are 100, 101 and 102, and every built-in identifier is at or above the
      boundary. Both the value and the strictness are behaviour, and the reason the strictness matters
      is that the object declares TWO CONSTANTS WITH THE SAME VALUE - the reserved-start sentinel and
      automatic-column-width are both 10000 - so the boundary is not a gap between two ranges but a
      real, selectable entry. An implementation that treated the sentinel as reserved-and-unused, or
      that used a non-strict comparison, would misclassify that one entry.


      TWO FURTHER MISCOUNTS FALL OUT OF THE SAME LINES, and both are preserved rather than tidied. The
      fixture's header comment enumerates FOUR built-in features while the object declares EIGHT
      identifiers governed by FIVE flags: the comment folds set-and-clear into one feature, omits
      invert-check entirely, and omits both automatic-width identifiers. And the build loop's own
      feature filter names only TWO of the three check identifiers - set and clear - so a host that
      turns the check flag off from inside its initializer hook, after the items have been added but
      before the loop runs, removes two of the three and LEAVES THE THIRD IN THE MODEL.
    locator: >-
      ws_objects/pfw.tests.pbl.src/w_test_dwsvc_contextmenu.srw:L96, with the eight identifiers at
      ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L37-L45, the two sharing 10000 at :L37
      and :L38, the five flags at :L49-L53, the fixture's four-feature comment at
      ws_objects/pfw.tests.pbl.src/w_test_dwsvc_contextmenu.srw:L44-L52, and the filter at
      ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L157-L168
    note: >-
      WHAT A WELL-MEANING CORRECTION WOULD BREAK. Renaming or de-duplicating the two constants that
      share 10000 would look like hygiene and would change the classification of a real entry. Adding
      the missing invert-check identifier to the filter would look like a bug fix and would remove an
      entry the oracle keeps. And "correcting" the fixture's four-feature comment to six or eight would
      change nothing observable but would remove the evidence that the four it names are precisely the
      headless ones - which is the observation that draws the split in the first place. Constant
      identifiers additionally keep their legacy screaming-snake spelling in the port because they
      appear in serialized payloads, log records and these recordings, so a rename would silently
      invalidate every stored comparison; `../../docs/PARITY.md` section 1.7 is the authority.
