      map. With no oracle window for either container anywhere in the corpus, the map's only in-scope
      exercise - the column-value map in this service's own paste path - is where it is characterized.
      `./README.md` holds the full correction register and is the authority for this displacement; it is
      cross-referenced rather than restated.

# ---- THE SHARED-VOLUME CAPTURE RULE ---------------------------------------------------------------
#  `applies: true`. THE RULE'S CANONICAL TEXT IS OWNED BY `../README.md` SECTION 2.1 AND IS CITED HERE
#  RATHER THAN REPRODUCED - the same text is carried word for word by that file, by
#  `../../docs/PARITY.md` section 4.2 and by `../../orchestration/README.md`, and a fourth copy would be
#  a fourth thing to drift, which is the failure this store exists to prevent rather than to commit.
#
#  WHY IT APPLIES EVEN THOUGH THIS WORKFLOW'S ROWS ARE INLINE IN A READ-ONLY FIXTURE AND ITS SEED
#  TOUCHES NO DATABASE. The exemption in `../README.md` section 2.7 is narrow and is NOT a loophole: it
#  holds only while a workflow reads and writes NOTHING, and the store's only exempt row is the paging
#  behaviour, which is a pure string transform. THIS WORKFLOW DOES NOT QUALIFY. The target half is
#  captured against the running service rather than an in-process host; the check and paste features
#  WRITE into a live buffer, and the paste feature INSERTS ROWS when its payload is longer than the row
#  count; and both copy features accept pending edit text before they read. A volume state that moved
#  between the two halves would change the input the second half ran against, and nothing would report
#  it. The rule is therefore honoured in full, including its teardown corollary in section 2.6: between
#  the two halves, tear the stack down with a plain down and NEVER with the flag that removes named
#  volumes.
sharedVolume:
  applies: true

# ---- HONEST STATE --------------------------------------------------------------------------------
#  NOTHING HERE HAS BEEN RUN, AND THE ONLY LEGAL VALUE SAYS SO. No paired capture exists on either
#  side. `characterization/recordings/` IS present - both halves exist and carry their own readmes - but
#  neither holds a recording for this identifier, and the blocker is one-sided: the legacy half needs a
#  PowerBuilder toolchain that is not present. Nothing in this
#  definition may be read as reporting a parity result, and the schema's single-member enumeration is
#  what makes that structural rather than a matter of trust.
executionStatus: specified-not-executed

# ---- SIBLINGS ------------------------------------------------------------------------------------
#  A cross-reference only: each pair stays independently comparable under its own identifier, and no
#  definition here merges with another. The event chain is cited because THIS SERVICE RUNS INSIDE IT -
#  its two semantic events are two of the chain's nine, and the ordering discipline this capture is
#  taken under is assigned there rather than re-derived here. The other three are the siblings that
#  share the split: column sort and drop-down search are the other two presentational services whose
#  headless halves ship, and row-select is the one that needed no split at all, which is the contrast
#  D-07 rests on. The two behaviours this store reports BLOCKED belong to siblings rather than to this
#  workflow - pinyin first-letter matching to the drop-down search definition, and cross-session
#  foreign expression variables to the column-expression definition - which is why this definition
#  declares no blocked behaviour of its own.
relatedWorkflows:
  - dataservices-dw-event-chain
  - dataservices-dwsvc-columnsort
  - dataservices-dwsvc-dropdownsearch
  - dataservices-dwsvc-rowselect
