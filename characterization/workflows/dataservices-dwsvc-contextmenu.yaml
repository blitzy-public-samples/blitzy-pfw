    locator: >-
      ws_objects/pfw.tests.pbl.src/w_test_dwsvc_contextmenu.srw:L90, with the loop that emits it at
      ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L156-L185 and the split-carrying branch
