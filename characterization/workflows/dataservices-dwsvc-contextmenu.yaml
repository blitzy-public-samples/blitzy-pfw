# yaml-language-server: $schema=./workflow.schema.json
# ==================================================================================================
#  dataservices-dwsvc-contextmenu - THE HEADLESS MENU ITEM MODEL, AND THE COLUMN-VALUE ORDERED MAP
#  ------------------------------------------------------------------------------------------------
#  THIS DEFINITION HAS TWO JOBS, AND THE SECOND ONE IS HERE BY CORRECTION RATHER THAN BY DESIGN.
#    1. It characterizes the HEADLESS HALF of the DataWindow context-menu service - the menu ITEM
#       MODEL. This is the most presentational of the five attached services, so the split between
#       what ships and what does not is the defining feature of the capture rather than a footnote.
#    2. It carries the ORDERED-MAP COVERAGE that was displaced here after the container's nominated
#       oracle turned out not to be one. `../README.md` section 4.6 nominates
#       `ws_objects/pfw.tests.pbl.src/w_test_static_map.srw` for the ordered map on the strength of
#       its name. THE NAME IS A FALSE FRIEND: read in full - it is 82 lines - that window creates an
#       `n_httpclient` at `:L55` and `:L58`, issues an HTTP `GET` against a public third-party
#       static-map endpoint across `:L55-L66`, and calls `SetPicture` into a control declared
#       `from picture` at `:L7` and `:L74`, sizing the request through the unit conversions on
#       `:L66`. Its dependencies are OUTBOUND HTTP and A PICTURE CONTROL - two deferred capability
#       areas - and it reaches a LIVE THIRD-PARTY ENDPOINT, which destroys the repeatability the
#       golden-master technique names as its one hard prerequisite. It therefore carries no workflow
#       at all: C-D rules it out on the first ground and the second would rule it out even if the
#       capability areas shipped. "Static map" names a static map IMAGE, not the ordered map.
#
#       AND THERE IS NO ORDERED-MAP ORACLE WINDOW ANYWHERE. Searching for the ordered-map and vector
#       container types across EVERY file in `ws_objects/pfw.tests.pbl.src/` and
#       `ws_objects/pfw.demos.pbl.src/` returns nothing - neither container is exercised anywhere in
#       the fixture corpus. The container's only in-scope exercise is the column-value map inside
#       this service's own paste path, so this is where it is characterized, and it is the
#       container's ONLY paired coverage in the store. Its pure contract - independent of any
#       DataWindow - is unit-test matter in `PowerFramework.Shared.Containers.Tests`, on the same
#       ground the return-code algebra is: a behaviour with no oracle recording cannot be paired,
#       and a unit test that pins a pure function is not weakened by the absence of one.
#       `./README.md` holds the full correction register and is the authority for both findings.
#
#  THIS FILE SPECIFIES A CAPTURE. IT CONTAINS NO CODE AND NO CAPTURED VALUE.
#  It conforms to `./workflow.schema.json`, which is authoritative for shape. Store-wide conventions
#  - the capture rule's canonical text, the recording-file conventions, the seam register and the
#  defect roster - belong to `../README.md` and `../../docs/PARITY.md` and are CITED here, never
#  restated. A fourth copy of a rule three files already own word for word is a fourth thing to
#  drift. The deferred roster belongs to `../../docs/DEFERRED.md` and is likewise cited, not copied.
#
#  ---- THE HEADLESS / RENDERING SPLIT, AND THE EVIDENCE THAT DRAWS IT WHERE IT IS ----------------
#  `../../docs/DEFERRED.md` section 6.2 fixes the split for this service: the COMPLETE MENU ITEM
#  MODEL ships in DataServices - labels, ids, enabled and split flags, and computed logical text
#  widths - while DPI-to-pixel conversion, font measurement, window geometry and actual rendering
#  are DEFERRED and named as a reserved Gateway extension point. Section 6.1 of the same document
#  carries the measured type-position evidence, and this capture adds one finding that makes the
#  line sharper than a locator list can: ALL FOUR font creations and ALL FOUR unit conversions in
#  the service live inside its TWO automatic-column-width functions, which begin at
#  `n_cst_dwsvc_contextmenu.sru:L1085` and `:L1260`. Nothing else in the object measures or converts
#  anything. THAT IS WHY THE FIXTURE'S OWN HEADER COMMENT ENUMERATES FOUR BUILT-IN FEATURES AND
#  OMITS AUTOMATIC COLUMN WIDTH: the four it names are precisely the headless ones. A documented gap
#  is deliberately preferred to a partial implementation (C-D, and the migration plan's own reading
#  that a half-built deferred service is worse than a documented gap).
#
#  ---- THREE READINGS CORRECTED AGAINST THE SOURCE ----------------------------------------------
#  Each was read line by line rather than copied forward, and each correction is load-bearing
#  because a capture written against a withdrawn reading asserts a behaviour the oracle does not
#  exhibit - the one failure a characterization suite cannot survive.
#    * THE EMPTY STRING ARGUMENT IS AN IMAGE, NOT AN ACCELERATOR. The four `of_AddMenu` overloads at
#      `n_cst_dwsvc_contextmenu.sru:L70-L74` are (text, image, tiptext, enabled, id), (text, image,
#      id), (text, image, enabled, id) and (text, image, tiptext, id). The fixture's four-argument
#      call binds the third of those, so its `""` lands in the item model's IMAGE field at `:L15`.
#      No accelerator parameter exists anywhere in the object.
#    * THE ITEM-TEXT ACCESSOR'S FLAG IS `byposition`, NOT A CHOICE OF LABEL RENDERING. The prototype
#      at `:L91` reads `of_gettext(readonly unsignedlong id, readonly boolean byposition)` and the
#      body at `:L554-L560` branches `if byPosition then nIndex = id else nIndex = of_GetIndex(id)`.
#      False means resolve the argument as an IDENTIFIER; true means treat it as a ONE-BASED
#      POSITION. That is a far more consequential distinction than a rendering choice, and it is why
#      both flag values are captured - see defect D-05 and defect D-06.
#    * THE FIXTURE HAS TWO DROP-DOWN-DATAWINDOW COLUMNS AND ONE DROP-DOWN LIST BOX, NOT THREE OF THE
#      FORMER. `dw_svc_sample_contextmenu.srd:L25` and `:L26` carry `dddw.name=dw_svc_sample_dddw`;
#      `:L27` is a `ddlb` column whose three display-and-data pairs come from its OWN inline value
#      list at `:L11`. Both paths reach the same value-map accessor, so the capture covers both and
#      names which is which rather than treating them as one.
#
#  ---- ORDER AND VALUES, NEVER SPEED (C-K, and `../README.md` section 6.4) -----------------------
#  No elapsed value is recorded and no timing is asserted anywhere in this workflow. The repository
#  publishes no service-level agreement, no latency budget, no throughput target and no availability
#  commitment, so there is nothing a timing assertion could be measured against. The only
#  quantitative gate in the brief is 80% per-service line coverage, read from
#  `coverage.cobertura.xml` in CI - not from this store. `../../docs/BUILD.md` is the authority for
#  the command and the report path.
#
#  ---- WHAT THIS DEFINITION DELIBERATELY OMITS, AND WHY -----------------------------------------
#    * `blockedBehaviours` - OMITTED because this workflow blocks nothing. The store's two blocked
#      cases belong to siblings: pinyin first-letter matching to `dataservices-dwsvc-dropdownsearch`
#      and cross-session foreign expression variables to `dataservices-dwsvc-columnexp`. Neither is
#      reachable from the menu item model or the value map, and claiming either would misattribute a
#      known gap. Said here so the member's absence is not read as an oversight.
#    * `redaction` - OMITTED because nothing this capture records is sensitive. Every value that
#      reaches a recording originates in the read-only fixtures' own inline rows - two decimal
#      columns, one numeric column rendered as a checkbox over one and zero, and three status
#      columns of three-letter codes - and the clipboard payload the paste case consumes is
#      FIXTURE-SOURCED for exactly this reason. NO KEY, NO PASSWORD, NO CERTIFICATE, NO TOKEN AND NO
#      CONNECTION STRING IS READ, EMITTED OR RECORDED HERE (C-F). This service issues no SQL, so the
#      redacted-statement rule has no field to act on.
#
#  ---- GOVERNING CONSTRAINTS --------------------------------------------------------------------
#  NO USER-SPECIFIED RULES EXIST. The project's rules document returns exactly one line reporting
#  that none were provided - a single line, with nothing further to page through. No rule is
#  invented, inferred or back-filled, and nothing in this file exists because of one;
#  enterprise-standard best practice applies in their place. The binding constraints are the
#  migration plan's own: C-B (defects reproduced, never corrected - a CORRECTED capture is a parity
#  FAILURE), C-C (the legacy tree is read-only and is the oracle; every claim carries a locator),
#  C-D (nothing for a deferred capability area, not even a stub), C-F (no secret value), C-K (every
#  decision carries its reason) and C-L (the shared-volume capture rule).
# ==================================================================================================

schemaVersion: "1"

workflowId: dataservices-dwsvc-contextmenu

title: >-
  Context-menu service: the headless menu item model, its two vetoable hooks, and the column-value
  ordered map

capabilityArea: >-
  The headless half of the DataWindow context-menu service `n_cst_dwsvc_contextmenu` - the menu ITEM
  MODEL it builds (labels, images, tip texts, identifiers, enabled and split flags, submenu
  presence, separator entries and their suppression rules, and computed logical text widths), the
  two entry points that produce structurally different models, the boundary between custom and
  built-in menu identifiers, the two adjacent vetoable hooks and their two different veto meanings,
  the headless built-in features and their effects on cell and column values, and the column-value
  ORDERED MAP the paste feature resolves display values through - its insertion order and its
  positional get by integer index.

targetService: DataServices

description: >-
  ONE MENU, BUILT AND DISPATCHED TWICE. The pair proves that the item model this service builds, the
  identifier a selection carries, the effect each headless built-in feature has on the fixture's
  values, and the two veto outcomes are identical on the legacy master and on the .NET candidate
  after identical masking.


  JOB ONE - THE HEADLESS ITEM MODEL. The item model is a structure of eight fields declared at
  `ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_contextmenu.sru:L12-L21`, and seven of
  them are headless: enabled, text, image, tip text, identifier, split and menu-owner. The eighth is
  typed on the popup-menu class at `:L18` and is the single point at which the structure reaches
  into the deferred half; the candidate substitutes headless submenu metadata for it rather than
  holding the popup-menu type. Everything the capture records about a menu comes out of that
  structure and out of the build loop at `:L156-L185` that projects it.


  JOB TWO - THE DISPLACED ORDERED-MAP COVERAGE, AND WHY AN ORDERED-MAP CONCERN LIVES IN A
  CONTEXT-MENU WORKFLOW. `../README.md` section 4.6 nominates the static-map window as the ordered
  map's oracle; that window is a third-party static-map IMAGE fetch over outbound HTTP into a
  picture control, so it depends on two deferred capability areas and on a live network endpoint and
  carries no workflow. Searching both fixture libraries for the ordered-map and vector container
  types returns nothing, so THERE IS NO ORDERED-MAP ORACLE WINDOW AT ALL. The container's only
  in-scope exercise is the column-value map that `n_cst_dwsvc.sru` builds at `:L583-L585` and that
  this service consumes at `n_cst_dwsvc_contextmenu.sru:L948`, so that is where its insertion order
  and its positional get by integer index are characterized - and this is the container's only
  paired coverage in the store. `./README.md` holds the full correction register.


  THE SPLIT IS THE DEFINING FEATURE, AND ITS REASON IS MEASURED RATHER THAN ASSERTED (C-K). This is
  the most presentational of the five attached services: it queries a window rectangle, converts
  logical units to device pixels in four places, creates a font object in four places to measure
  text, and publishes a submenu surface typed on the popup-menu class. The contrast that makes the
  split evidence-driven rather than arbitrary is in the same folder - `n_cst_dwsvc.sru` is 864 lines
  with ZERO presentation references and `n_cst_dwsvc_rowselect.sru` has exactly ONE, so the
  row-select service ships whole while this one is split. One finding sharpens the line further:
  every one of the four font creations and every one of the four unit conversions sits inside the
  two automatic-column-width functions and nowhere else, which is why the fixture's own header
  comment names four built-in features and silently leaves automatic column width out of them.


  WHAT THAT MEANS FOR THIS CAPTURE. The item model, the identifier dispatch, the veto outcomes, the
  resulting values and the value map are all recorded. Window geometry, unit conversion, font
  measurement, the theme background style's effect and any rendering are NOT - they are declared in
  `deferredCapabilities` as a documented gap behind a reserved route, and no mask entry, no
  precondition and no recorded output targets them. The one width the capture does record is the
  LOGICAL one the item model computes, expressed as a character-count measure and two logical
  constants; any device-resolved width is masked out, and the mask entry says which side of that
  line each recorded width sits on.


  NO DATA VALUE RECORDED HERE IS SENSITIVE. Every captured value - including the clipboard payload
  the paste case consumes, which is seeded from fixture data rather than read from ambient system
  state - originates in the read-only fixtures' own inline rows. Nothing is read from a credential,
  a key store or a connection string (C-F).

