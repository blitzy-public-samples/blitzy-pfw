    note: >-
      WHAT A WELL-MEANING CORRECTION WOULD BREAK. Omitting a disabled entry is the obvious "improvement"
      and it is the one that does the most damage here: it shortens the model, shifts every following
      ONE-BASED POSITION down by one, and therefore changes the answer to every position-based read in
      this capture - including the item-text accessor's by-position form and the two positions either
      side of the range. The model would still look plausible and every identifier-based read would still
