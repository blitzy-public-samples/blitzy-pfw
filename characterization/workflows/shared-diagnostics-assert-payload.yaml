# ---------------------------------------------------------------------------------------------

# The rule applies. Its canonical text is characterization/README.md section 2.1 and is cited from
# the top-level description and the capture-phase preconditions rather than reproduced here - the
# same text is owned word for word by docs/PARITY.md section 4.2 and orchestration/README.md
# section 7.2, and a fourth copy would be a fourth thing to drift. No exemption is claimed: this
# workflow reads and writes no persistent state, but the exemption is narrow and claiming it would
# add nothing, so the volume state is left undisturbed across both halves of the pair exactly as it
# would be for a workflow that did touch storage.
sharedVolume:
  applies: true

# No paired capture has been taken, on either side. The legacy half needs a PowerBuilder toolchain
# that is not present, and nothing in this definition implies a verified run or a parity result.
executionStatus: "specified-not-executed"

relatedWorkflows:
  # Owns the same system-error handler from the composition-root side: the initialize and finalize
  # pairing, and the same fail-fast posture on a structural fault.
  - "gateway-lifecycle-composition-root"
  # The same fail-fast posture in the persistence layer, where worker-session creation failure is
  # likewise fatal rather than degraded.
  - "persistence-thread-task-lifecycle"
  # The event broker's ordering and veto semantics. Related because the broker is the other shared
  # library whose behaviour is carried by an opaque packed string whose encodings must be decomposed
  # rather than transmitted whole.
  - "shared-eventful-broker-ordering"
