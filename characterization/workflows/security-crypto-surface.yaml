# yaml-language-server: $schema=./workflow.schema.json
#
# Characterization workflow definition - the cryptographic surface.
#
# THE ABSOLUTE RULE FOR THIS FILE: no secret value, in any form, anywhere. Not a key,
# not a certificate, not a credential, not a fragment of one, and not an obviously
# expired one. The only oracle this capability has is itself one of the repository's
# hardcoded-secret sites, so this definition drives it with INJECTED test key material
# and cites the fixture's own embedded material by locator only, through
# ../../docs/SECRETS.md. Locators live there; values live nowhere.
#
# This file specifies a capture. It carries no code and no value.

schemaVersion: "1"
workflowId: security-crypto-surface
title: >-
  Security cryptographic surface - the keyed and unkeyed operation set, driven with injected test
  key material
capabilityArea: >-
  The cryptographic surface: unkeyed hashing, keyed hashing, encoding conversion, the three
  symmetric cipher families, the asymmetric encrypt, decrypt, sign and verify set, and random
  generation - together with the seven weak legacy defaults that are preserved as defaults and
  annotated as known legacy weaknesses rather than corrected
targetService: Security

description: |
  WHAT THIS PAIR EXERCISES

  One paired golden-master capture over the whole cryptographic operation surface: unkeyed
  hashing of text and of a file, keyed hashing, the two encoding conversions in both
  directions, symmetric encryption and decryption across the three cipher families, the
  asymmetric encrypt, decrypt, sign and verify set with its three rejection outcomes, and
  the three random generators. It pins seven weak legacy defaults so that a later change
  cannot strengthen one of them without a recorded comparison failing.

  NO CRYPTOGRAPHIC TEST WINDOW EXISTS, AND THAT IS A FINDING RATHER THAN A GAP IN THIS FILE

  There is no w_test_crypto.srw among the 47 legacy test windows, and no fixture window for
  this capability exists anywhere in the repository. A reader looking for one will not find
  one, which is why the absence is recorded here instead of being left to a search.
  characterization/README.md section 4.6 states the same finding and names it a risk rather
  than an omission. The sole oracle is therefore a tab page inside a demo container:
  ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru, hosted by
  ws_objects/pfw.demos.pbl.src/w_demo.srw.

  THE ORACLE IS A SECRET-BEARING SITE - READ THE WARNING BEFORE OPENING IT

  That tab page is one of the repository's eight in-source hardcoded-secret sites. It embeds
  two distinct plaintext private keys in event scripts, defaults an encryption key and an
  initialization vector to plain guessable strings in fields that are not even masked, and
  hardcodes a keyed-hash key. ../../docs/SECRETS.md is the authority: site 8 and its
  section 2.6 carry every locator, its severity and its required action. This definition
  cites those locators and reproduces no value from any of them, in any form - not pasted,
  not excerpted, not abbreviated, not folded into another encoding, not hashed, and not
  "redacted but included". The capture is consequently driven with injected test key
  material only, and the fixture's embedded material is never read, never used, never
  echoed, never captured and never stored.

  Because the whole object is a secret-bearing site, the store-wide rule in
  characterization/README.md section 6.2 applies to every recording taken under this
  workflow and not merely to this document: no recording may capture, echo or store key
  material, a certificate, a password or a token.

  THE CONTRACT-LEVEL RULE THAT MAKES THAT STRUCTURAL RATHER THAN A MATTER OF REVIEW

  Callers never send key bytes. A caller passes an opaque key reference and Security
  resolves it against its own configured key store, so there is no request field into which
  a key could be placed. ../../docs/CONTRACTS.md section 5.2 defines that rule and its error
  behaviour for the cryptographic contract and ../../docs/SECRETS.md section 4.5 records it
  from the secrets side; neither is restated here. One consequence bears on the asymmetric
  cases below: key generation returns the public key and a reference to the private key, and
  the generated private key is retained by Security and never returned to the caller.

  THE SEVEN PRESERVED DEFAULTS ARE ANNOTATED, NOT REMEDIATED

  Every item in provesDefects below is a weak cryptographic default. Each is preserved as
  the default and annotated as a known legacy weakness, and annotation is the whole
  remediation: none is silently strengthened and no safe mode is added alongside it. The
  list is therefore not a remediation backlog, and it must not be read as one. A capture
  that shows a strengthened default is a parity FAILURE and is filed as a divergence in the
  target, because behaviour preservation forbids improvements as firmly as it forbids
  regressions.

  WHAT IS NOT CAPTURED

  Four things, stated so that their absence is a decision rather than an oversight. First,
  the fixture's embedded key values - never read and never recorded. Second, the contents of
  the fixture's own default key and initialization-vector fields, for the same reason.
  Third, any sibling tab page in the same demo container: the two payment-gateway pages and
  the outbound HTTP-client page beside it belong to capability areas that receive no code in
  this phase, and only the cryptographic tab's surface is captured here. Fourth, token
  issuance: minting is net-new with no legacy oracle at all, so it is unit-tested rather
  than characterized, and no pair could exist for it.

  WHAT IS COMPARED WITHOUT BEING MASKED

  The determinism mask below is deliberately narrow. Nothing masks any algorithm, cipher,
  mode or padding identifier; any hash or checksum value over a fixed input; either file
  hash taken over the read-only root binary; the round-trip fidelity of any cipher family;
  any rejection outcome or its error classification, including the two size-limit
  rejections and the no-padding rejection; the failure of decryption to detect a tampered
  ciphertext; the character classes present in a generated random string; or the formatting
  of a generated identifier per flag. Each of those is behaviour, and every masked field is
  a field in which a regression can hide.

  TWO RECORDING RULES THAT APPLY TO EVERY OUTPUT BELOW, STATED ONCE AS RULES

  First, the key-material rule. KEY MATERIAL NEVER APPEARS IN AN OUTPUT. Where an
  operation's result is key material, or contains it, or is derived closely enough from it
  to carry it, the recording holds a placeholder and the material's shape and size - a byte
  length, a modulus size in bits, a produced-or-not verdict - and nothing else. That is why
  key generation records a shape rather than a pair of keys, and why every keyed operation
  records the identifier that selected the algorithm rather than the key that keyed it. The
  capturePhase redaction member declares the same fields field by field, so the rule is
  enforced in two places rather than trusted once.

  Second, the artifact rule. Every recording artifact is TEXT-BASED AND DIFFABLE, and no
  artifact on this surface may be a binary dump. That constraint bites harder here than
  almost anywhere else in the store, because ciphertext, digests, checksums and signatures
  are all binary-shaped by nature: dumped raw, a reviewer sees only that two files differ
  and never what differed, and a parity failure becomes detectable without becoming legible.
  Each is therefore projected into a stable textual encoding - lower-case hexadecimal for
  bytes, the operation's own returned string where it returns one - and each artifact is
  named with one of the seven extensions this store admits. The six extensions the
  repository's root .gitignore carries unanchored cannot be spelled here at all: an artifact
  named that way would be silently untracked, present on the machine that produced it and
  absent from review and from CI, so the comparison would look taken and be unfindable. The
  root .gitignore is not modified to accommodate a name; the name is chosen correctly.

  NO TIMING, AND A SECOND REASON FOR THAT BEYOND THE STORE-WIDE ONE

  No timing value is recorded as an assertion anywhere in this definition: no throughput
  figure, no key-generation duration, no elapsed time. The repository publishes no
  service-level agreement, no latency budget, no throughput target and no availability
  commitment to assert one against, and the only quantitative gate in the whole project is
  80% line coverage per in-scope service, measured from coverage.cobertura.xml in CI rather
  than from anything in this store. Cryptography invites a throughput or key-generation-time
  claim more than most capability areas, and it carries its own additional reason to record
  none: timing measurements over cryptographic operations are themselves a side channel, and
  a recorded one is a published one. The oracle emits no timing field of its own, so nothing
  needs recording-and-excluding either.

  WHY THIS PAIR HAS NOT BEEN RUN

  n_crypto is declared native over a closed binary and its 86 lines are declarations only -
  there is no PowerScript body for any operation on the surface. The legacy half therefore
  needs the Windows PowerBuilder toolchain and the closed binary, neither of which a Linux
  container can execute, and no paired recording exists on either side. executionStatus is
  specified-not-executed and no member of this document may imply otherwise.

