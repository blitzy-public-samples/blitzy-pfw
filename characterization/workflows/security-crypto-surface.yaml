seedPhase:
  runsOncePerPair: true
  neverBetweenCaptures: true
  steps:
    - action: >-
        Confirm that this workflow's seed performs no destructive setup at all: no file is
        deleted and no DDL is issued. The cryptographic surface opens no storage, so unlike
        the SQLite fixture - whose own setup deletes the database file before opening it and
        then recreates the schema - there is nothing here to tear down and nothing to
        recreate. Recording the absence keeps a later reader from adding a reseed by analogy
        with the workflow next door.
    - action: >-
        Provision an injected symmetric key and an injected initialization vector for the
        capture, generated at capture time by the harness or supplied to it through
        configuration. Both are test-only, both are bound identically on the legacy side and
        the target side, and both are placeholders in the recording rather than values.
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L266"
    - action: >-
        Provision an injected keyed-hash key for the keyed hashing case, on the same terms:
        harness-supplied, test-only, identical on both sides, and a placeholder in the
        recording.
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L449"
    - action: >-
        Generate an injected asymmetric key pair for the signing, verification, encryption
        and decryption cases. The public half is carried into the capture as a placeholder
        recording only its shape and size; the private half is retained behind an opaque key
        reference and never leaves the key store, which is the contract's own arrangement
        rather than a convention adopted for this capture.
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L699"
    - action: >-
        State the reason the material must be injected rather than reused from the fixture,
        because it is the reason this seed phase exists at all and is a different shape from
        every other seed phase in this store. The oracle's own key material is committed to
        version control: driving the capture with it would copy a committed secret into a
        recording, and a recording is reviewed, diffed and published like any other tracked
        file. Injection is what makes the capture possible without replicating a secret. The
        fixture's embedded material is referenced by locator through ../../docs/SECRETS.md
        and is not read by this workflow.
    - action: >-
        Pin the injected symmetric key lengths so that the capture exercises the cipher
        rather than a key-material refusal: a non-empty single-key value, and at least 16
        bytes for the triple-key family. Short key material is right-padded with zero bytes,
        and this platform's cryptographic library refuses the known weak and semi-weak
        single-key values and refuses triple keys whose adjacent sub-keys coincide, where the
        binary the legacy bound did not. ../../docs/CONTRACTS.md section 5.3 records that
        divergence as a property of the key material supplied rather than of the port; the
        seed avoids it so it does not mask the behaviour under capture.
    - action: >-
        Bind the entropy seam and the clock seam to their deterministic doubles on both
        sides before the first capture begins, so the two halves are taken under one
        arrangement. The seams and their injection points are named in the determinism mask
        below and registered authoritatively in ../../docs/PARITY.md section 5.1.

capturePhase:
  behaviourUnderTest: >-
    Every operation the cryptographic tab page drives, taken against the state the seed
    phase established and driven exclusively with the injected test key material that seed
    phase provisioned: unkeyed hashing of a text value and of the read-only root framework
    binary, keyed hashing, base64 and hexadecimal conversion in both directions, symmetric
    encryption and decryption across the single-key, triple-key and 256-bit modern cipher
    families in chained-block mode, the same operations through a mode-omitting overload so
    that the electronic-codebook default is actually reached, asymmetric key generation,
    encryption, decryption, signing and verification together with the two plaintext
    size-limit rejections and the no-padding rejection, and the three random generators.
    What is captured is the observable result of each call, the algorithm, cipher, mode and
    padding identifiers in force for it, and the classification of every rejection - never
    the key material any of them consumed or produced.
  preconditions:
    - >-
      The paired captures are taken under the shared-volume capture rule, whose canonical
      text characterization/README.md section 2.1 owns and which is cited here rather than
      restated because the same wording is owned word for word by three upstream documents
      and a fourth copy would be a fourth thing to drift.
    - >-
      The seed phase has run once and has not run again. No step of it runs between the
      legacy-side capture and the target-side capture.
    - >-
      All key material in play is the injected, test-only material the seed phase
      provisioned. The fixture's own embedded key material is not read, and its locators are
      consulted through ../../docs/SECRETS.md rather than by opening the values.
    - >-
      The injected symmetric key lengths are full-length for each cipher family - a
      non-empty single-key value and at least 16 bytes for the triple-key family - so that
      the capture records the cipher's behaviour rather than this platform's refusal of weak
      and degenerate key material.
    - >-
      The requested random blob and random string lengths stay inside the maximum the target
      contract publishes, so the capture records generation rather than the cap's refusal.
      ../../docs/CONTRACTS.md section 5.4 carries the cap and the legacy domain maximum
      published beside it.
    - >-
      pfw.dll is present at the repository root, unmodified and tracked, because two file
      hashes are taken over it. It is read only, never written, and it is never copied into
      this store.
    - >-
      Text inputs are converted to bytes with the single-byte encoding the fixture uses, and
      the same encoding is pinned on both sides.
    - >-
      The entropy seam and the clock seam are bound to their deterministic doubles on both
      sides.
    - >-
      The target's own key material comes exclusively from configuration injection. No
      literal key, certificate or credential is present in source, in application settings
      or in a container definition on either side of the pair.
  observedOutputs:
    # ---------- Hashing ----------
    - name: hash.text.sha256
      description: >-
        The digest of a fixed text value under the SHA-256 identifier. A difference means the
        digest algorithm, the input bytes or the output rendering diverged - and because the
        input is fixed and the algorithm is deterministic, a difference here is never
        environmental.
      format: >-
        Lower-case hexadecimal digest string exactly as the operation returns it, plus the numeric
        hash-type identifier that selected it
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L404"
    - name: hash.file.crc32
      description: >-
        The checksum of the read-only root framework binary under the CRC-32 identifier. This
        is the strongest capture input on the whole surface: the file is version-controlled
        and never edited, so the expected value is fixed for all time, and no key or
        credential is involved in producing it.
      format: "The checksum string as returned, plus the file path and the numeric hash-type identifier"
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L281"
    - name: hash.file.sha1
      description: >-
        The digest of the same read-only binary under the SHA-1 identifier, captured
        separately from the checksum because it exercises a different family over an
        identical input - which is what makes the pair of them able to distinguish an input
        divergence from an algorithm divergence.
      format: "Lower-case hexadecimal digest string, plus the file path and the numeric hash-type identifier"
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L489"
    - name: hmac.text.sha256
      description: >-
        The keyed digest of a fixed text value under the SHA-256 identifier, produced with
        the INJECTED keyed-hash key. The fixture hardcodes a key literal at this call site;
        that literal is a secret site, is not used, and is not recorded. What is compared is
        the digest produced under the injected key, which is identical on both sides because
        the same injected key is bound on both.
      format: >-
        Lower-case hexadecimal digest string, plus the numeric hash-type identifier and a placeholder
        standing for the key
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L449"
    - name: hash.typeIdentifiers
      description: >-
        The complete hash-type identifier set as the legacy declares it, spellings and values
        alike, spanning the digest families and the one checksum - CRYPTO_HASH_MD5 = 0,
        CRYPTO_HASH_SHA1 = 1, CRYPTO_HASH_SHA256 = 2, CRYPTO_HASH_SHA384 = 3,
        CRYPTO_HASH_SHA512 = 4 and CRYPTO_HASH_CRC32 = 5. Recorded as an output rather than
        assumed, because the recording is where a silent renaming or renumbering would be
        caught.
      format: "Identifier spelling to numeric value, in declaration order"
      locator: "ws_objects/pfw.shared.pbl.src/enums.sru:L928-L933"
    # ---------- Encoding ----------
    - name: encoding.base64.encode
      description: >-
        Base64 rendering of a byte sequence, taken through the blob-to-string direction. The
        two directions are separate entry points on the legacy surface, so they are captured
        as separate outputs rather than inferred from one another.
      format: >-
        The encoded string as returned, plus the numeric encoding identifier and the byte length of the
        input
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L419"
    - name: encoding.base64.decode
      description: >-
        The byte sequence recovered from a base64 string, taken through the string-to-blob
        direction. A difference here with a matching encode output localises the divergence
        to the decoder.
      format: "The decoded bytes rendered as lower-case hexadecimal, plus the numeric encoding identifier"
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L434"
    - name: encoding.hex.encode
      description: >-
        Hexadecimal rendering of a byte sequence through the blob-to-string direction,
        including the letter case the legacy emits, which is itself observable.
      format: >-
        The encoded string exactly as returned, preserving letter case, plus the numeric encoding
        identifier
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L577"
    - name: encoding.hex.decode
      description: >-
        The byte sequence recovered from a hexadecimal string through the string-to-blob
        direction, captured separately for the same reason as the base64 pair.
      format: "The decoded bytes rendered as lower-case hexadecimal, plus the numeric encoding identifier"
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L562"
    - name: encoding.identifiers
      description: >-
        The encoding identifier set as declared - CRYPTO_ENCODING_BASE64 = 0 and
        CRYPTO_ENCODING_HEX = 1 - recorded so that a renumbering cannot pass unnoticed.
      format: "Identifier spelling to numeric value, in declaration order"
      locator: "ws_objects/pfw.shared.pbl.src/enums.sru:L924-L925"
    # ---------- Symmetric ----------
    - name: symmetric.des.cbc.roundTrip
      description: >-
        Encryption then decryption of a fixed plaintext through the single-key legacy cipher
        in chained-block mode, with the injected key and initialization vector. The round
        trip returning the original plaintext byte for byte is the behaviour; the ciphertext
        is compared as well, because this mode with a pinned vector is deterministic.
      format: >-
        Ciphertext rendered as lower-case hexadecimal, the recovered plaintext, a round-trip verdict,
        and the numeric cipher and mode identifiers in force
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L504"
    - name: symmetric.des.cbc.decrypt
      description: >-
        The decrypt half of the single-key round trip captured as its own output, because the
        legacy exposes it as its own call site and a decrypt-only divergence is a different
        finding from a round-trip divergence.
      format: "The recovered plaintext, plus the numeric cipher and mode identifiers"
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L547"
    - name: symmetric.3des.cbc.roundTrip
      description: >-
        The same round trip through the triple-key variant in chained-block mode. Captured
        per family rather than once, because the three families are separate identifier
        values reaching separate implementations and a divergence in one says nothing about
        the others.
      format: >-
        Ciphertext rendered as lower-case hexadecimal, the recovered plaintext, a round-trip verdict,
        and the numeric cipher and mode identifiers
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L637"
    - name: symmetric.3des.cbc.decrypt
      description: "The decrypt half of the triple-key round trip, at its own legacy call site."
      format: "The recovered plaintext, plus the numeric cipher and mode identifiers"
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L622"
    - name: symmetric.aes256.cbc.roundTrip
      description: >-
        The same round trip through the 256-bit modern cipher in chained-block mode,
        completing the three-family matrix.
      format: >-
        Ciphertext rendered as lower-case hexadecimal, the recovered plaintext, a round-trip verdict,
        and the numeric cipher and mode identifiers
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L607"
    - name: symmetric.aes256.cbc.decrypt
      description: "The decrypt half of the 256-bit round trip, at its own legacy call site."
      format: "The recovered plaintext, plus the numeric cipher and mode identifiers"
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L592"
    - name: symmetric.modeOmitted.ecbDefault
      description: >-
        ADDED CASE, NOT SUPPLIED BY THE ORACLE. Encryption through a mode-omitting overload,
        so that the electronic-codebook default is actually reached and characterized. Every
        one of the fixture's six symmetric call sites passes the chained-block mode
        explicitly, so no oracle call reaches the default at all; without this case the
        default that provesDefects item 1 pins would go entirely uncharacterized. The
        overload used is the arity that carries neither a mode nor a vector, which is the
        arity that reaches the default and needs no vector to do so. What is recorded is the
        resulting mode in force - the default resolving to electronic codebook - and the
        ciphertext it produced.
      format: >-
        The numeric mode identifier actually in force, the numeric cipher identifier, and the ciphertext
        rendered as lower-case hexadecimal
      locator: "ws_objects/pfw.crypto.pbl.src/n_crypto.sru:L30"
    - name: symmetric.ecb.blockRepetition
      description: >-
        The observable consequence of the electronic-codebook default: a plaintext built from
        a repeated block encrypts to a ciphertext whose corresponding blocks are identical,
        so plaintext structure survives into the ciphertext. This is the weakness itself made
        visible, and it is compared rather than masked - the determinism is the point.
      format: >-
        Ciphertext rendered as lower-case hexadecimal with block boundaries marked, plus a count of
        repeated ciphertext blocks and the count of repeated plaintext blocks that produced them
      locator: "ws_objects/pfw.shared.pbl.src/enums.sru:L946"
    - name: symmetric.tamperedCipher.noDetection
      description: >-
        A ciphertext is altered by one byte and decryption is attempted. The recorded
        behaviour is that decryption does NOT report tampering: it returns altered plaintext
        or a padding-level failure, never an integrity failure, because no authenticated mode
        exists on this surface and the ciphertext therefore carries no integrity tag. A
        target that reported an integrity failure here would be a parity failure, not an
        improvement.
      format: >-
        The outcome classification, the returned plaintext or error rendered as text, and an explicit
        flag recording that no integrity failure was raised
      locator: "ws_objects/pfw.shared.pbl.src/enums.sru:L943-L945"
    - name: symmetric.rawKeyBytes.noDerivation
      description: >-
        A short passphrase is supplied where key material is expected, and the recorded
        behaviour is that it is consumed as raw key bytes: no derivation function is applied,
        no iteration count exists to apply, and no salt is involved, so whatever the caller
        supplies is the key. The observable consequence recorded is that a passphrase shorter
        than the cipher's key length is padded rather than stretched.
      format: >-
        The byte length of the supplied material, the byte length the cipher consumed, a flag recording
        that no derivation was applied, and the resulting ciphertext rendered as lower-case hexadecimal
      locator: "ws_objects/pfw.crypto.pbl.src/n_crypto.sru:L30-L61"
    - name: symmetric.cipherIdentifiers
      description: >-
        The symmetric cipher identifier set as declared, spellings and values alike -
        CRYPTO_SYMCRYPT_TYPE_DES = 0, CRYPTO_SYMCRYPT_TYPE_3DES = 1,
        CRYPTO_SYMCRYPT_TYPE_AES128 = 2, CRYPTO_SYMCRYPT_TYPE_AES192 = 3 and
        CRYPTO_SYMCRYPT_TYPE_AES256 = 4 - five identifiers across the three cipher families
        the surface offers.
      format: "Identifier spelling to numeric value, in declaration order"
      locator: "ws_objects/pfw.shared.pbl.src/enums.sru:L936-L940"
    - name: symmetric.modeIdentifiers
      description: >-
        The symmetric mode identifier set as declared, including the default alias that is
        the whole evidence for provesDefects item 1 - CRYPTO_SYMCRYPT_MODE_ECB = 0,
        CRYPTO_SYMCRYPT_MODE_CBC = 1, CRYPTO_SYMCRYPT_MODE_CFB = 2, and
        CRYPTO_SYMCRYPT_MODE_DEFAULT declared equal to CRYPTO_SYMCRYPT_MODE_ECB. All three
        modes are enumerated even though the feedback mode is not exercised as a case, for
        the reason blockedBehaviours records.
      format: >-
        Identifier spelling to numeric value, in declaration order, with the default alias recorded as
        the identifier it resolves to rather than as a number
      locator: "ws_objects/pfw.shared.pbl.src/enums.sru:L943-L946"
    # ---------- Asymmetric ----------
    - name: rsa.keyGeneration.shape
      description: >-
        Key generation at the legacy-legal small key size, through the arity that returns
        both halves in two reference out-parameters and takes the block-format flag. Only the
        SHAPE is recorded - the key size in bits, whether each half was produced, and the
        rendering format requested. Neither half's value is recorded, and on the target side
        the private half is never returned to a caller at all.
      format: >-
        Key size in bits, a produced-or-not verdict per half, the requested rendering format, and a
        placeholder per half recording only its shape and size
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L699"
    - name: rsa.encrypt
      description: >-
        Asymmetric encryption of a fixed plaintext under the public half, through the
        padding-omitting arity so that the default padding is the one in force. The
        ciphertext itself is not compared byte for byte, because the default padding is
        randomized; what is compared is that it decrypts back to the original.
      format: "Ciphertext byte length, the numeric padding identifier in force, and a decryptability verdict"
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L744"
    - name: rsa.decrypt
      description: >-
        Asymmetric decryption under the private half, recorded as the recovered plaintext.
        The private half is reached through the opaque key reference on the target side and
        is never present in the recording in any form.
      format: >-
        The recovered plaintext, the numeric padding identifier in force, and a placeholder standing for
        the key reference
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L720"
    - name: rsa.sign.sha256
      description: >-
        A signature over fixed data under the SHA-256 identifier. The signature bytes are not
        compared, because the signing padding is randomized and the bytes differ per run;
        what is compared is that a signature was produced, its length, and that it verifies.
      format: >-
        Signature byte length, the numeric hash-type identifier that selected the digest, and a
        produced-or-not verdict
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L470"
    - name: rsa.verify.sha256
      description: >-
        Verification of that signature under the same hash identifier, recorded as the
        boolean the legacy returns. Two cases are captured: the valid signature, which
        verifies, and the same signature over altered data, which does not - because a
        verification that succeeded on both would be indistinguishable from one that always
        succeeds.
      format: "The boolean verification result per case, plus the numeric hash-type identifier"
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L474"
    - name: rsa.sizeLimit.rejection.pkcs1
      description: >-
        A first-class rejection outcome, not an incidental error. Under the default
        PKCS-family padding the plaintext must be at least eleven bytes smaller than the key
        modulus; a plaintext at or above that bound is refused. The refusal and its
        classification are the behaviour and are compared.
      format: >-
        The plaintext byte length offered, the modulus size in bytes, the outcome classification, and
        the numeric padding identifier in force
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L736"
    - name: rsa.sizeLimit.rejection.oaep
      description: >-
        The same rejection under the optimal-asymmetric-encryption-padding form, whose bound
        is forty-one bytes smaller than the key modulus rather than eleven. Captured
        separately because the two bounds are different numbers and a port that applied one
        bound to both paddings would pass a single-case check.
      format: >-
        The plaintext byte length offered, the modulus size in bytes, the outcome classification, and
        the numeric padding identifier in force
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L737"
    - name: rsa.noPadding.rejection
      description: >-
        The no-padding form is explicitly not supported, and the refusal is the legacy's own
        rather than a hardening decision taken by the port. There is additionally no
        identifier value to select it with - the declared padding set has exactly two members
        - so the request is unrepresentable as well as refused. Both facts are recorded.
      format: >-
        The outcome classification, and the declared padding identifier set as evidence that no third
        value exists to request
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L738"
    - name: rsa.paddingIdentifiers
      description: >-
        The asymmetric padding identifier set as declared - CRYPTO_RSA_PADDING_PKCS1 = 0,
        CRYPTO_RSA_PADDING_OAEP = 1, and CRYPTO_RSA_PADDING_DEFAULT declared equal to
        CRYPTO_RSA_PADDING_PKCS1 - which is simultaneously the evidence for provesDefects
        item 2 and for the unrepresentability recorded above.
      format: >-
        Identifier spelling to numeric value, in declaration order, with the default alias recorded as
        the identifier it resolves to
      locator: "ws_objects/pfw.shared.pbl.src/enums.sru:L949-L951"
    - name: rsa.keySizeIdentifiers
      description: >-
        The declared key-size set - CRYPTO_RSA_BITS_1024 = 1024, CRYPTO_RSA_BITS_2048 = 2048
        and CRYPTO_RSA_BITS_4096 = 4096. The small size is a first-class declared value
        alongside the other two, which is the evidence for provesDefects item 6, and it is
        recorded so that its removal from the accepted set would surface as a difference.
      format: "Identifier spelling to numeric value, in declaration order"
      locator: "ws_objects/pfw.shared.pbl.src/enums.sru:L965-L967"
    # ---------- Random ----------
    - name: random.blob.shape
      description: >-
        Random byte generation. The bytes are a masked seam and are not compared; what is
        compared is the shape - that the requested byte count was produced and rendered
        through the hexadecimal encoding the fixture wraps it in. A length mismatch is a
        behavioural difference even though the value is not.
      format: >-
        Requested byte count, produced byte count, the numeric encoding identifier used to render it,
        and a placeholder standing for the bytes
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L652"
    - name: random.string.characterClasses
      description: >-
        Random string generation with the number, alphabet and symbol classes combined. The
        characters are masked, but the CHARACTER CLASSES PRESENT in the output are behaviour
        and are compared: a generator that silently dropped the symbol class would produce a
        perfectly plausible string and would be caught only by this comparison. The requested
        length is compared too.
      format: >-
        Requested length, produced length, the set of character classes observed in the output, the
        numeric flag value requested, and a placeholder standing for the string
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L667"
    - name: random.guid.formatting
      description: >-
        Identifier generation with the bracket and separator flags combined, and again
        through the flag-omitting arity so the default formatting is reached. The value is
        masked, but the FORMATTING is behaviour and is compared - bracket presence, separator
        presence and separator positions, per flag combination. Four combinations are
        captured: neither flag, bracket only, separator only, and both.
      format: >-
        Per flag combination: the numeric flag value, a formatting descriptor recording bracket presence
        and separator positions, the total length, and a placeholder standing for the value
      locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L682"
    - name: random.identifiers
      description: >-
        The two flag identifier sets as declared - CRYPTO_RNDSTRING_NUMBER = 1,
        CRYPTO_RNDSTRING_ALPHABET = 2, CRYPTO_RNDSTRING_SYMBOL = 4 with
        CRYPTO_RNDSTRING_DEFAULT declared as number plus alphabet; and
        CRYPTO_GUID_INCLUDE_BRACKET = 1, CRYPTO_GUID_INCLUDE_SEPARATOR = 2 with
        CRYPTO_GUID_DEFAULT declared as both. The defaults are recorded as the combinations
        they resolve to, because a caller reaching the flag-omitting arity gets those and
        nothing else.
      format: >-
        Identifier spelling to numeric value, in declaration order, with each default alias recorded as
        the combination it resolves to
      locator: "ws_objects/pfw.shared.pbl.src/enums.sru:L954-L962"
  redaction:
    - field: "The injected symmetric key"
      treatment: redacted
    - field: "The injected initialization vector"
      treatment: redacted
    - field: "The injected keyed-hash key"
      treatment: redacted
    - field: "The passphrase supplied to the no-derivation case as raw key material"
      treatment: redacted
    - field: "The generated asymmetric public half"
      treatment: redacted
    - field: "The generated asymmetric private half"
      treatment: omitted
    - field: "The opaque key reference a caller passes in place of key bytes"
      treatment: redacted
    - field: "The fixture's own embedded key material at every one of its locators"
      treatment: omitted
  recordingArtifacts:
    - filename: hashing.json
    - filename: encoding.json
    - filename: symmetric.json
    - filename: asymmetric.json
    - filename: random.json
