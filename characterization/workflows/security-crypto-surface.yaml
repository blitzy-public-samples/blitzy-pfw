# The mask is inline and complete. It is not a pointer to a mask, and no entry of it is
# delegated to another file, because a mask that drifts away from its workflow silently
# invalidates every pair captured under it. Every entry names both sides: a one-sided mask
# manufactures a passing comparison out of mismatched data, which is worse than no mask.
determinismMask:
  - seam: "Random blob generation"
    method: >-
      Seamed rather than masked wherever possible: entropy is injected through the
      IEntropySource abstraction declared at
      services/security-service/PowerFramework.Security/Crypto/RandomProvider.cs:L228, and a
      test substitutes a deterministic double for the production implementation at :L269. The
      provider reaches entropy only through its constructor parameter at :L578, so no code
      path can bypass the double. Two doubles exist, at
      services/security-service/PowerFramework.Security.Tests/RandomProviderTests.cs:L81 and
      :L108. The produced bytes are still replaced by a placeholder in the recording; the
      requested and produced byte counts are compared.
    appliesTo:
      - legacy
      - dotnet
    reason: >-
      Non-deterministic by construction - every value differs on every run by design, so a
      recording containing one is unmatchable unless the value is masked on both sides. This
      is one of the three primary non-determinism sources in the entire in-scope estate, and
      all three of them live on this one surface, which is why this workflow carries more
      seam entries than any other in the store. ../../docs/PARITY.md section 5.1 is the
      authoritative register.
  - seam: "Random string generation"
    method: >-
      The same injected entropy seam and the same deterministic doubles. The string value is
      replaced by a placeholder, but the character classes present in the output are derived
      from it before masking and are recorded and compared, as is the produced length.
    appliesTo:
      - legacy
      - dotnet
    reason: >-
      Non-deterministic by construction, for the same reason as the blob generator. The
      distinction that matters: the characters are not behaviour, but the CLASSES OF
      CHARACTER PRESENT are - a generator that silently stopped honouring one of the three
      requested classes would still produce a plausible string, and the class set is the only
      recorded field that would catch it. Masking the class set along with the value would
      remove the one comparison this case exists to make.
  - seam: "Identifier generation"
    method: >-
      The same injected entropy seam and the same deterministic doubles. The value is
      replaced by a placeholder, but the formatting is derived before masking and compared:
      bracket presence, separator presence and separator positions, recorded per flag
      combination across all four combinations.
    appliesTo:
      - legacy
      - dotnet
    reason: >-
      Non-deterministic by construction, the third of the three primary seams. As with the
      random string, the value is not behaviour but the FORMATTING is: the flags select it
      deterministically, so a flag that stopped being honoured is a real regression that only
      the formatting comparison detects.
  - seam: "All injected key material, and every generated key pair"
    method: >-
      Replaced by a stable placeholder that records only the material's shape and size - key
      length in bytes, modulus size in bits, and whether each half was produced. Never the
      material. The capturePhase redaction member declares the same fields from the
      sensitivity side; this entry declares them from the comparability side, and both are
      needed because they answer different questions.
    appliesTo:
      - legacy
      - dotnet
    reason: >-
      Two independent reasons, either of which alone would be sufficient. First and governing:
      a recording must never carry key material, so key material cannot appear in a compared
      field. Second: a key generated at capture time differs per run and is therefore not
      comparable in any case, so masking it costs the comparison nothing it could otherwise
      have had.
  - seam: "Signature and ciphertext bytes where a non-deterministic padding is involved"
    method: >-
      Compare the round-trip outcome and the verification result rather than the raw bytes -
      that a ciphertext decrypts back to its original plaintext, and that a signature
      verifies against its data and fails against altered data - together with the byte
      lengths, which are deterministic. Where the mode is DETERMINISTIC, the ciphertext is
      NOT masked and is compared byte for byte; the electronic-codebook cases and the
      chained-block cases taken with a pinned vector are both in that category.
    appliesTo:
      - legacy
      - dotnet
    reason: >-
      A randomized padding makes the ciphertext or signature differ on every run while the
      behaviour is identical, so the bytes cannot be compared and the decryptability and the
      verification result are what carry the behaviour. The exception is load-bearing and
      runs the other way: for the deterministic modes the ciphertext MUST be compared,
      because its determinism is precisely the weakness this pair exists to characterize, and
      masking it would hide the very property provesDefects item 1 pins.
  - seam: "Every clock read"
    method: >-
      Injected as a time provider taken by constructor, with no ambient clock read behind it,
      so a test substitutes a fixed or advancing double. No timing value is recorded as an
      assertion in any case, so nothing on this surface depends on the substituted value
      being any particular one.
    appliesTo:
      - legacy
      - dotnet
    reason: >-
      A clock read differs by definition rather than by behaviour, so any recorded field
      derived from one is unmatchable. Declared even though this surface asserts no timing,
      because the seam must be bound on both sides for the pair to be taken under one
      arrangement, and an unbound clock can still reach a recording through an incidental
      field.
  - seam: "Newline normalization"
    method: >-
      Normalize line endings to a single convention on both sides before comparison. For
      base64 output specifically, normalize the line wrapping first and then compare the
      DECODED BYTES rather than the wrapped text, so a differently wrapped rendering of
      identical bytes is not reported as a divergence.
    appliesTo:
      - legacy
      - dotnet
    reason: >-
      A platform artifact rather than a behaviour: the master is produced on Windows by
      PowerBuilder and the candidate runs in a Linux container, and the repository's root
      .gitattributes declares only linguist-language mappings with no text rule and no
      end-of-line rule, so nothing normalizes line endings on the way into version control.
      That file is not in scope to change, which is exactly why the normalization has to be
      declared in the workflow's own mask instead. The base64 wrapping hazard is specific to
      this surface: two encoders that agree on every byte can disagree on where they break
      the line, and comparing the wrapped text would report that as a cryptographic
      divergence.
  - seam: "Text encoding of inputs before hashing or encrypting"
    method: >-
      Pin one declared input encoding on both sides - the single-byte encoding the fixture
      converts through at its blob conversion call sites - and record the pinned encoding
      alongside every affected output so that the pinning is visible in the recording rather
      than assumed by the harness.
    appliesTo:
      - legacy
      - dotnet
    reason: >-
      The fixture converts strings to bytes with an explicit single-byte encoding before
      handing them to the surface. A different default on the candidate side would change the
      INPUT bytes and therefore every digest, ciphertext and signature derived from them -
      and it would present as a cryptographic divergence when the cryptography is byte for
      byte identical. This is the most misleading failure available on this surface, which is
      why the encoding is pinned rather than left to a platform default.

# EVERY ITEM BELOW IS A WEAK CRYPTOGRAPHIC DEFAULT THAT IS PRESERVED AS THE DEFAULT AND
# ANNOTATED AS A KNOWN LEGACY WEAKNESS. Annotation is the whole remediation: not one of them
# is silently strengthened and no safe mode is offered alongside any of them. This list is
# NOT a remediation backlog. A capture showing a strengthened default is a parity FAILURE
# and is filed as a divergence in the target, because behaviour preservation forbids
# improvements as firmly as it forbids regressions. ../../docs/CONTRACTS.md section 5.3
# carries the same roster from the contract side and is the authority for the annotations
# the published contract descriptions actually bear.
provesDefects:
  - defect: >-
      The default symmetric mode is electronic codebook. The mode default is declared equal
      to the electronic-codebook identifier, so every overload that omits the mode selector
      encrypts in it - identical plaintext blocks become identical ciphertext blocks and
      plaintext structure survives into the ciphertext.
    locator: "ws_objects/pfw.shared.pbl.src/enums.sru:L943-L946"
    note: >-
      Annotation carried at the point of reproduction: electronic codebook is preserved as
      the default, and a caller who needs otherwise passes the mode explicitly. It is not
      silently upgraded, and no alternative default is offered.

      ORACLE COVERAGE GAP, STATED RATHER THAN PAPERED OVER: the fixture never reaches this
      default. All six of its symmetric call sites pass the chained-block mode explicitly -
      at u_cst_tabpage_utility_crypto.sru:L504, :L547, :L592, :L607, :L622 and :L637 - so no
      oracle call exercises the default at all, and a capture built only from what the oracle
      does would leave the single most consequential weakness on this surface entirely
      uncharacterized. That is why capturePhase adds a mode-omitting case. The mode-omitting
      arities are declared at ws_objects/pfw.crypto.pbl.src/n_crypto.sru:L30, :L32, :L34 and
      :L36 with their blob counterparts through :L44, and the decrypt counterparts run from
      :L46 to :L60.
  - defect: >-
      The default asymmetric padding is the PKCS-family form, and the no-padding form is
      explicitly not supported. The legacy's own authoritative comment states the default,
      states that the plaintext must be at least eleven bytes smaller than the key modulus,
      states that the optimal-asymmetric-encryption-padding form requires forty-one bytes
      smaller, and then states outright that no-padding is not supported.
    locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L736-L738"
    note: >-
      Annotation: the PKCS-family default is preserved and is not silently upgraded to the
      optimal-asymmetric form, and the no-padding refusal is the LEGACY'S OWN rather than a
      hardening decision taken by the port - which is why reproducing the refusal is
      preservation rather than improvement. The refusal is doubly established: beyond the
      comment, the declared padding set has exactly two members at
      ws_objects/pfw.shared.pbl.src/enums.sru:L949-L950, so there is no third value to
      select and the request is unrepresentable as well as refused. All three outcomes - the
      two size-limit rejections and the no-padding rejection - are captured as first-class
      results with their classifications, not as incidental errors. The padding-omitting
      arities that reach the default are n_crypto.sru:L62, :L64, :L66 and :L68.
  - defect: >-
      Symmetric padding is a single fixed family and is not selectable. There is no way to
      choose a padding scheme for any symmetric operation, and no way to discover which one
      is in force from the declared surface.
    locator: "ws_objects/pfw.shared.pbl.src/enums.sru:L936-L946"
    note: >-
      Annotation: the padding scheme is fixed and the contract carries no field for it,
      because offering one would imply a choice the legacy never had - and inventing a choice
      is a new feature, which behaviour preservation forbids exactly as firmly as it forbids
      removing one. Established by ABSENCE, and the absence is mechanical rather than
      inferred: no symmetric padding constant of any kind exists anywhere in enums.sru - the
      cipher block exposes type and mode and nothing else - and not one of the 32 symmetric
      overloads at ws_objects/pfw.crypto.pbl.src/n_crypto.sru:L30-L61 carries a padding
      parameter. Absence is weaker evidence than presence in general, but here it is the
      right kind: a capability the legacy cannot express is one the port must not offer.
  - defect: >-
      No key-derivation function is reachable at all, and there is no salt concept anywhere
      on the surface, so a passphrase supplied as key material is used as raw key bytes.
      Whatever the caller supplies IS the key: nothing derives it, stretches it, or salts it,
      and material shorter than the cipher's key length is padded rather than strengthened.
    locator: "ws_objects/pfw.crypto.pbl.src/n_crypto.sru:L30-L61"
    note: >-
      Annotation: the contract does not derive, stretch or salt, and adding a derivation
      function would be a new capability rather than a fix. Established by ABSENCE across the
      whole surface: no derivation-family or salt constant exists in
      ws_objects/pfw.shared.pbl.src/enums.sru, and no signature on the cryptographic surface
      accepts an iteration count or a salt. The fixture demonstrates the consequence directly
      - its key field takes a plain string straight through into the key parameter with
      nothing in between.

      SECRETS POSITION FOR THIS WHOLE WORKFLOW, RECORDED HERE BECAUSE THIS IS THE ITEM WHOSE
      EVIDENCE TOUCHES IT: the oracle is a secret-bearing site. It carries two distinct
      embedded private keys at u_cst_tabpage_utility_crypto.sru:L466 and :L718, a hardcoded
      keyed-hash key at :L449, and an encryption key and an initialization vector defaulted
      to plain guessable strings in fields that are not masked, at :L266 and :L515. Every one
      of those lies inside the read-only legacy region, so the posture is NEVER REPLICATE,
      DOCUMENT, AND ROTATE - never edit the legacy file, and specifically not in order to
      remove the literals, because deleting them from the oracle would corrupt the very
      artifact the parity comparison is taken against. ../../docs/SECRETS.md holds every
      locator with its severity and required action; the values live nowhere, and no field of
      this definition and no field of any recording taken under it may carry one. On the
      target side there is exactly one signing secret in the whole system, it is held by
      Security alone, and it arrives exclusively through configuration injection: Security is
      the SOLE token issuer and the other three services hold verification material only.
      ../../docs/SECRETS.md sections 3.2, 4.1, 4.2 and 4.5 and ../../docs/CONTRACTS.md
      section 5.2 are the authorities for all of that and none of it is restated here.
  - defect: >-
      No authenticated encryption is reachable - no authenticated mode of any kind exists on
      the surface - so ciphertext carries no integrity tag and decryption cannot detect that
      a ciphertext has been altered.
    locator: "ws_objects/pfw.shared.pbl.src/enums.sru:L943-L945"
    note: >-
      Annotation: ciphertext integrity is not protected by this surface, and a caller needing
      it must obtain it separately - the keyed-hash operations are the surface's own means of
      doing so. No authenticated mode is added. Established by ABSENCE: the declared mode set
      is exactly electronic codebook, chained-block and feedback, and none of the three
      authenticates. The observable consequence is captured directly, as
      symmetric.tamperedCipher.noDetection: a ciphertext is altered by one byte and
      decryption is attempted, and the recorded behaviour is that no integrity failure is
      raised. A target that DID report an integrity failure there would be a parity failure
      rather than an improvement, and it is the clearest example on this surface of why a
      better-looking result is a bug report.
  - defect: >-
      A small asymmetric key size remains legal, and the legacy demonstration uses it. The
      1024-bit size is a declared, first-class value alongside 2048 and 4096, and the oracle
      generates at it.
    locator: "ws_objects/pfw.demos.pbl.src/u_cst_tabpage_utility_crypto.sru:L699"
    note: >-
      Annotation: 1024 is accepted, is annotated as a legacy-compatibility value, and is NOT
      removed from the accepted set - refusing it would refuse input the legacy accepts,
      which is a behavioural change dressed as hardening. The declaring evidence is the
      key-size set at ws_objects/pfw.shared.pbl.src/enums.sru:L965-L967, where the small size
      sits beside the two larger ones as an equal member. The capture records the size in
      bits as an observed output precisely so that a later narrowing of the accepted set
      surfaces as a comparison difference rather than as a silent policy change.
  - defect: >-
      The algorithm identifier sets are preserved exactly, values and spellings alike: the
      six hash identifiers, the five cipher identifiers across three families, the three
      modes with their default alias, the two padding values with theirs, the two encoding
      values, the three random-string classes and the two identifier-formatting flags.
    locator: "ws_objects/pfw.shared.pbl.src/enums.sru:L924-L967"
    note: >-
      Stated precisely because the distinction matters: this is a preservation RULE rather
      than a weakness, and it is listed here because this pair is what enforces it, not
      because the identifiers are themselves defective. The rule exists because these
      identifiers appear in serialized payloads, in log records and in characterization
      recordings, so a rename or a renumbering would silently invalidate every stored
      comparison - including every recording taken under this workflow. The identifiers keep
      their original screaming-snake spelling in the target even though that departs from the
      language's naming convention, and the analyzer rules that would object are suppressed
      for the files carrying them rather than the identifiers being tidied.

      One consequence of the declared sets is easy to miss and is recorded so it is not: the
      declaring comment at ws_objects/pfw.shared.pbl.src/enums.sru:L927 names the hash set's
      consumers as the hash operation AND the signing and verification operations - one set,
      three consumers - so the whole set, including the weakest digest in it, is a legal
      selector on the signature operations. That is preserved rather than narrowed, because
      narrowing the accepted set would refuse input the legacy accepts.

      NO THIRD-PARTY CRYPTOGRAPHY PACKAGE IS ADOPTED, AND NONE IS NEEDED: the platform's own
      cryptographic library covers every operation enumerated on this surface - the
      asymmetric family with generation, encryption, decryption, signing and verification;
      keyed hashing; the whole digest family and the checksum; the three cipher families
      across the three declared modes with the PKCS-family padding; cryptographic random
      generation; and identifier generation. Adding a package would introduce an
      unnecessary dependency on the sole token issuer, and it would put a third party's
      choice of default between this port and the defaults it is required to preserve.

# Declared rather than approximated. Each of the three is a boundary the published
# cryptographic contract narrows on purpose, and each therefore bounds what this pair can
# prove. ../../docs/CONTRACTS.md section 5.3 is the authority for all three, including the
# defined error each returns. The root cause they share is worth stating once: the legacy
# class is declared native over a closed binary at
# ws_objects/pfw.crypto.pbl.src/n_crypto.sru:L8 and its 86 lines are declarations only, so
# where a parameter lived inside that binary there is no source anywhere in the repository
# that can adjudicate it.
blockedBehaviours:
  - behaviour: >-
      Keyed hashing and signing under the checksum identifier - the keyed and signing
      operations invoked with the one member of the hash set that is a checksum rather than a
      digest.
    reason: >-
      No evidence is missing and none could be: the construction itself does not exist. A
      checksum has no compression function for a keyed-hash construction to key, and no
      algorithm identifier for a signature scheme to name, so neither combination was ever
      defined. The identifier is nonetheless a declared member of the one hash set that the
      hash, signing and verification operations all share, so a caller can name it.
    disposition: narrowed-with-defined-error
  - behaviour: >-
      Symmetric encryption and decryption in the feedback mode, which this workflow
      enumerates as a declared identifier but does not exercise as a capture case.
    reason: >-
      The feedback width is unobservable. The legacy publishes one unqualified feedback-mode
      value with no feedback-size argument anywhere in its signatures, and full-block versus
      narrow feedback produce entirely different ciphertext from identical inputs - so there
      is no way to establish from the repository which of them the closed binary used. A
      substitute would produce ciphertext that is plausible and wrong, which is the failure
      mode a characterization suite exists to prevent rather than to commit.
    disposition: narrowed-with-defined-error
  - behaviour: >-
      Chained-block mode reached through one of the eight overloads that supply a mode but no
      initialization vector.
    reason: >-
      The vector the closed binary substituted when none was supplied is unobservable, and
      chained-block mode cannot be reproduced without it. The affected arities are declared
      at ws_objects/pfw.crypto.pbl.src/n_crypto.sru:L31, :L35, :L39, :L43, :L47, :L51, :L55
      and :L59. This bounds the capture rather than blocking it: every chained-block case in
      capturePhase deliberately uses a vector-supplying arity, and the added mode-omitting
      case uses the arity that carries neither a mode nor a vector, which reaches the
      electronic-codebook default and needs no vector to do so.
    disposition: narrowed-with-defined-error

# True, and not because this workflow writes to storage - it opens none. The fixture runs
# inside the same oracle application whose state both halves of the pair share, so the
# capture rule governs it in full. characterization/README.md section 2.1 owns that rule's
# canonical text and is the authority for it; the one exemption this store admits belongs
# solely to the pure-string-transform paging workflow, and it is not this one.
sharedVolume:
  applies: true

executionStatus: specified-not-executed

relatedWorkflows:
  - gateway-lifecycle-composition-root
