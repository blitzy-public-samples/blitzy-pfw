        that leading, trailing and repeated whitespace is visible in the recording and survives review.
        No trimming, no case folding, no separator normalization and no re-ordering of clauses is applied
        on either side. The empty string is recorded as an empty string and is distinguishable from an
        absent field, because empty is a meaningful state here - it is what triggers the restore path.
