# ==================================================================================================
#  THE DEFERRED HALF - A DOCUMENTED GAP, AND EMPHATICALLY NOT A STUB
#  ------------------------------------------------------------------------------------------------
#  READ THE ENTRY BELOW AS A NOTE ABOUT THE EVENTUAL SYSTEM, BECAUSE THAT IS ALL IT IS. Naming a
#  deferred capability area and its reserved route records WHERE a gap will eventually be filled; it
#  does not claim, and cannot claim, that anything has been built to fill it. Behind that route there is
#  NO PROJECT, NO CONTAINER, NO TEST, NO PARTIAL IMPLEMENTATION AND NO PLACEHOLDER THAT THROWS. The
#  route itself is a routing declaration on the gateway that answers 501 with a machine-readable body
#  naming the deferred area - metadata about the shape of the eventual system, not a stub of it (C-D).
#  Correspondingly: NO CAPTURE STEP, NO OBSERVED OUTPUT AND NO MASK ENTRY IN THIS FILE TARGETS THE
#  DEFERRED HALF. This workflow characterizes the half that ships, and nothing else.
#
#  THE DEFERRED OBJECT ASSIGNMENT IS NOT RESTATED HERE. `../../docs/DEFERRED.md` owns the roster - its
#  section 6.1 carries the evidence for this split, section 6.2 the table of what ships against what
#  does not, and section 5.2 the auditable compliance note on the distinction between a route and a
#  stub. This entry points at that document rather than duplicating it, because a second copy of the
#  roster would be a second thing to drift.
# ==================================================================================================
deferredCapabilities:
  - capability: >-
      THE SORT-INDICATOR GEOMETRY - the placement and sizing of the visual sort indicator on the column
      header, together with the placement of the small ordinal badge that marks a column's position
      within a multi-column sort, and the drawn removal of both when a column returns to the not-sorted
      state.


      WHAT WOULD BE NEEDED TO COVER IT, stated so the gap is enumerable rather than gestural: a
      resolution-aware unit-conversion family, header-object geometry reads, a text-metric source for the
      leader offset the routine subtracts, and a drawing surface able to create and destroy the indicator
      objects. None of those exists in this phase, so none of it is captured, implemented or stubbed.


      THE EVIDENCE, AND IT IS NARROW - which is exactly why only this much is deferred. The service
      converts logical units into device pixels through the DPI conversion family at
      `ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnsort.sru:L359` and at `:L361`, and
      those two calls exist PURELY to position the indicator: they sit inside the indicator-placement
      routine, they feed a leader-offset subtraction applied to the header object's own coordinate, and
      nothing downstream of them reaches the sort model. The same routine returns early for a not-sorted
      column at `:L353`, which is the drawn removal named above. Those two lines are the ENTIRE
      presentational coupling of this service.


      WHAT SHIPS INSTEAD, SURFACED AS DATA OVER THE CONTRACT. The sort model is complete without the
      indicator: the per-column sort state, the ordered participating set with each column's one-based
      position, the multi-column ordinal the legacy passes to the indicator routine, the clause each
      column contributes and the joined expression string are all headless, and all are captured above.
      A client that wants to draw an indicator has every value it needs to decide WHAT to draw; what it
      does not get from this phase is the geometry telling it WHERE. That is a gap a reader can list, and
      it is deliberately preferred to a rendering path built on an approximation nobody characterized.
      `../../docs/DEFERRED.md` sections 6.1 and 6.2 carry the roster and the full split; they are cited
      here and not restated.
    deferredTo: DesignSystem
    reservedRoute: "/v1/design/**"

# ==================================================================================================
#  THE DETERMINISM MASK - INLINE, SYMMETRIC, AND EVERY ENTRY WITH ITS REASON
#  ------------------------------------------------------------------------------------------------
#  The mask is a member of THIS definition rather than a pointer to one, because a mask that drifts away
#  from its workflow silently invalidates every pair captured under it. EVERY ENTRY APPLIES TO BOTH
#  SIDES: masking only the candidate leaves the master holding a value that can never be matched, and
#  masking only the master inverts the same problem. One configuration, used for both captures.
#  `../../docs/PARITY.md` section 5.1 is the authoritative seam register and carries each seam's
#  injection point and status; `../README.md` section 5.1 reproduces it with the statuses. The first four
#  entries below are this workflow's application of that register. THE FIFTH IS THIS WORKFLOW'S OWN -
#  collation appears in neither register, because no other workflow in this store sorts character columns
#  - and it is stated with the same discipline the register applies to its own rows.
#
#  PREFER THE SEAM TO THE MASK. Four of the five entries below INJECT a deterministic substitute rather
#  than removing a field from the comparison, because masking a field out removes the comparison's
#  ability to detect anything in it, and every masked field is a field a regression can hide in.
# ==================================================================================================
determinismMask:
  - seam: >-
      Every clock read reachable from this sort path - any timestamp that reaches a recorded field or a
      recorded decision, on either side.
    method: >-
      Inject the clock and substitute a deterministic double that advances only when the test advances it.
      Nothing in the sort path branches on a clock value, so the substitution changes no path; it only
      makes a recorded timestamp reproducible.
    appliesTo: [legacy, dotnet]
    reason: >-
      A timestamp differs on every run BY DEFINITION RATHER THAN BY BEHAVIOUR, so an unmasked one reports
      a difference on every comparison and trains a reviewer to ignore red results. NOTE WHAT THIS IS
      NOT: seaming the clock does not introduce a timing assertion, and it does not license one. No
      elapsed value and no rows-per-unit-time figure is recorded or compared anywhere in this workflow.
  - seam: >-
      Modify-call ordering on the DataWindow property path - the sequence of describe and modify calls
      this service issues while applying a sort, which includes the band and edit-style reads that resolve
      the clicked object, the property reads the clause grammar performs per column, the one-time read of
      the definition's own declared sort rule, and the modify that applies the finished expression.
    method: >-
      Fix the order in which the service issues those describe and modify calls, and record them in that
      one fixed order on both sides.
    appliesTo: [legacy, dotnet]
    reason: >-
      Two orderings that reach the same state can emit different intermediate output, so an unpinned
      order surfaces as a difference where no behaviour changed. FIXING THE ORDER IS NOT FIXING THE
      OUTCOME: each property's VALUE remains fully compared, and a genuine change in what a property
      returns is still detected. This matters more here than the count of calls suggests, because the
      clause grammar reaches for several properties per column and chooses its branch on what they return.
  - seam: >-
      The click coordinates carried in the mouse-event payloads - the retained down point and the up
      point the service compares against it.
    method: >-
      Substitute one FIXED LOGICAL COORDINATE PAIR PER CASE, chosen so that it resolves to that case's
      intended header object and so that the up point is within the movement tolerance of the down point
      on both axes. This is a seam rather than a mask-out precisely because the coordinate participates in
      a DECISION as well as in a payload: outside the tolerance the service treats the pair as a drag and
      refuses to sort, so a masked-out coordinate would leave the two halves free to disagree about
      whether a click happened at all. The substituted pair is recorded; it is the resolved column that is
      compared.
    appliesTo: [legacy, dotnet]
    reason: >-
      A RAW COORDINATE IS AN ARTIFACT OF HOW THE CLICK WAS SYNTHESIZED, not of the service's behaviour -
      two harnesses aiming at the same header object legitimately produce different numbers, and the
      legacy and target harnesses inevitably do. THE COLUMN THE COORDINATE RESOLVES TO IS BEHAVIOUR, and
      it is compared: the resolution walks the clicked object's name and band, which is exactly the logic
      a port can get wrong. So the coordinate is fixed and the resolution is compared - masking the
      resolution would remove the only part of this that matters.
  - seam: >-
      Line endings in every multi-line recorded field, and in every recording file this workflow writes.
    method: >-
      Declare one newline convention for this workflow and apply it identically to both halves AT
      COMPARISON TIME. This is a comparison-time normalization only: IT DOES NOT LICENSE EDITING A STORED
      MASTER, which the technique forbids outright.
    appliesTo: [legacy, dotnet]
    reason: >-
      The master is produced on Windows by the legacy framework while the candidate runs in a Linux
      container, so raw line endings differ BY PLATFORM RATHER THAN BY BEHAVIOUR - and the repository's
      root `.gitattributes` declares only language mappings, WITH NO TEXT RULE AND NO END-OF-LINE RULE AT
      ALL, so nothing normalizes them on the way into version control. Without this entry a byte-exact
      comparison reports a difference on every line of every multi-line field, which would bury the one
      field this workflow exists to compare. CHANGING `.gitattributes` IS NOT IN SCOPE and would be the
      wrong place to solve it: the normalization belongs to the comparison, not to the repository's
      checkout behaviour.
  - seam: >-
      THE COLLATION CULTURE USED TO ORDER CHARACTER-COLUMN VALUES - the string comparison the sort applies
      to the fixture's three character columns, including the display values a display-lookup clause
      resolves to.
    method: >-
      Pin ONE INVARIANT, CULTURE-INDEPENDENT COLLATION for the capture and use that same collation on both
      halves. Record which collation was pinned in the recording, so a later reader can tell a
      collation change from a behaviour change.
    appliesTo: [legacy, dotnet]
    reason: >-
      The fixture's character columns hold CHINESE DISPLAY VALUES - the first one carries a code table
      whose display side is Chinese while its data side is not - and a display-lookup clause sorts on the
      display side. A culture-dependent collation orders those values differently on a Windows master and
      a Linux container candidate even when the sort behaviour is byte-for-byte identical, and the
      divergence would surface as a ROW-ORDER difference: the most alarming-looking failure this workflow
      can produce, and in that case an entirely spurious one. BE PRECISE ABOUT WHAT IS MASKED HERE: THE
      COLLATION IS PINNED, THE RESULTING ROW ORDER UNDER THAT FIXED COLLATION IS FULLY COMPARED. This
      entry removes a platform variable, not an assertion - the ordering the pinned collation produces is
      still one of the fields the pair compares.

# ---- WHAT IS DELIBERATELY NOT MASKED, STATED EXPLICITLY ------------------------------------------
#  These ARE the behaviour under test. Masking any one of them would produce a comparison that passes
#  while proving nothing, which is worse than a comparison that fails:
#    * THE CONSTRUCTED SORT-EXPRESSION STRING - compared byte for byte, unnormalized, including its
#      separators, its spacing, its direction letters and its clause forms;
#    * THE APPLIED EXPRESSION on the restore paths, and the recorded baseline it is compared against,
#      including that baseline's trailing space;
#    * THE PER-COLUMN SORT STATE, as its raw number, in all three states;
#    * THE PARTICIPATING COLUMN LIST, ITS MEMBERSHIP AND ITS ORDER, plus each column's one-based
#      position and the multi-column ordinal derived from it;
#    * THE CLAUSE EACH COLUMN CONTRIBUTES, and which grammar branch produced it, including the empty
#      clause a not-sorted column contributes;
#    * THE RESULTING ROW ORDER, as a sequence of one-based row numbers under the pinned collation;
#    * THE CURRENT ROW, and the computed control's evaluation of it;
#    * THE EVENT RETURNS AND THE HANDLER SEQUENCE, as raw numbers, including on every refusal path;
#    * WHICH GATE REFUSED, on the negative case.
#  And nothing is masked on one side only, anywhere, ever - the schema will not permit it to be written.


# ==================================================================================================
#  THE DEFECTS AND QUIRKS THIS PAIR EXISTS TO PROVE SURVIVED
#  ------------------------------------------------------------------------------------------------
#  THE INVERSION IS LOAD-BEARING: a capture that shows CORRECTED behaviour is a parity FAILURE, not an
#  improvement. Where the target produces output that looks more correct than the oracle, the finding is
#  a divergence in the target and is filed as a defect (C-B). A legacy quirk is reproduced and annotated
#  at its point of reproduction, never repaired. `../../docs/PARITY.md` section 7 is the authoritative
#  catalogue of behaviour groups; the four entries below record which of them THIS pair pins.
#
#  THE HEADLESS/RENDERING SPLIT FINDING is recorded as the note on the first entry, where the evidence
#  for it is closest to the behaviour it constrains.
#
#  ONE QUIRK IS DELIBERATELY NOT CLAIMED, and the omission is reasoned rather than an oversight. The
#  original-rule-update entry point contains a genuine wrong-variable comparison - it tests a local that
#  is still empty at that point instead of the field it plainly means to test
#  [`n_cst_dwsvc_columnsort.sru:L272`], and the reset entry point reports failure rather than success when
#  there is nothing to reset [`:L236`]. NEITHER IS REACHED BY THIS MATRIX: the oracle window drives the
#  service exclusively through header clicks and calls neither entry point, so a defect claimed against
#  either would be a claim this pair cannot support. They are named here so a reader who finds them in the
#  source knows they were seen and consciously left out, and so that whoever exercises those entry points
#  knows there is a quirk waiting there.
# ==================================================================================================
provesDefects:
  - defect: >-
      D-01. THE SORT CYCLE IS THREE-STATE, AND NOT-SORTED IS THE FIXTURE'S DECLARED DEFAULT RULE RATHER
      THAN AN ABSENCE OF STATE. Clicking one column header repeatedly walks not-sorted to ascending to
      descending and BACK TO NOT-SORTED, and that third state is a positive state with observable
      consequences: the column's clause becomes empty, the constructed expression becomes empty, and the
      service then applies THE DEFINITION'S OWN DECLARED SORT RULE in its place. The oracle window's own
      header comment names all three states and explicitly labels the third as the default rule.
    locator: >-
      ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnsort.srw:L34-L39, with the cycle at
      ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnsort.sru:L125-L132 and the
      default-rule fallback at :L201-L207
    note: >-
      A TWO-STATE ASCENDING-DESCENDING TOGGLE WOULD BE A BEHAVIOUR CHANGE, and it is the single most
      natural way to get this wrong, because a two-state toggle is what almost every other grid in
      existence does. The capture therefore records the third state explicitly and proves that it returns
      the rows to THE FIXTURE'S DECLARED BASE ORDERING rather than to an arbitrary unsorted order - which
      is why the baseline is recorded in the seed phase before any click is synthesized. A port that
      cleared the sort instead of restoring the declared rule would produce whatever order the buffer
      happened to hold, and on this fixture that can easily coincide with the declared order and pass a
      careless review.


      THE HEADLESS/RENDERING SPLIT FINDING BELONGS HERE, because the third state is where the two halves
      touch. THIS SERVICE'S PRESENTATIONAL COUPLING IS NARROW: the DPI conversion at
      `n_cst_dwsvc_columnsort.sru:L359` and `:L361`, both inside the indicator-placement routine, which
      also returns early for a not-sorted column at `:L353`. Two lines of coupling, all of it about where
      to draw an arrow. THAT IS WHY ONLY THE INDICATOR GEOMETRY IS DEFERRED AND THE WHOLE SORT MODEL
      SHIPS. Compare the two sibling workflows whose services are presentationally coupled far more
      broadly - `dataservices-dwsvc-contextmenu`, whose service positions a window, constructs fonts and
      exposes a popup-menu-typed API, and `dataservices-dwsvc-dropdownsearch`, whose service shows,
      measures, offsets and repositions a window and declares a window prototype of its own. Their
      headless halves are correspondingly smaller; here the headless half is nearly the whole object. The
      contrast is the evidence that the split was drawn from what the source does rather than applied
      uniformly, and `../../docs/DEFERRED.md` section 6.1 carries the same contrast with the per-object
      counts behind it.
  - defect: >-
      D-02. A REPEAT MODIFIER-CLICK RESTORES THE ORIGINAL SORT RULE, AND THE RESTORE TARGET IS THE
      FIXTURE'S OWN DECLARED METADATA - not an empty sort, not the buffer's incidental order, and not a
      rule the service synthesizes. The service reads that rule from the definition LAZILY AND EXACTLY
      ONCE, on the first sort it performs and only while its retained field is still empty, and thereafter
      falls back to the retained copy whenever the constructed expression is empty. The oracle window's
      header comment states the behaviour in one clause: clicking again restores the original sort rule.
    locator: >-
      ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnsort.srw:L36, with the lazy capture at
      ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnsort.sru:L176-L178 and the fallback at
      :L201-L207
    note: >-
      THE CAPTURE CANNOT VERIFY THIS WITHOUT THE BASELINE, which is why recording the fixture's declared
      metadata is a seed step rather than an afterthought: observing that a restore happened is not the
      same as observing that it restored to the RIGHT rule, and the two are indistinguishable in a
      recording that never wrote the target down. Two further ways to get this wrong, both of which the
      recording detects. First, the LAZINESS is behaviour: a port that captured the baseline eagerly at
      construction, or re-captured it on every sort, would retain a rule that had already been overwritten
      by its own previous sort - so the restore would return to the last sort rather than to the original,
      and would do so only on the second and later restores. Second, THE FORM DIFFERS VISIBLY: the
      declared rule is space-separated and carries a trailing space, while the service's own constructed
      expressions are comma-joined, so the two are distinguishable on sight in a recording and a port that
      reconstructed the baseline instead of retaining it verbatim is caught by the whitespace alone.
      Finally note the ORDER on the modifier branch: the service sorts FIRST and removes the exhausted
      column from the participating set afterwards, so the restore lands on the same transition that drops
      the last column rather than on a subsequent one.
  - defect: >-
      D-03. MULTI-COLUMN SORT-EXPRESSION COMPOSITION ORDER IS OBSERVABLE, AND IT IS INSERTION ORDER. The
      expression is built by walking the participating set in the order the columns were ADDED to the
      sort - each newly clicked column being appended at the end of that set - and NOT in the definition's
      column order, nor in identifier order, nor in the order the columns are declared in the definition
      file. A column already in the set keeps its position when its direction changes; it is not moved to
      the end.
    locator: >-
      ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnsort.sru:L187-L199, with the append
      that fixes insertion order at :L120-L123, the in-place update at :L113-L118 and the comma join at
      :L196-L197
    note: >-
      THE CAPTURE PROVES THIS BY RECORDING THE EXPRESSION AFTER EVERY SINGLE ADDITION rather than only at
      the end, so the composition order is demonstrated incrementally instead of inferred from a final
      string that several different orders could have produced. THE FIXTURE MAKES IT CHECKABLE: its column
      controls are DECLARED OUT OF IDENTIFIER ORDER [`ws_objects/pfw.tests.pbl.src/dw_svc_sample.srd:L22-L27`],
      so a port that composed from the definition's declaration order - the most plausible wrong
      implementation, since it is the order a naive enumeration of columns yields - emits a demonstrably
      different string for identical clicks. Note also that the multi-column ordinal the service derives
      while composing is assigned ONLY while more than one column participates and otherwise remains
      zero; that ordinal is data and is recorded, even though the position at which the legacy draws it is
      the deferred half.
  - defect: >-
      D-04. ONE-BASED COLUMN AND ROW INDEXING THROUGHOUT, WITH AN UPPER BOUND THAT IS THE LAST VALID INDEX
      RATHER THAN A LENGTH. The participating set is a one-based array searched from index one, and a
      newly clicked column is appended by writing at UPPER-BOUND-PLUS-ONE - an idiom that appears twice,
      once when a column joins the sort and once when the set is rebuilt after a column leaves it. Every
      row number the capture records, including the value of the fixture's own computed current-row
      control, is likewise one-based.
    locator: >-
      ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnsort.sru:L112-L123, with the rebuild
      idiom at :L137-L144 and the fixture's computed control at
      ws_objects/pfw.tests.pbl.src/dw_svc_sample.srd:L28
    note: >-
      THIS IS THE ONE TRANSLATION HAZARD HERE WHOSE FAILURE IS INVISIBLE, which is why the indexing basis
      is declared in the preconditions as well as pinned here. The target's arrays are zero-based with a
      length one past the end, so a mechanical translation of either loop shifts every position by one -
      and a shifted participating set still produces a well-formed expression, still sorts, and still
      returns nine rows. The failure surfaces only as a wrong column order inside a multi-column
      expression or as a dropped or duplicated first element, both of which look like plausible output. The
      recording therefore carries every column's one-based position explicitly rather than relying on the
      array order of a serialized list, and both halves record and compare one-based values with the
      conversion performed at the target's own boundary and never in the recording. A reviewer should
      treat any off-by-one in this field as a translation defect and never as a tolerable difference.

# ==================================================================================================
#  THE SHARED-VOLUME CAPTURE RULE
#  ------------------------------------------------------------------------------------------------
#  `../README.md` SECTION 2.1 CARRIES THAT RULE'S CANONICAL TEXT AND IS THE AUTHORITY FOR IT. It is
#  cited here and deliberately NOT reproduced: the same text is owned word for word by
#  `../README.md`, `../../docs/PARITY.md` and `../../orchestration/README.md`, and a fourth copy would be
#  a fourth thing to drift. Section 2.4 explains the volume's name, section 2.5 why breaking the rule is
#  dangerous precisely because nothing errors, and section 2.6 the teardown corollary.
#
#  WHY IT APPLIES EVEN THOUGH THIS WORKFLOW'S ROWS ARE INLINE IN A READ-ONLY FIXTURE. The exemption in
#  `../README.md` section 2.7 is narrow and is not a loophole: it holds only while a workflow reads and
#  writes NOTHING, which is why the pure string-transform workflow is the one that claims it. THIS
#  WORKFLOW DOES NOT QUALIFY. Its target half is captured against the running service rather than an
#  in-process host, the sort mutates live buffer state through the applied expression, and the transition
#  is performed by a continuation that runs after the handler which queued it has already returned. A
#  volume state that moved between the two halves would change the state the second half ran against and
#  nothing would report it - so the rule is honoured in full, including its teardown corollary: between
#  the two halves, tear the stack down with a plain down and NEVER with the flag that removes named
#  volumes.
sharedVolume:
  applies: true

# ---- HONEST STATE --------------------------------------------------------------------------------
#  NOTHING HERE HAS BEEN RUN, AND THE ONLY LEGAL VALUE SAYS SO. No paired capture exists on either side
#  for this identifier: the legacy half needs a PowerBuilder toolchain that is not present, and no
#  recording directory for this identifier exists. Nothing in this definition may be read as reporting a
#  parity result, and no expected value quoted above may be read as an observed one - the expression forms
#  cited in the cases are what the grammar and the read-only fixture DECLARE, not what a run produced.
executionStatus: specified-not-executed

# ---- SIBLINGS ------------------------------------------------------------------------------------
#  A cross-reference only: each pair stays independently comparable under its own identifier, and naming
#  a sibling never merges two workflows. The event chain is the substrate this service's mouse events
#  arrive through and owns the ordering contract this file cites rather than re-derives. The other two are
#  the presentationally-coupled siblings whose much broader coupling is the contrast that justifies this
#  service being SPLIT rather than deferred - see the note on D-01 - and they share this workflow's
#  primary fixture, so a reader comparing the three is comparing three services against one definition.
relatedWorkflows:
  - dataservices-dw-event-chain
  - dataservices-dwsvc-contextmenu
  - dataservices-dwsvc-dropdownsearch
