# yaml-language-server: $schema=./workflow.schema.json
# ==================================================================================================
#  dataservices-dwsvc-columnsort - THE HEADLESS HALF OF THE COLUMN-SORT SERVICE
#  ------------------------------------------------------------------------------------------------
#  THIS FILE SPECIFIES A CAPTURE. IT CONTAINS NO CODE.
#  It conforms to `./workflow.schema.json`, which is authoritative for shape. Store-wide conventions -
#  the capture rule's canonical text, the recording-file conventions, the seam register, the defect
#  roster and what must never enter a recording - belong to `../README.md` and to `../../docs/PARITY.md`
#  and are CITED here, never restated. A copy of a rule those files already own word for word would be
#  one more thing to drift.
#
#  ---- THE SPLIT IS THIS WORKFLOW'S DEFINING FEATURE ---------------------------------------------
#  The closure analysis found this service PARTLY presentational: it reaches for a resolution-dependent
#  unit conversion purely to place its sort indicator - the two evidence locators are cited exactly once,
#  in `deferredCapabilities` below. The resolution is a split. The HEADLESS HALF - sort-expression
#  construction and sort state - ships in DataServices and is what this pair characterizes. The
#  indicator geometry is DEFERRED and named as a reserved gateway extension point, declared under
#  `deferredCapabilities` below. That is a DOCUMENTED CAPABILITY GAP, and it is deliberately preferred
#  to a partial implementation: where the choice is between a half-built rendering path and a gap a
#  reader can enumerate, the gap wins, because a gap can be audited and a half-built path cannot.
#  `../../docs/DEFERRED.md` section 6 owns the split's full statement across all three affected
#  services; this file records only what the split means FOR THIS CAPTURE.
#
#  ---- WHAT IS NOT HERE, AND WHY EACH ABSENCE IS DELIBERATE --------------------------------------
#    * `blockedBehaviours` - OMITTED. This workflow blocks nothing. The store's two blocked cases both
#      belong to siblings: pinyin first-letter matching to `dataservices-dwsvc-dropdownsearch` and
#      cross-session foreign expression variables to `dataservices-dwsvc-columnexp`. Neither is
#      reachable from the sort path, and claiming either here would misattribute a known gap. Stated so
#      the member's absence is not read as an oversight.
#    * `redaction` - OMITTED. Nothing this capture records is sensitive. Every value that reaches a
#      recording originates in the read-only fixture's own nine inline rows - three small decimals and
#      three status codes per row - or in the fixture's own declared sort metadata. NO KEY, NO PASSWORD,
#      NO CERTIFICATE, NO TOKEN AND NO CONNECTION STRING IS READ, EMITTED OR RECORDED HERE (C-F). This
#      service issues no SQL, so the redacted-statement rule has no field to act on.
#    * `seedPhase.connectionUri` - OMITTED. This workflow opens no storage. The fixture declares no
#      retrieval statement, no update table and no schema; its rows are inline in the definition, so
#      there is no URI to record a grammar for.
#
#  ---- ORDER AND EXPRESSION TEXT, NEVER SPEED (C-K, and `../README.md` section 6.4) --------------
#  Sorting invites a throughput claim and this file makes none. NO ELAPSED VALUE AND NO
#  ROWS-PER-UNIT-TIME FIGURE IS RECORDED, COMPARED OR IMPLIED ANYWHERE BELOW. The repository publishes
#  no service-level agreement, no latency budget, no throughput target and no availability commitment,
#  so there is nothing a timing assertion could be measured against. The only quantitative gate in the
#  brief is 80% per-service line coverage, and it is read from `coverage.cobertura.xml` in CI - not
#  from this store. What IS compared is the constructed expression text, byte for byte, and the row
#  order it produces.
#
#  ---- GOVERNING CONSTRAINTS -------------------------------------------------------------------
#  NO USER-SPECIFIED RULES EXIST. The project's rules document returns exactly one line reporting that
#  none were provided, so no rule is invented, inferred or back-filled, and nothing in this file exists
#  because of one. Enterprise-standard best practice applies in their place. The binding constraints are
#  the migration plan's own: C-B (defects reproduced, never corrected - a corrected capture is a parity
#  FAILURE), C-C (the legacy tree is read-only and is the oracle; every claim carries a locator), C-D
#  (nothing for a deferred capability area - and a routing declaration is not a stub of one), C-F (no
#  secret value), C-K (every decision carries its reason) and C-L (the shared-volume capture rule).
# ==================================================================================================

schemaVersion: "1"

workflowId: dataservices-dwsvc-columnsort

title: >-
  Column sort, headless half: three-state cycle, multi-column composition order, and restoration of the
  fixture's own declared sort rule

capabilityArea: >-
  Headless sort-expression construction and sort state in the service class `n_cst_dwsvc_columnsort` -
  the per-column three-state cycle, the ordered set of columns participating in a multi-column sort, the
  clause grammar each participating column contributes, the comma-joined expression the service builds
  from them, and the restoration of the DataWindow definition's own declared sort rule when no column is
  left sorted. The sort indicator's geometry is NOT part of this capability area; it is the deferred half
  declared under `deferredCapabilities` below.

targetService: DataServices

description: >-
  ONE CLICK MATRIX, CAPTURED TWICE. The pair proves that the expression text the service constructs, the
  per-column sort state it holds, the order in which columns participate, and the row order that results
  are identical on the legacy master and on the .NET candidate after identical masking.


  THE HEADLESS/RENDERING SPLIT, AND WHY THE GAP IS PREFERRED TO A PARTIAL IMPLEMENTATION. This service
  is partly presentational: it performs a resolution-dependent unit conversion purely to place its sort
  indicator on the column header, and the two locators evidencing that are cited in
  `deferredCapabilities` below rather than repeated here. Rather than ship an approximation of that
  placement, the capability is split - the sort
  model ships and is characterized here, and the indicator geometry is deferred and named as a reserved
  extension point. The reasoning is the migration plan's own and it is not a matter of taste: a
  half-built deferred capability is WORSE than a documented gap, because the gap is enumerable and
  auditable while the half-built path silently invites callers to depend on behaviour nobody
  characterized. `deferredCapabilities` below names precisely what does not ship, and
  `../../docs/DEFERRED.md` section 6.2 carries the same split for all three affected services.


  THE PRESENTATIONAL COUPLING HERE IS NARROW, WHICH IS WHY THE WHOLE SORT MODEL SHIPS. Two
  unit-conversion calls, both inside the indicator-placement routine, are the entire coupling. That is
  the contrast that justifies splitting this service rather than deferring it: its two presentational
  siblings, `dataservices-dwsvc-contextmenu` and `dataservices-dwsvc-dropdownsearch`, are coupled far
  more broadly - window positioning, font construction, a popup-menu-typed API surface - and their
  headless halves are correspondingly smaller. Here the headless half is nearly the whole object.


  THIS WORKFLOW RUNS INSIDE THE EVENT CHAIN, NOT BESIDE IT. The oracle window declares its DataWindow
  control as the service-extension class itself
  [`ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnsort.srw:L5`, `:L44`], so every mouse event this
  service observes arrives through the 22-event surface that `dataservices-dw-event-chain`
  characterizes. That definition owns the ordering contract; this one cites it rather than re-deriving
  it, and records only the returns the sort path itself produces.


  ONE-BASED THROUGHOUT, DECLARED RATHER THAN ASSUMED. Every column number and every row number in every
  recording produced by this workflow is a ONE-BASED legacy index. The legacy's upper-bound function
  returns the LAST VALID INDEX where the target's array length is one past the end, and the service
  appends a newly clicked column at upper-bound-plus-one. A silent off-by-one in that translation is
  indistinguishable from a behavioural regression, so the basis is stated here, restated as a
  precondition, and pinned as a defect below.


  NO DATA VALUE RECORDED HERE IS SENSITIVE. Every captured value originates in the read-only fixture's
  own inline rows or its own declared metadata; nothing is read from a credential, a key store or a
  connection string (C-F).

oracleFixtures:
  # THE DRIVING ORACLE WINDOW. 53 lines in total, and the whole of the behaviour it drives lives in the
  # service object below it - which is exactly why both are cited. The window alone would under-specify
  # this capture: it enables the service and binds a definition, and that is all it does.
  # Read, never edited, moved, renamed, reformatted, re-encoded or copied into this tree (C-C).
  - path: ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnsort.srw
    role: oracle-window
    locators:
      - "L5"          # the control is forward-declared as the service-extension class itself
      - "L34-L39"     # THE AUTHORITATIVE STATE SPECIFICATION - see the three claims it makes, below
      - "L36"         # modifier-plus-left-click multi-column sort; clicking again restores the original rule
      - "L38"         # the three sort states, with not-sorted named as the DEFAULT RULE
      - "L40"         # the source comment introducing the enablement
      - "L41"         # THE ENABLEMENT: the column-sort service is switched on here, and only this one
      - "L44"         # the control's type definition, deriving from the service-extension class
      - "L50"         # THE BINDING: the sample definition is bound as the control's data object

  # THE DEFINITION THE WORKFLOW IS BUILT AROUND, and the seed in its entirety - its rows are INLINE in
  # the definition itself, so binding it IS the seed. It is also the reason two of the four defects
  # below are checkable at all: it declares a base sort rule for the restore path to return to, and it
  # declares its column controls OUT of identifier order, which is what makes composition order
  # observable rather than coincidental.
  - path: ws_objects/pfw.tests.pbl.src/dw_svc_sample.srd
    role: primary-fixture
    locators:
      - "L2"          # release 19
      - "L3"          # the grid presentation style the service requires, and the declared unit system
      - "L8-L13"      # six columns, every one carrying updatewhereclause=yes
      - "L11"         # the status code table on the first character column - Chinese DISPLAY values
      - "L14"         # THE BASE SORT METADATA - the restore target, recorded in the seed phase below
      - "L15"         # THE NINE INLINE ROWS - the seed, carried by the read-only definition itself
      - "L16-L21"     # the six header text objects, each named for its column with the "_t" suffix
      - "L22-L27"     # the column controls, DECLARED OUT OF IDENTIFIER ORDER
      - "L27"         # the drop-down list-box column, whose clause takes the display-lookup form
      - "L28"         # the computed control evaluating the current row number

  # THE OBJECT UNDER CHARACTERIZATION. 450 lines, and the locators below are the ones this definition's
  # observed outputs, preconditions and defects cite. Every one was read in the source rather than
  # copied forward.
  - path: ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnsort.sru
    role: service-object
    locators:
      - "L4"          # it derives from the DataWindow service base
      - "L10-L13"     # the per-column sort record: a column name and a sort state, and nothing else
      - "L16-L19"     # the four mouse events, including the posted one that does the work
      - "L26"         # the indicator object's name suffix
      - "L29"         # THE ORDERED PARTICIPATING SET - insertion-ordered, and the array is one-based
      - "L31"         # the constructed expression - the primary recorded artifact of this workflow
      - "L32"         # the retained ORIGINAL rule - the restore target, captured lazily at :L176-L178
      - "L34"         # the retained click point, which the determinism mask below seams
      - "L37-L39"     # THE THREE SORT STATES as their raw numeric values: 0, 1 and 2
      - "L53-L54"     # the click point is recorded on button-down
      - "L61"         # THE GRID-STYLE GATE - a non-grid presentation style sorts nothing at all
      - "L63"         # the grouping gate - a grouped definition sorts nothing either
      - "L70-L73"     # the movement tolerance, and THE POSTED CONTINUATION that performs the sort
      - "L83-L85"     # the clicked object must be in the header band, or the handler returns zero
      - "L94-L102"    # the column name is the header object's name minus its two-character suffix
      - "L104-L105"   # the resolved name must be a column in the detail band
      - "L107-L110"   # two edit styles are excluded from sorting entirely
      - "L112-L123"   # ONE-BASED SEARCH, AND THE APPEND AT UPPER-BOUND-PLUS-ONE that fixes insertion order
      - "L125-L132"   # THE THREE-STATE CYCLE: not-sorted to ascending to descending and back
      - "L134"        # THE MODIFIER TEST - the control key, read at click time
      - "L135-L145"   # the modifier branch: sort, then drop the column that cycled out of the sort
      - "L141"        # the one-based append idiom again, rebuilding the participating set
      - "L146-L162"   # the plain branch: clear every other column first, then sort, then collapse the set
      - "L168"        # a double-click re-enters the button-down handler rather than sorting directly
      - "L171-L199"   # THE EXPRESSION BUILD
      - "L174"        # the expression is rebuilt from scratch on every transition
      - "L176-L178"   # THE LAZY BASELINE CAPTURE - the original rule is read from the definition once
      - "L180-L185"   # the count of participating columns, which decides whether an index badge applies
      - "L187-L199"   # THE COMPOSITION LOOP - insertion order, and the comma join
      - "L196-L197"   # the separator: a comma, inserted only between non-empty clauses
      - "L201-L207"   # THE RESTORE PATH - an empty expression falls back to the retained original rule
      - "L211"        # the constructed or restored expression is applied here
      - "L236"        # the reset entry point reports failure when nothing is sorted
      - "L290-L339"   # THE CLAUSE GRAMMAR, one clause per participating column
      - "L292"        # a not-sorted column contributes an EMPTY clause and so leaves the expression
      - "L294-L295"   # a computed column contributes its own name
      - "L297-L311"   # the display-lookup forms for the drop-down edit styles
      - "L307-L310"   # and for a plain code table
      - "L313-L328"   # the null-coalescing forms, per column type
      - "L329"        # the fallback: the column's own name
      - "L331-L336"   # THE DIRECTION SUFFIX: a single letter, space-separated from the clause
      - "L353"        # a not-sorted column's indicator is destroyed and not recreated

  # THE STRUCTURAL HOST. The oracle window's control is this class, so every mouse event the sort
  # service sees arrives through its 22-event surface. Cited for the surface and for the returns the
  # sort path produces into it - NOT re-characterized here. `dataservices-dw-event-chain` owns that.
  - path: ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru
    role: service-object
    locators:
      - "L11-L32"     # the 22-event surface the sort service's mouse events arrive through
      - "L80-L84"     # the sub-service members, one of which is the column-sort service
      - "L109-L111"   # the event gate, which must be in a known state for this capture

  # READ AS THE AUTHORITATIVE STATEMENT of what the two gates at `:L61` and `:L63` actually test. The
  # presentation-style constants are declared here and the gate resolves a describe result against
  # them, so the fixture's declared style is checkable rather than assumed. This workflow characterizes
  # none of this class's own behaviour - `dataservices-dwsvc-contextmenu` cites it as a service object.
  - path: ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc.sru
    role: specification
    locators:
      - "L18-L24"     # the presentation-style constants, of which only the grid value admits sorting
      - "L143-L152"   # the style gate's own resolution of the describe result

# ==================================================================================================
#  THE SEED PHASE - SEPARATE FROM THE CAPTURE PHASE, AND IT RUNS ONCE
#  ------------------------------------------------------------------------------------------------
#  THE SEED SHAPE HERE IS THE INLINE-FIXTURE SHAPE, NOT THE DATABASE SHAPE. The persistence workflows
#  seed storage: their oracle deletes the database file, recreates the schema and inserts rows, which is
#  precisely the destructive reseed the capture rule forbids between the two halves of a pair. THIS
#  workflow seeds nothing of the kind. Its nine rows are declared INLINE IN THE READ-ONLY DATAWINDOW
#  DEFINITION ITSELF [`dw_svc_sample.srd:L15`], so BINDING THE DEFINITION IS THE SEED: there is NO FILE
#  DELETE, NO DDL, NO INSERT AND NO CONNECTION anywhere in this phase. The two assertions the schema
#  requires are still both true and still both required - the seed happens once per pair, and nothing
#  here runs between the two captures.
#
#  ONE SEED STEP EXISTS PURELY TO MAKE A DEFECT VERIFIABLE. The restore path returns to the fixture's
#  OWN declared sort rule rather than to an arbitrary unsorted order, and the service reads that rule
#  lazily, once, on the first sort it performs. A capture that did not record the baseline first could
#  observe the restore happening and still not be able to say whether it restored to the RIGHT rule. The
#  baseline is therefore recorded in the seed phase, before any click is synthesized.
# ==================================================================================================
seedPhase:
  steps:
    - action: >-
        Bind the sample DataWindow definition the oracle window names as its control's data object. On
        the legacy side that is the definition the window declares; on the target side it is the
        transcribed definition registered under the same column model. Binding loads the definition's own
        inline rows - this step performs NO file delete, NO schema creation, NO row insert and NO
        connection, because the rows are part of the read-only fixture rather than of any store.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnsort.srw:L50"
    - action: >-
        Confirm the nine inline rows the bound definition declares are present and in declaration order,
        with the six columns in their declared types - three two-place decimal columns named n1, n2 and
        n3, and three hundred-character character columns named s1, s2 and s3 - and confirm the row count
        is nine on both halves before any click is synthesized.
      locator: "ws_objects/pfw.tests.pbl.src/dw_svc_sample.srd:L15"
    - action: >-
        RECORD THE FIXTURE'S OWN BASE SORT METADATA VERBATIM, BEFORE ANY CLICK. The definition declares
        its table sort rule as the exact string "n1 A n2 A n3 A " - the three numeric columns, each
        ascending, SEPARATED BY SINGLE SPACES AND CARRYING A TRAILING SPACE. Record it byte for byte,
        including that trailing space, because it is the restore target: the third state of the sort
        cycle and the repeat modifier-click both return to THIS string, and a capture that has not
        recorded it cannot tell a correct restore from a plausible-looking one. Note while recording it
        that this space-separated form is NOT the form the service constructs - the service joins its own
        clauses with commas - so the two are distinguishable in a recording on sight.
      locator: "ws_objects/pfw.tests.pbl.src/dw_svc_sample.srd:L14"
    - action: >-
        Confirm the service's retained original-rule field is EMPTY at capture start on both halves. The
        service captures the baseline lazily and exactly once - on the first sort it performs, and only
        while that field is still empty - so a field left populated by an earlier capture would silently
        substitute a different restore target and the restore cases would compare two different
        behaviours.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnsort.sru:L176-L178"
    - action: >-
        Confirm the ordered participating set is EMPTY at capture start on both halves, so that the first
        recorded transition is an insertion into an empty set rather than a mutation of a set left behind
        by a previous case. Every case below states the set it starts from, and this is the state the
        first of them starts from.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/n_cst_dwsvc_columnsort.sru:L29"
    - action: >-
        Enable exactly the column-sort service and leave the other four DataWindow sub-services disabled,
        matching the oracle window's own open event. This is a seed step rather than a precondition check
        because the enabled set is observable: the host's changed-event dispatcher and its raw editing
        event hand control to other sub-services only when those are enabled, so a different enabled set
        produces a different recorded event order for reasons that are not this service's behaviour.
      locator: "ws_objects/pfw.tests.pbl.src/w_test_dwsvc_columnsort.srw:L41"
    - action: >-
        Leave every host event-gate bit enabled - the gate bitmask starts at zero, meaning nothing
        disabled - so the mouse events this service depends on reach it and every case below is a
        departure from a known starting state rather than from an unknown one.
      locator: "ws_objects/pfw.datawindow.services.pbl.src/se_cst_dw.sru:L109-L111"
    - action: >-
        Configure the determinism seams declared below ONCE, and use that one configuration for both
        halves of the pair. A seam configured per capture is two configurations, and two configurations
        make the two recordings answer two different questions.
    - action: >-
        On the target side, materialize the same nine rows from the same read-only definition,
        transcribed rather than read at run time, and open one session for the host the cases below drive.
        No schema provisioning and no row seeding runs on this side either, so this step is idempotent
        and is safe to repeat without touching any persistent state.

  runsOncePerPair: true
  neverBetweenCaptures: true

capturePhase:
  behaviourUnderTest: >-
    THE HEADLESS SORT MODEL THE SERVICE HOLDS AND THE EXPRESSION TEXT IT CONSTRUCTS, AND NOTHING ELSE.
    For each synthesized click: which column the click resolves to, the per-column sort state after the
    three-state cycle advances, the ordered set of columns participating in the sort with each one's
    direction, the clause the grammar produces for each of them, the single expression string the service
    joins those clauses into, the row order that expression produces, the current row afterwards, and the
    returns the sort path produces into the host's event chain.


    THE PRIMARY ARTIFACT IS THE EXPRESSION STRING, AND IT IS COMPARED BYTE FOR BYTE. It is built from
    scratch on every transition [`n_cst_dwsvc_columnsort.sru:L174`], one clause per participating column
    in insertion order, joined with a comma inserted only between non-empty clauses [`:L196-L197`], with
    each clause carrying a single space and a single direction letter [`:L331-L336`]. Every character of
    it is behaviour: the separator, the spacing, the letter case, the clause form the grammar chose, and
    the presence or absence of a trailing character. Nothing about it is normalized before comparison.


    WHAT THIS CAPTURE IS NOT, STATED SO A RECORDED FIELD CANNOT BE MISATTRIBUTED. IT DOES NOT CAPTURE
    THE SORT INDICATOR - not its position, not its size, not its index-badge placement, and not its
    rendering or removal as drawn output. That half of the capability does not ship in this phase and is
    declared under `deferredCapabilities` below; a recording of it would be a recording of something no
    service produces. Accordingly NO OBSERVED OUTPUT BELOW CARRIES A COORDINATE, A GEOMETRY VALUE, A
    SCALING RESULT OR A TEXT-MEASUREMENT VALUE. It is also not a capture of the host event chain's own
    ordering - `dataservices-dw-event-chain` owns that - and it records only the returns this service's
    own handlers produce. AND IT IS NOT A MEASUREMENT: no elapsed value is recorded and no throughput is
    asserted or implied. Sorting is exactly the behaviour that invites such a claim, and this capture
    makes none.


    ONE FURTHER EXCLUSION, BECAUSE IT WOULD OTHERWISE LOOK LIKE AN OMISSION. The reset and
    original-rule-update entry points [`:L216-L247`, `:L249-L283`] are NOT exercised by this matrix. The
    oracle window drives this service entirely through header clicks and calls neither, so a recording of
    either would be a recording of a path the oracle never takes - and a defect claimed against an
    unexercised path is a claim this pair could not support.

  preconditions:
    # ---- GATES THAT DECIDE WHETHER ANY SORT HAPPENS AT ALL ---------------------------------------
    - >-
      THE BOUND DEFINITION MUST BE IN THE GRID PRESENTATION STYLE. The service returns immediately
      without sorting when the style is anything else [`n_cst_dwsvc_columnsort.sru:L61`], and the style
      constants are declared on its base class where only the grid value admits sorting
      [`n_cst_dwsvc.sru:L18-L24`, resolved at `:L143-L152`]. The fixture satisfies this in its own
      declaration [`dw_svc_sample.srd:L3`], so the gate is checkable rather than assumed - but it is
      recorded as a precondition because a capture taken against a non-grid definition would record
      eight cases of "nothing happened" and could be mistaken for a passing comparison.
    - >-
      THE BOUND DEFINITION MUST DECLARE NO GROUPING. A grouped definition sorts nothing
      [`n_cst_dwsvc_columnsort.sru:L63`]. The fixture declares none, and this is stated for the same
      reason as the style gate: the failure mode is silence, not an error.
    - >-
      EVERY HEADER OBJECT MUST BE NAMED FOR ITS COLUMN WITH THE TWO-CHARACTER SUFFIX THE SERVICE STRIPS.
      The service derives the column name by removing that suffix and returns zero for any header object
      that does not carry it [`:L94-L102`]; the resolved name must then be a column in the detail band
      [`:L104-L105`]. The fixture's six header objects satisfy both [`dw_svc_sample.srd:L16-L21`].
    - >-
      NO COLUMN IN THE MATRIX MAY USE AN EXCLUDED EDIT STYLE. Two edit styles are refused outright
      [`:L107-L110`]. None of the fixture's six columns uses either, so all six are sortable and the
      matrix's choice of columns is unconstrained by this gate.
    # ---- HOW A CLICK IS RECOGNIZED, WHICH IS ITSELF A PRECONDITION -------------------------------
    - >-
      EACH SYNTHESIZED CLICK MUST BE A DOWN AND AN UP THAT THE SERVICE ACCEPTS AS ONE CLICK. The service
      retains the down point [`:L53-L54`] and acts only when the up point is within the movement
      tolerance of it on BOTH axes [`:L70`]; outside that tolerance the click is treated as a drag and
      nothing sorts. The synthesized pair must therefore satisfy the tolerance identically on both
      halves, which is why the click point is seamed rather than merely masked - see the mask below.
    - >-
      THE SORT IS PERFORMED BY A POSTED CONTINUATION, NOT BY THE BUTTON-UP HANDLER, AND THE CONTINUATION
      MUST BE DRAINED BEFORE A CASE IS RECORDED [`:L70-L73`]. The legacy defers the work onto the
      platform message queue; the target has no message pump and queues an explicit continuation
      instead. A record taken before the continuation ran would capture the state BEFORE the transition
      on either side, and would do so intermittently - which is the worst kind of parity failure because
      it is not reproducible.
    - >-
      THE MODIFIER STATE MUST BE FIXED AND RECORDED PER CASE. The service reads the control key at click
      time [`:L134`] and the two branches differ substantially: the modifier branch preserves the other
      participating columns while the plain branch clears them first [`:L135-L145` against `:L146-L162`].
      Every case below states the modifier state it was taken under, and the recording carries it, so a
      case cannot be compared against its counterpart taken under the other branch.
    - >-
      A DOUBLE-CLICK IS NOT A SECOND CLICK FOR THIS SERVICE. The double-click handler re-enters the
      button-down handler [`:L168`], so it records a new down point rather than advancing the cycle. The
      matrix synthesizes discrete down-up pairs and no double-click, and this is stated so that a
      recording containing an unexpected extra transition is read as a synthesis fault rather than as a
      behavioural divergence.
    # ---- THE INDEXING BASIS, DECLARED ONCE AND BINDING ON EVERY RECORD ---------------------------
    - >-
      EVERY COLUMN NUMBER AND EVERY ROW NUMBER IN EVERY RECORD IS A ONE-BASED LEGACY INDEX. The
      participating set is a one-based array searched from index one [`:L112-L118`] and appended at
      upper-bound-plus-one [`:L120-L123`, and again at `:L141`], where the legacy's upper-bound function
      returns the LAST VALID INDEX rather than a length. Both halves record one-based values and the
      comparison is one-based; the target performs the conversion at its own boundary and never in the
      recording. This is pinned as a defect below as well, because it is the one translation hazard here
      whose failure is invisible.
    # ---- STATE THE MATRIX STARTS FROM ------------------------------------------------------------
    - >-
      THE PARTICIPATING SET IS EMPTY AND THE RETAINED ORIGINAL RULE IS UNSET AT THE START OF THE MATRIX,
      as the seed phase establishes. The cases are ordered and each states its starting set, so the
      matrix is a single ordered walk rather than eight independent captures - the composition-order and
      restore cases are only meaningful in sequence.
    - >-
      THE SAME SIX-COLUMN MODEL AND THE SAME NINE ROWS ARE BOUND ON BOTH HALVES, including the code
      table on the first character column and the two drop-down columns whose display and data columns
      differ. That configuration is not a detail: it is what selects the display-lookup clause form for
      those columns [`:L297-L311`], so an unequal configuration produces an unequal expression string
      for identical clicks.
    - >-
      THE TARGET HALF IS CAPTURED AGAINST THE RUNNING SERVICE, not against an in-process test host. A
      test host mounts no volume and so cannot be the candidate half of a pair however thorough it is;
      `../README.md` section 7 is the authority for that distinction.
    - >-
      BOTH HALVES OF THIS PAIR ARE TAKEN IN ONE WORKING TREE. Where several clones run concurrently each
      needs its own compose project and its own volume, so that one clone's teardown cannot invalidate
      another clone's half-finished pair.


