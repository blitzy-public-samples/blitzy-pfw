        difference of ANY kind here is a behavioural divergence: a different separator, different
        spacing, a different direction letter, a different clause form for the same column, a different
        column order, or a different string entirely. This is the field the whole pair exists to compare,
        and it is the field a naive port is most likely to get subtly wrong while producing a row order
        that happens to look right.
